eAuthError"},{"n":"User","t":"FirebaseUser","k":"struct","c":"","r":"FFirebaseUser"}],"exec":["OnUnlinked","OnError"],"topic":"Linking"},{"id":"ULinkProviderProxy_LinkProvider","title":"Link Provider","fn":"LinkProvider","owner":"ULinkProviderProxy","kind":"async","module":"Auth","group":"","platform":"","doc":"Links the currently signed-in user (e.g. an anonymous account) to Provider,\npicked by enum instead of needing a separate node per provider:\n - Google: Android's Credential Manager account picker (Android only).\n - PlayGames: Play Games Services sign-in (Android only).\n - Apple: the native \"Sign in with Apple\" UI on iOS/tvOS; the generic\n   OAuth web-redirect flow below on every other platform, where the\n   native UI isn't available.\n - GitHub/Microsoft/Twitter/Yahoo: the generic OAuth\n   web-redirect flow (same as LinkWithFederatedProvider, with no Scopes/\n   CustomParameters — call that node directly instead if you need those).\n - Facebook: fails with InvalidProviderId — Facebook's terms require its\n   own SDK; pass its access token to the Facebook Token nodes instead.\n - GameCenter: iOS/tvOS only; requires AuthenticateGameCenterLocalPlayer\n   to have already succeeded.\nNot valid for Provider == Password (needs an Email/Password pair this node\nhas no room for — use LinkWithEmailAndPassword instead), Phone (needs a\nverification code round-trip this node has no room for — use\nSendPhoneVerificationCode/VerifyPhoneCode with Mode = Link instead), or\nUnknown; all three fail immediately with InvalidProviderId.","inputs":[{"n":"Provider","t":"EFirebaseAuthProvider","k":"enum","c":"","r":"EFirebaseAuthProvider","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseAuthError","k":"enum","c":"","r":"EFirebaseAuthError"},{"n":"User","t":"FirebaseUser","k":"struct","c":"","r":"FFirebaseUser"}],"exec":["OnLinked","OnError"],"topic":"Linking"},{"id":"UReauthenticateProviderProxy_ReauthenticateProvider","title":"Reauthenticate Provider","fn":"ReauthenticateProvider","owner":"UReauthenticateProviderProxy","kind":"async","module":"Auth","group":"","platform":"","doc":"Re-authenticates the signed-in user against Provider, picked by enum\ninstead of needing a separate node per provider — same\nGoogle/PlayGames (native) vs Apple (native on iOS/tvOS, generic OAuth\nweb-redirect elsewhere) vs GitHub/Microsoft/Twitter/Yahoo\n(generic OAuth web-redirect) vs GameCenter (native GameKit, iOS/tvOS only,\nrequires AuthenticateGameCenterLocalPlayer first) split as\nLinkProvider — see its own doc comment for details. Call this after a\nsensitive operation (UpdateUserPassword, DeleteUser...) fails with\nEFirebaseAuthError::RequiresRecentLogin, then retry that operation. Not\nvalid for Provider == Password (use ReauthenticateWithEmailAndPassword\ninstead), Phone (use SendPhoneVerificationCode/VerifyPhoneCode with\nMode = Reauthenticate instead), or Unknown; all three fail immediately\nwith InvalidProviderId.","inputs":[{"n":"Provider","t":"EFirebaseAuthProvider","k":"enum","c":"","r":"EFirebaseAuthProvider","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseAuthError","k":"enum","c":"","r":"EFirebaseAuthError"},{"n":"User","t":"FirebaseUser","k":"struct","c":"","r":"FFirebaseUser"}],"exec":["OnReauthenticated","OnError"],"topic":"Re-authentication"},{"id":"USignInProviderProxy_SignInProvider","title":"Sign In Provider","fn":"SignInProvider","owner":"USignInProviderProxy","kind":"async","module":"Auth","group":"","platform":"","doc":"Signs in via Provider, picked by enum instead of needing a separate node\nper provider:\n - Google: Android's Credential Manager account picker (Android only).\n - PlayGames: Play Games Services sign-in (Android only).\n - Apple: the native \"Sign in with Apple\" UI on iOS/tvOS; the generic\n   OAuth web-redirect flow below on every other platform, where the\n   native UI isn't available.\n - GitHub/Microsoft/Twitter/Yahoo: the generic OAuth\n   web-redirect flow (same as SignInWithFederatedProvider, with no Scopes/\n   CustomParameters — call that node directly instead if you need those).\n - Facebook: fails with InvalidProviderId — Facebook's terms require its\n   own SDK; pass its access token to the Facebook Token nodes instead.\n - GameCenter: iOS/tvOS only; requires AuthenticateGameCenterLocalPlayer\n   to have already succeeded.\nNot valid for Provider == Password (needs an Email/Password pair this node\nhas no room for — use SignInWithEmailAndPassword instead), Phone (use\nSendPhoneVerificationCode/VerifyPhoneCode with Mode = SignIn instead), or\nUnknown; all three fail immediately with InvalidProviderId. Doesn't cover\nanonymous sign-in either (SignInAnonymously) — an anonymous user has no\nprovider at all.","inputs":[{"n":"Provider","t":"EFirebaseAuthProvider","k":"enum","c":"","r":"EFirebaseAuthProvider","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseAuthError","k":"enum","c":"","r":"EFirebaseAuthError"},{"n":"User","t":"FirebaseUser","k":"struct","c":"","r":"FFirebaseUser"}],"exec":["OnSignedIn","OnError"],"topic":"Sign in"},{"id":"UFirebaseAuthLibrary_SignOut","title":"Sign Out","fn":"SignOut","owner":"UFirebaseAuthLibrary","kind":"call","module":"Auth","group":"","platform":"","doc":"Removes any existing authentication credentials from this client. Always succeeds.","inputs":[],"outputs":[],"exec":[],"topic":"Sign in"},{"id":"UFirebaseAuthLibrary_SignOutGoogle","title":"Sign Out Google","fn":"SignOutGoogle","owner":"UFirebaseAuthLibrary","kind":"call","module":"Auth","group":"","platform":"Android","doc":"Clears Credential Manager's saved Google sign-in state used by \"Sign In\nwith Google\" (Android only, no-op elsewhere). Call it alongside\nSignOut() when the player signs out, as Google recommends: the account\nchooser is always shown anyway, but this stops any automatic sign-in\noffer from reusing the signed-out account.","inputs":[],"outputs":[],"exec":[],"topic":"Sign in"},{"id":"UFirebaseAuthLibrary_GetCurrentUser","title":"Get Current User","fn":"GetCurrentUser","owner":"UFirebaseAuthLibrary","kind":"pure","module":"Auth","group":"","platform":"","doc":"Synchronously gets the cached current user. bIsValid will be false if there is none.","inputs":[],"outputs":[{"n":"Return Value","t":"FirebaseUser","k":"struct","c":"","r":"FFirebaseUser"}],"exec":[],"topic":"Account"},{"id":"UFirebaseAuthLibrary_DecodeIdToken","title":"Decode Id Token","fn":"DecodeIdToken","owner":"UFirebaseAuthLibrary","kind":"pure","module":"Auth","group":"","platform":"","doc":"Decodes a Firebase ID token (e.g. from Get ID Token) into its claims —\nlocally, without verifying its signature (see FFirebaseIdTokenResult).\nFalse if Token isn't a well-formed JWT.","inputs":[{"n":"Token","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Result","t":"FirebaseIdTokenResult","k":"struct","c":"","r":"FFirebaseIdTokenResult"},{"n":"Return Value","t":"Boolean","k":"bool","c":"","r":""}],"exec":[],"topic":"Tokens"},{"id":"UFirebaseAuthLibrary_IsUserSignedIn","title":"Is User Signed In","fn":"IsUserSignedIn","owner":"UFirebaseAuthLibrary","kind":"pure","module":"Auth","group":"","platform":"","doc":"Returns true if a user is currently signed in.","inputs":[],"outputs":[{"n":"Return Value","t":"Boolean","k":"bool","c":"","r":""}],"exec":[],"topic":"Account"},{"id":"UFirebaseAuthLibrary_GetLinkedProviderIds","title":"Get Linked Provider Ids","fn":"GetLinkedProviderIds","owner":"UFirebaseAuthLibrary","kind":"pure","module":"Auth","group":"","platform":"","doc":"Returns the provider IDs (e.g. \"password\", \"google.com\") currently linked to the signed-in user. Empty if signed out.","inputs":[],"outputs":[{"n":"Return Value","t":"Array of String","k":"string","c":"array","r":""}],"exec":[],"topic":"Linking"},{"id":"UFirebaseAuthLibrary_GetLinkedProvidersInfo","title":"Get Linked Providers Info","fn":"GetLinkedProvidersInfo","owner":"UFirebaseAuthLibrary","kind":"pure","module":"Auth","group":"","platform":"","doc":"Same providers as GetLinkedProviderIds, but with each provider's own DisplayName/Email/PhotoUrl — use this instead when you need to tell e.g. a linked Google account's name apart from a linked Play Games account's name. Empty if signed out.","inputs":[],"outputs":[{"n":"Return Value","t":"Array of FirebaseLinkedProviderInfo","k":"struct","c":"array","r":""}],"exec":[],"topic":"Linking"},{"id":"UFirebaseAuthLibrary_IsProviderLinked","title":"Is Provider Linked","fn":"IsProviderLinked","owner":"UFirebaseAuthLibrary","kind":"pure","module":"Auth","group":"","platform":"","doc":"True if the signed-in user currently has Provider linked — a typed alternative to checking GetLinkedProviderIds for a raw provider ID string. False if signed out.","inputs":[{"n":"Provider","t":"EFirebaseAuthProvider","k":"enum","c":"","r":"EFirebaseAuthProvider","adv":false}],"outputs":[{"n":"Return Value","t":"Boolean","k":"bool","c":"","r":""}],"exec":[],"topic":"Linking"},{"id":"UFirebaseAuthLibrary_SetAuthLanguageCode","title":"Set Auth Language Code","fn":"SetAuthLanguageCode","owner":"UFirebaseAuthLibrary","kind":"call","module":"Auth","group":"","platform":"","doc":"Sets the language Firebase Auth uses for the emails/SMS it sends (verification, password reset...) — an ISO language code, e.g. \"fr\" or \"en-US\". Fire-and-forget, no Future to wait on.","inputs":[{"n":"LanguageCode","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[],"exec":[],"topic":"Settings"},{"id":"UFirebaseAuthLibrary_GetAuthLanguageCode","title":"Get Auth Language Code","fn":"GetAuthLanguageCode","owner":"UFirebaseAuthLibrary","kind":"pure","module":"Auth","group":"","platform":"","doc":"The language code currently set via SetAuthLanguageCode/UseAppLanguageForAuth, or empty if never called (SDK default is the device's own language).","inputs":[],"outputs":[{"n":"Return Value","t":"String","k":"string","c":"","r":""}],"exec":[],"topic":"Settings"},{"id":"UFirebaseAuthLibrary_UseAppLanguageForAuth","title":"Use App Language For Auth","fn":"UseAppLanguageForAuth","owner":"UFirebaseAuthLibrary","kind":"call","module":"Auth","group":"","platform":"","doc":"Uses the device/app's own current language for Auth emails/SMS, instead of a language you set explicitly via SetAuthLanguageCode.","inputs":[],"outputs":[],"exec":[],"topic":"Settings"},{"id":"UFirebaseAuthLibrary_UseAuthEmulator","title":"Use Auth Emulator","fn":"UseAuthEmulator","owner":"UFirebaseAuthLibrary","kind":"call","module":"Auth","group":"","platform":"","doc":"Redirects every subsequent Auth call to a local Firebase Auth Emulator\ninstead of the real backend — for offline/local testing only. Must be\ncalled before any other Auth node (including GetCurrentUser); calling it\nafter Auth has already made a real network call has no effect. Host is\nusually \"10.0.2.2\" from an Android emulator (loopback to the host\nmachine) or your machine's LAN IP from a real device; Port defaults to\n9099 in the Firebase emulator suite.","inputs":[{"n":"Host","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Port","t":"Integer","k":"int","c":"","r":"","adv":false}],"outputs":[],"exec":[],"topic":"Settings"},{"id":"UFirebaseAuthLibrary_MakeOAuthCredential","title":"Make OAuth Credential","fn":"MakeOAuthCredential","owner":"UFirebaseAuthLibrary","kind":"call","module":"Auth","group":"","platform":"","doc":"Builds a credential for any OAuth / OpenID Connect provider enabled in\nFirebase Console (e.g. \"apple.com\", \"microsoft.com\", or a custom\n\"oidc.my-provider\") from tokens you obtained yourself — the provider's\nown SDK, your own web login... — to pass to Sign In / Link /\nReauthenticate With Credential. Give an IdToken (OpenID Connect), an\nAccessToken (plain OAuth), or both. RawNonce: only when the IdToken was\nrequested with a nonce (e.g. Apple), the unhashed value. The result's\nbIsValid is false (and the reason logged) if the inputs or Firebase\naren't usable — the token itself is only checked when signing in.","inputs":[{"n":"ProviderId","t":"String","k":"string","c":"","r":"","adv":false},{"n":"IdToken","t":"String","k":"string","c":"","r":"","adv":false},{"n":"AccessToken","t":"String","k":"string","c":"","r":"","adv":false},{"n":"RawNonce","t":"String","k":"string","c":"","r":"","adv":true}],"outputs":[{"n":"Return Value","t":"FirebaseAuthCredential","k":"struct","c":"","r":"FFirebaseAuthCredential"}],"exec":[],"topic":"Tokens"},{"id":"UFetchProvidersForEmailProxy_FetchProvidersForEmail","title":"Fetch Providers For Email","fn":"FetchProvidersForEmail","owner":"UFetchProvidersForEmailProxy","kind":"async","module":"Auth","group":"","platform":"","doc":"Returns every sign-in method (e.g. \"password\", \"google.com\") already\nregistered for Email. Empty array if Email isn't registered with any\nprovider yet — BUT also always empty when the project has Email\nEnumeration Protection on (Firebase Console -> Authentication -> Settings),\nthe default for projects created since September 2023. Don't build a\n\"new user vs existing user\" flow on it there: try to sign in and handle\nthe error (e.g. EmailAlreadyInUse / WrongPassword) instead.","inputs":[{"n":"Email","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseAuthError","k":"enum","c":"","r":"EFirebaseAuthError"},{"n":"ProviderIds","t":"Array of String","k":"string","c":"array","r":""}],"exec":["OnSuccess","OnError"],"topic":"Linking"},{"id":"USignInWithCustomTokenProxy_SignInWithCustomToken","title":"Sign In With Custom Token","fn":"SignInWithCustomToken","owner":"USignInWithCustomTokenProxy","kind":"async","module":"Auth","group":"","platform":"","doc":"Signs in with a custom token minted by your own backend (via the Firebase Admin SDK) — for accounts whose identity your server controls rather than a federated provider. No-op / always fails if you have no such backend.","inputs":[{"n":"Token","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseAuthError","k":"enum","c":"","r":"EFirebaseAuthError"},{"n":"User","t":"FirebaseUser","k":"struct","c":"","r":"FFirebaseUser"}],"exec":["OnSignedIn","OnError"],"topic":"Sign in"},{"id":"USignInWithFederatedProviderProxy_SignInWithFederatedProvider","title":"Sign In With Federated Provider","fn":"SignInWithFederatedProvider","owner":"USignInWithFederatedProviderProxy","kind":"async","module":"Auth","group":"","platform":"","doc":"Signs in with any generic OAuth identity provider by its Firebase provider\nID — e.g. \"apple.com\", \"microsoft.com\", \"yahoo.com\", \"github.com\",\n\"twitter.com\" — without needing a dedicated native SDK/Blueprint node per\nprovider like Google/Play Games have. On Android (and iOS), the OAuth\nredirect flow is handled entirely by the platform itself (Chrome Custom\nTabs) — no extra UI code needed on your end, unlike on desktop platforms\nwhere the SDK requires you to implement your own browser flow (not\nsupported by this plugin). Scopes/CustomParameters may be left empty for\nthe provider's defaults. The provider must be enabled for your project in\nFirebase Console -> Authentication -> Sign-in method first.","inputs":[{"n":"ProviderId","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Scopes","t":"Array of String","k":"string","c":"array","r":"","adv":true},{"n":"CustomParameters","t":"Map of String to String","k":"string","c":"map","r":"","adv":true}],"outputs":[{"n":"Error","t":"EFirebaseAuthError","k":"enum","c":"","r":"EFirebaseAuthError"},{"n":"User","t":"FirebaseUser","k":"struct","c":"","r":"FFirebaseUser"}],"exec":["OnSignedIn","OnError"],"topic":"Sign in"},{"id":"ULinkWithFederatedProviderProxy_LinkWithFederatedProvider","title":"Link With Federated Provider","fn":"LinkWithFederatedProvider","owner":"ULinkWithFederatedProviderProxy","kind":"async","module":"Auth","group":"","platform":"","doc":"Links the signed-in user to a generic OAuth provider — see SignInWithFederatedProvider for ProviderId/Scopes/CustomParameters details. Fails with a provider-already-linked-style error if that provider is already linked to this (or another) account.","inputs":[{"n":"ProviderId","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Scopes","t":"Array of String","k":"string","c":"array","r":"","adv":true},{"n":"CustomParameters","t":"Map of String to String","k":"string","c":"map","r":"","adv":true}],"outputs":[{"n":"Error","t":"EFirebaseAuthError","k":"enum","c":"","r":"EFirebaseAuthError"},{"n":"User","t":"FirebaseUser","k":"struct","c":"","r":"FFirebaseUser"}],"exec":["OnSuccess","OnError"],"topic":"Linking"},{"id":"USignInWithCredentialProxy_SignInWithCredential","title":"Sign In With Credential","fn":"SignInWithCredential","owner":"USignInWithCredentialProxy","kind":"async","module":"Auth","group":"","platform":"","doc":"Signs in with a credential you already hold, instead of showing any\nsign-in UI:\n - the UpdatedCredential a Link node's OnError hands back when the\n   provider account already belongs to another Firebase user\n   (CredentialAlreadyInUse) — switches to that account;\n - one built by Make OAuth Credential from tokens obtained elsewhere (a\n   provider's own SDK, your own web login...).\nFails with InvalidCredential if Credential isn't valid (bIsValid false).","inputs":[{"n":"Credential","t":"FirebaseAuthCredential","k":"struct","c":"","r":"FFirebaseAuthCredential","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseAuthError","k":"enum","c":"","r":"EFirebaseAuthError"},{"n":"User","t":"FirebaseUser","k":"struct","c":"","r":"FFirebaseUser"}],"exec":["OnSignedIn","OnError"],"topic":"Sign in"},{"id":"ULinkWithCredentialProxy_LinkWithCredential","title":"Link With Credential","fn":"LinkWithCredential","owner":"ULinkWithCredentialProxy","kind":"async","module":"Auth","group":"","platform":"","doc":"Links the signed-in user to a credential you already hold (see Sign In\nWith Credential). If that provider account already belongs to another\nFirebase user, OnError fires with CredentialAlreadyInUse and, when\nFirebase provides one, User.AdditionalInfo.UpdatedCredential to sign in to\nthat other account instead.","inputs":[{"n":"Credential","t":"FirebaseAuthCredential","k":"struct","c":"","r":"FFirebaseAuthCredential","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseAuthError","k":"enum","c":"","r":"EFirebaseAuthError"},{"n":"User","t":"FirebaseUser","k":"struct","c":"","r":"FFirebaseUser"}],"exec":["OnLinked","OnError"],"topic":"Linking"},{"id":"UReauthenticateWithCredentialProxy_ReauthenticateWithCredential","title":"Reauthenticate With Credential","fn":"ReauthenticateWithCredential","owner":"UReauthenticateWithCredentialProxy","kind":"async","module":"Auth","group":"","platform":"","doc":"Re-authenticates the signed-in user with a credential you already hold (see Sign In With Credential) — e.g. after a sensitive operation failed with RequiresRecentLogin. The credential must belong to this same user, else UserMismatch.","inputs":[{"n":"Credential","t":"FirebaseAuthCredential","k":"struct","c":"","r":"FFirebaseAuthCredential","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseAuthError","k":"enum","c":"","r":"EFirebaseAuthError"},{"n":"User","t":"FirebaseUser","k":"struct","c":"","r":"FFirebaseUser"}],"exec":["OnReauthenticated","OnError"],"topic":"Re-authentication"},{"id":"UReauthenticateWithFederatedProviderProxy_ReauthenticateWithFederatedProvider","title":"Reauthenticate With Federated Provider","fn":"ReauthenticateWithFederatedProvider","owner":"UReauthenticateWithFederatedProviderProxy","kind":"async","module":"Auth","group":"","platform":"","doc":"Re-authenticates the signed-in user against a generic OAuth provider — see SignInWithFederatedProvider for ProviderId/Scopes/CustomParameters details. Required before some sensitive operations (DeleteUser, UpdateUserPassword...) if the user's session is old.","inputs":[{"n":"ProviderId","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Scopes","t":"Array of String","k":"string","c":"array","r":"","adv":true},{"n":"CustomParameters","t":"Map of String to String","k":"string","c":"map","r":"","adv":true}],"outputs":[{"n":"Error","t":"EFirebaseAuthError","k":"enum","c":"","r":"EFirebaseAuthError"},{"n":"User","t":"FirebaseUser","k":"struct","c":"","r":"FFirebaseUser"}],"exec":["OnSuccess","OnError"],"topic":"Re-authentication"},{"id":"USignInWithFacebookTokenProxy_SignInWithFacebookToken","title":"Sign In With Facebook Token","fn":"SignInWithFacebookToken","owner":"USignInWithFacebookTokenProxy","kind":"async","module":"Auth","group":"","platform":"","doc":"Signs in using an access token already obtained from Facebook's own native\nSDK (e.g. via a separate Facebook Login integration elsewhere in your\nproject) — this plugin does not bundle or launch the Facebook SDK itself,\nonly wraps firebase::auth::FacebookAuthProvider::GetCredential once you\nalready have a token. For a fully self-contained flow with no Facebook SDK\ndependency at all, prefer SignInProvider(EFirebaseAuthProvider::Facebook)/\nSignInWithFederatedProvider(\"facebook.com\", ...) instead — those use\nFirebase's own generic OAuth web-redirect flow and need nothing from you\nbeyond enabling Facebook in Firebase Console.","inputs":[{"n":"AccessToken","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseAuthError","k":"enum","c":"","r":"EFirebaseAuthError"},{"n":"User","t":"FirebaseUser","k":"struct","c":"","r":"FFirebaseUser"}],"exec":["OnSignedIn","OnError"],"topic":"Sign in"},{"id":"ULinkWithFacebookTokenProxy_LinkWithFacebookToken","title":"Link With Facebook Token","fn":"LinkWithFacebookToken","owner":"ULinkWithFacebookTokenProxy","kind":"async","module":"Auth","group":"","platform":"","doc":"Same as USignInWithFacebookTokenProxy, but links AccessToken's Facebook account to the currently signed-in user instead of signing in fresh. See USignInWithFacebookTokenProxy's own doc comment re: the Facebook SDK dependency this implies.","inputs":[{"n":"AccessToken","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseAuthError","k":"enum","c":"","r":"EFirebaseAuthError"},{"n":"User","t":"FirebaseUser","k":"struct","c":"","r":"FFirebaseUser"}],"exec":["OnLinked","OnError"],"topic":"Linking"},{"id":"UReauthenticateWithFacebookTokenProxy_ReauthenticateWithFacebookToken","title":"Reauthenticate With Facebook Token","fn":"ReauthenticateWithFacebookToken","owner":"UReauthenticateWithFacebookTokenProxy","kind":"async","module":"Auth","group":"","platform":"","doc":"Same as USignInWithFacebookTokenProxy, but re-authenticates the currently signed-in user instead of signing in fresh. See USignInWithFacebookTokenProxy's own doc comment re: the Facebook SDK dependency this implies.","inputs":[{"n":"AccessToken","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseAuthError","k":"enum","c":"","r":"EFirebaseAuthError"},{"n":"User","t":"FirebaseUser","k":"struct","c":"","r":"FFirebaseUser"}],"exec":["OnReauthenticated","OnError"],"topic":"Re-authentication"},{"id":"UAuthenticateGameCenterLocalPlayerProxy_AuthenticateGameCenterLocalPlayer","title":"Authenticate Game Center Local Player","fn":"AuthenticateGameCenterLocalPlayer","owner":"UAuthenticateGameCenterLocalPlayerProxy","kind":"async","module":"Auth","group":"","platform":"iOS","doc":"Triggers Apple's native Game Center login sheet (GKLocalPlayer's own\nauthenticateHandler) if the local player isn't already authenticated with\nGame Center on this device — succeeds immediately (with bSuccess true) if\nthey already are, from a previous call in this or an earlier session.\n\nMust complete successfully before SignInProvider/LinkProvider/\nReauthenticateProvider/UnlinkProvider can be used with\nEFirebaseAuthProvider::GameCenter — call this once, e.g. at app/main-menu\nstartup, and check IsGameCenterPlayerAuthenticated aftwards if you need to\ngate UI on it. iOS/tvOS only; bSuccess is always false elsewhere.","inputs":[],"outputs":[{"n":"bSuccess","t":"Boolean","k":"bool","c":"","r":""}],"exec":["OnCompleted"],"topic":"Sign in"},{"id":"UFirebaseGameCenterLibrary_IsGameCenterPlayerAuthenticated","title":"Is Game Center Player Authenticated","fn":"IsGameCenterPlayerAuthenticated","owner":"UFirebaseGameCenterLibrary","kind":"pure","module":"Auth","group":"","platform":"","doc":"True if the local player is currently authenticated with Game Center on this device. Always false on non-iOS/tvOS platforms.","inputs":[],"outputs":[{"n":"Return Value","t":"Boolean","k":"bool","c":"","r":""}],"exec":[],"topic":"Sign in"},{"id":"USendPhoneVerificationCodeProxy_SendPhoneVerificationCode","title":"Send Phone Verification Code","fn":"SendPhoneVerificationCode","owner":"USendPhoneVerificationCodeProxy","kind":"async","module":"Auth","group":"","platform":"","doc":"Step 1 of phone number sign-in/link/reauthentication — sends an SMS\nverification code to PhoneNumber (E.164 format, e.g. \"+15551234567\").\n\nTwo different outcomes can fire — branch on whichever happens first, not\nboth:\n - OnCodeSent(VerificationId): the normal path. Hold onto VerificationId,\n   show a \"enter the code\" UI, then call VerifyPhoneCode once the user\n   types it in.\n - OnAutoVerified: Android-only bonus path — the OS detected/verified the\n   code itself (SMS auto-retrieval or instant validation) with no user\n   input needed, and this proxy already completed the full Mode operation\n   for you. VerifyPhoneCode is not needed in this case.\n\nTimeoutSeconds bounds how long Android's auto-detection is attempted\nbefore giving up and relying on manual entry only (the SDK clamps this to\n30-120 itself; use 0 to disable auto-detection entirely) — ignored on\nother platforms. Works on Android and iOS (iOS has no auto-detection, so\nmanual entry via VerifyPhoneCode is always required there).\n\n@warning Do NOT test the manual-entry path (VerifyPhoneCode) in\nPIE/Windows; see its own doc comment, it crashes the Editor. This node itself (OnCodeSent) is safe to test in PIE, but there's\nnothing useful to do with the VerificationId it gives you there.\n\nResendToken: leave default-constructed for a normal first send. To\nimplement \"Resend code\", pass the ResendToken captured from this same\nphone number's previous OnCodeSentWithToken — this tells the backend to\nsend another SMS for the same verification session instead of\ndeduplicating it as a repeat request.","inputs":[{"n":"PhoneNumber","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Mode","t":"EFirebasePhoneAuthMode","k":"enum","c":"","r":"EFirebasePhoneAuthMode","adv":false},{"n":"TimeoutSeconds","t":"Integer","k":"int","c":"","r":"","d":"60","adv":true},{"n":"ResendToken","t":"FirebaseBPPhoneForceResendingToken","k":"struct","c":"","r":"FFirebaseBPPhoneForceResendingToken","d":"FFirebaseBPPhoneForceResendingToken()","adv":true}],"outputs":[{"n":"VerificationId","t":"String","k":"string","c":"","r":""},{"n":"ResendToken","t":"FirebaseBPPhoneForceResendingToken","k":"struct","c":"","r":"FFirebaseBPPhoneForceResendingToken"},{"n":"Error","t":"EFirebaseAuthError","k":"enum","c":"","r":"EFirebaseAuthError"},{"n":"User","t":"FirebaseUser","k":"struct","c":"","r":"FFirebaseUser"},{"n":"SmsCode","t":"String","k":"string","c":"","r":""}],"exec":["OnCodeSent","OnCodeSentWithToken","OnAutoVerified","OnAutoVerifiedWithSmsCode","OnError"],"topic":"Sign in"},{"id":"UVerifyPhoneCodeProxy_VerifyPhoneCode","title":"Verify Phone Code","fn":"VerifyPhoneCode","owner":"UVerifyPhoneCodeProxy","kind":"async","module":"Auth","group":"","platform":"","doc":"Step 2 of phone number sign-in/link/reauthentication — completes the flow\nSendPhoneVerificationCode started, using VerificationId (from its\nOnCodeSent) and the code the user typed in. Not needed if\nSendPhoneVerificationCode's OnAutoVerified already fired instead. Mode\nmust match what you passed to SendPhoneVerificationCode.\n\n@warning Android and iOS devices only. Confirmed on-device (2026-08-24):\nthe DESKTOP stub's VerifyPhoneNumber fires OnCodeSent for show but never\nsets up the real verification session PhoneAuthProvider::GetCredential()\nexpects afterwards, even with fully valid inputs (a real registered\nFirebase Console test number + its matching code) — GetCredential() then\nhits an internal SDK assert that calls abort() directly, taking down the\nwhole process. This is entirely inside firebase::auth::PhoneAuthProvider\nitself, so Activate() refuses to call it at all on any platform other\nthan Android/iOS (fails immediately with Unimplemented) instead of ever\nreaching that crash — safe to call in PIE/on Windows, it just won't do\nanything useful there. iOS was originally refused too, but that was only\ninherited from the desktop finding: the vendored iOS libfirebase_auth.a\ncontains a real native bridge to FIRPhoneAuthProvider\n(credentialWithVerificationID), not the desktop stub — so iOS is now\nallowed. It has not been exercised on a physical iOS device yet: if\nGetCredential() misbehaves there, restore the PLATFORM_IOS exclusion in\nUVerifyPhoneCodeProxy/UUpdatePhoneNumberProxy::Activate. Remember iOS has\nno SMS auto-retrieval, so VerifyPhoneCode is the ONLY way to finish the\nflow there (OnAutoVerified never fires).","inputs":[{"n":"VerificationId","t":"String","k":"string","c":"","r":"","adv":false},{"n":"VerificationCode","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Mode","t":"EFirebasePhoneAuthMode","k":"enum","c":"","r":"EFirebasePhoneAuthMode","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseAuthError","k":"enum","c":"","r":"EFirebaseAuthError"},{"n":"User","t":"FirebaseUser","k":"struct","c":"","r":"FFirebaseUser"}],"exec":["OnSuccess","OnError"],"topic":"Sign in"},{"id":"UUpdatePhoneNumberProxy_UpdatePhoneNumber","title":"Update Phone Number","fn":"UpdatePhoneNumber","owner":"UUpdatePhoneNumberProxy","kind":"async","module":"Auth","group":"","platform":"","doc":"Changes the signed-in user's linked phone number to a freshly-verified one\n— same two-step flow as SendPhoneVerificationCode/VerifyPhoneCode (get\nVerificationId from OnCodeSent, have the user type in the SMS code), but\natomically replaces the old linked phone number instead of failing with\nProviderAlreadyLinked / requiring a manual Unlink first.\n\n@warning Android and iOS devices only — see UVerifyPhoneCodeProxy's own doc\ncomment for why (same underlying PhoneAuthProvider::GetCredential() call).","inputs":[{"n":"VerificationId","t":"String","k":"string","c":"","r":"","adv":false},{"n":"VerificationCode","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseAuthError","k":"enum","c":"","r":"EFirebaseAuthError"},{"n":"User","t":"FirebaseUser","k":"struct","c":"","r":"FFirebaseUser"}],"exec":["OnUpdated","OnError"],"topic":"Sign in"},{"id":"UGetPhoneNumberHintProxy_GetPhoneNumberHint","title":"Get Phone Number Hint","fn":"GetPhoneNumberHint","owner":"UGetPhoneNumberHintProxy","kind":"async","module":"Auth","group":"","platform":"Android","doc":"Android only. Shows Google's native \"Phone Number Hint\" picker — a small\nbottom-sheet listing the phone number(s) associated with the device's\nSIM/Google account — so the user taps once to fill in their number instead\nof typing it, right before you call SendPhoneVerificationCode. No dangerous\npermission needed (unlike TelephonyManager.getLine1Number(), which also\ntends to return nothing on real devices even with permission granted).\n\nOnFailed also fires (with an empty ErrorMessage) if the user dismisses the\npicker without choosing a number — there's no separate \"cancelled\" case to\ndistinguish from a real failure here, unlike the Storage file picker.","inputs":[],"outputs":[{"n":"PhoneNumber","t":"String","k":"string","c":"","r":""},{"n":"ErrorMessage","t":"String","k":"string","c":"","r":""}],"exec":["OnPhoneNumberReceived","OnFailed"],"topic":"Sign in"},{"id":"UQueryProductDetailsProxy_QueryProductDetails","title":"Query Product Details","fn":"QueryProductDetails","owner":"UQueryProductDetailsProxy","kind":"async","module":"Billing","group":"","platform":"Android","doc":"Queries Play Console product catalog info (price, title, description) for\nup to three lists of product IDs, one per EFirebaseProductType — call this\nbefore PurchaseProduct, which looks up its ProductId in whatever this last\nreturned (Play Billing itself requires the actual product details object,\nnot just an ID string, to launch a purchase). Android only.","inputs":[{"n":"ConsumableProductIds","t":"Array of String","k":"string","c":"array","r":"","adv":false},{"n":"NonConsumableProductIds","t":"Array of String","k":"string","c":"array","r":"","adv":false},{"n":"SubscriptionProductIds","t":"Array of String","k":"string","c":"array","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseBillingError","k":"enum","c":"","r":"EFirebaseBillingError"},{"n":"Products","t":"Array of FirebaseProductDetails","k":"struct","c":"array","r":""}],"exec":["OnQueried","OnFailed"],"topic":"Purchases"},{"id":"UPurchaseProductProxy_PurchaseProduct","title":"Purchase Product","fn":"PurchaseProduct","owner":"UPurchaseProductProxy","kind":"async","module":"Billing","group":"","platform":"","doc":"Launches the Play Billing purchase flow for ProductId (must have been\nreturned by a prior QueryProductDetails call). Resolves once the purchase\nflow's result includes this ProductId — if you launch a second\nPurchaseProduct before this one resolves, only the most recent call's\nresult is tracked; prefer waiting for one purchase to finish before\nstarting another. For anything you don't want to risk missing (a purchase\nthat settles after this proxy already returned, e.g. a Pending purchase\nthat later completes), bind UFirebaseBPSubsystem::OnPurchasesUpdated.\nGrant the item in ONE place only: the same purchase fires both this node's\nOnPurchased and OnPurchasesUpdated, so granting in both handlers grants it\ntwice — the simplest safe pattern is to grant only in OnPurchasesUpdated\n(keyed by PurchaseToken) and use this node just for UI feedback.\nAcknowledgment happens automatically: NonConsumable and Subscription\nproducts are acknowledged (stay owned permanently); Consumable products are\nconsumed (repurchasable again) automatically too, unless Auto Consume\nConsumables is turned off (then call Consume Purchase once granted).\n\nObfuscatedAccountId/ObfuscatedProfileId let you tie a purchase to your own\naccount/profile identifiers (Google's own fraud-detection recommendation,\nand how you'd disambiguate which of a shared device's several in-game\nprofiles made the purchase) — pass a one-way hash of your own ID, never the\nID itself in plain text. Both empty (the default) omits them, exactly as\nbefore these params existed.\n\nTo upgrade/downgrade/crossgrade an EXISTING subscription to a different\nProductId instead of buying a brand new one, pass the old subscription's\nPurchaseToken (from the FFirebasePurchase you already hold — e.g. one\nreturned by RestorePurchases, or from UFirebaseBPSubsystem::OnPurchasesUpdated)\nas OldSubscriptionPurchaseToken, and pick a ReplacementMode; leave it empty\nfor an ordinary new purchase. Check\nUFirebaseBillingLibrary::IsBillingFeatureSupported(SubscriptionsUpdate)\nfirst — not guaranteed on every Play Store version.\n\nSubscriptions with several base plans/offers (see the product's\nSubscriptionOffers): leave BasePlanId empty to buy the first one; set it\n(and OfferId, empty for the bare base plan) to buy that exact one. If it is\nnot available to this player (e.g. a free trial they already used), the\nnode fails with DeveloperError instead of charging another price.\nIgnored for one-time products.\n\nMulti-quantity products (enabled per product in Play Console) let the\nplayer pick how many to buy in Play's own dialog — read the result's\nQuantity and grant that many.","inputs":[{"n":"ProductId","t":"String","k":"string","c":"","r":"","adv":false},{"n":"ObfuscatedAccountId","t":"String","k":"string","c":"","r":"","d":"\"\"","adv":false},{"n":"ObfuscatedProfileId","t":"String","k":"string","c":"","r":"","d":"\"\"","adv":false},{"n":"OldSubscriptionPurchaseToken","t":"String","k":"string","c":"","r":"","d":"\"\"","adv":false},{"n":"ReplacementMode","t":"EFirebaseSubscriptionReplacementMode","k":"enum","c":"","r":"EFirebaseSubscriptionReplacementMode","d":"EFirebaseSubscriptionReplacementMode::WithTimeProration","adv":false},{"n":"BasePlanId","t":"String","k":"string","c":"","r":"","d":"\"\"","adv":true},{"n":"OfferId","t":"String","k":"string","c":"","r":"","d":"\"\"","adv":true}],"outputs":[{"n":"Error","t":"EFirebaseBillingError","k":"enum","c":"","r":"EFirebaseBillingError"},{"n":"Purchase","t":"FirebasePurchase","k":"struct","c":"","r":"FFirebasePurchase"}],"exec":["OnPurchased","OnFailed"],"topic":"Purchases"},{"id":"URestorePurchasesProxy_RestorePurchases","title":"Restore Purchases","fn":"RestorePurchases","owner":"URestorePurchasesProxy","kind":"async","module":"Billing","group":"","platform":"","doc":"Queries currently owned purchases (non-consumables and active\nsubscriptions) directly from Play, for both restoring entitlements on a\nnew device/reinstall and catching anything left unacknowledged from a\nprevious session. Google recommends calling this once on every app start.\nConsumables are NOT included (Play doesn't track consumed purchases as\n\"owned\" once consumed) — track those in your own save data instead.","inputs":[],"outputs":[{"n":"Error","t":"EFirebaseBillingError","k":"enum","c":"","r":"EFirebaseBillingError"},{"n":"Purchases","t":"Array of FirebasePurchase","k":"struct","c":"array","r":""}],"exec":["OnRestored","OnFailed"],"topic":"Purchases"},{"id":"UGetBillingConfigProxy_GetBillingConfig","title":"Get Billing Config","fn":"GetBillingConfig","owner":"UGetBillingConfigProxy","kind":"async","module":"Billing","group":"","platform":"Android","doc":"Fetches the Play Store country code the current player buys from\n(BillingConfig.getCountryCode() — an ISO 3166-1 alpha-2 code such as \"US\"),\nfor region-aware pricing/compliance logic. This is the STORE's country, which\ncan differ from the device locale (e.g. a traveler using their home store).\nAndroid only.","inputs":[],"outputs":[{"n":"Error","t":"EFirebaseBillingError","k":"enum","c":"","r":"EFirebaseBillingError"},{"n":"CountryCode","t":"String","k":"string","c":"","r":""}],"exec":["OnResult","OnFailed"],"topic":"Store"},{"id":"UShowInAppMessagesProxy_ShowInAppMessages","title":"Show In-App Messages","fn":"ShowInAppMessages","owner":"UShowInAppMessagesProxy","kind":"async","module":"Billing","group":"","platform":"Android","doc":"Shows Google Play's own billing in-app messages (e.g. \"your payment method\nwas declined — update it\" prompts that recover otherwise-lost subscription\nrevenue). Call it when the app starts or resumes; Play decides whether\nthere is actually a message to show for this player, and OnCompleted fires\nonce the message flow closes (immediately if there was nothing to show).\nbSubscriptionStatusUpdated is true when the player fixed a payment problem\nfrom the message — call RestorePurchases afterwards to pick up the changed\nsubscription state. Check IsBillingFeatureSupported(InAppMessaging) first;\nfails with FeatureNotSupported otherwise. Android only.","inputs":[],"outputs":[{"n":"Error","t":"EFirebaseBillingError","k":"enum","c":"","r":"EFirebaseBillingError"},{"n":"bSubscriptionStatusUpdated","t":"Boolean","k":"bool","c":"","r":""}],"exec":["OnCompleted","OnFailed"],"topic":"Store"},{"id":"UFirebaseBillingLibrary_IsBillingReady","title":"Is Billing Ready","fn":"IsBillingReady","owner":"UFirebaseBillingLibrary","kind":"pure","module":"Billing","group":"","platform":"","doc":"True once the connection to Google Play Billing is established (see UFirebaseBPSubsystem::OnBillingReady).","inputs":[],"outputs":[{"n":"Return Value","t":"Boolean","k":"bool","c":"","r":""}],"exec":[],"topic":"Store"},{"id":"UFirebaseBillingLibrary_IsBillingFeatureSupported","title":"Is Billing Feature Supported","fn":"IsBillingFeatureSupported","owner":"UFirebaseBillingLibrary","kind":"pure","module":"Billing","group":"","platform":"","doc":"Whether Feature is supported on this device/Play Store version — check\nbefore relying on it (e.g. before offering a subscription-change UI\ngated on SubscriptionsUpdate). False (not just \"unsupported\" but also\n\"unknown yet\") if Billing isn't connected — call after IsBillingReady.","inputs":[{"n":"Feature","t":"EFirebaseBillingFeature","k":"enum","c":"","r":"EFirebaseBillingFeature","adv":false}],"outputs":[{"n":"Return Value","t":"Boolean","k":"bool","c":"","r":""}],"exec":[],"topic":"Store"},{"id":"UFirebaseBillingLibrary_ConsumePurchase","title":"Consume Purchase","fn":"ConsumePurchase","owner":"UFirebaseBillingLibrary","kind":"call","module":"Billing","group":"","platform":"","doc":"Consumes a Consumable purchase once your game has granted it — only\nneeded with Auto Consume Consumables turned off (Project Settings ->\nFirebase BP -> Billing); otherwise the plugin already did it. A failure\nis retried automatically; the outcome arrives on the Firebase BP\nsubsystem's OnPurchaseConsumed. A purchase whose consume never goes\nthrough keeps being reported (the plugin re-checks purchases whenever\nBilling connects and whenever the app returns to the foreground), so\ncall this again then. Calling it twice for the same token is harmless.","inputs":[{"n":"PurchaseToken","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[],"exec":[],"topic":"Purchases"},{"id":"UFirebaseCrashlyticsLibrary_LogCrashlyticsMessage","title":"Log Crashlytics Message","fn":"LogCrashlyticsMessage","owner":"UFirebaseCrashlyticsLibrary","kind":"call","module":"Crashlytics","group":"","platform":"","doc":"Logs a breadcrumb message included in the next fatal or non-fatal crash report.","inputs":[{"n":"Message","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[],"exec":[],"topic":"Context"},{"id":"UFirebaseCrashlyticsLibrary_SetCrashlyticsCustomKeyString","title":"Set Crashlytics Custom Key String","fn":"SetCrashlyticsCustomKeyString","owner":"UFirebaseCrashlyticsLibrary","kind":"call","module":"Crashlytics","group":"","platform":"","doc":"","inputs":[{"n":"Key","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Value","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[],"exec":[],"topic":"Context"},{"id":"UFirebaseCrashlyticsLibrary_SetCrashlyticsCustomKeyInt","title":"Set Crashlytics Custom Key Int","fn":"SetCrashlyticsCustomKeyInt","owner":"UFirebaseCrashlyticsLibrary","kind":"call","module":"Crashlytics","group":"","platform":"","doc":"","inputs":[{"n":"Key","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Value","t":"Integer","k":"int","c":"","r":"","adv":false}],"outputs":[],"exec":[],"topic":"Context"},{"id":"UFirebaseCrashlyticsLibrary_SetCrashlyticsCustomKeyFloat","title":"Set Crashlytics Custom Key Float","fn":"SetCrashlyticsCustomKeyFloat","owner":"UFirebaseCrashlyticsLibrary","kind":"call","module":"Crashlytics","group":"","platform":"","doc":"","inputs":[{"n":"Key","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Value","t":"Float","k":"float","c":"","r":"","adv":false}],"outputs":[],"exec":[],"topic":"Context"},{"id":"UFirebaseCrashlyticsLibrary_SetCrashlyticsCustomKeyInt64","title":"Set Crashlytics Custom Key Int64","fn":"SetCrashlyticsCustomKeyInt64","owner":"UFirebaseCrashlyticsLibrary","kind":"call","module":"Crashlytics","group":"","platform":"","doc":"For values that don't fit a 32-bit Integer (timestamps in ms, large counters, 64-bit IDs).","inputs":[{"n":"Key","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Value","t":"Integer64","k":"int64","c":"","r":"","adv":false}],"outputs":[],"exec":[],"topic":"Context"},{"id":"UFirebaseCrashlyticsLibrary_SetCrashlyticsCustomKeyDouble","title":"Set Crashlytics Custom Key Double","fn":"SetCrashlyticsCustomKeyDouble","owner":"UFirebaseCrashlyticsLibrary","kind":"call","module":"Crashlytics","group":"","platform":"","doc":"Full double precision, unlike SetCrashlyticsCustomKeyFloat's 32-bit float.","inputs":[{"n":"Key","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Value","t":"Float","k":"float","c":"","r":"","adv":false}],"outputs":[],"exec":[],"topic":"Context"},{"id":"UFirebaseCrashlyticsLibrary_SetCrashlyticsCustomKeyBool","title":"Set Crashlytics Custom Key Bool","fn":"SetCrashlyticsCustomKeyBool","owner":"UFirebaseCrashlyticsLibrary","kind":"call","module":"Crashlytics","group":"","platform":"","doc":"","inputs":[{"n":"Key","t":"String","k":"string","c":"","r":"","adv":false},{"n":"bValue","t":"Boolean","k":"bool","c":"","r":"","adv":false}],"outputs":[],"exec":[],"topic":"Context"},{"id":"UFirebaseCrashlyticsLibrary_SetCrashlyticsUserId","title":"Set Crashlytics User Id","fn":"SetCrashlyticsUserId","owner":"UFirebaseCrashlyticsLibrary","kind":"call","module":"Crashlytics","group":"","platform":"","doc":"Associates subsequent crash reports with a user ID (e.g. after sign-in), to help correlate crashes to a specific player.","inputs":[{"n":"UserId","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[],"exec":[],"topic":"Context"},{"id":"UFirebaseCrashlyticsLibrary_RecordCrashlyticsError","title":"Record Crashlytics Error","fn":"RecordCrashlyticsError","owner":"UFirebaseCrashlyticsLibrary","kind":"call","module":"Crashlytics","group":"","platform":"","doc":"Records a non-fatal error: shows up in Crashlytics as its own event,\nseparate from real crashes, without stopping the app. Useful for\n\"this shouldn't happen but didn't kill anything\" cases.\n\nTag groups related errors into the same Crashlytics issue — e.g. pass\n\"InventorySync\" from every call site inside your inventory sync code,\nso they group together regardless of the exact Message text, and\nseparately from an unrelated \"PurchaseValidation\" error. Leave empty\n(the default) to group by Message itself instead: every call site in\nthis plugin ultimately constructs the underlying native exception at\nthe exact same line of native code, so without a Tag (or this\nMessage-based fallback), Crashlytics would otherwise lump every\nRecordCrashlyticsError call from anywhere in your whole project into a\nsingle issue, rather than one issue per distinct problem.","inputs":[{"n":"Message","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Tag","t":"String","k":"string","c":"","r":"","d":"\"\"","adv":true}],"outputs":[],"exec":[],"topic":"Errors"},{"id":"UFirebaseCrashlyticsLibrary_ForceTestCrash","title":"Force Test Crash (Testing Only)","fn":"ForceTestCrash","owner":"UFirebaseCrashlyticsLibrary","kind":"call","module":"Crashlytics","group":"","platform":"","doc":"Immediately crashes the app with a null pointer write, to verify the\nCrashlytics reporting pipeline end-to-end. Unlike the engine's \"debug\ncrash\" console command, this works in Shipping builds too (debug exec\ncommands are compiled out there). Never call this outside of testing.","inputs":[],"outputs":[],"exec":[],"topic":"Errors"},{"id":"UFirebaseCrashlyticsLibrary_DidCrashlyticsCrashOnPreviousExecution","title":"Did Crashlytics Crash On Previous Execution","fn":"DidCrashlyticsCrashOnPreviousExecution","owner":"UFirebaseCrashlyticsLibrary","kind":"pure","module":"Crashlytics","group":"","platform":"","doc":"Whether the app crashed (or ran out of memory, on iOS) during its\nimmediately preceding execution — check this at startup to show the\nplayer a \"we're sorry, send us details?\" prompt, or to decide whether to\nskip some risky startup step this run. False on every platform other\nthan Android and iOS.","inputs":[],"outputs":[{"n":"Return Value","t":"Boolean","k":"bool","c":"","r":""}],"exec":[],"topic":"Errors"},{"id":"UFirebaseCrashlyticsLibrary_SendUnsentCrashlyticsReports","title":"Send Unsent Crashlytics Reports","fn":"SendUnsentCrashlyticsReports","owner":"UFirebaseCrashlyticsLibrary","kind":"call","module":"Crashlytics","group":"","platform":"","doc":"Uploads any crash report still queued on-device instead of waiting for\nthe SDK's own automatic send — e.g. once a player consents to a\ndata-collection prompt shown after CheckForUnsentCrashlyticsReports\nfound one waiting. A no-op if none are queued.","inputs":[],"outputs":[],"exec":[],"topic":"Reports and consent"},{"id":"UFirebaseCrashlyticsLibrary_DeleteUnsentCrashlyticsReports","title":"Delete Unsent Crashlytics Reports","fn":"DeleteUnsentCrashlyticsReports","owner":"UFirebaseCrashlyticsLibrary","kind":"call","module":"Crashlytics","group":"","platform":"","doc":"Discards any crash report still queued on-device instead of uploading it\n— the opt-out counterpart to SendUnsentCrashlyticsReports, e.g. if the\nplayer declines a data-collection consent prompt.","inputs":[],"outputs":[],"exec":[],"topic":"Reports and consent"},{"id":"UFirebaseCrashlyticsLibrary_SetCrashlyticsCollectionEnabled","title":"Set Crashlytics Collection Enabled","fn":"SetCrashlyticsCollectionEnabled","owner":"UFirebaseCrashlyticsLibrary","kind":"call","module":"Crashlytics","group":"","platform":"","doc":"Turns automatic crash/non-fatal data collection on or off going forward\n— the runtime counterpart to CheckForUnsentCrashlyticsReports's consent\nflow: if a player declines, call this with false so nothing further is\ncollected (DeleteUnsentCrashlyticsReports only discards what was already\nqueued before they decided). Per Firebase's own docs this doesn't\nnecessarily take effect until the app's next launch — call it as early\nas possible (e.g. right after reading a previously-stored consent\nchoice), not only in direct response to the prompt.","inputs":[{"n":"bEnabled","t":"Boolean","k":"bool","c":"","r":"","adv":false}],"outputs":[],"exec":[],"topic":"Reports and consent"},{"id":"UCheckForUnsentCrashlyticsReportsProxy_CheckForUnsentCrashlyticsReports","title":"Check For Unsent Crashlytics Reports","fn":"CheckForUnsentCrashlyticsReports","owner":"UCheckForUnsentCrashlyticsReportsProxy","kind":"async","module":"Crashlytics","group":"","platform":"","doc":"Checks whether a crash report from a previous run is still queued on-device\nawaiting upload — typically used to decide whether to show a data-collection\nconsent prompt before calling SendUnsentCrashlyticsReports/\nDeleteUnsentCrashlyticsReports. bHasUnsentReports is false if Crashlytics\nisn't available (module disabled, or any platform other than Android and\niOS) as well as for the genuine \"nothing queued\" case — there is no\nseparate error signal, matching every other query in this module.\n\nCall it ONCE per app launch: on Android the Crashlytics SDK only answers\nthe first call per process — every later call reports false. And for there\nto be anything to check, automatic collection must be off at launch\n(Project Settings -> Firebase BP -> Privacy -> Crashlytics Collection\nEnabled At Launch unchecked); otherwise reports are uploaded right away.","inputs":[],"outputs":[{"n":"bHasUnsentReports","t":"Boolean","k":"bool","c":"","r":""}],"exec":["OnResult"],"topic":"Reports and consent"},{"id":"UDatabaseListenerLibrary_ListenToDatabaseValue","title":"Listen To Database Value","fn":"ListenToDatabaseValue","owner":"UDatabaseListenerLibrary","kind":"call","module":"Database","group":"Listener","platform":"","doc":"Starts listening to Reference's value. Callback fires once immediately with the current value, then again every time it changes, until the returned handle is passed to StopDatabaseListener.","inputs":[{"n":"Reference","t":"FirebaseDatabaseReference","k":"object","c":"","r":"","adv":false},{"n":"Callback","t":"FBP_OnDatabaseValueChanged","k":"delegate","c":"","r":"FFBP_OnDatabaseValueChanged","adv":false}],"outputs":[{"n":"Return Value","t":"FirebaseDatabaseListenerHandle","k":"struct","c":"","r":"FFirebaseDatabaseListenerHandle"}],"exec":[],"topic":"Live listeners"},{"id":"UDatabaseListenerLibrary_ListenToDatabaseQueryValue","title":"Listen To Database Query Value","fn":"ListenToDatabaseQueryValue","owner":"UDatabaseListenerLibrary","kind":"call","module":"Database","group":"Listener","platform":"","doc":"Same as ListenToDatabaseValue, but for a filtered/ordered Query — Callback fires with the value of whichever single location Query refers to (use ListenToDatabaseQueryChildren instead to observe each matching child separately).","inputs":[{"n":"Query","t":"FirebaseDatabaseQuery","k":"object","c":"","r":"","adv":false},{"n":"Callback","t":"FBP_OnDatabaseValueChanged","k":"delegate","c":"","r":"FFBP_OnDatabaseValueChanged","adv":false}],"outputs":[{"n":"Return Value","t":"FirebaseDatabaseListenerHandle","k":"struct","c":"","r":"FFirebaseDatabaseListenerHandle"}],"exec":[],"topic":"Live listeners"},{"id":"UDatabaseListenerLibrary_ListenToDatabaseChildren","title":"Listen To Database Children","fn":"ListenToDatabaseChildren","owner":"UDatabaseListenerLibrary","kind":"call","module":"Database","group":"Listener","platform":"","doc":"Starts listening to changes in Reference's immediate children (added/changed/moved/removed) — see EFirebaseDatabaseChildEventType. PreviousSiblingKey is empty for Added/Changed/Moved events on the first child, and always empty for Removed.","inputs":[{"n":"Reference","t":"FirebaseDatabaseReference","k":"object","c":"","r":"","adv":false},{"n":"Callback","t":"FBP_OnDatabaseChildEvent","k":"delegate","c":"","r":"FFBP_OnDatabaseChildEvent","adv":false}],"outputs":[{"n":"Return Value","t":"FirebaseDatabaseListenerHandle","k":"struct","c":"","r":"FFirebaseDatabaseListenerHandle"}],"exec":[],"topic":"Live listeners"},{"id":"UDatabaseListenerLibrary_ListenToDatabaseQueryChildren","title":"Listen To Database Query Children","fn":"ListenToDatabaseQueryChildren","owner":"UDatabaseListenerLibrary","kind":"call","module":"Database","group":"Listener","platform":"","doc":"Same as ListenToDatabaseChildren, but limited to Query's matching children (e.g. only the top 10 by score).","inputs":[{"n":"Query","t":"FirebaseDatabaseQuery","k":"object","c":"","r":"","adv":false},{"n":"Callback","t":"FBP_OnDatabaseChildEvent","k":"delegate","c":"","r":"FFBP_OnDatabaseChildEvent","adv":false}],"outputs":[{"n":"Return Value","t":"FirebaseDatabaseListenerHandle","k":"struct","c":"","r":"FFirebaseDatabaseListenerHandle"}],"exec":[],"topic":"Live listeners"},{"id":"UDatabaseListenerLibrary_StopDatabaseListener","title":"Stop Database Listener","fn":"StopDatabaseListener","owner":"UDatabaseListenerLibrary","kind":"call","module":"Database","group":"Listener","platform":"","doc":"Stops a listener started by any of the ListenToDatabase* functions above. Safe to call more than once, or on an already-invalid handle.","inputs":[],"outputs":[{"n":"Handle","t":"FirebaseDatabaseListenerHandle","k":"struct","c":"","r":"FFirebaseDatabaseListenerHandle"}],"exec":[],"topic":"Live listeners"},{"id":"UDatabaseListenerLibrary_StopAllDatabaseListeners","title":"Stop All Database Listeners","fn":"StopAllDatabaseListeners","owner":"UDatabaseListenerLibrary","kind":"call","module":"Database","group":"Listener","platform":"","doc":"Stops every Realtime Database listener this app started and hasn't\nstopped yet — including ones whose handle was never stored. Handy on\nsign-out, or when leaving a whole game mode. Also runs automatically at\nthe end of each Play In Editor session.","inputs":[],"outputs":[],"exec":[],"topic":"Live listeners"},{"id":"UDatabaseListenerLibrary_IsDatabaseListenerValid","title":"Is Database Listener Valid","fn":"IsDatabaseListenerValid","owner":"UDatabaseListenerLibrary","kind":"pure","module":"Database","group":"Listener","platform":"","doc":"False for a default-constructed handle, one whose listener already failed to start, one already stopped, or one the server cancelled (e.g. permission denied).","inputs":[{"n":"Handle","t":"FirebaseDatabaseListenerHandle","k":"struct","c":"","r":"FFirebaseDatabaseListenerHandle","adv":false}],"outputs":[{"n":"Return Value","t":"Boolean","k":"bool","c":"","r":""}],"exec":[],"topic":"Live listeners"},{"id":"UFirebaseDatabaseReference_GetKey","title":"Get Key","fn":"GetKey","owner":"UFirebaseDatabaseReference","kind":"pure","module":"Database","group":"","platform":"","doc":"Key of this location (its own path segment, e.g. \"abc123\" for \".../players/abc123\") — empty for the root.","inputs":[{"n":"Target","t":"FirebaseDatabaseReference","k":"object","c":"","r":"","target":true}],"outputs":[{"n":"Return Value","t":"String","k":"string","c":"","r":""}],"exec":[],"topic":"References"},{"id":"UFirebaseDatabaseReference_GetUrl","title":"Get Url","fn":"GetUrl","owner":"UFirebaseDatabaseReference","kind":"pure","module":"Database","group":"","platform":"","doc":"Absolute URL of this location.","inputs":[{"n":"Target","t":"FirebaseDatabaseReference","k":"object","c":"","r":"","target":true}],"outputs":[{"n":"Return Value","t":"String","k":"string","c":"","r":""}],"exec":[],"topic":"References"},{"id":"UFirebaseDatabaseReference_IsRoot","title":"Is Root","fn":"IsRoot","owner":"UFirebaseDatabaseReference","kind":"pure","module":"Database","group":"","platform":"","doc":"","inputs":[{"n":"Target","t":"FirebaseDatabaseReference","k":"object","c":"","r":"","target":true}],"outputs":[{"n":"Return Value","t":"Boolean","k":"bool","c":"","r":""}],"exec":[],"topic":"References"},{"id":"UFirebaseDatabaseReference_IsValid","title":"Is Valid","fn":"IsValid","owner":"UFirebaseDatabaseReference","kind":"pure","module":"Database","group":"","platform":"","doc":"False if GetDatabaseReference(FromUrl) was given a malformed path/URL, or Database wasn't initialized yet — every other call on this object would just fail with InvalidArgument/NotInitialized rather than crash.","inputs":[{"n":"Target","t":"FirebaseDatabaseReference","k":"object","c":"","r":"","target":true}],"outputs":[{"n":"Return Value","t":"Boolean","k":"bool","c":"","r":""}],"exec":[],"topic":"References"},{"id":"UFirebaseDatabaseReference_Child","title":"Child","fn":"Child","owner":"UFirebaseDatabaseReference","kind":"call","module":"Database","group":"","platform":"","doc":"A reference to a location relative to this one.","inputs":[{"n":"Target","t":"FirebaseDatabaseReference","k":"object","c":"","r":"","target":true},{"n":"Path","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"FirebaseDatabaseReference","k":"object","c":"","r":""}],"exec":[],"topic":"References"},{"id":"UFirebaseDatabaseReference_GetParent","title":"Get Parent","fn":"GetParent","owner":"UFirebaseDatabaseReference","kind":"call","module":"Database","group":"","platform":"","doc":"Parent of this location, or this same location again if it's already the root.","inputs":[{"n":"Target","t":"FirebaseDatabaseReference","k":"object","c":"","r":"","target":true}],"outputs":[{"n":"Return Value","t":"FirebaseDatabaseReference","k":"object","c":"","r":""}],"exec":[],"topic":"References"},{"id":"UFirebaseDatabaseReference_GetRoot","title":"Get Root","fn":"GetRoot","owner":"UFirebaseDatabaseReference","kind":"call","module":"Database","group":"","platform":"","doc":"","inputs":[{"n":"Target","t":"FirebaseDatabaseReference","k":"object","c":"","r":"","target":true}],"outputs":[{"n":"Return Value","t":"FirebaseDatabaseReference","k":"object","c":"","r":""}],"exec":[],"topic":"References"},{"id":"UFirebaseDatabaseReference_PushChild","title":"Push Child","fn":"PushChild","owner":"UFirebaseDatabaseReference","kind":"call","module":"Database","group":"","platform":"","doc":"Creates a new child under this location with an auto-generated, chronologically-sortable unique key (the common pattern for list items — chat messages, log entries, ...) and returns a reference to it. Doesn't write any data by itself; SetDatabaseValue on the result to actually populate it.","inputs":[{"n":"Target","t":"FirebaseDatabaseReference","k":"object","c":"","r":"","target":true}],"outputs":[{"n":"Return Value","t":"FirebaseDatabaseReference","k":"object","c":"","r":""}],"exec":[],"topic":"References"},{"id":"UFirebaseDatabaseReference_StartQuery","title":"Start Query","fn":"StartQuery","owner":"UFirebaseDatabaseReference","kind":"call","module":"Database","group":"Query","platform":"","doc":"Starts a query over this location's children — chain OrderBy*, StartAt, EndAt, EqualTo and LimitTo* on the result, then read it with Get Database Query Value or a query listener.","inputs":[{"n":"Target","t":"FirebaseDatabaseReference","k":"object","c":"","r":"","target":true}],"outputs":[{"n":"Return Value","t":"FirebaseDatabaseQuery","k":"object","c":"","r":""}],"exec":[],"topic":"Queries"},{"id":"UFirebaseDatabaseReference_GoOffline","title":"Go Offline","fn":"GoOffline","owner":"UFirebaseDatabaseReference","kind":"call","module":"Database","group":"","platform":"","doc":"Manually disconnects the Realtime Database client and disables\nautomatic reconnection. Affects every DatabaseReference in the app, not\njust this one — prefer UFirebaseDatabaseLibrary::GoOffline unless you\nspecifically need this on an arbitrary reference.","inputs":[{"n":"Target","t":"FirebaseDatabaseReference","k":"object","c":"","r":"","target":true}],"outputs":[],"exec":[],"topic":"Settings and connection"},{"id":"UFirebaseDatabaseReference_GoOnline","title":"Go Online","fn":"GoOnline","owner":"UFirebaseDatabaseReference","kind":"call","module":"Database","group":"","platform":"","doc":"Reconnects after GoOffline. Affects every DatabaseReference in the app.","inputs":[{"n":"Target","t":"FirebaseDatabaseReference","k":"object","c":"","r":"","target":true}],"outputs":[],"exec":[],"topic":"Settings and connection"},{"id":"UFirebaseDatabaseReference_RemoveAllValueListeners","title":"Remove All Value Listeners","fn":"RemoveAllValueListeners","owner":"UFirebaseDatabaseReference","kind":"call","module":"Database","group":"Listener","platform":"","doc":"Removes every ListenToDatabaseValue/ListenToDatabaseQueryValue listener attached to this exact location, without needing to track each one's own FFirebaseDatabaseListenerHandle. Listeners on a Child/Query of this location are unaffected.","inputs":[{"n":"Target","t":"FirebaseDatabaseReference","k":"object","c":"","r":"","target":true}],"outputs":[],"exec":[],"topic":"Live listeners"},{"id":"UFirebaseDatabaseReference_RemoveAllChildListeners","title":"Remove All Child Listeners","fn":"RemoveAllChildListeners","owner":"UFirebaseDatabaseReference","kind":"call","module":"Database","group":"Listener","platform":"","doc":"Same as RemoveAllValueListeners, for ListenToDatabaseChildren/ListenToDatabaseQueryChildren listeners instead.","inputs":[{"n":"Target","t":"FirebaseDatabaseReference","k":"object","c":"","r":"","target":true}],"outputs":[],"exec":[],"topic":"Live listeners"},{"id":"UFirebaseDatabaseQuery_IsValid","title":"Is Valid","fn":"IsValid","owner":"UFirebaseDatabaseQuery","kind":"pure","module":"Database","group":"Query","platform":"","doc":"False if the reference this query was started from was invalid, or a StartAt/EndAt/EqualTo call was given malformed JSON (which is otherwise silently ignored, leaving the query running unfiltered — check this if that matters to you).","inputs":[{"n":"Target","t":"FirebaseDatabaseQuery","k":"object","c":"","r":"","target":true}],"outputs":[{"n":"Return Value","t":"Boolean","k":"bool","c":"","r":""}],"exec":[],"topic":"Queries"},{"id":"UFirebaseDatabaseQuery_OrderByChild","title":"Order By Child","fn":"OrderByChild","owner":"UFirebaseDatabaseQuery","kind":"call","module":"Database","group":"Query","platform":"","doc":"","inputs":[{"n":"Target","t":"FirebaseDatabaseQuery","k":"object","c":"","r":"","target":true},{"n":"Path","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"FirebaseDatabaseQuery","k":"object","c":"","r":""}],"exec":[],"topic":"Queries"},{"id":"UFirebaseDatabaseQuery_OrderByKey","title":"Order By Key","fn":"OrderByKey","owner":"UFirebaseDatabaseQuery","kind":"call","module":"Database","group":"Query","platform":"","doc":"","inputs":[{"n":"Target","t":"FirebaseDatabaseQuery","k":"object","c":"","r":"","target":true}],"outputs":[{"n":"Return Value","t":"FirebaseDatabaseQuery","k":"object","c":"","r":""}],"exec":[],"topic":"Queries"},{"id":"UFirebaseDatabaseQuery_OrderByPriority","title":"Order By Priority","fn":"OrderByPriority","owner":"UFirebaseDatabaseQuery","kind":"call","module":"Database","group":"Query","platform":"","doc":"","inputs":[{"n":"Target","t":"FirebaseDatabaseQuery","k":"object","c":"","r":"","target":true}],"outputs":[{"n":"Return Value","t":"FirebaseDatabaseQuery","k":"object","c":"","r":""}],"exec":[],"topic":"Queries"},{"id":"UFirebaseDatabaseQuery_OrderByValue","title":"Order By Value","fn":"OrderByValue","owner":"UFirebaseDatabaseQuery","kind":"call","module":"Database","group":"Query","platform":"","doc":"","inputs":[{"n":"Target","t":"FirebaseDatabaseQuery","k":"object","c":"","r":"","target":true}],"outputs":[{"n":"Return Value","t":"FirebaseDatabaseQuery","k":"object","c":"","r":""}],"exec":[],"topic":"Queries"},{"id":"UFirebaseDatabaseQuery_StartAt","title":"Start At","fn":"StartAt","owner":"UFirebaseDatabaseQuery","kind":"call","module":"Database","group":"Query","platform":"","doc":"Keeps only children with a sort value >= OrderValueJson (a JSON scalar, e.g. \"10\" or \"\\\"abc\\\"\" — see FirebaseBPVariantJson.h), using whichever OrderBy is active.\nChildKey (optional) breaks ties between children with the same sort\nvalue: only those whose key is >= ChildKey are kept — what makes paging\nthrough e.g. a leaderboard with equal scores reliable (start the next\npage at the last row's score AND key).","inputs":[{"n":"Target","t":"FirebaseDatabaseQuery","k":"object","c":"","r":"","target":true},{"n":"OrderValueJson","t":"String","k":"string","c":"","r":"","adv":false},{"n":"ChildKey","t":"String","k":"string","c":"","r":"","d":"\"\"","adv":true}],"outputs":[{"n":"Return Value","t":"FirebaseDatabaseQuery","k":"object","c":"","r":""}],"exec":[],"topic":"Queries"},{"id":"UFirebaseDatabaseQuery_EndAt","title":"End At","fn":"EndAt","owner":"UFirebaseDatabaseQuery","kind":"call","module":"Database","group":"Query","platform":"","doc":"Keeps only children with a sort value \u003c= OrderValueJson. ChildKey (optional): among children with that exact sort value, only those whose key is \u003c= ChildKey.","inputs":[{"n":"Target","t":"FirebaseDatabaseQuery","k":"object","c":"","r":"","target":true},{"n":"OrderValueJson","t":"String","k":"string","c":"","r":"","adv":false},{"n":"ChildKey","t":"String","k":"string","c":"","r":"","d":"\"\"","adv":true}],"outputs":[{"n":"Return Value","t":"FirebaseDatabaseQuery","k":"object","c":"","r":""}],"exec":[],"topic":"Queries"},{"id":"UFirebaseDatabaseQuery_EqualTo","title":"Equal To","fn":"EqualTo","owner":"UFirebaseDatabaseQuery","kind":"call","module":"Database","group":"Query","platform":"","doc":"Keeps only children with a sort value == OrderValueJson. ChildKey (optional): and whose key is exactly ChildKey.","inputs":[{"n":"Target","t":"FirebaseDatabaseQuery","k":"object","c":"","r":"","target":true},{"n":"OrderValueJson","t":"String","k":"string","c":"","r":"","adv":false},{"n":"ChildKey","t":"String","k":"string","c":"","r":"","d":"\"\"","adv":true}],"outputs":[{"n":"Return Value","t":"FirebaseDatabaseQuery","k":"object","c":"","r":""}],"exec":[],"topic":"Queries"},{"id":"UFirebaseDatabaseQuery_LimitToFirst","title":"Limit To First","fn":"LimitToFirst","owner":"UFirebaseDatabaseQuery","kind":"call","module":"Database","group":"Query","platform":"","doc":"Keeps only the first Count children (by the query's order). 0 leaves the query unlimited.","inputs":[{"n":"Target","t":"FirebaseDatabaseQuery","k":"object","c":"","r":"","target":true},{"n":"Count","t":"Integer","k":"int","c":"","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"FirebaseDatabaseQuery","k":"object","c":"","r":""}],"exec":[],"topic":"Queries"},{"id":"UFirebaseDatabaseQuery_LimitToLast","title":"Limit To Last","fn":"LimitToLast","owner":"UFirebaseDatabaseQuery","kind":"call","module":"Database","group":"Query","platform":"","doc":"Keeps only the last Count children (by the query's order). 0 leaves the query unlimited.","inputs":[{"n":"Target","t":"FirebaseDatabaseQuery","k":"object","c":"","r":"","target":true},{"n":"Count","t":"Integer","k":"int","c":"","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"FirebaseDatabaseQuery","k":"object","c":"","r":""}],"exec":[],"topic":"Queries"},{"id":"UFirebaseDatabaseQuery_SetKeepSynchronized","title":"Set Keep Synchronized","fn":"SetKeepSynchronized","owner":"UFirebaseDatabaseQuery","kind":"call","module":"Database","group":"Query","platform":"","doc":"Keeps this location's data downloaded and synced even with no active listener, and exempt from persistent-cache eviction.","inputs":[{"n":"Target","t":"FirebaseDatabaseQuery","k":"object","c":"","r":"","target":true},{"n":"bKeepSynchronized","t":"Boolean","k":"bool","c":"","r":"","adv":false}],"outputs":[],"exec":[],"topic":"Queries"},{"id":"UFirebaseDatabaseQuery_GetReference","title":"Get Reference","fn":"GetReference","owner":"UFirebaseDatabaseQuery","kind":"call","module":"Database","group":"Query","platform":"","doc":"A DatabaseReference to this same location, without any of this query's ordering/filtering.","inputs":[{"n":"Target","t":"FirebaseDatabaseQuery","k":"object","c":"","r":"","target":true}],"outputs":[{"n":"Return Value","t":"FirebaseDatabaseReference","k":"object","c":"","r":""}],"exec":[],"topic":"Queries"},{"id":"UFirebaseDatabaseQuery_RemoveAllValueListeners","title":"Remove All Value Listeners","fn":"RemoveAllValueListeners","owner":"UFirebaseDatabaseQuery","kind":"call","module":"Database","group":"Listener","platform":"","doc":"Removes every ListenToDatabaseQueryValue listener attached to this exact filtered query. Listeners on a different Query (even over the same underlying location) or a plain ListenToDatabaseValue are unaffected.","inputs":[{"n":"Target","t":"FirebaseDatabaseQuery","k":"object","c":"","r":"","target":true}],"outputs":[],"exec":[],"topic":"Live listeners"},{"id":"UFirebaseDatabaseQuery_RemoveAllChildListeners","title":"Remove All Child Listeners","fn":"RemoveAllChildListeners","owner":"UFirebaseDatabaseQuery","kind":"call","module":"Database","group":"Listener","platform":"","doc":"Same as RemoveAllValueListeners, for ListenToDatabaseQueryChildren listeners instead.","inputs":[{"n":"Target","t":"FirebaseDatabaseQuery","k":"object","c":"","r":"","target":true}],"outputs":[],"exec":[],"topic":"Live listeners"},{"id":"UFirebaseDatabaseOnDisconnect_SetValue","title":"Set Value","fn":"SetValue","owner":"UFirebaseDatabaseOnDisconnect","kind":"call","module":"Database","group":"OnDisconnect","platform":"","doc":"Sets this location's value to JsonValue when the client disconnects.","inputs":[{"n":"Target","t":"FirebaseDatabaseOnDisconnect","k":"object","c":"","r":"","target":true},{"n":"JsonValue","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[],"exec":[],"topic":"On disconnect (presence)"},{"id":"UFirebaseDatabaseOnDisconnect_SetValueAndPriority","title":"Set Value And Priority","fn":"SetValueAndPriority","owner":"UFirebaseDatabaseOnDisconnect","kind":"call","module":"Database","group":"OnDisconnect","platform":"","doc":"Sets this location's value and priority when the client disconnects.","inputs":[{"n":"Target","t":"FirebaseDatabaseOnDisconnect","k":"object","c":"","r":"","target":true},{"n":"JsonValue","t":"String","k":"string","c":"","r":"","adv":false},{"n":"JsonPriority","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[],"exec":[],"topic":"On disconnect (presence)"},{"id":"UFirebaseDatabaseOnDisconnect_UpdateChildren","title":"Update Children","fn":"UpdateChildren","owner":"UFirebaseDatabaseOnDisconnect","kind":"call","module":"Database","group":"OnDisconnect","platform":"","doc":"Updates the given child keys to the given values (a JSON object) when the client disconnects; a value of JSON null deletes that child.","inputs":[{"n":"Target","t":"FirebaseDatabaseOnDisconnect","k":"object","c":"","r":"","target":true},{"n":"JsonValues","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[],"exec":[],"topic":"On disconnect (presence)"},{"id":"UFirebaseDatabaseOnDisconnect_RemoveValue","title":"Remove Value","fn":"RemoveValue","owner":"UFirebaseDatabaseOnDisconnect","kind":"call","module":"Database","group":"OnDisconnect","platform":"","doc":"Removes this location's value when the client disconnects.","inputs":[{"n":"Target","t":"FirebaseDatabaseOnDisconnect","k":"object","c":"","r":"","target":true}],"outputs":[],"exec":[],"topic":"On disconnect (presence)"},{"id":"UFirebaseDatabaseOnDisconnect_Cancel","title":"Cancel","fn":"Cancel","owner":"UFirebaseDatabaseOnDisconnect","kind":"call","module":"Database","group":"OnDisconnect","platform":"","doc":"Cancels every OnDisconnect operation queued for this location.","inputs":[{"n":"Target","t":"FirebaseDatabaseOnDisconnect","k":"object","c":"","r":"","target":true}],"outputs":[],"exec":[],"topic":"On disconnect (presence)"},{"id":"UFirebaseDatabaseLibrary_UseDatabaseURL","title":"Use Database URL","fn":"UseDatabaseURL","owner":"UFirebaseDatabaseLibrary","kind":"call","module":"Database","group":"","platform":"","doc":"Points every subsequent Database call at Url instead of the project's\ndefault Realtime Database instance — needed both to reach the Firebase\nLocal Emulator Suite (typically \"http://127.0.0.1:9000/?ns=\u003cyour-database-name>\";\n\"10.0.2.2\" instead of \"127.0.0.1\" from an Android emulator, loopback to\nthe host machine) and, in production, any Realtime Database instance\nthat isn't this project's default one — e.g. a non-default-region\ninstance, or any instance when the project has more than one. Call\nonce, before any other Database node (including GetDatabaseReference);\ncalling it again later resolves to a distinct Database instance for\nthe new Url (the SDK caches one instance per Url), it does not\nreconfigure the previous one.","inputs":[{"n":"Url","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[],"exec":[],"topic":"Settings and connection"},{"id":"UFirebaseDatabaseLibrary_GetDatabaseReference","title":"Get Database Reference","fn":"GetDatabaseReference","owner":"UFirebaseDatabaseLibrary","kind":"call","module":"Database","group":"","platform":"","doc":"A reference to Path (e.g. \"players/abc123\"), or the root if Path is empty.","inputs":[{"n":"Path","t":"String","k":"string","c":"","r":"","d":"\"\"","adv":false}],"outputs":[{"n":"Return Value","t":"FirebaseDatabaseReference","k":"object","c":"","r":""}],"exec":[],"topic":"References"},{"id":"UFirebaseDatabaseLibrary_GetDatabaseReferenceFromUrl","title":"Get Database Reference From Url","fn":"GetDatabaseReferenceFromUrl","owner":"UFirebaseDatabaseLibrary","kind":"call","module":"Database","group":"","platform":"","doc":"A reference to Url, which must belong to this app's own Database URL. Needed only if you have a location's full URL (e.g. from data written elsewhere) rather than its path.","inputs":[{"n":"Url","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"FirebaseDatabaseReference","k":"object","c":"","r":""}],"exec":[],"topic":"References"},{"id":"UFirebaseDatabaseLibrary_GetDatabaseConnectionStateReference","title":"Get Database Connection State Reference","fn":"GetDatabaseConnectionStateReference","owner":"UFirebaseDatabaseLibrary","kind":"call","module":"Database","group":"","platform":"","doc":"A reference to Realtime Database's special \".info/connected\" location —\nits value is a JSON bool: true whenever this client currently has an\nactive connection to the Realtime Database backend, false the instant\nit doesn't (including right before the app quits — the standard basis\nfor a presence system). Listen to it with ListenToDatabaseValue, and\npair it with GetOnDisconnectHandler to write a \"went offline\" state that\nthe server applies the moment it notices this client disconnect.","inputs":[],"outputs":[{"n":"Return Value","t":"FirebaseDatabaseReference","k":"object","c":"","r":""}],"exec":[],"topic":"Settings and connection"},{"id":"UFirebaseDatabaseLibrary_GetOnDisconnectHandler","title":"Get On Disconnect Handler","fn":"GetOnDisconnectHandler","owner":"UFirebaseDatabaseLibrary","kind":"call","module":"Database","group":"OnDisconnect","platform":"","doc":"The disconnect handler for Reference — see UFirebaseDatabaseOnDisconnect.\nReturns an invalid (does-nothing) handler if Database isn't available.","inputs":[{"n":"Reference","t":"FirebaseDatabaseReference","k":"object","c":"","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"FirebaseDatabaseOnDisconnect","k":"object","c":"","r":""}],"exec":[],"topic":"On disconnect (presence)"},{"id":"UFirebaseDatabaseLibrary_SetDatabasePersistenceEnabled","title":"Set Database Persistence Enabled","fn":"SetDatabasePersistenceEnabled","owner":"UFirebaseDatabaseLibrary","kind":"call","module":"Database","group":"","platform":"","doc":"Persists pending writes and cached data to on-device storage so they\nsurvive an app restart, even offline. Call once, before creating any\nDatabaseReference (i.e. as early as possible) — has no effect if called\nlater.","inputs":[{"n":"bEnabled","t":"Boolean","k":"bool","c":"","r":"","adv":false}],"outputs":[],"exec":[],"topic":"Settings and connection"},{"id":"UFirebaseDatabaseLibrary_GoOffline","title":"Go Offline","fn":"GoOffline","owner":"UFirebaseDatabaseLibrary","kind":"call","module":"Database","group":"","platform":"","doc":"Manually disconnects the Realtime Database client and disables automatic reconnection, until GoOnline is called.","inputs":[],"outputs":[],"exec":[],"topic":"Settings and connection"},{"id":"UFirebaseDatabaseLibrary_GoOnline","title":"Go Online","fn":"GoOnline","owner":"UFirebaseDatabaseLibrary","kind":"call","module":"Database","group":"","platform":"","doc":"Reconnects after GoOffline.","inputs":[],"outputs":[],"exec":[],"topic":"Settings and connection"},{"id":"UFirebaseDatabaseLibrary_PurgeOutstandingWrites","title":"Purge Outstanding Writes","fn":"PurgeOutstandingWrites","owner":"UFirebaseDatabaseLibrary","kind":"call","module":"Database","group":"","platform":"","doc":"Abandons every pending write (including transactions and OnDisconnect operations) instead of sending them once connectivity returns. Rolls them back locally, possibly triggering listener events.","inputs":[],"outputs":[],"exec":[],"topic":"Settings and connection"},{"id":"UFirebaseDatabaseLibrary_MakeServerTimestampJson","title":"Make Server Timestamp Json","fn":"MakeServerTimestampJson","owner":"UFirebaseDatabaseLibrary","kind":"pure","module":"Database","group":"","platform":"","doc":"A JSON value which, when included anywhere inside JsonValue passed to\nSetDatabaseValue/UpdateDatabaseChildren, tells the server to replace it\nwith the current server time (milliseconds since epoch) at write time —\nuse this instead of a client-generated timestamp to avoid clock-skew\nissues between devices.","inputs":[],"outputs":[{"n":"Return Value","t":"String","k":"string","c":"","r":""}],"exec":[],"topic":"Settings and connection"},{"id":"UFirebaseDatabaseLibrary_SetDatabaseLogLevel","title":"Set Database Log Level","fn":"SetDatabaseLogLevel","owner":"UFirebaseDatabaseLibrary","kind":"call","module":"Database","group":"","platform":"","doc":"Verbosity of this Realtime Database instance's own internal logging —\nseparate from (and on top of) UFirebaseBPSubsystem::SetFirebaseLogLevel's\nSDK-wide setting; use this to get more/less Database-specific detail\nwithout changing every other module's verbosity. Reuses EFirebaseLogLevel\n(see its own doc comment on FirebaseBPSubsystem.h).","inputs":[{"
