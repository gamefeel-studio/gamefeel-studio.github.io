<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FirebaseBP Node Reference</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: sticky search bar, module rail on the left (chip row on phones), node cards drawn like Blueprint graph nodes. */
:root {
  --bg: #eef0f3;
  --surface: #ffffff;
  --surface-2: #f6f7f9;
  --ink: #18202c;
  --ink-2: #4a5566;
  --ink-3: #6f7a8b;
  --line: #d9dde4;
  --accent: #d9761a;
  --accent-ink: #9a4f0b;
  --grid: rgba(24, 32, 44, 0.045);

  /* Node header colors (Blueprint editor conventions). */
  --hd-async: #3a6ea8;
  --hd-call: #2f5d8f;
  --hd-pure: #4f8a3d;
  --hd-event: #a83a32;
  --hd-type: #59607a;

  /* Pin colors (Unreal's own pin palette, darkened to read on light). */
  --pin-exec: #3c4350;
  --pin-bool: #a40e0e;
  --pin-int: #0f9d7a;
  --pin-int64: #3f8f6b;
  --pin-byte: #00695c;
  --pin-enum: #00695c;
  --pin-float: #5e9c16;
  --pin-string: #c0189c;
  --pin-text: #c4569e;
  --pin-name: #8e5bc9;
  --pin-struct: #1d5fbd;
  --pin-object: #0889c7;
  --pin-class: #6a2fb0;
  --pin-delegate: #b5382f;
  --pin-other: #7a8090;

  --android: #2d7d46;
  --ios: #4a5566;

  --f-display: "Barlow Semi Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15181d; --surface: #1d2128; --surface-2: #232831; --ink: #e6e9ee; --ink-2: #aab3c0; --ink-3: #828c9b; --line: #313844;
    --accent: #f0913a; --accent-ink: #f6b072; --grid: rgba(255, 255, 255, 0.035);
    --hd-async: #3d74b3; --hd-call: #33669e; --hd-pure: #4d8b3a; --hd-event: #b0433a; --hd-type: #5d6582;
    --pin-exec: #e6e9ee; --pin-bool: #e04646; --pin-int: #2fe0b2; --pin-int64: #7fd8a8; --pin-byte: #1fbba3; --pin-enum: #1fbba3; --pin-float: #9fe04a;
    --pin-string: #ff4fd8; --pin-text: #ee8fcf; --pin-name: #c79bff; --pin-struct: #4d93ff; --pin-object: #33b4f2; --pin-class: #a46cf0; --pin-delegate: #ff6b5e; --pin-other: #a0a6b4;
    --android: #5fc07c; --ios: #aab3c0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15181d; --surface: #1d2128; --surface-2: #232831; --ink: #e6e9ee; --ink-2: #aab3c0; --ink-3: #828c9b; --line: #313844;
  --accent: #f0913a; --accent-ink: #f6b072; --grid: rgba(255, 255, 255, 0.035);
  --hd-async: #3d74b3; --hd-call: #33669e; --hd-pure: #4d8b3a; --hd-event: #b0433a; --hd-type: #5d6582;
  --pin-exec: #e6e9ee; --pin-bool: #e04646; --pin-int: #2fe0b2; --pin-int64: #7fd8a8; --pin-byte: #1fbba3; --pin-enum: #1fbba3; --pin-float: #9fe04a;
  --pin-string: #ff4fd8; --pin-text: #ee8fcf; --pin-name: #c79bff; --pin-struct: #4d93ff; --pin-object: #33b4f2; --pin-class: #a46cf0; --pin-delegate: #ff6b5e; --pin-other: #a0a6b4;
  --android: #5fc07c; --ios: #aab3c0;
  color-scheme: dark;
}

* { box-sizing: border-box; }
/* Pages, search and filters work by toggling hidden; display: grid / flex rules must not undo it. */
[hidden] { display: none !important; }
body {
  background: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font: 15px/1.55 var(--f-body);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
a { color: var(--accent-ink); }
code, .mono { font-family: var(--f-mono); font-size: 0.86em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand h1 { margin: 0; font: 700 22px/1.1 var(--f-display); letter-spacing: 0.01em; }
.brand h1 span { color: var(--accent); }
.brand .ver { font: 500 12px var(--f-mono); color: var(--ink-3); white-space: nowrap; }
.search { flex: 1 1 260px; display: flex; gap: 8px; align-items: center; max-width: 560px; }
.search input {
  width: 100%; font: 15px var(--f-body); color: var(--ink); background: var(--surface-2);
  border: 1px solid var(--line); border-radius: var(--r); padding: 8px 12px;
}
.search .count { font: 500 12px var(--f-mono); color: var(--ink-3); white-space: nowrap; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button {
  font: 600 12px var(--f-body); letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-2);
  background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; cursor: pointer;
}
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }

.layout {
  display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 28px;
  padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 1320px; margin: 0 auto;
}
nav.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 74px); align-self: start; max-height: calc(100vh - 100px); overflow: auto; }
nav.rail ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
nav.rail a {
  display: flex; justify-content: space-between; gap: 8px; text-decoration: none; color: var(--ink-2);
  font: 600 15px var(--f-display); letter-spacing: 0.02em; padding: 5px 10px; border-radius: var(--r);
}
nav.rail a:hover { background: var(--surface); color: var(--ink); }
nav.rail a .n { font: 500 11px var(--f-mono); color: var(--ink-3); align-self: center; }
nav.rail .sep { height: 1px; background: var(--line); margin: 8px 10px; }
nav.rail a .lbl { display: flex; align-items: center; gap: 9px; min-width: 0; }
.mg.sm { width: 22px; height: 22px; border-radius: 6px; font-size: 10.5px; letter-spacing: 0; }
.mg.home { background: var(--accent); }

/* ☰ toggles the module menu: a drawer on phones, a collapsible column on wide screens. */
.menu-btn {
  flex: none; display: grid; place-items: center; width: 36px; height: 36px; padding: 0; cursor: pointer;
  background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r);
}
.menu-btn svg { width: 20px; height: 20px; }
.menu-btn:hover { border-color: var(--accent); }
.drawer-head { display: none; align-items: center; justify-content: space-between; padding: 0 4px 10px 10px; margin-bottom: 8px; border-bottom: 1px solid var(--line); font: 700 18px var(--f-display); }
.drawer-head button { background: none; border: 0; color: var(--ink-2); font-size: 22px; line-height: 1; padding: 4px 8px; cursor: pointer; }
.scrim { display: none; position: fixed; inset: 0; z-index: 35; background: rgba(0, 0, 0, 0.45); }
@media (min-width: 861px) {
  body.nav-collapsed nav.rail { display: none; }
  body.nav-collapsed .layout { grid-template-columns: minmax(0, 1fr); max-width: 1100px; }
}

/* minmax(0, 1fr): an implicit auto column would grow to its widest card and overflow phones. */
main { min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 40px; }
section.module { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; scroll-margin-top: 90px; }
.module-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; border-bottom: 2px solid var(--ink); padding-bottom: 6px; }
.module-head h2 { margin: 0; font: 700 30px/1.1 var(--f-display); letter-spacing: 0.01em; text-wrap: balance; }
.module-head .meta { font: 500 12px var(--f-mono); color: var(--ink-3); }
h3.group { margin: 6px 0 -4px; font: 600 13px var(--f-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 14px; align-items: start; }

.node {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  box-shadow: 0 1px 0 rgba(0,0,0,0.04); overflow: hidden; min-width: 0; scroll-margin-top: 90px;
}
.node > header {
  display: flex; align-items: center; gap: 10px; padding: 7px 12px; color: #fff;
  background: var(--hd-call);
}
.node.async > header { background: linear-gradient(90deg, var(--hd-async), color-mix(in srgb, var(--hd-async) 70%, #000)); }
.node.pure > header { background: var(--hd-pure); }
.node.event > header { background: var(--hd-event); }
.node.type > header { background: var(--hd-type); }
.node header .ico { width: 16px; height: 16px; flex: none; }
.node header h4 { margin: 0; font: 600 17px/1.2 var(--f-display); letter-spacing: 0.01em; min-width: 0; overflow-wrap: anywhere; }
.node header .kind { margin-left: auto; font: 600 10px var(--f-body); letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.85; white-space: nowrap; }
.node .sub { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 6px 12px 0; font-size: 12px; color: var(--ink-3); }
.badge { font: 600 11px var(--f-body); letter-spacing: 0.03em; border-radius: 4px; padding: 1px 6px; border: 1px solid currentColor; }
.badge.Android { color: var(--android); }
.badge.iOS, .badge.Mobile { color: var(--ios); }
.pins { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 4px 16px; padding: 8px 12px; }
.pins .col { display: grid; gap: 4px; align-content: start; min-width: 0; }
.pins .col.out { justify-items: end; text-align: right; }
.pin { display: flex; align-items: flex-start; gap: 7px; min-width: 0; font-size: 13px; line-height: 1.35; }
.col.out .pin { flex-direction: row-reverse; }
.pin .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--c, var(--pin-other)); margin-top: 3px; }
.pin.array .dot { border-radius: 2px; background: repeating-linear-gradient(90deg, var(--c) 0 2px, transparent 2px 4px); }
.pin.map .dot { border-radius: 2px; background: var(--c); }
.pin.exec .dot { border: none; width: 0; height: 0; border-left: 9px solid var(--pin-exec); border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-radius: 0; margin-top: 2px; }
.pin .pn { font-weight: 500; overflow-wrap: anywhere; }
.pin .pt { display: block; font: 400 11.5px var(--f-mono); color: var(--ink-3); overflow-wrap: anywhere; }
.pin .pd { font: 400 11.5px var(--f-mono); color: var(--accent-ink); overflow-wrap: anywhere; }
.pin .adv { font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
.pin a { color: inherit; }
.k-bool { --c: var(--pin-bool); } .k-int { --c: var(--pin-int); } .k-int64 { --c: var(--pin-int64); } .k-byte { --c: var(--pin-byte); }
.k-enum { --c: var(--pin-enum); } .k-float { --c: var(--pin-float); } .k-string { --c: var(--pin-string); } .k-text { --c: var(--pin-text); }
.k-name { --c: var(--pin-name); } .k-struct, .k-vector { --c: var(--pin-struct); } .k-object { --c: var(--pin-object); } .k-class { --c: var(--pin-class); }
.k-delegate { --c: var(--pin-delegate); } .k-other { --c: var(--pin-other); }
.node .doc { padding: 4px 12px 12px; color: var(--ink-2); font-size: 14px; }
.node .doc p { margin: 0 0 8px; max-width: 70ch; }
.node .doc p:last-child { margin-bottom: 0; }
.node details { border-top: 1px solid var(--line); }
.node details summary { cursor: pointer; padding: 6px 12px; font-size: 12.5px; color: var(--ink-3); }
.node .fn { font: 400 11.5px var(--f-mono); color: var(--ink-3); }

.fields { width: 100%; border-collapse: collapse; font-size: 13px; }
.fields td { border-top: 1px solid var(--line); padding: 6px 12px; vertical-align: top; }
.fields td:first-child { width: 42%; }
.fields .doc-cell { color: var(--ink-2); }
.table-wrap { overflow-x: auto; }

.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 12.5px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.empty { padding: 40px 0; text-align: center; color: var(--ink-3); }

.settings-cat h3 { margin: 10px 0 6px; font: 600 18px var(--f-display); }

/* Overview: three pictogram steps and a tile per module. */
.hero { display: grid; gap: 18px; }
.hero h2 { margin: 0; font: 700 34px/1.1 var(--f-display); text-wrap: balance; }
.hero .lede { margin: -8px 0 0; color: var(--ink-2); }
.howto { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 12px; margin: 0; padding: 0; list-style: none; }
.howto li { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 2px 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.howto .hico { grid-row: span 2; width: 44px; height: 44px; border-radius: 10px; display: grid; place-items: center; background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent-ink); }
.howto .hico svg { width: 24px; height: 24px; }
.howto b { font: 600 17px/1.2 var(--f-display); }
.howto span:last-child { font: 400 12px/1.4 var(--f-mono); color: var(--ink-3); overflow-wrap: anywhere; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 10px; }
.tile {
  --tc: hsl(var(--h) 55% 45%);
  display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 2px 12px; align-content: start;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; text-decoration: none; color: inherit;
  transition: border-color 0.15s, transform 0.15s;
}
.tile:hover { border-color: var(--tc); transform: translateY(-1px); }
.mg { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 9px; background: hsl(var(--h) 55% 45%); color: #fff; font: 700 17px var(--f-display); letter-spacing: 0.02em; flex: none; }
.tile .mg { grid-row: span 3; }
.tile .tname { font: 600 18px/1.15 var(--f-display); }
.tile .ttag { font-size: 12.5px; line-height: 1.4; color: var(--ink-2); }
.tile .tcount { font: 400 11px var(--f-mono); color: var(--ink-3); }

/* Module head with its monogram, then the Quick start graph. */
.module-head .mg { align-self: center; width: 44px; height: 44px; font-size: 19px; }
.module-head .tagline { flex-basis: 100%; margin: 0; color: var(--ink-2); }
.recipe { grid-template-columns: minmax(0, 1fr); background: var(--surface-2); border: 1px dashed var(--line); border-radius: var(--r); padding: 12px 14px 14px; display: grid; gap: 10px; }
.recipe-title { font: 600 12px var(--f-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent-ink); }
.recipe-title span { text-transform: none; letter-spacing: 0; font: 500 14px var(--f-body); color: var(--ink); margin-left: 6px; }
/* Nodes top-aligned so the wire sits on the first exec row, as in the editor. */
.graph { display: flex; align-items: flex-start; overflow-x: auto; padding-bottom: 4px; }
.graph .node { flex: none; }
.graph .node .pins { padding: 6px 10px; }
.pin.hl .pn { color: var(--accent-ink); font-weight: 600; }
.pin.exec.hl .dot { border-left-color: var(--accent); }
.wire { flex: none; display: grid; justify-items: center; gap: 2px; width: 88px; margin: 24px -2px 0; }
.wire i { display: block; width: 100%; height: 3px; background: var(--pin-exec); position: relative; border-radius: 2px; }
.wire i::after { content: ""; position: absolute; right: -2px; top: -5px; border-left: 9px solid var(--pin-exec); border-top: 6.5px solid transparent; border-bottom: 6.5px solid transparent; }
.wire span { font: 500 11px var(--f-mono); color: var(--ink-3); white-space: nowrap; }

/* Blueprint nodes, drawn like the editor's (dark body in both themes), with a one-line caption under them. */
.bpgrid { display: flex; flex-wrap: wrap; gap: 28px 32px; align-items: flex-start; }
.node.bp { background: none; border: 0; border-radius: 0; box-shadow: none; overflow: visible; width: max-content; max-width: 100%; display: grid; gap: 6px; }
.bpn {
  --pin-exec: #f2f2f2; --pin-bool: #e04646; --pin-int: #2fe0b2; --pin-int64: #7fd8a8; --pin-byte: #1fbba3; --pin-enum: #1fbba3; --pin-float: #9fe04a;
  --pin-string: #ff4fd8; --pin-text: #ee8fcf; --pin-name: #c79bff; --pin-struct: #4d93ff; --pin-object: #33b4f2; --pin-class: #a46cf0; --pin-delegate: #ff6b5e; --pin-other: #a0a6b4;
  min-width: 220px; max-width: 100%; background: rgba(16, 17, 19, 0.94); color: #e6e6e6; border: 1px solid #050505; border-radius: 8px;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.07), 0 8px 18px rgba(0, 0, 0, 0.32); overflow: hidden; font: 13px/1.25 var(--f-body);
}
.bp { --hc: #2c6db5; }
.bp.pure { --hc: #4b8a2f; }
.bp.event { --hc: #a9271f; }
.bpn > header {
  display: flex; align-items: center; gap: 7px; padding: 6px 12px 6px 9px; border-bottom: 1px solid rgba(0, 0, 0, 0.7);
  background: linear-gradient(90deg, var(--hc), color-mix(in srgb, var(--hc) 45%, transparent) 75%, transparent);
}
.bpn header .ico { width: 14px; height: 14px; flex: none; color: #fff; }
.bpn header .t { font: 600 14px var(--f-body); color: #fff; text-shadow: 0 1px 1px #000; white-space: nowrap; }
.bpn header .t a { color: inherit; text-decoration: none; }
.bpn header .t a:hover { text-decoration: underline; }
.bpn header .tag { margin-left: auto; padding-left: 4px; font: 600 10px var(--f-body); letter-spacing: 0.04em; color: #9be0a8; }
.bpn .io { display: grid; grid-template-columns: auto auto; justify-content: space-between; gap: 0 26px; padding: 7px 0 9px; }
.bpn .col { display: grid; gap: 6px; align-content: start; min-width: 0; }
.bpn .col.out { justify-items: end; }
.bp-pin { display: flex; align-items: center; gap: 6px; padding: 0 10px; white-space: nowrap; }
.col.out .bp-pin { flex-direction: row-reverse; }
.bp-pin.hl span { color: #ffb35c; font-weight: 600; }
.pi { flex: none; width: 11px; height: 11px; border: 2px solid var(--c, var(--pin-other)); border-radius: 50%; }
.pi.array { border-radius: 1px; border-width: 1.5px; background: linear-gradient(var(--c), var(--c)) center / 1.5px 100% no-repeat, linear-gradient(var(--c), var(--c)) center / 100% 1.5px no-repeat; }
.pi.map, .pi.set { border-radius: 2px; background: var(--c); }
.pi.exec { width: 11px; height: 12px; border: 0; border-radius: 0; background: var(--pin-exec); clip-path: polygon(0 0, 55% 0, 100% 50%, 55% 100%, 0 100%); }
.bp-pin.hl .pi.exec { background: #ffb35c; }
.lit { font: 11px var(--f-mono); color: #d4d4d4; background: #0a0a0b; border: 1px solid #3b3b3e; border-radius: 3px; padding: 0 5px; min-width: 0; max-width: 12em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chk { width: 13px; height: 13px; border: 1px solid #77777c; border-radius: 2px; background: #0a0a0b; position: relative; }
.chk.on::after { content: ""; position: absolute; left: 3.5px; top: 0.5px; width: 3px; height: 7px; border: solid #e6e6e6; border-width: 0 2px 2px 0; transform: rotate(45deg); }
.advn { text-align: center; font-size: 11px; color: #9a9a9f; padding: 2px 0 6px; border-top: 1px solid rgba(255, 255, 255, 0.05); }
.node.bp .cap { width: 0; min-width: 100%; margin: 0; color: var(--ink-2); font-size: 13.5px; line-height: 1.45; overflow-wrap: anywhere; }
.node.bp details.more { overflow-wrap: anywhere; }
.node.bp details.more { width: 0; min-width: 100%; border: 0; }
.node.bp details.more summary { padding: 0; font-size: 12.5px; color: var(--ink-3); }
.node.bp details.more .doc { padding: 6px 0 0; font-size: 13.5px; }
.pinlist { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 3px; font-size: 12.5px; }
.pinlist .dir { display: inline-block; width: 26px; font: 500 10px var(--f-mono); text-transform: uppercase; color: var(--ink-3); }
.pinlist .ty { font: 11.5px var(--f-mono); color: var(--ink-3); }
.node.bp .fn { margin: 6px 0 0; font: 11px var(--f-mono); color: var(--ink-3); overflow-wrap: anywhere; }

/* Page navigation: current page in the rail, previous / next at the bottom. */
.brand h1 a { color: inherit; text-decoration: none; }
nav.rail a[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: inset 3px 0 var(--accent); }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
.pager a { display: grid; gap: 2px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); text-decoration: none; color: var(--ink); font: 600 17px var(--f-display); }
.pager a:hover { border-color: var(--accent); }
.pager a.next { text-align: right; grid-column: 2; }
.pager small { font: 500 11px var(--f-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }

/* Types fold as one block per module. */
details.types { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
details.types > summary { cursor: pointer; padding: 10px 14px; font: 600 15px var(--f-display); letter-spacing: 0.02em; color: var(--ink-2); }
details.types[open] > summary { border-bottom: 1px solid var(--line); }
details.types > .cards { padding: 14px; }

@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 16px; padding-block: 12px 48px; }
  /* Phones: the module list becomes a drawer that slides in from the left over a scrim. */
  nav.rail {
    position: fixed; z-index: 40; top: 0; bottom: 0; left: 0; width: min(82vw, 300px); max-height: none;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 12px 24px max(12px, env(safe-area-inset-left, 0px));
    background: var(--bg); border-right: 1px solid var(--line); box-shadow: 8px 0 24px rgba(0, 0, 0, 0.3);
    transform: translateX(-105%); transition: transform 0.22s ease; visibility: hidden;
  }
  body.nav-open nav.rail { transform: none; visibility: visible; }
  body.nav-open .scrim { display: block; }
  body.nav-open { overflow: hidden; }
  nav.rail .drawer-head { display: flex; }
  /* Struct fields, enum values and settings: name above its explanation, not two cramped columns. */
  .fields, .fields tbody, .fields tr, .fields td { display: block; width: auto !important; }
  .fields tr { border-top: 1px solid var(--line); padding: 8px 12px; }
  .fields td { border: 0; padding: 0; overflow-wrap: anywhere; }
  .fields td.doc-cell { padding-top: 4px; }
  .fields td.doc-cell:empty, .fields td.doc-cell:not(:has(*)) { display: none; }
  details.types > .cards { padding: 10px; }
  .pins { grid-template-columns: minmax(0, 1fr); }
  .pins .col.out { justify-items: start; text-align: left; }
  .col.out .pin { flex-direction: row; }
  /* The Quick start graph stacks, wired top to bottom. */
  .graph { flex-direction: column; align-items: flex-start; overflow: visible; }
  .graph .wire { align-self: stretch; justify-content: start; padding-left: 40px; }
  /* Phones: the title bar keeps to the screen width, and long pin names may wrap inside a node. */
  .brand h1 { font-size: 20px; }
  .brand .ver { display: none; }
  .bp-pin { white-space: normal; min-width: 0; }
  .lit { max-width: 7em; }
  .graph .node, .graph .bpn { max-width: 100%; }
  .bpn header .t { white-space: normal; }
  .wire { width: auto; height: 46px; margin: 0; grid-template-columns: auto auto; align-items: center; justify-content: center; gap: 8px; }
  .wire i { width: 3px; height: 100%; order: -1; }
  .wire i::after { right: auto; left: -5px; top: auto; bottom: -2px; border-left: 6.5px solid transparent; border-right: 6.5px solid transparent; border-top: 9px solid var(--pin-exec); border-bottom: 0; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

<script>
const MODEL = {"modules":["Core","Auth","Firestore","Database","Storage","Functions","App Check","Analytics","Crashlytics","Remote Config","Messaging","Installations","UMP","AdMob","Billing","Play Games","Store Services"],"nodes":[{"id":"ULoadInterstitialAdProxy_LoadInterstitialAd","title":"Load Interstitial Ad","fn":"LoadInterstitialAd","owner":"ULoadInterstitialAdProxy","kind":"async","module":"AdMob","group":"","platform":"Android","doc":"Loads an interstitial ad for AdUnitId and caches it natively until shown\n(see ShowInterstitialAd) or replaced by another LoadInterstitialAd call.\nPreload this ahead of the moment you actually want to show the ad — e.g.\nright after the previous one is dismissed — since AdMob recommends never\nloading right before you need to show. Android only.","inputs":[{"n":"AdUnitId","t":"String","k":"string","c":"","r":"","d":"\"ca-app-pub-3940256099942544/1033173712\"","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseAdMobError","k":"enum","c":"","r":"EFirebaseAdMobError"}],"exec":["OnLoaded","OnFailedToLoad"],"topic":"Interstitial"},{"id":"UShowInterstitialAdProxy_ShowInterstitialAd","title":"Show Interstitial Ad","fn":"ShowInterstitialAd","owner":"UShowInterstitialAdProxy","kind":"async","module":"AdMob","group":"","platform":"","doc":"Shows the interstitial ad previously cached by LoadInterstitialAd. Fails\nimmediately with NotLoaded if none is loaded and ready (see\nUFirebaseAdMobLibrary::IsInterstitialAdReady). Either way the cached ad is\nconsumed — load a new one before showing again.","inputs":[],"outputs":[{"n":"Error","t":"EFirebaseAdMobError","k":"enum","c":"","r":"EFirebaseAdMobError"}],"exec":["OnDismissed","OnFailedToShow"],"topic":"Interstitial"},{"id":"ULoadRewardedAdProxy_LoadRewardedAd","title":"Load Rewarded Ad","fn":"LoadRewardedAd","owner":"ULoadRewardedAdProxy","kind":"async","module":"AdMob","group":"","platform":"Android","doc":"Loads a rewarded ad for AdUnitId and caches it natively until shown (see\nShowRewardedAd) or replaced by another LoadRewardedAd call. Android only.\n\nDefaults to Google's public sample rewarded Ad Unit ID — see\nLoadInterstitialAd's comment above; replace before shipping.\n\nSSVUserId / SSVCustomData: server-side verification. When either is\nset, Google calls the SSV callback URL configured on the ad unit (AdMob\n-> Ad units -> Server-side verification) with them each time the\nreward is earned, so your server grants the reward instead of trusting\nthe client. Leave both empty to skip it.","inputs":[{"n":"AdUnitId","t":"String","k":"string","c":"","r":"","d":"\"ca-app-pub-3940256099942544/5224354917\"","adv":false},{"n":"SSVUserId","t":"String","k":"string","c":"","r":"","d":"\"\"","adv":true},{"n":"SSVCustomData","t":"String","k":"string","c":"","r":"","d":"\"\"","adv":true}],"outputs":[{"n":"Error","t":"EFirebaseAdMobError","k":"enum","c":"","r":"EFirebaseAdMobError"}],"exec":["OnLoaded","OnFailedToLoad"],"topic":"Rewarded"},{"id":"ULoadRewardedAdProxy_LoadRewardedInterstitialAd","title":"Load Rewarded Interstitial Ad","fn":"LoadRewardedInterstitialAd","owner":"ULoadRewardedAdProxy","kind":"async","module":"AdMob","group":"","platform":"Android","doc":"Loads a rewarded interstitial ad: a rewarded ad shown at a natural\ntransition (between levels...) without the player opting in first.\nGoogle's policy requires an intro screen before it that announces the\nreward and lets the player skip it. Cached separately from Load\nRewarded Ad (both can be loaded at once); show it with Show Rewarded\nInterstitial Ad. Defaults to Google's public sample Ad Unit ID; the\nSSV parameters work as on Load Rewarded Ad. Android only.","inputs":[{"n":"AdUnitId","t":"String","k":"string","c":"","r":"","d":"\"ca-app-pub-3940256099942544/5354046379\"","adv":false},{"n":"SSVUserId","t":"String","k":"string","c":"","r":"","d":"\"\"","adv":true},{"n":"SSVCustomData","t":"String","k":"string","c":"","r":"","d":"\"\"","adv":true}],"outputs":[{"n":"Error","t":"EFirebaseAdMobError","k":"enum","c":"","r":"EFirebaseAdMobError"}],"exec":["OnLoaded","OnFailedToLoad"],"topic":"Rewarded interstitial"},{"id":"UShowRewardedAdProxy_ShowRewardedAd","title":"Show Rewarded Ad","fn":"ShowRewardedAd","owner":"UShowRewardedAdProxy","kind":"async","module":"AdMob","group":"","platform":"","doc":"Shows the rewarded ad previously cached by LoadRewardedAd. OnRewardEarned\nfires only if the player watches far enough to earn the reward, always\nfollowed by OnDismissed once the ad closes; OnDismissed can fire on its own\nif the player closes the ad early without earning anything. Fails\nimmediately with NotLoaded if no ad is loaded and ready (see\nUFirebaseAdMobLibrary::IsRewardedAdReady).","inputs":[],"outputs":[{"n":"Error","t":"EFirebaseAdMobError","k":"enum","c":"","r":"EFirebaseAdMobError"},{"n":"RewardType","t":"String","k":"string","c":"","r":""},{"n":"RewardAmount","t":"Integer","k":"int","c":"","r":""}],"exec":["OnRewardEarned","OnDismissed","OnFailedToShow"],"topic":"Rewarded"},{"id":"UShowRewardedAdProxy_ShowRewardedInterstitialAd","title":"Show Rewarded Interstitial Ad","fn":"ShowRewardedInterstitialAd","owner":"UShowRewardedAdProxy","kind":"async","module":"AdMob","group":"","platform":"","doc":"Shows the rewarded interstitial ad cached by Load Rewarded Interstitial\nAd — same outputs as Show Rewarded Ad. Show your own intro screen (with\na way to skip) first: Google requires it for this format. Fails with\nNotLoaded if none is ready (see IsRewardedInterstitialAdReady).","inputs":[],"outputs":[{"n":"Error","t":"EFirebaseAdMobError","k":"enum","c":"","r":"EFirebaseAdMobError"},{"n":"RewardType","t":"String","k":"string","c":"","r":""},{"n":"RewardAmount","t":"Integer","k":"int","c":"","r":""}],"exec":["OnRewardEarned","OnDismissed","OnFailedToShow"],"topic":"Rewarded interstitial"},{"id":"ULoadAppOpenAdProxy_LoadAppOpenAd","title":"Load App Open Ad","fn":"LoadAppOpenAd","owner":"ULoadAppOpenAdProxy","kind":"async","module":"AdMob","group":"","platform":"Android","doc":"Loads an app open ad for AdUnitId and caches it natively until shown (see\nShowAppOpenAd) or replaced by another LoadAppOpenAd call. Typically shown\nright after loading, when the app is foregrounded (e.g. from a splash\nscreen). An app open ad older than 4 hours is treated as expired, as\nAdMob recommends: IsAppOpenAdReady returns false and Show fails with\nNotLoaded until you load a new one. Android only.","inputs":[{"n":"AdUnitId","t":"String","k":"string","c":"","r":"","d":"\"ca-app-pub-3940256099942544/9257395921\"","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseAdMobError","k":"enum","c":"","r":"EFirebaseAdMobError"}],"exec":["OnLoaded","OnFailedToLoad"],"topic":"App open"},{"id":"UShowAppOpenAdProxy_ShowAppOpenAd","title":"Show App Open Ad","fn":"ShowAppOpenAd","owner":"UShowAppOpenAdProxy","kind":"async","module":"AdMob","group":"","platform":"","doc":"Shows the app open ad previously cached by LoadAppOpenAd. Fails immediately\nwith NotLoaded if none is loaded and ready (see\nUFirebaseAdMobLibrary::IsAppOpenAdReady).","inputs":[],"outputs":[{"n":"Error","t":"EFirebaseAdMobError","k":"enum","c":"","r":"EFirebaseAdMobError"}],"exec":["OnDismissed","OnFailedToShow"],"topic":"App open"},{"id":"ULoadBannerAdProxy_LoadBannerAd","title":"Load Banner Ad","fn":"LoadBannerAd","owner":"ULoadBannerAdProxy","kind":"async","module":"AdMob","group":"","platform":"Android","doc":"Loads a banner ad for AdUnitId and docks it (initially hidden — see\nUFirebaseAdMobLibrary::ShowBannerAd) as a screen-width strip at Position.\nUnlike interstitial/rewarded/app open, a banner ad view is created\nimmediately (not just cached) and stays on screen refreshing itself\nautomatically until DestroyBannerAd — there is no separate \"Show\" node that\nconsumes it. Calling this again replaces any existing banner (destroying\nthe previous one first). Android only.","inputs":[{"n":"AdUnitId","t":"String","k":"string","c":"","r":"","d":"\"ca-app-pub-3940256099942544/6300978111\"","adv":false},{"n":"Size","t":"EFirebaseAdMobBannerSize","k":"enum","c":"","r":"EFirebaseAdMobBannerSize","d":"EFirebaseAdMobBannerSize::Banner","adv":false},{"n":"Position","t":"EFirebaseAdMobBannerPosition","k":"enum","c":"","r":"EFirebaseAdMobBannerPosition","d":"EFirebaseAdMobBannerPosition::Bottom","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseAdMobError","k":"enum","c":"","r":"EFirebaseAdMobError"}],"exec":["OnLoaded","OnFailedToLoad"],"topic":"Banner"},{"id":"URequestConsentInfoUpdateProxy_RequestConsentInfoUpdate","title":"Request Consent Info Update","fn":"RequestConsentInfoUpdate","owner":"URequestConsentInfoUpdateProxy","kind":"async","module":"AdMob","group":"","platform":"","doc":"Requests an update of the end user's UMP consent info and — if a consent\nform is required by their region and your Ad Manager/AdMob privacy\nsettings — automatically loads and shows it, waiting for the user to\nrespond before completing. Call this once, early (e.g. right after\nFirebase init), and always BEFORE the first LoadInterstitialAd/\nLoadRewardedAd/LoadAppOpenAd call: check UFirebaseAdMobLibrary::CanRequestAds()\nonce this completes to know whether ad requests may proceed at all (and\nsee Google's own UMP docs for how to request non-personalized-only ads if\nconsent was denied but the region still allows non-personalized ads).\nConsentStatus reflects the outcome even on error, if it's known.\nCross-platform (Android/iOS/Windows) via the UMP module's own\nfirebase::ump::ConsentInfo (UMP/FirebaseBPUMPNodes.h has the same flow\nsplit into its own RequestUMPConsentInfoUpdate/LoadAndShowUMPConsentFormIfRequired\nsteps, plus the SDK's own granular error codes, if you need more control\nthan this single-node convenience gives you) — requires Enable UMP in\naddition to Enable AdMob in Project Settings.","inputs":[],"outputs":[{"n":"Error","t":"EFirebaseAdMobError","k":"enum","c":"","r":"EFirebaseAdMobError"},{"n":"ConsentStatus","t":"EFirebaseConsentStatus","k":"enum","c":"","r":"EFirebaseConsentStatus"}],"exec":["OnUpdated","OnFailed"],"topic":"Consent and privacy"},{"id":"UShowPrivacyOptionsFormProxy_ShowPrivacyOptionsForm","title":"Show Privacy Options Form","fn":"ShowPrivacyOptionsForm","owner":"UShowPrivacyOptionsFormProxy","kind":"async","module":"AdMob","group":"","platform":"","doc":"Re-shows the UMP \"Privacy Options\" form so the user can change a consent\nchoice they already made — wire this to a \"Privacy Options\" entry in your\nown settings menu, shown only when UFirebaseAdMobLibrary::IsPrivacyOptionsRequired()\nis true (most non-EEA/UK users will never need it). Requires\nRequestConsentInfoUpdate to have already completed at least once this\nsession. Cross-platform (Android/iOS/Windows) via the UMP module — requires\nEnable UMP in addition to Enable AdMob in Project Settings.","inputs":[],"outputs":[{"n":"Error","t":"EFirebaseAdMobError","k":"enum","c":"","r":"EFirebaseAdMobError"},{"n":"ConsentStatus","t":"EFirebaseConsentStatus","k":"enum","c":"","r":"EFirebaseConsentStatus"}],"exec":["OnUpdated","OnFailed"],"topic":"Consent and privacy"},{"id":"UFirebaseAdMobLibrary_IsInterstitialAdReady","title":"Is Interstitial Ad Ready","fn":"IsInterstitialAdReady","owner":"UFirebaseAdMobLibrary","kind":"pure","module":"AdMob","group":"","platform":"","doc":"True if a previously loaded interstitial ad is cached and ready to show (false once it has expired, 1 hour after loading).","inputs":[],"outputs":[{"n":"Return Value","t":"Boolean","k":"bool","c":"","r":""}],"exec":[],"topic":"Interstitial"},{"id":"UFirebaseAdMobLibrary_IsRewardedAdReady","title":"Is Rewarded Ad Ready","fn":"IsRewardedAdReady","owner":"UFirebaseAdMobLibrary","kind":"pure","module":"AdMob","group":"","platform":"","doc":"True if a previously loaded rewarded ad is cached and ready to show (false once it has expired, 1 hour after loading).","inputs":[],"outputs":[{"n":"Return Value","t":"Boolean","k":"bool","c":"","r":""}],"exec":[],"topic":"Rewarded"},{"id":"UFirebaseAdMobLibrary_IsRewardedInterstitialAdReady","title":"Is Rewarded Interstitial Ad Ready","fn":"IsRewardedInterstitialAdReady","owner":"UFirebaseAdMobLibrary","kind":"pure","module":"AdMob","group":"","platform":"","doc":"True if a previously loaded rewarded interstitial ad is cached and ready to show (false once it has expired, 1 hour after loading).","inputs":[],"outputs":[{"n":"Return Value","t":"Boolean","k":"bool","c":"","r":""}],"exec":[],"topic":"Rewarded interstitial"},{"id":"UFirebaseAdMobLibrary_SetAdMobAppMuted","title":"Set Ad Mob App Muted","fn":"SetAdMobAppMuted","owner":"UFirebaseAdMobLibrary","kind":"call","module":"AdMob","group":"","platform":"Android","doc":"Mutes (or unmutes) video ads' sound — use it when the player turned the\ngame's sound off. Reported to AdMob, which may serve fewer video ads\nwhile muted. Kept and applied to every later ad. Android only.","inputs":[{"n":"bMuted","t":"Boolean","k":"bool","c":"","r":"","adv":false}],"outputs":[],"exec":[],"topic":"Settings"},{"id":"UFirebaseAdMobLibrary_SetAdMobAppVolume","title":"Set Ad Mob App Volume","fn":"SetAdMobAppVolume","owner":"UFirebaseAdMobLibrary","kind":"call","module":"AdMob","group":"","platform":"Android","doc":"Sets video ads' volume relative to the device volume (0 = silent, 1 =\nfull, the default) — match it to your game's own master volume slider.\nUse SetAdMobAppMuted rather than 0 to mute. Android only.","inputs":[{"n":"Volume","t":"Float","k":"float","c":"","r":"","adv":false}],"outputs":[],"exec":[],"topic":"Settings"},{"id":"UFirebaseAdMobLibrary_IsAppOpenAdReady","title":"Is App Open Ad Ready","fn":"IsAppOpenAdReady","owner":"UFirebaseAdMobLibrary","kind":"pure","module":"AdMob","group":"","platform":"","doc":"True if a previously loaded app open ad is cached and ready to show (false once it has expired, 4 hours after loading).","inputs":[],"outputs":[{"n":"Return Value","t":"Boolean","k":"bool","c":"","r":""}],"exec":[],"topic":"App open"},{"id":"UFirebaseAdMobLibrary_ShowBannerAd","title":"Show Banner Ad","fn":"ShowBannerAd","owner":"UFirebaseAdMobLibrary","kind":"call","module":"AdMob","group":"","platform":"","doc":"Makes the banner ad loaded by LoadBannerAd visible. A no-op if none is loaded.","inputs":[],"outputs":[],"exec":[],"topic":"Banner"},{"id":"UFirebaseAdMobLibrary_HideBannerAd","title":"Hide Banner Ad","fn":"HideBannerAd","owner":"UFirebaseAdMobLibrary","kind":"call","module":"AdMob","group":"","platform":"","doc":"Hides the banner ad without destroying it — HideBannerAd/ShowBannerAd can be toggled freely; the ad keeps auto-refreshing in the background while hidden. A no-op if none is loaded.","inputs":[],"outputs":[],"exec":[],"topic":"Banner"},{"id":"UFirebaseAdMobLibrary_DestroyBannerAd","title":"Destroy Banner Ad","fn":"DestroyBannerAd","owner":"UFirebaseAdMobLibrary","kind":"call","module":"AdMob","group":"","platform":"","doc":"Removes the banner ad view and releases its resources. Call this when you no longer need the banner (e.g. leaving the menu it's shown on) — LoadBannerAd itself also does this for any previous banner before creating a new one.","inputs":[],"outputs":[],"exec":[],"topic":"Banner"},{"id":"UFirebaseAdMobLibrary_IsBannerAdLoaded","title":"Is Banner Ad Loaded","fn":"IsBannerAdLoaded","owner":"UFirebaseAdMobLibrary","kind":"pure","module":"AdMob","group":"","platform":"","doc":"True if a banner ad is currently loaded (regardless of whether it's shown or hidden).","inputs":[],"outputs":[{"n":"Return Value","t":"Boolean","k":"bool","c":"","r":""}],"exec":[],"topic":"Banner"},{"id":"UFirebaseAdMobLibrary_SetAdContentSettings","title":"Set Ad Content Settings","fn":"SetAdContentSettings","owner":"UFirebaseAdMobLibrary","kind":"call","module":"AdMob","group":"","platform":"Android","doc":"Sets the child-directed (COPPA) / under-age-of-consent (GDPR) tags and the\nmaximum ad content rating applied to every ad request made AFTER this\ncall — required for apps in Google Play's Families program or otherwise\naimed at children. Call it once, before the first Load*Ad. Keeps any Test\nDevice IDs already configured in Project Settings. Android only; does\nnothing elsewhere.","inputs":[{"n":"ChildDirectedTreatment","t":"EFirebaseAdTagStatus","k":"enum","c":"","r":"EFirebaseAdTagStatus","adv":false},{"n":"UnderAgeOfConsent","t":"EFirebaseAdTagStatus","k":"enum","c":"","r":"EFirebaseAdTagStatus","adv":false},{"n":"MaxAdContentRating","t":"EFirebaseAdMaxContentRating","k":"enum","c":"","r":"EFirebaseAdMaxContentRating","adv":false}],"outputs":[],"exec":[],"topic":"Settings"},{"id":"UFirebaseAdMobLibrary_OpenAdMobInspector","title":"Open Ad Mob Inspector","fn":"OpenAdMobInspector","owner":"UFirebaseAdMobLibrary","kind":"call","module":"AdMob","group":"","platform":"","doc":"Opens the Google Mobile Ads SDK's on-device Ad Inspector overlay — shows\nlive ad request/response status and error codes without needing Logcat.\nOnly works on a device registered in AdMob Test Device IDs (Project\nSettings -> Firebase BP -> AdMob); does nothing (logs a warning) on an\nunregistered device. Handy wired to a debug menu button as an\nalternative to the shake gesture, which isn't reliable on every device.","inputs":[],"outputs":[],"exec":[],"topic":"Settings"},{"id":"UFirebaseAdMobLibrary_CanRequestAds","title":"Can Request Ads","fn":"CanRequestAds","owner":"UFirebaseAdMobLibrary","kind":"pure","module":"AdMob","group":"","platform":"","doc":"True once UMP consent (see RequestConsentInfoUpdate) allows ad requests\nto proceed under the user's region/consent choice — check this before\nevery LoadInterstitialAd/LoadRewardedAd/LoadAppOpenAd call. False if\nRequestConsentInfoUpdate hasn't completed yet. Cross-platform via the\nUMP module (same value as UFirebaseUMPLibrary::CanRequestAds).","inputs":[],"outputs":[{"n":"Return Value","t":"Boolean","k":"bool","c":"","r":""}],"exec":[],"topic":"Consent and privacy"},{"id":"UFirebaseAdMobLibrary_IsPrivacyOptionsRequired","title":"Is Privacy Options Required","fn":"IsPrivacyOptionsRequired","owner":"UFirebaseAdMobLibrary","kind":"pure","module":"AdMob","group":"","platform":"","doc":"True if a \"Privacy Options\" re-consent entry point should be shown in\nyour own settings UI — region-dependent (most non-EEA/UK users will\nget false). Only meaningful after RequestConsentInfoUpdate has\ncompleted at least once. Cross-platform via the UMP module (same value\nas UFirebaseUMPLibrary::GetUMPPrivacyOptionsRequirementStatus() ==\nRequired).","inputs":[],"outputs":[{"n":"Return Value","t":"Boolean","k":"bool","c":"","r":""}],"exec":[],"topic":"Consent and privacy"},{"id":"UFirebaseAnalyticsNamesLibrary_GetAnalyticsEventName","title":"Get Analytics Event Name","fn":"GetAnalyticsEventName","owner":"UFirebaseAnalyticsNamesLibrary","kind":"pure","module":"Analytics","group":"Names","platform":"","doc":"","inputs":[{"n":"Event","t":"EFirebaseAnalyticsEvent","k":"enum","c":"","r":"EFirebaseAnalyticsEvent","adv":false}],"outputs":[{"n":"Return Value","t":"String","k":"string","c":"","r":""}],"exec":[],"topic":"Names"},{"id":"UFirebaseAnalyticsNamesLibrary_GetAnalyticsParameterName","title":"Get Analytics Parameter Name","fn":"GetAnalyticsParameterName","owner":"UFirebaseAnalyticsNamesLibrary","kind":"pure","module":"Analytics","group":"Names","platform":"","doc":"","inputs":[{"n":"Parameter","t":"EFirebaseAnalyticsParameter","k":"enum","c":"","r":"EFirebaseAnalyticsParameter","adv":false}],"outputs":[{"n":"Return Value","t":"String","k":"string","c":"","r":""}],"exec":[],"topic":"Names"},{"id":"UFirebaseAnalyticsNamesLibrary_GetAnalyticsUserPropertyName","title":"Get Analytics User Property Name","fn":"GetAnalyticsUserPropertyName","owner":"UFirebaseAnalyticsNamesLibrary","kind":"pure","module":"Analytics","group":"Names","platform":"","doc":"","inputs":[{"n":"UserProperty","t":"EFirebaseAnalyticsUserProperty","k":"enum","c":"","r":"EFirebaseAnalyticsUserProperty","adv":false}],"outputs":[{"n":"Return Value","t":"String","k":"string","c":"","r":""}],"exec":[],"topic":"Names"},{"id":"UFirebaseAnalyticsLibrary_MakeAnalyticsParamInt","title":"Make Analytics Param Int","fn":"MakeAnalyticsParamInt","owner":"UFirebaseAnalyticsLibrary","kind":"pure","module":"Analytics","group":"","platform":"","doc":"","inputs":[{"n":"Value","t":"Integer64","k":"int64","c":"","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"FirebaseAnalyticsParameterValue","k":"struct","c":"","r":"FFirebaseAnalyticsParameterValue"}],"exec":[],"topic":"Events"},{"id":"UFirebaseAnalyticsLibrary_MakeAnalyticsParamDouble","title":"Make Analytics Param Double","fn":"MakeAnalyticsParamDouble","owner":"UFirebaseAnalyticsLibrary","kind":"pure","module":"Analytics","group":"","platform":"","doc":"","inputs":[{"n":"Value","t":"Float","k":"float","c":"","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"FirebaseAnalyticsParameterValue","k":"struct","c":"","r":"FFirebaseAnalyticsParameterValue"}],"exec":[],"topic":"Events"},{"id":"UFirebaseAnalyticsLibrary_MakeAnalyticsParamString","title":"Make Analytics Param String","fn":"MakeAnalyticsParamString","owner":"UFirebaseAnalyticsLibrary","kind":"pure","module":"Analytics","group":"","platform":"","doc":"","inputs":[{"n":"Value","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"FirebaseAnalyticsParameterValue","k":"struct","c":"","r":"FFirebaseAnalyticsParameterValue"}],"exec":[],"topic":"Events"},{"id":"UFirebaseAnalyticsLibrary_MakeAnalyticsParamItems","title":"Make Analytics Param Items","fn":"MakeAnalyticsParamItems","owner":"UFirebaseAnalyticsLibrary","kind":"pure","module":"Analytics","group":"","platform":"","doc":"Builds the standard \"items\" parameter (a list of FFirebaseAnalyticsItem)\nfor GA4 e-commerce events — pair it with the key\nGetAnalyticsParameterName(Items) in Log Firebase Analytics Event's\nParameters map, alongside currency/value/transaction_id. Explicit node\n(no autocast): an item list is never something to convert to\nimplicitly. Delivered through the SDK's structured-parameter (Variant\nvector-of-maps) support — confirm items show up in Analytics DebugView\non your target platforms the first time you use it.","inputs":[{"n":"Items","t":"Array of FirebaseAnalyticsItem","k":"struct","c":"array","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"FirebaseAnalyticsParameterValue","k":"struct","c":"","r":"FFirebaseAnalyticsParameterValue"}],"exec":[],"topic":"Events"},{"id":"UFirebaseAnalyticsLibrary_LogFirebaseAnalyticsEvent","title":"Log Firebase Analytics Event","fn":"LogFirebaseAnalyticsEvent","owner":"UFirebaseAnalyticsLibrary","kind":"call","module":"Analytics","group":"","platform":"","doc":"Logs an event, e.g. \"level_up\" with parameters {\"level\": 5, \"character\": \"wizard\"}.\nEventName must be 1-40 alphanumeric/underscore characters starting with\na letter; the \"firebase_\"/\"google_\"/\"ga_\" prefixes are reserved. Up to\n25 parameters per event, parameter names follow the same rules as\nEventName, string values up to 100 characters.","inputs":[{"n":"EventName","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Parameters","t":"Map of String to FirebaseAnalyticsParameterValue","k":"string","c":"map","r":"","adv":false}],"outputs":[],"exec":[],"topic":"Events"},{"id":"UFirebaseAnalyticsLibrary_SetFirebaseAnalyticsUserProperty","title":"Set Firebase Analytics User Property","fn":"SetFirebaseAnalyticsUserProperty","owner":"UFirebaseAnalyticsLibrary","kind":"call","module":"Analytics","group":"","platform":"","doc":"Associates a persistent property with the current user (e.g. \"favorite_character\" = \"wizard\"), attached to every event logged afterward. An empty Value clears the property. Max 25 user properties per app.","inputs":[{"n":"Name","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Value","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[],"exec":[],"topic":"User"},{"id":"UFirebaseAnalyticsLibrary_SetFirebaseAnalyticsUserId","title":"Set Firebase Analytics User Id","fn":"SetFirebaseAnalyticsUserId","owner":"UFirebaseAnalyticsLibrary","kind":"call","module":"Analytics","group":"","platform":"","doc":"Sets the ID Analytics associates with the current user (e.g. after sign-in, so events across devices/sessions link to the same user). Pass an empty string to clear it (e.g. on sign-out).","inputs":[{"n":"UserId","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[],"exec":[],"topic":"User"},{"id":"UFirebaseAnalyticsLibrary_SetFirebaseAnalyticsCollectionEnabled","title":"Set Firebase Analytics Collection Enabled","fn":"SetFirebaseAnalyticsCollectionEnabled","owner":"UFirebaseAnalyticsLibrary","kind":"call","module":"Analytics","group":"","platform":"","doc":"Enables/disables Analytics data collection for this app on this device — persisted across sessions, enabled by default. Use for a privacy/consent opt-out control.","inputs":[{"n":"bEnabled","t":"Boolean","k":"bool","c":"","r":"","adv":false}],"outputs":[],"exec":[],"topic":"Privacy and consent"},{"id":"UFirebaseAnalyticsLibrary_ResetFirebaseAnalyticsData","title":"Reset Firebase Analytics Data","fn":"ResetFirebaseAnalyticsData","owner":"UFirebaseAnalyticsLibrary","kind":"call","module":"Analytics","group":"","platform":"","doc":"Clears all Analytics data (events, user properties, user ID) for this app instance and resets its instance ID. Use for a \"delete my data\" / account deletion flow.","inputs":[],"outputs":[],"exec":[],"topic":"Privacy and consent"},{"id":"UFirebaseAnalyticsLibrary_SetFirebaseAnalyticsConsent","title":"Set Firebase Analytics Consent","fn":"SetFirebaseAnalyticsConsent","owner":"UFirebaseAnalyticsLibrary","kind":"call","module":"Analytics","group":"","platform":"","doc":"Google's Consent Mode — records the end user's consent choice for how\nAnalytics (and any linked Google Ads/AdMob data) may use device\nidentifiers/ad-related signals on this device. Persisted across\nsessions; every parameter defaults to \"Granted\" in the SDK until this\nis called, so call it as soon as you have a consent decision (e.g.\nright after a GDPR/CCPA consent prompt, or your own UMP consent flow —\nsee UFirebaseAdMobLibrary::RequestConsentInfoUpdate) — omitting a\nvalue here leaves it at whatever was last set, it does not reset it.\nUnlike SetFirebaseAnalyticsCollectionEnabled (an all-or-nothing\nswitch), this lets you honor a more granular regional consent choice\nwithout disabling Analytics collection entirely.\n\n@param bAdStorageGranted Consent for storing/accessing ad-related\ndevice identifiers/cookies (Google's ad_storage signal).\n@param bAnalyticsStorageGranted Consent for storing/accessing\nanalytics-related device identifiers/cookies (analytics_storage).\n@param bAdUserDataGranted Consent for sending user data related to\nadvertising to Google (ad_user_data).\n@param bAdPersonalizationGranted Consent for personalized advertising\n(ad_personalization).","inputs":[{"n":"bAdStorageGranted","t":"Boolean","k":"bool","c":"","r":"","adv":false},{"n":"bAnalyticsStorageGranted","t":"Boolean","k":"bool","c":"","r":"","adv":false},{"n":"bAdUserDataGranted","t":"Boolean","k":"bool","c":"","r":"","adv":false},{"n":"bAdPersonalizationGranted","t":"Boolean","k":"bool","c":"","r":"","adv":false}],"outputs":[],"exec":[],"topic":"Privacy and consent"},{"id":"UFirebaseAnalyticsLibrary_SetFirebaseAnalyticsSessionTimeoutDuration","title":"Set Firebase Analytics Session Timeout Duration","fn":"SetFirebaseAnalyticsSessionTimeoutDuration","owner":"UFirebaseAnalyticsLibrary","kind":"call","module":"Analytics","group":"","platform":"","doc":"How long (in milliseconds) an app must be in the background before a new session starts on next foreground. Defaults to 30 minutes.","inputs":[{"n":"Milliseconds","t":"Integer64","k":"int64","c":"","r":"","adv":false}],"outputs":[],"exec":[],"topic":"Settings and diagnostics"},{"id":"UFirebaseAnalyticsLibrary_SetFirebaseAnalyticsDefaultEventParameters","title":"Set Firebase Analytics Default Event Parameters","fn":"SetFirebaseAnalyticsDefaultEventParameters","owner":"UFirebaseAnalyticsLibrary","kind":"call","module":"Analytics","group":"","platform":"","doc":"Sets parameters that are automatically attached to every event logged\nafterward (via LogFirebaseAnalyticsEvent or an automatically-collected\nevent alike) — e.g. a build number or A/B test variant you want on\nevery event without adding it to each LogFirebaseAnalyticsEvent call by\nhand. MERGES into the existing defaults (it does not replace them), and\nthe defaults persist across app launches: a parameter you no longer\nwant must be removed explicitly — call this with that name mapped to an\nempty String value, which removes it. Passing an empty map changes\nnothing.","inputs":[{"n":"Parameters","t":"Map of String to FirebaseAnalyticsParameterValue","k":"string","c":"map","r":"","adv":false}],"outputs":[],"exec":[],"topic":"Settings and diagnostics"},{"id":"UFirebaseAnalyticsLibrary_SetFirebaseAnalyticsDesktopDebugMode","title":"Set Firebase Analytics Desktop Debug Mode","fn":"SetFirebaseAnalyticsDesktopDebugMode","owner":"UFirebaseAnalyticsLibrary","kind":"call","module":"Analytics","group":"","platform":"","doc":"Enables Analytics DebugView streaming (Firebase Console -> Analytics ->\nDebugView) so events logged from this session show up there in near\nreal time — useful during development to verify events are actually\nflowing correctly. Windows Desktop only; a no-op on Android/iOS (the\nSDK itself has no desktop-debug concept there — use each platform's own\nadb/Xcode debug flags instead).","inputs":[{"n":"bEnabled","t":"Boolean","k":"bool","c":"","r":"","adv":false}],"outputs":[],"exec":[],"topic":"Settings and diagnostics"},{"id":"UFirebaseAnalyticsLibrary_NotifyFirebaseAnalyticsAppTerminating","title":"Notify Firebase Analytics App Terminating","fn":"NotifyFirebaseAnalyticsAppTerminating","owner":"UFirebaseAnalyticsLibrary","kind":"call","module":"Analytics","group":"","platform":"","doc":"Tells the desktop (Windows) Analytics SDK the app is about to quit, so\nit flushes any not-yet-uploaded events before exiting instead of\npossibly losing them — call this from a shutdown handler (e.g. bound to\nFCoreDelegates::OnEnginePreExit) right before the app closes. Blocks\nthe calling thread until the flush finishes or fails. Windows Desktop\nonly; a no-op on Android/iOS.","inputs":[],"outputs":[],"exec":[],"topic":"Settings and diagnostics"},{"id":"UFirebaseAnalyticsLibrary_IsFirebaseAnalyticsDesktopInitialized","title":"Is Firebase Analytics Desktop Initialized","fn":"IsFirebaseAnalyticsDesktopInitialized","owner":"UFirebaseAnalyticsLibrary","kind":"pure","module":"Analytics","group":"","platform":"","doc":"Whether the desktop (Windows) Analytics SDK has finished its own\n(asynchronous, disk-backed) initialization. Always true on Android/iOS,\nwhere Analytics initializes synchronously with the rest of the SDK —\nonly meaningful on Windows Desktop, where an event logged too early\n(before this returns true) is silently dropped instead of queued.","inputs":[],"outputs":[{"n":"Return Value","t":"Boolean","k":"bool","c":"","r":""}],"exec":[],"topic":"Settings and diagnostics"},{"id":"UFirebaseAnalyticsLibrary_InitiateFirebaseAnalyticsOnDeviceConversionWithEmail","title":"Initiate Firebase Analytics On Device Conversion With Email","fn":"InitiateFirebaseAnalyticsOnDeviceConversionWithEmail","owner":"UFirebaseAnalyticsLibrary","kind":"call","module":"Analytics","group":"","platform":"iOS","doc":"Feeds a user's email address into on-device ad-conversion measurement,\nso an install/purchase can be attributed to an ad campaign without\nrelying on IDFA. iOS/tvOS only (requires the\nGoogleAppMeasurementOnDeviceConversion dependency to be linked; a no-op\notherwise); a no-op on Android/desktop. Include the domain (e.g.\n\"player@gmail.com\", not just \"player\").","inputs":[{"n":"EmailAddress","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[],"exec":[],"topic":"On-device conversion"},{"id":"UFirebaseAnalyticsLibrary_InitiateFirebaseAnalyticsOnDeviceConversionWithPhoneNumber","title":"Initiate Firebase Analytics On Device Conversion With Phone Number","fn":"InitiateFirebaseAnalyticsOnDeviceConversionWithPhoneNumber","owner":"UFirebaseAnalyticsLibrary","kind":"call","module":"Analytics","group":"","platform":"","doc":"Same as InitiateFirebaseAnalyticsOnDeviceConversionWithEmail, for a phone number in E.164 format (e.g. \"+15551234567\", max 15 digits after the \"+\").","inputs":[{"n":"PhoneNumber","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[],"exec":[],"topic":"On-device conversion"},{"id":"UFirebaseAnalyticsLibrary_InitiateFirebaseAnalyticsOnDeviceConversionWithHashedEmail","title":"Initiate Firebase Analytics On Device Conversion With Hashed Email","fn":"InitiateFirebaseAnalyticsOnDeviceConversionWithHashedEmail","owner":"UFirebaseAnalyticsLibrary","kind":"call","module":"Analytics","group":"","platform":"","doc":"Same as InitiateFirebaseAnalyticsOnDeviceConversionWithEmail, but HashedEmailAddress is already SHA256-hashed (per Firebase's own on-device-measurement documentation) instead of plaintext — use this if your backend only ever hands you a hashed identifier.","inputs":[{"n":"HashedEmailAddress","t":"Array of Byte","k":"byte","c":"array","r":"","adv":false}],"outputs":[],"exec":[],"topic":"On-device conversion"},{"id":"UFirebaseAnalyticsLibrary_InitiateFirebaseAnalyticsOnDeviceConversionWithHashedPhoneNumber","title":"Initiate Firebase Analytics On Device Conversion With Hashed Phone Number","fn":"InitiateFirebaseAnalyticsOnDeviceConversionWithHashedPhoneNumber","owner":"UFirebaseAnalyticsLibrary","kind":"call","module":"Analytics","group":"","platform":"","doc":"Same as InitiateFirebaseAnalyticsOnDeviceConversionWithHashedEmail, for an already SHA256-hashed phone number instead of a hashed email.","inputs":[{"n":"HashedPhoneNumber","t":"Array of Byte","k":"byte","c":"array","r":"","adv":false}],"outputs":[],"exec":[],"topic":"On-device conversion"},{"id":"UFirebaseAnalyticsLibrary_SetFirebaseAnalyticsLogCallbackEnabled","title":"Set Firebase Analytics Log Callback Enabled","fn":"SetFirebaseAnalyticsLogCallbackEnabled","owner":"UFirebaseAnalyticsLibrary","kind":"call","module":"Analytics","group":"","platform":"","doc":"When enabled, every message the Analytics SDK's own internal logger\nemits is forwarded to UFirebaseBPSubsystem::OnAnalyticsLogMessage —\nmainly useful paired with SetFirebaseAnalyticsDesktopDebugMode to watch\nwhat Analytics is doing without needing adb/Xcode's own log viewer.\nWindows Desktop only; a no-op on Android/iOS (the SDK itself has no\nlog-callback support there). Disable again with bEnabled = false.","inputs":[{"n":"bEnabled","t":"Boolean","k":"bool","c":"","r":"","adv":false}],"outputs":[],"exec":[],"topic":"Settings and diagnostics"},{"id":"ULogAppleTransactionProxy_LogAppleTransaction","title":"Log Apple Transaction","fn":"LogAppleTransaction","owner":"ULogAppleTransactionProxy","kind":"async","module":"Analytics","group":"","platform":"iOS","doc":"Logs an Apple StoreKit 2 in-app purchase transaction to Analytics, for\nrevenue reporting when a purchase is processed outside this plugin's own\nBilling module (e.g. via a separate StoreKit 2 integration). iOS/tvOS\nonly; a no-op elsewhere.","inputs":[{"n":"TransactionId","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"bSuccess","t":"Boolean","k":"bool","c":"","r":""}],"exec":["OnResult"],"topic":"Settings and diagnostics"},{"id":"UGetFirebaseAnalyticsInstanceIdProxy_GetFirebaseAnalyticsInstanceId","title":"Get Firebase Analytics Instance Id","fn":"GetFirebaseAnalyticsInstanceId","owner":"UGetFirebaseAnalyticsInstanceIdProxy","kind":"async","module":"Analytics","group":"","platform":"","doc":"Retrieves the current app instance's Analytics-specific identifier — NOT\nthe same as Firebase Installations' own id (UGetInstallationsIdProxy) or\nany signed-in user id. Mainly useful to correlate this device/session with\nBigQuery-exported Analytics data or the DebugView in Firebase Console.","inputs":[],"outputs":[{"n":"bSuccess","t":"Boolean","k":"bool","c":"","r":""},{"n":"InstanceId","t":"String","k":"string","c":"","r":""}],"exec":["OnResult"],"topic":"Settings and diagnostics"},{"id":"UGetFirebaseAnalyticsSessionIdProxy_GetFirebaseAnalyticsSessionId","title":"Get Firebase Analytics Session Id","fn":"GetFirebaseAnalyticsSessionId","owner":"UGetFirebaseAnalyticsSessionIdProxy","kind":"async","module":"Analytics","group":"","platform":"","doc":"Retrieves the identifier of the current Analytics app session — can fail if Analytics collection is disabled or the session has expired.","inputs":[],"outputs":[{"n":"bSuccess","t":"Boolean","k":"bool","c":"","r":""},{"n":"SessionId","t":"Integer64","k":"int64","c":"","r":""}],"exec":["OnResult"],"topic":"Settings and diagnostics"},{"id":"UGetAppCheckTokenProxy_GetAppCheckToken","title":"Get App Check Token","fn":"GetAppCheckToken","owner":"UGetAppCheckTokenProxy","kind":"async","module":"App Check","group":"","platform":"","doc":"Diagnostic node: requests an App Check token and reports whether it\nsucceeded. Useful to verify the provider installed by\nFirebaseBPAppCheck (Play Integrity on Android, App Attest on iOS, Debug on\ndesktop non-Shipping builds) is\nactually able to mint tokens, without waiting to find out via a rejected\nAuth/Firestore/... call.\n\nSet bForceRefresh to get a new token even if the cached one hasn't expired yet.","inputs":[{"n":"bForceRefresh","t":"Boolean","k":"bool","c":"","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseAppCheckError","k":"enum","c":"","r":"EFirebaseAppCheckError"},{"n":"Token","t":"FirebaseAppCheckToken","k":"struct","c":"","r":"FFirebaseAppCheckToken"}],"exec":["OnTokenReceived","OnError"],"topic":""},{"id":"UGetLimitedUseAppCheckTokenProxy_GetLimitedUseAppCheckToken","title":"Get Limited-Use App Check Token","fn":"GetLimitedUseAppCheckToken","owner":"UGetLimitedUseAppCheckTokenProxy","kind":"async","module":"App Check","group":"","platform":"","doc":"Requests a limited-use App Check token: unlike GetAppCheckToken, this always\nmints a fresh token (no caching) meant to be consumed exactly once by your\nown backend, for replay protection on sensitive one-shot requests (e.g.\nclaiming a reward, validating a purchase). Not needed for calls to Firebase\nservices themselves (Firestore/Auth/Storage/...), which are authorized\nautomatically — only for your own custom backend endpoints. Slower and\nmore quota-costly than GetAppCheckToken since it never uses the cache;\ndon't call this for routine requests.","inputs":[],"outputs":[{"n":"Error","t":"EFirebaseAppCheckError","k":"enum","c":"","r":"EFirebaseAppCheckError"},{"n":"Token","t":"FirebaseAppCheckToken","k":"struct","c":"","r":"FFirebaseAppCheckToken"}],"exec":["OnTokenReceived","OnError"],"topic":""},{"id":"UFirebaseAppCheckLibrary_GetAppCheckProviderName","title":"Get App Check Provider Name","fn":"GetAppCheckProviderName","owner":"UFirebaseAppCheckLibrary","kind":"pure","module":"App Check","group":"","platform":"","doc":"Which App Check provider FirebaseBPAppCheck::InstallProviderFactory()\ninstalled for this build — a fixed compile-time choice, not something\nthe SDK exposes a runtime getter for (there is no \"current provider\"\nquery on firebase::app_check::AppCheck). Returns \"Play Integrity\" on\nAndroid, \"App Attest\" on iOS, \"Debug\" on desktop non-Shipping builds\n(Editor/Windows testing only — no production attestation provider\nexists for desktop).","inputs":[],"outputs":[{"n":"Return Value","t":"String","k":"string","c":"","r":""}],"exec":[],"topic":""},{"id":"UFirebaseAppCheckLibrary_IsAppCheckTokenExpired","title":"Is App Check Token Expired","fn":"IsAppCheckTokenExpired","owner":"UFirebaseAppCheckLibrary","kind":"pure","module":"App Check","group":"","platform":"","doc":"True if Token's ExpireTime has already passed (compares against UtcNow(), not local time).","inputs":[{"n":"Token","t":"FirebaseAppCheckToken","k":"struct","c":"","r":"FFirebaseAppCheckToken","adv":false}],"outputs":[{"n":"Return Value","t":"Boolean","k":"bool","c":"","r":""}],"exec":[],"topic":""},{"id":"UFirebaseAppCheckLibrary_SetAppCheckTokenAutoRefreshEnabled","title":"Set App Check Token Auto Refresh Enabled","fn":"SetAppCheckTokenAutoRefreshEnabled","owner":"UFirebaseAppCheckLibrary","kind":"call","module":"App Check","group":"","platform":"","doc":"Enables or disables automatic App Check token refreshing. On by default\n(set once, unconditionally, right after the App Check provider is\ninstalled) — call this only if you need to turn it off, e.g. to avoid\nminting tokens for a guest/not-yet-consented player, then re-enable it\nonce appropriate. Automatic refreshing also requires Unreal's own\nanalytics/data-collection consent flag to be enabled (the SDK ties this\nto the same global isDataCollectionDefaultEnabled flag every other\nFirebase product uses) — this call overrides that tie for App Check\nspecifically, without touching the flag itself.","inputs":[{"n":"bEnabled","t":"Boolean","k":"bool","c":"","r":"","adv":false}],"outputs":[],"exec":[],"topic":""},{"id":"URevokeAppleSignInProxy_RevokeAppleSignInNative","title":"Revoke Apple Sign-In (Native)","fn":"RevokeAppleSignInNative","owner":"URevokeAppleSignInProxy","kind":"async","module":"Auth","group":"","platform":"iOS","doc":"Revokes the currently signed-in user's Sign in with Apple grant with Apple\nitself, through Firebase Auth's revokeToken(withAuthorizationCode:). App\nStore Review Guideline 5.1.1(v) requires any app that offers Sign in with\nApple AND lets players delete their account to also revoke that Apple\ntoken on deletion — deleting the Firebase user alone (Delete User) leaves\nthe app still listed under the player's Apple ID \"Sign in with Apple\" apps,\nwhich is grounds for App Review rejection.\n\nCall this BEFORE Delete User (a deleted user can no longer be revoked\nagainst): typical order is Reauthenticate Provider (Provider = Apple,\nwhich uses the native Apple flow on iOS/tvOS — see ClassifyAuthProviderKind's\nown doc comment) -> Revoke Apple Sign-In (Native) -> Delete User. This node shows Apple's own native\nsign-in sheet once to obtain a fresh one-time authorization code (Apple\noffers no silent way to get one), so it should be triggered from an\nexplicit \"Delete my account\" confirmation. The player must pick the same\nApple ID they originally signed in with — revoking a different Apple ID's\ntoken silently revokes the wrong grant. iOS/tvOS only; fails immediately\nwith Unimplemented elsewhere (an account created via the Android/Windows\nweb-redirect flow has no native token to revoke from here).","inputs":[],"outputs":[{"n":"Error","t":"EFirebaseAuthError","k":"enum","c":"","r":"EFirebaseAuthError"}],"exec":["OnRevoked","OnError"],"topic":"Tokens"},{"id":"USignInAnonymouslyProxy_SignInAnonymously","title":"Sign In Anonymously","fn":"SignInAnonymously","owner":"USignInAnonymouslyProxy","kind":"async","module":"Auth","group":"","platform":"","doc":"Asynchronously creates and becomes an anonymous user.\nIf there is already an anonymous user signed in, that user is returned instead.","inputs":[],"outputs":[{"n":"Error","t":"EFirebaseAuthError","k":"enum","c":"","r":"EFirebaseAuthError"},{"n":"User","t":"FirebaseUser","k":"struct","c":"","r":"FFirebaseUser"}],"exec":["OnSignedIn","OnError"],"topic":"Sign in"},{"id":"USignInWithEmailProxy_SignInWithEmailAndPassword","title":"Sign In with Email and Password","fn":"SignInWithEmailAndPassword","owner":"USignInWithEmailProxy","kind":"async","module":"Auth","group":"","platform":"","doc":"Signs in using provided email address and password.","inputs":[{"n":"Email","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Password","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseAuthError","k":"enum","c":"","r":"EFirebaseAuthError"},{"n":"User","t":"FirebaseUser","k":"struct","c":"","r":"FFirebaseUser"}],"exec":["OnSignedIn","OnError"],"topic":"Sign in"},{"id":"UCreateUserWithEmailProxy_CreateUserWithEmailAndPassword","title":"Create User with Email and Password","fn":"CreateUserWithEmailAndPassword","owner":"UCreateUserWithEmailProxy","kind":"async","module":"Auth","group":"","platform":"","doc":"Creates, and on success, logs in a user with the given email address and password.","inputs":[{"n":"Email","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Password","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseAuthError","k":"enum","c":"","r":"EFirebaseAuthError"},{"n":"User","t":"FirebaseUser","k":"struct","c":"","r":"FFirebaseUser"}],"exec":["OnUserCreated","OnError"],"topic":"Sign in"},{"id":"USendPasswordResetEmailProxy_SendPasswordResetEmail","title":"Send Password Reset Email","fn":"SendPasswordResetEmail","owner":"USendPasswordResetEmailProxy","kind":"async","module":"Auth","group":"","platform":"","doc":"Initiates a password reset for the given email address.","inputs":[{"n":"Email","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseAuthError","k":"enum","c":"","r":"EFirebaseAuthError"}],"exec":["OnEmailSent","OnError"],"topic":"Account"},{"id":"UGetIdTokenProxy_GetIdToken","title":"Get ID Token","fn":"GetIdToken","owner":"UGetIdTokenProxy","kind":"async","module":"Auth","group":"","platform":"","doc":"Asynchronously retrieves the current user's ID token (JWT), e.g. to send to\na backend for verification. Errors with NoSignedInUser if nobody is signed in.\n\nSet bForceRefresh to get a new token even if the cached one hasn't expired yet.","inputs":[{"n":"bForceRefresh","t":"Boolean","k":"bool","c":"","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseAuthError","k":"enum","c":"","r":"EFirebaseAuthError"},{"n":"Token","t":"String","k":"string","c":"","r":""}],"exec":["OnTokenReceived","OnError"],"topic":"Tokens"},{"id":"UGetIdTokenResultProxy_GetIdTokenResult","title":"Get ID Token Result","fn":"GetIdTokenResult","owner":"UGetIdTokenResultProxy","kind":"async","module":"Auth","group":"","platform":"","doc":"Same as Get ID Token, plus its decoded content: custom claims (roles set\nby your backend), sign-in provider, expiration and auth times. Use\nbForceRefresh right after your backend changed the user's custom claims —\nthe cached token keeps the old ones until it's refreshed (up to an hour).\nDecoded locally, not verified: drive UI with it, decide anything that must\nbe trusted on your backend / in security rules.","inputs":[{"n":"bForceRefresh","t":"Boolean","k":"bool","c":"","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseAuthError","k":"enum","c":"","r":"EFirebaseAuthError"},{"n":"Result","t":"FirebaseIdTokenResult","k":"struct","c":"","r":"FFirebaseIdTokenResult"}],"exec":["OnTokenReceived","OnError"],"topic":"Tokens"},{"id":"USendEmailVerificationProxy_SendEmailVerification","title":"Send Email Verification","fn":"SendEmailVerification","owner":"USendEmailVerificationProxy","kind":"async","module":"Auth","group":"","platform":"","doc":"Initiates email verification for the current user.","inputs":[],"outputs":[{"n":"Error","t":"EFirebaseAuthError","k":"enum","c":"","r":"EFirebaseAuthError"}],"exec":["OnEmailSent","OnError"],"topic":"Account"},{"id":"UUpdateUserProfileProxy_UpdateUserProfile","title":"Update User Profile","fn":"UpdateUserProfile","owner":"UUpdateUserProfileProxy","kind":"async","module":"Auth","group":"","platform":"","doc":"Updates the current user's display name and/or photo URL.\nBoth fields are always applied: pass an empty string to clear a field, or\nthe value from GetCurrentUser() to leave it unchanged.","inputs":[{"n":"DisplayName","t":"String","k":"string","c":"","r":"","adv":false},{"n":"PhotoUrl","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseAuthError","k":"enum","c":"","r":"EFirebaseAuthError"}],"exec":["OnProfileUpdated","OnError"],"topic":"Account"},{"id":"USendEmailVerificationBeforeUpdatingEmailProxy_SendEmailVerificationBeforeUpdatingEmail","title":"Send Email Verification Before Updating Email","fn":"SendEmailVerificationBeforeUpdatingEmail","owner":"USendEmailVerificationBeforeUpdatingEmailProxy","kind":"async","module":"Auth","group":"","platform":"","doc":"Sends a verification email to NewEmail; once the user confirms it, their\nsign-in email is updated to NewEmail. Replaces the old direct UpdateEmail\nAPI, which current Firebase Auth backends no longer accept.","inputs":[{"n":"NewEmail","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseAuthError","k":"enum","c":"","r":"EFirebaseAuthError"}],"exec":["OnEmailSent","OnError"],"topic":"Account"},{"id":"UUpdateUserPasswordProxy_UpdateUserPassword","title":"Update User Password","fn":"UpdateUserPassword","owner":"UUpdateUserPasswordProxy","kind":"async","module":"Auth","group":"","platform":"","doc":"Changes the current user's password. May fail with RequiresRecentLogin if\nthe session is old; call Reauthenticate first in that case.","inputs":[{"n":"NewPassword","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseAuthError","k":"enum","c":"","r":"EFirebaseAuthError"}],"exec":["OnPasswordUpdated","OnError"],"topic":"Account"},{"id":"UReloadUserProxy_ReloadUser","title":"Reload User","fn":"ReloadUser","owner":"UReloadUserProxy","kind":"async","module":"Auth","group":"","platform":"","doc":"Refreshes the current user's cached data (email, display name, providers,\n...) from the server and returns the updated user.","inputs":[],"outputs":[{"n":"Error","t":"EFirebaseAuthError","k":"enum","c":"","r":"EFirebaseAuthError"},{"n":"User","t":"FirebaseUser","k":"struct","c":"","r":"FFirebaseUser"}],"exec":["OnReloaded","OnError"],"topic":"Account"},{"id":"UDeleteUserProxy_DeleteUser","title":"Delete User","fn":"DeleteUser","owner":"UDeleteUserProxy","kind":"async","module":"Auth","group":"","platform":"","doc":"Permanently deletes the current user's account. May fail with\nRequiresRecentLogin if the session is old; call Reauthenticate first.\n\niOS apps that offer Sign in with Apple: App Store Review Guideline\n5.1.1(v) also requires revoking the player's Apple token when their\naccount is deleted, and this node does NOT do that on its own — call\nRevoke Apple Sign-In (Native) (FirebaseBPAppleSignInNodes.h) BEFORE this\nnode, since a deleted user can no longer be revoked against.","inputs":[],"outputs":[{"n":"Error","t":"EFirebaseAuthError","k":"enum","c":"","r":"EFirebaseAuthError"}],"exec":["OnDeleted","OnError"],"topic":"Account"},{"id":"UReauthenticateWithEmailProxy_ReauthenticateWithEmailAndPassword","title":"Reauthenticate with Email and Password","fn":"ReauthenticateWithEmailAndPassword","owner":"UReauthenticateWithEmailProxy","kind":"async","module":"Auth","group":"","platform":"","doc":"Re-proves the current user's identity with fresh email/password\ncredentials. Required by Firebase before sensitive operations (change\npassword/email, delete account, ...) if the session is old.","inputs":[{"n":"Email","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Password","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseAuthError","k":"enum","c":"","r":"EFirebaseAuthError"},{"n":"User","t":"FirebaseUser","k":"struct","c":"","r":"FFirebaseUser"}],"exec":["OnReauthenticated","OnError"],"topic":"Re-authentication"},{"id":"ULinkWithEmailProxy_LinkWithEmailAndPassword","title":"Link with Email and Password","fn":"LinkWithEmailAndPassword","owner":"ULinkWithEmailProxy","kind":"async","module":"Auth","group":"","platform":"","doc":"Links an email/password credential to the current user (e.g. to upgrade an\nanonymous account into a permanent one without losing its data).","inputs":[{"n":"Email","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Password","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseAuthError","k":"enum","c":"","r":"EFirebaseAuthError"},{"n":"User","t":"FirebaseUser","k":"struct","c":"","r":"FFirebaseUser"}],"exec":["OnLinked","OnError"],"topic":"Linking"},{"id":"UUnlinkProviderProxy_UnlinkProvider","title":"Unlink Provider","fn":"UnlinkProvider","owner":"UUnlinkProviderProxy","kind":"async","module":"Auth","group":"","platform":"","doc":"Unlinks the current user from Provider (see UFirebaseAuthLibrary::GetLinkedProvidersInfo to know which ones are currently linked). Works for every EFirebaseAuthProvider value except Unknown (which fails with InvalidProviderId), including the generic OAuth ones (Facebook/Apple/GitHub/Microsoft/Twitter/Yahoo) and GameCenter.","inputs":[{"n":"Provider","t":"EFirebaseAuthProvider","k":"enum","c":"","r":"EFirebaseAuthProvider","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseAuthError","k":"enum","c":"","r":"EFirebaseAuthError"},{"n":"User","t":"FirebaseUser","k":"struct","c":"","r":"FFirebaseUser"}],"exec":["OnUnlinked","OnError"],"topic":"Linking"},{"id":"UUnlinkProviderProxy_UnlinkProviderById","title":"Unlink Provider By Id","fn":"UnlinkProviderById","owner":"UUnlinkProviderProxy","kind":"async","module":"Auth","group":"","platform":"","doc":"Same as UnlinkProvider, but takes a raw Firebase provider ID string\n(e.g. \"apple.com\", \"github.com\", \"microsoft.com\", \"yahoo.com\",\n\"twitter.com\") instead of EFirebaseAuthProvider — for a provider linked\nvia SignInWithFederatedProvider/LinkWithFederatedProvider with an ID\nthat has no EFirebaseAuthProvider value (a custom OIDC / SAML provider\nsuch as \"oidc.myprovider\").","inputs":[{"n":"ProviderId","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseAuthError","k":"enum","c":"","r":"EFirebas
