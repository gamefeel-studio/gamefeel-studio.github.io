tadata / custom key-value payload sent alongside the message."},{"n":"Link","t":"String","k":"string","c":"","r":"","doc":"The link into the app from the message, if any."},{"n":"bNotificationOpened","t":"Boolean","k":"bool","c":"","r":"","doc":"True if this message was opened by tapping a notification in the OS system tray.","d":"false"},{"n":"bHasNotification","t":"Boolean","k":"bool","c":"","r":"","doc":"False for a \"data-only\" message; every NotificationXxx field below is only meaningful when this is true.","d":"false"},{"n":"NotificationTitle","t":"String","k":"string","c":"","r":"","doc":"Not visible on iOS/tvOS phones and tablets."},{"n":"NotificationBody","t":"String","k":"string","c":"","r":"","doc":""},{"n":"NotificationIcon","t":"String","k":"string","c":"","r":"","doc":"Android only: drawable resource name to use as the notification icon."},{"n":"NotificationSound","t":"String","k":"string","c":"","r":"","doc":"\"default\", or the filename of a bundled sound resource."},{"n":"NotificationTag","t":"String","k":"string","c":"","r":"","doc":"Android only: notifications sharing a tag replace each other in the notification drawer instead of stacking."},{"n":"NotificationColor","t":"String","k":"string","c":"","r":"","doc":"Android only: icon color in #rrggbb format."},{"n":"NotificationClickAction","t":"String","k":"string","c":"","r":"","doc":"Android: matching intent-filter activity to launch on tap. iOS/tvOS: APNs \"category\"."},{"n":"NotificationBadge","t":"String","k":"string","c":"","r":"","doc":"iOS/tvOS only: badge to display on the app icon."},{"n":"NotificationChannelId","t":"String","k":"string","c":"","r":"","doc":"Android only: the notification channel ID provided when the message was sent."},{"n":"NotificationBodyLocKey","t":"String","k":"string","c":"","r":"","doc":"Localization key for NotificationBody (iOS/tvOS: APNs \"loc-key\"; Android: a string resource key) — empty unless the sender set one."},{"n":"NotificationBodyLocArgs","t":"Array of String","k":"string","c":"array","r":"","doc":"Format arguments substituted into NotificationBodyLocKey's localized string."},{"n":"NotificationTitleLocKey","t":"String","k":"string","c":"","r":"","doc":"Same as NotificationBodyLocKey, for NotificationTitle (iOS/tvOS: APNs \"title-loc-key\")."},{"n":"NotificationTitleLocArgs","t":"Array of String","k":"string","c":"array","r":"","doc":"Format arguments substituted into NotificationTitleLocKey's localized string."}]},{"id":"FFirebasePlayGamesPlayer","kind":"struct","name":"FFirebasePlayGamesPlayer","module":"Play Games","doc":"The signed-in player's public profile, as returned by GetCurrentPlayer.","fields":[{"n":"PlayerId","t":"String","k":"string","c":"","r":"","doc":""},{"n":"DisplayName","t":"String","k":"string","c":"","r":"","doc":""},{"n":"Title","t":"String","k":"string","c":"","r":"","doc":"Player's in-game title/rank as configured in Play Console (e.g. \"Novice\"); empty if none is set up."},{"n":"IconImageUrl","t":"String","k":"string","c":"","r":"","doc":""},{"n":"HiResImageUrl","t":"String","k":"string","c":"","r":"","doc":""}]},{"id":"FFirebasePlayGamesScore","kind":"struct","name":"FFirebasePlayGamesScore","module":"Play Games","doc":"The signed-in player's score on one leaderboard, as returned by GetPlayerScore.","fields":[{"n":"bHasScore","t":"Boolean","k":"bool","c":"","r":"","doc":"False if the player has no score on this leaderboard yet — every other field is meaningless in that case.","d":"false"},{"n":"RawScore","t":"Integer64","k":"int64","c":"","r":"","doc":"","d":"0"},{"n":"FormattedScore","t":"String","k":"string","c":"","r":"","doc":"Localized, ready-to-display score (e.g. \"1,234\"). Already accounts for the leaderboard's Play Console format (Numeric/Time/Currency) — no extra parsing needed."},{"n":"Rank","t":"Integer64","k":"int64","c":"","r":"","doc":"1-based rank on this leaderboard, or -1 if Google hasn't computed a rank\nfor this player yet (LEADERBOARD_RANK_UNKNOWN — can happen right after a\nfirst score submission, before the leaderboard's ranking data catches up).","d":"-1"},{"n":"FormattedRank","t":"String","k":"string","c":"","r":"","doc":"Localized, ready-to-display rank (e.g. \"1,234th\"); empty if Rank is -1."}]},{"id":"FFirebasePlayGamesLeaderboardEntry","kind":"struct","name":"FFirebasePlayGamesLeaderboardEntry","module":"Play Games","doc":"One row of a leaderboard score list, as returned by GetTopScores or\nGetPlayerCenteredScores. Unlike GetPlayerScore (which only ever returns\nthe signed-in player's own score), these two nodes return a whole page of\nOTHER players' entries too — this struct is per-entry, not per-request.","fields":[{"n":"Rank","t":"Integer64","k":"int64","c":"","r":"","doc":"1-based rank on this leaderboard.","d":"0"},{"n":"PlayerId","t":"String","k":"string","c":"","r":"","doc":"May be empty: the SDK doesn't guarantee a resolvable Player object for\nevery score entry (in particular for GetTopScores' potentially-strangers\nresults), only PlayerDisplayName/PlayerIconImageUrl below."},{"n":"PlayerDisplayName","t":"String","k":"string","c":"","r":"","doc":""},{"n":"PlayerIconImageUrl","t":"String","k":"string","c":"","r":"","doc":"May be empty if this player has no avatar set."},{"n":"RawScore","t":"Integer64","k":"int64","c":"","r":"","doc":"","d":"0"},{"n":"FormattedScore","t":"String","k":"string","c":"","r":"","doc":"Localized, ready-to-display score (e.g. \"01:04.220\")."}]},{"id":"FFirebasePlayGamesPlayerStats","kind":"struct","name":"FFirebasePlayGamesPlayerStats","module":"Play Games","doc":"The signed-in player's engagement/monetization stats, as returned by\nGetPlayGamesPlayerStats — Play Games' own predictive analytics about this\nspecific player (e.g. to tailor an offer to a player estimated likely to\nchurn or spend). Google's own docs note several of these can come back as\nthe sentinel -1 (int fields) / -1.0 (float fields) — \"not enough data yet\"\nfor a player Play Games hasn't observed enough sessions from — always check\nfor that before using a field, rather than assuming every field is populated.","fields":[{"n":"NumberOfSessions","t":"Integer","k":"int","c":"","r":"","doc":"-1 if unknown.","d":"-1"},{"n":"DaysSinceLastPlayed","t":"Integer","k":"int","c":"","r":"","doc":"-1 if unknown.","d":"-1"},{"n":"AverageSessionLengthMinutes","t":"Float","k":"float","c":"","r":"","doc":"-1 if unknown.","d":"-1.f"},{"n":"SessionPercentile","t":"Float","k":"float","c":"","r":"","doc":"0-100 (this player's session count/frequency percentile among this game's players), or -1 if unknown.","d":"-1.f"},{"n":"ChurnProbability","t":"Float","k":"float","c":"","r":"","doc":"0-1 (estimated probability this player stops playing soon), or -1 if unknown.","d":"-1.f"},{"n":"NumberOfPurchases","t":"Integer","k":"int","c":"","r":"","doc":"-1 if unknown.","d":"-1"},{"n":"SpendPercentile","t":"Float","k":"float","c":"","r":"","doc":"0-100 (this player's spend percentile among this game's players), or -1 if unknown.","d":"-1.f"},{"n":"SpendProbability","t":"Float","k":"float","c":"","r":"","doc":"0-1 (estimated probability this player makes another purchase), or -1 if unknown.","d":"-1.f"},{"n":"HighSpenderProbability","t":"Float","k":"float","c":"","r":"","doc":"0-1 (estimated probability this player becomes a high spender), or -1 if unknown.","d":"-1.f"},{"n":"TotalSpendNext28Days","t":"Float","k":"float","c":"","r":"","doc":"Estimated spend over the next 28 days, in the app's own store currency units, or -1 if unknown.","d":"-1.f"}]},{"id":"FFirebasePlayGamesLeaderboard","kind":"struct","name":"FFirebasePlayGamesLeaderboard","module":"Play Games","doc":"One leaderboard configured for this game, as returned by Get Leaderboards.","fields":[{"n":"LeaderboardId","t":"String","k":"string","c":"","r":"","doc":"The ID to pass to Submit Score / Get Top Scores / Show Leaderboard..."},{"n":"Name","t":"String","k":"string","c":"","r":"","doc":"The name set in Play Console, localized to the device FirebasePlayGamesAchievementType","doc":"","d":"EFirebasePlayGamesAchievementType::Standard"},{"n":"CurrentSteps","t":"Integer","k":"int","c":"","r":"","doc":"Only meaningful when Type == Incremental (always 0 for Standard).","d":"0"},{"n":"TotalSteps","t":"Integer","k":"int","c":"","r":"","doc":"Only meaningful when Type == Incremental (always 0 for Standard).","d":"0"},{"n":"UnlockedImageUrl","t":"String","k":"string","c":"","r":"","doc":"May be empty if this achievement has no icon configured in Play Console."},{"n":"RevealedImageUrl","t":"String","k":"string","c":"","r":"","doc":"Icon shown once Revealed but before Unlocked; may be empty."},{"n":"XpValue","t":"Integer64","k":"int64","c":"","r":"","doc":"XP awarded on unlock, as configured in Play Console (0 if XP isn't set up for this project).","d":"0"}]},{"id":"FFirebasePlayGamesSnapshotInfo","kind":"struct","name":"FFirebasePlayGamesSnapshotInfo","module":"Play Games","doc":"One saved game's metadata, as returned by ListPlayGamesSnapshots — lets you\nbuild a \"choose a save slot\" UI without downloading each slot's actual save\ndata (see SavePlayGamesSnapshot/LoadPlayGamesSnapshot for that). SnapshotName\nis the same identifier those two nodes take.","fields":[{"n":"SnapshotName","t":"String","k":"string","c":"","r":"","doc":""},{"n":"Description","t":"String","k":"string","c":"","r":"","doc":"Whatever Description SavePlayGamesSnapshot was last called with for this snapshot; empty if none was given."},{"n":"LastModifiedTimestampMs","t":"Integer64","k":"int64","c":"","r":"","doc":"Milliseconds since epoch.","d":"0"},{"n":"PlayedTimeMs","t":"Integer64","k":"int64","c":"","r":"","doc":"Total played time associated with this save, in milliseconds — the PlayedTimeMs last passed to Save Play Games Snapshot (-1 if never set).","d":"0"},{"n":"ProgressValue","t":"Integer64","k":"int64","c":"","r":"","doc":"The game-defined ProgressValue last passed to Save Play Games Snapshot (-1 if never set).","d":"-1"},{"n":"CoverImageUrl","t":"String","k":"string","c":"","r":"","doc":"May be empty if this snapshot has no cover image."}]},{"id":"FFirebaseRemoteConfigInfo","kind":"struct","name":"FFirebaseRemoteConfigInfo","module":"Remote Config","doc":"Mirrors firebase::remote_config::ConfigInfo — state of the most recent Fetch() call.","fields":[{"n":"FetchTimeMs","t":"Integer64","k":"int64","c":"","r":"","doc":"Milliseconds since epoch that the last fetch completed; 0 if no fetch attempt has been made yet.","d":"0"},{"n":"LastFetchStatus","t":"EFirebaseRemoteConfigFetchStatus","k":"enum","c":"","r":"EFirebaseRemoteConfigFetchStatus","doc":"","d":"EFirebaseRemoteConfigFetchStatus::Pending"},{"n":"LastFetchFailureReason","t":"EFirebaseRemoteConfigFetchFailureReason","k":"enum","c":"","r":"EFirebaseRemoteConfigFetchFailureReason","doc":"","d":"EFirebaseRemoteConfigFetchFailureReason::Invalid"},{"n":"ThrottledEndTimeMs","t":"Integer64","k":"int64","c":"","r":"","doc":"Milliseconds since epoch when fetch throttling ends; only meaningful if LastFetchFailureReason is Throttled.","d":"0"}]},{"id":"FFirebaseRemoteConfigValueInfo","kind":"struct","name":"FFirebaseRemoteConfigValueInfo","module":"Remote Config","doc":"Mirrors firebase::remote_config::ValueInfo — returned alongside a value by every Get*WithInfo node.","fields":[{"n":"Source","t":"EFirebaseRemoteConfigValueSource","k":"enum","c":"","r":"EFirebaseRemoteConfigValueSource","doc":"","d":"EFirebaseRemoteConfigValueSource::StaticValue"},{"n":"bConversionSuccessful","t":"Boolean","k":"bool","c":"","r":"","doc":"False if the stored value couldn't be converted to the requested type (e.g. a non-numeric string read as a Double) — the returned value is that type's static fallback in that case.","d":"false"}]},{"id":"FFirebaseStorageMetadata","kind":"struct","name":"FFirebaseStorageMetadata","module":"Storage","doc":"Mirrors firebase::storage::Metadata — attributes of an uploaded object, plus your own custom key/value pairs.","fields":[{"n":"Bucket","t":"String","k":"string","c":"","r":"","doc":"The Google Cloud Storage bucket that holds this object."},{"n":"FullPath","t":"String","k":"string","c":"","r":"","doc":"Full path of the object, not including the bucket — e.g. \"avatars/player1.png\"."},{"n":"Name","t":"String","k":"string","c":"","r":"","doc":"Short name of the object — e.g. \"player1.png\"."},{"n":"ContentType","t":"String","k":"string","c":"","r":"","doc":""},{"n":"SizeBytes","t":"Integer64","k":"int64","c":"","r":"","doc":"","d":"0"},{"n":"Md5Hash","t":"String","k":"string","c":"","r":"","doc":"MD5 hash of the object's data, base64-encoded."},{"n":"CreationTime","t":"Date Time","k":"struct","c":"","r":"","doc":""},{"n":"UpdatedTime","t":"Date Time","k":"struct","c":"","r":"","doc":""},{"n":"CustomMetadata","t":"Map of String to String","k":"string","c":"map","r":"","doc":"Your own custom key/value pairs, set via UpdateStorageMetadata or at upload time."},{"n":"CacheControl","t":"String","k":"string","c":"","r":"","doc":"Caching directive for HTTP clients/CDNs fetching this object via its download URL (e.g. \"public, max-age=3600\") — empty if never set."},{"n":"ContentDisposition","t":"String","k":"string","c":"","r":"","doc":"e.g. \"attachment; filename=\\\"photo.jpg\\\"\" — hints a browser to download rather than display the object, and under what filename. Empty if never set."},{"n":"ContentEncoding","t":"String","k":"string","c":"","r":"","doc":"e.g. \"gzip\" — empty if never set."},{"n":"ContentLanguage","t":"String","k":"string","c":"","r":"","doc":"ISO language code of the object's content (e.g. \"en\"). Empty if never set."},{"n":"Generation","t":"Integer64","k":"int64","c":"","r":"","doc":"Version of the object's data — changes every time the data itself is overwritten (e.g. re-uploaded). Use with MetaGeneration for an optimistic-concurrency check before UpdateStorageMetadata.","d":"0"},{"n":"MetaGeneration","t":"Integer64","k":"int64","c":"","r":"","doc":"Version of the object's metadata — changes every time only its metadata (not its data) is updated.","d":"0"},{"n":"bIsValid","t":"Boolean","k":"bool","c":"","r":"","doc":"False if this Metadata was returned alongside a failed operation — check the proxy's own Error output first.","d":"false"}]},{"id":"FFirebaseAppUpdateInfo","kind":"struct","name":"FFirebaseAppUpdateInfo","module":"Store Services","doc":"Result of CheckForAppUpdate. Several fields are Android-only (populated\nfrom Play Core's AppUpdateInfo) or iOS-only (populated from an App Store\nversion lookup) — see each field's own doc comment for which platforms\nactually populate it, rather than assuming every field is meaningful\neverywhere.","fields":[{"n":"Availability","t":"EFirebaseAppUpdateAvailability","k":"enum","c":"","r":"EFirebaseAppUpdateAvailability","doc":"","d":"EFirebaseAppUpdateAvailability::Unknown"},{"n":"bUpdateAvailable","t":"Boolean","k":"bool","c":"","r":"","doc":"Convenience: true iff Availability == UpdateAvailable.","d":"false"},{"n":"bImmediateUpdateAllowed","t":"Boolean","k":"bool","c":"","r":"","doc":"Whether StartImmediateAppUpdate can be used right now. True on iOS whenever bUpdateAvailable is true (opening the App Store page is always possible there).","d":"false"},{"n":"bFlexibleUpdateAllowed","t":"Boolean","k":"bool","c":"","r":"","doc":"Whether StartFlexibleAppUpdate can be used right now. Always false on iOS — background-download updates have no iOS equivalent; use StartImmediateAppUpdate there instead.","d":"false"},{"n":"UpdatePriority","t":"Integer","k":"int","c":"","r":"","doc":"Android only: the Play Console-configured update priority (0-5) for the available update — use this to decide how strongly to nudge the player. Always 0 on iOS.","d":"0"},{"n":"ClientVersionStalenessDays","t":"Integer","k":"int","c":"","r":"","doc":"Android only: days since this player's installed version stopped being the latest available. -1 on iOS, or if unknown.","d":"-1"},{"n":"StoreVersionName","t":"String","k":"string","c":"","r":"","doc":"iOS only: the App Store's current version string for this app (e.g. \"1.4.2\"), from a store lookup. Empty on Android — Play Core's AppUpdateInfo exposes only an internal version CODE (not a human-readable version), which isn't surfaced here since it isn't comparable to iOS's version string."},{"n":"AvailableVersionCode","t":"Integer","k":"int","c":"","r":"","doc":"Android only: the version code of the update on the Play Store (0 if none, or on iOS). Compare it with your build's own version code.","d":"0"},{"n":"InstallStatus","t":"EFirebaseAppUpdateInstallStatus","k":"enum","c":"","r":"EFirebaseAppUpdateInstallStatus","doc":"Android only: state of a Flexible update already started (e.g. in a\nprevious session). Downloaded means it's ready: call\nCompleteFlexibleAppUpdate (Google recommends checking this at every\napp resume). Unknown on iOS.","d":"EFirebaseAppUpdateInstallStatus::Unknown"},{"n":"BytesDownloaded","t":"Integer64","k":"int64","c":"","r":"","doc":"Android only: bytes of that Flexible update downloaded so far (see InstallStatus).","d":"0"},{"n":"TotalBytesToDownload","t":"Integer64","k":"int64","c":"","r":"","doc":"Android only: total size of that Flexible update download, in bytes.","d":"0"}]},{"id":"FFirebaseUMPConsentDebugSettings","kind":"struct","name":"FFirebaseUMPConsentDebugSettings","module":"UMP","doc":"Debug settings for RequestUMPConsentInfoUpdate. Mirrors\nfirebase::ump::ConsentDebugSettings.","fields":[{"n":"DebugGeography","t":"EFirebaseUMPConsentDebugGeography","k":"enum","c":"","r":"EFirebaseUMPConsentDebugGeography","doc":"","d":"EFirebaseUMPConsentDebugGeography::Disabled"},{"n":"DebugDeviceIds","t":"Array of String","k":"string","c":"array","r":"","doc":"Hashed device IDs allowed to use DebugGeography — get yours from the device log after a first RequestUMPConsentInfoUpdate call with debugging enabled. Ignored on simulators/the Editor (debug behavior always applies there)."}]},{"id":"FFirebaseUMPConsentRequestParameters","kind":"struct","name":"FFirebaseUMPConsentRequestParameters","module":"UMP","doc":"Parameters for RequestUMPConsentInfoUpdate. Mirrors\nfirebase::ump::ConsentRequestParameters.","fields":[{"n":"bTagForUnderAgeOfConsent","t":"Boolean","k":"bool","c":"","r":"","doc":"Set true if this user is known to be under your region's age of consent — routes them straight to the \"not required to ask\" treatment rather than showing a form they legally can't consent through.","d":"false"},{"n":"DebugSettings","t":"FirebaseUMPConsentDebugSettings","k":"struct","c":"","r":"FFirebaseUMPConsentDebugSettings","doc":""}]},{"id":"EFirebaseAdMobError","kind":"enum","name":"EFirebaseAdMobError","module":"AdMob","doc":"Ad load/show error, Android only. Unlike most other error enums in this\nplugin, raw SDK code 0 is NOT \"success\" here (Google Mobile Ads' AdRequest\nerror codes have no such sentinel — success is signaled by the load/show\ncallback firing at all, not by an error code), so ConvertAdMobErrorCode\nbelow does an explicit switch instead of a direct cast.","values":[{"n":"None","v":"0","doc":""},{"n":"InternalError","v":"1","doc":""},{"n":"InvalidRequest","v":"2","doc":""},{"n":"NetworkError","v":"3","doc":""},{"n":"NoFill","v":"4","doc":""},{"n":"NotLoaded","v":"5","doc":"Show was called with no ad currently loaded (e.g. Show before Load finished, or after the loaded ad was already consumed) — a routine, expected condition, not an SDK-side failure."},{"n":"AlreadyInProgress","v":"6","doc":"The same Load/Show node is already running for this ad format (e.g. a double tap) — wait for it to finish."},{"n":"AdReused","v":"7","doc":"Show: this ad was already shown once (a loaded full-screen ad can only be shown one time)."},{"n":"AppNotInForeground","v":"8","doc":"Show: the app wasn't in the foreground when the ad tried to show."},{"n":"MediationShowError","v":"9","doc":"Show: a mediation ad network failed to show its ad."},{"n":"AppIdMissing","v":"10","doc":"Load: the AdMob App ID is missing (Project Settings -> Firebase BP -> AdMob)."},{"n":"NotInitialized","v":"100","doc":"Module disabled in Project Settings, not yet loaded, or Android SDK/JNI unavailable."},{"n":"Unknown","v":"127","doc":""}]},{"id":"EFirebaseAdMobAdFormat","kind":"enum","name":"EFirebaseAdMobAdFormat","module":"AdMob","doc":"Which ad format an FFirebaseAdPaidEvent came from. Android only.","values":[{"n":"Unknown","v":"0","doc":""},{"n":"Interstitial","v":"1","doc":""},{"n":"Rewarded","v":"2","doc":""},{"n":"AppOpen","v":"3","doc":""},{"n":"Banner","v":"4","doc":""},{"n":"RewardedInterstitial","v":"5","doc":""}]},{"id":"EFirebaseAdValuePrecision","kind":"enum","name":"EFirebaseAdValuePrecision","module":"AdMob","doc":"How trustworthy an FFirebaseAdPaidEvent's value is — mirrors com.google.android.gms.ads.AdValue.PrecisionType.","values":[{"n":"Unknown","v":"0","doc":""},{"n":"Estimated","v":"1","doc":"Approximated by AdMob (e.g. from a rolling average) rather than the exact price of this impression."},{"n":"PublisherProvided","v":"2","doc":"Provided by the publisher (you), e.g. a fixed price you configured for a house/direct-sold ad."},{"n":"Precise","v":"3","doc":"The real, exact price of this impression."}]},{"id":"EFirebaseAdTagStatus","kind":"enum","name":"EFirebaseAdTagStatus","module":"AdMob","doc":"Tri-state for the child-directed / under-age-of-consent tags (AdMob's TAG_FOR_* constants): explicitly yes, explicitly no, or leave to AdMob's default.","values":[{"n":"Unspecified","v":"0","doc":"Don't tag requests either way (AdMob's default)."},{"n":"Yes","v":"1","doc":"Yes — requests are tagged accordingly. (Not named True/False: UHT forbids enum values with those names.)"},{"n":"No","v":"2","doc":"No — requests are explicitly tagged as not applicable."}]},{"id":"EFirebaseAdMaxContentRating","kind":"enum","name":"EFirebaseAdMaxContentRating","module":"AdMob","doc":"Maximum content rating of ads AdMob may serve — mirrors RequestConfiguration.MAX_AD_CONTENT_RATING_*.","values":[{"n":"Unspecified","v":"0","doc":"No cap (AdMob's default)."},{"n":"G","v":"1","doc":"General audiences."},{"n":"PG","v":"2","doc":"Parental guidance."},{"n":"T","v":"3","doc":"Teen."},{"n":"MA","v":"4","doc":"Mature audiences."}]},{"id":"EFirebaseAdMobBannerSize","kind":"enum","name":"EFirebaseAdMobBannerSize","module":"AdMob","doc":"Standard Google Mobile Ads banner sizes, plus an adaptive option that sizes itself to the device's screen width. Mirrors com.google.android.gms.ads.AdSize's own named constants (Android only).","values":[{"n":"Banner","v":"0","doc":"320x50 — the standard, most widely-supported banner size."},{"n":"LargeBanner","v":"1","doc":"320x100."},{"n":"MediumRectangle","v":"2","doc":"300x250."},{"n":"FullBanner","v":"3","doc":"468x60 — tablet-oriented; not recommended on phone screens."},{"n":"Leaderboard","v":"4","doc":"728x90 — tablet-oriented; not recommended on phone screens."},{"n":"Adaptive","v":"5","doc":"Sizes itself to the current screen width and orientation (Google's recommended default for new integrations) — taller than the fixed Banner size, so it fits more content and generally performs better."}]},{"id":"EFirebaseAdMobBannerPosition","kind":"enum","name":"EFirebaseAdMobBannerPosition","module":"AdMob","doc":"Where LoadBannerAd docks the banner on screen — a thin, screen-width strip pinned to the top or bottom edge.","values":[{"n":"Top","v":"0","doc":""},{"n":"Bottom","v":"1","doc":""}]},{"id":"EFirebaseConsentStatus","kind":"enum","name":"EFirebaseConsentStatus","module":"AdMob","doc":"The end user's UMP (User Messaging Platform) consent status — Google's\nGDPR/CCPA consent flow, gating whether AdMob may request ads at all (and\nwhether they must be non-personalized). Mirrors\ncom.google.android.ump.ConsentInformation.ConsentStatus, which is also\nexactly firebase::ump::ConsentStatus's own value set (see\nConvertUMPConsentStatus below) — this historically Android-JNI-only type\nis now the one EFirebaseConsentStatus the cross-platform UMP module\n(UMP/FirebaseBPUMPTypes.h, which includes this header to reuse it) uses\ntoo, rather than each keeping its own copy: both AdMob's\nURequestConsentInfoUpdateProxy/UShowPrivacyOptionsFormProxy and the UMP\nmodule's own proxies ultimately read the same firebase::ump::ConsentInfo\nsingleton, so a single consent-status type is the accurate model.\nDeliberately kept under AdMob/ (not moved to UMP/) since renaming a\nBlueprint-reflected UENUM would break any already-saved graph that\nreferences EFirebaseConsentStatus by name.","values":[{"n":"Unknown","v":"0","doc":"Consent info hasn't been requested yet, or the last request failed."},{"n":"Required","v":"1","doc":"A consent decision is required from the user but hasn't been made yet — RequestConsentInfoUpdate should have already shown the form and resolved this to NotRequired/Obtained; seeing this after it completes means the user closed the form without deciding."},{"n":"NotRequired","v":"2","doc":"Consent isn't required for this user (e.g. outside the EEA/UK) — ads may be requested normally."},{"n":"Obtained","v":"3","doc":"The user has made a consent choice (via the form UMP showed) — check UFirebaseAdMobLibrary::CanRequestAds() for whether/how ads may be requested given that choice."}]},{"id":"EFirebaseAnalyticsEvent","kind":"enum","name":"EFirebaseAnalyticsEvent","module":"Analytics","doc":"A predefined Google Analytics event name — see GetAnalyticsEventName.","values":[{"n":"AdImpression","doc":"\"ad_impression\""},{"n":"AddPaymentInfo","doc":"\"add_payment_info\""},{"n":"AddShippingInfo","doc":"\"add_shipping_info\""},{"n":"AddToCart","doc":"\"add_to_cart\""},{"n":"AddToWishlist","doc":"\"add_to_wishlist\""},{"n":"AppOpen","doc":"\"app_open\""},{"n":"BeginCheckout","doc":"\"begin_checkout\""},{"n":"CampaignDetails","doc":"\"campaign_details\""},{"n":"EarnVirtualCurrency","doc":"\"earn_virtual_currency\""},{"n":"GenerateLead","doc":"\"generate_lead\""},{"n":"InAppPurchase","doc": d","v":"34","doc":""},{"n":"MissingVerificationCode","v":"35","doc":""},{"n":"MissingVerificationId","v":"36","doc":""},{"n":"MissingEmail","v":"37","doc":""},{"n":"MissingPassword","v":"38","doc":""},{"n":"QuotaExceeded","v":"39","doc":""},{"n":"RetryPhoneAuth","v":"40","doc":""},{"n":"SessionExpired","v":"41","doc":""},{"n":"AppNotVerified","v":"42","doc":""},{"n":"AppVerificationFailed","v":"43","doc":""},{"n":"CaptchaCheckFailed","v":"44","doc":""},{"n":"InvalidAppCredential","v":"45","doc":""},{"n":"MissingAppCredential","v":"46","doc":""},{"n":"InvalidClientId","v":"47","doc":""},{"n":"InvalidContinueUri","v":"48","doc":""},{"n":"MissingContinueUri","v":"49","doc":""},{"n":"KeychainError","v":"50","doc":""},{"n":"MissingAppToken","v":"51","doc":""},{"n":"MissingIosBundleId","v":"52","doc":""},{"n":"NotificationNotForwarded","v":"53","doc":""},{"n":"UnauthorizedDomain","v":"54","doc":""},{"n":"WebContextAlreadyPresented","v":"55","doc":""},{"n":"WebContextCancelled","v":"56","doc":""},{"n":"DynamicLinkNotActivated","v":"57","doc":""},{"n":"Cancelled","v":"58","doc":""},{"n":"InvalidProviderId","v":"59","doc":""},{"n":"WebInternalError","v":"60","doc":""},{"n":"WebStorageUnsupported","v":"61","doc":""},{"n":"TenantIdMismatch","v":"62","doc":""},{"n":"UnsupportedTenantOperation","v":"63","doc":""},{"n":"InvalidLinkDomain","v":"64","doc":""},{"n":"RejectedCredential","v":"65","doc":""},{"n":"PhoneNumberNotFound","v":"66","doc":""},{"n":"InvalidTenantId","v":"67","doc":""},{"n":"MissingClientIdentifier","v":"68","doc":""},{"n":"MissingMultiFactorSession","v":"69","doc":""},{"n":"MissingMultiFactorInfo","v":"70","doc":""},{"n":"InvalidMultiFactorSession","v":"71","doc":""},{"n":"MultiFactorInfoNotFound","v":"72","doc":""},{"n":"AdminRestrictedOperation","v":"73","doc":""},{"n":"UnverifiedEmail","v":"74","doc":""},{"n":"SecondFactorAlreadyEnrolled","v":"75","doc":""},{"n":"MaximumSecondFactorCountExceeded","v":"76","doc":""},{"n":"UnsupportedFirstFactor","v":"77","doc":""},{"n":"EmailChangeNeedsVerification","v":"78","doc":""},{"n":"Unimplemented","v":"79","doc":""},{"n":"NotInitialized","v":"100","doc":""},{"n":"Unknown","v":"127","doc":""}]},{"id":"EFirebaseAuthProvider","kind":"enum","name":"EFirebaseAuthProvider","module":"Auth","doc":"Which Firebase Auth identity provider a linked/signed-in credential came\nfrom. Maps the raw provider ID string the SDK uses internally (e.g.\n\"password\", \"google.com\") to a proper enum, so Blueprint graphs can\nSwitch on Enum instead of comparing raw strings.","values":[{"n":"Unknown","doc":""},{"n":"Password","doc":""},{"n":"Google","doc":""},{"n":"PlayGames","doc":""},{"n":"Phone","doc":"Query/unlink only (IsProviderLinked, GetLinkedProviderIds/Info,\nUnlinkProvider) — to actually create a phone link in the first place,\nuse SendPhoneVerificationCode/VerifyPhoneCode (Mode = Link) instead of\nLinkProvider: phone auth is an inherently two-step flow (send code,\nthen verify the code the user typed in), which doesn't fit\nLinkProvider's single-call OnLinked/OnError shape."},{"n":"Facebook","doc":""},{"n":"Apple","doc":""},{"n":"GitHub","doc":""},{"n":"Microsoft","doc":""},{"n":"Twitter","doc":""},{"n":"Yahoo","doc":""},{"n":"GameCenter","doc":"Apple Game Center — unlike every other value in this enum (Password/\nPhone aside), NOT a generic OAuth/OIDC provider: authenticating requires\na native call into Apple's own GameKit framework (see\nUFirebaseGameCenterLibrary::AuthenticateGameCenterLocalPlayer, which\nmust succeed first) rather than a web redirect. iOS/tvOS only."}]},{"id":"EFirebaseBillingError","kind":"enum","name":"EFirebaseBillingError","module":"Billing","doc":"Google Play Billing error, Android only. Raw SDK code 0 IS \"success\" here (BillingClient.BillingResponseCode.OK), unlike EFirebaseAdMobError.","values":[{"n":"None","v":"0","doc":""},{"n":"UserCancelled","v":"1","doc":""},{"n":"ServiceUnavailable","v":"2","doc":""},{"n":"BillingUnavailable","v":"3","doc":""},{"n":"ItemUnavailable","v":"4","doc":""},{"n":"DeveloperError","v":"5","doc":""},{"n":"ItemAlreadyOwned","v":"6","doc":""},{"n":"ItemNotOwned","v":"7","doc":""},{"n":"ServiceDisconnected","v":"8","doc":""},{"n":"FeatureNotSupported","v":"9","doc":""},{"n":"NetworkError","v":"10","doc":""},{"n":"NotInitialized","v":"100","doc":"Module disabled in Project Settings, not yet connected, or Android SDK/JNI unavailable."},{"n":"AlreadyInProgress","v":"101","doc":"A call of this same kind (e.g. another PurchaseProduct) is already in flight; this one was rejected outright, not attempted and failed."},{"n":"Unknown","v":"127","doc":""}]},{"id":"EFirebaseSubscriptionReplacementMode","kind":"enum","name":"EFirebaseSubscriptionReplacementMode","module":"Billing","doc":"How an in-flight subscription purchase should be reconciled with the one it\nreplaces — mirrors com.android.billingclient.api.BillingFlowParams.SubscriptionUpdateParams.ReplacementMode.\nOnly meaningful when PurchaseProduct is called with a non-empty\nOldSubscriptionPurchaseToken (i.e. this is an upgrade/downgrade, not a\nfresh purchase). See Google's own Play Billing docs for which mode fits a\ngiven upgrade/downgrade/crossgrade case.","values":[{"n":"WithTimeProration","v":"0","doc":"Replace immediately; credit for the old plan's unused time is applied as a proration towards the new plan's price. Play Billing's classic default behavior."},{"n":"ChargeProratedPrice","v":"1","doc":"Replace immediately; the prorated value of the old plan's unused time is charged as a one-time fee for the new plan's remaining current billing cycle."},{"n":"WithoutProration","v":"2","doc":"Replace immediately, with no proration at all — the new plan's billing cycle starts fresh from today."},{"n":"Deferred","v":"3","doc":"Don't replace until the current billing cycle ends — the old plan keeps running until then, and the new plan's price only starts being charged at the next renewal."},{"n":"ChargeFullPrice","v":"4","doc":"Replace immediately, charging the new plan's full price with no credit for the old plan's unused time."}]},{"id":"EFirebaseBillingFeature","kind":"enum","name":"EFirebaseBillingFeature","module":"Billing","doc":"A BillingClient.FeatureType Play Billing may or may not support on a given device/Play Store version — check with UFirebaseBillingLibrary::IsBillingFeatureSupported before relying on it.","values":[{"n":"Subscriptions","v":"0","doc":"Subscriptions (BillingClient.ProductType.SUBS) at all."},{"n":"SubscriptionsUpdate","v":"1","doc":"Changing an existing subscription's plan (PurchaseProduct's OldSubscriptionPurchaseToken/ReplacementMode params)."},{"n":"InAppMessaging","v":"2","doc":"In-app messaging (e.g. Play's own \"payment declined, update your billing details\" prompts)."},{"n":"PriceChangeConfirmation","v":"3","doc":""},{"n":"BillingConfig","v":"4","doc":""}]},{"id":"EFirebaseProductType","kind":"enum","name":"EFirebaseProductType","module":"Billing","doc":"How a product should be handled once purchased. Google Play Billing itself\nhas no such concept (only \"one-time product\" vs \"subscription\", via\nBillingClient.ProductType.INAPP/SUBS) — Consumable vs NonConsumable is\npurely a decision your own product catalog design makes, so you tell the\nplugin which is which when you call QueryProductDetails/PurchaseProduct.\nThis drives whether a purchase is auto-consumed (Consumable, repurchasable\nagain afterwards) or auto-acknowledged only (NonConsumable/Subscription,\nstays permanently owned).","values":[{"n":"Consumable","doc":""},{"n":"NonConsumable","doc":""},{"n":"Subscription","doc":""}]},{"id":"EFirebasePurchaseState","kind":"enum","name":"EFirebasePurchaseState","module":"Billing","doc":"","values":[{"n":"Purchased","doc":""},{"n":"Pending","doc":""},{"n":"Unspecified","doc":""}]},{"id":"EFirebaseDatabaseError","kind":"enum","name":"EFirebaseDatabaseError","module":"Database","doc":"Mirrors firebase::database::Error. Every raw value from 0 to 14 is a real, defined SDK error.","values":[{"n":"None","v":"0","doc":""},{"n":"Disconnected","v":"1","doc":"The operation had to be aborted due to a network disconnect."},{"n":"ExpiredToken","v":"2","doc":"The supplied auth token has expired."},{"n":"InvalidToken","v":"3","doc":"The specified authentication token is invalid."},{"n":"MaxRetries","v":"4","doc":"The transaction had too many retries."},{"n":"NetworkError","v":"5","doc":"The operation could not be performed due to a network error."},{"n":"OperationFailed","v":"6","doc":"The server indicated that this operation failed."},{"n":"OverriddenBySet","v":"7","doc":"The transaction was overridden by a subsequent set."},{"n":"PermissionDenied","v":"8","doc":"This client does not have permission to perform this operation."},{"n":"Unavailable","v":"9","doc":"The service is unavailable."},{"n":"UnknownError","v":"10","doc":"An unknown error occurred."},{"n":"WriteCanceled","v":"11","doc":"The write was canceled locally."},{"n":"InvalidVariantType","v":"12","doc":"JsonValue passed for a value/priority field parsed to a Variant type the database rejects (e.g. an array/map where only a scalar is allowed for Priority)."},{"n":"ConflictingOperationInProgress","v":"13","doc":"An operation that conflicts with this one is already in progress on the same location (e.g. SetValue and SetValueAndPriority at once)."},{"n":"TransactionAbortedByUser","v":"14","doc":"The transaction was aborted because the transaction function returned kTransactionResultAbort."},{"n":"NotInitialized","v":"100","doc":"Module disabled in Project Settings, or the Firebase App/Database instance isn't available."},{"n":"InvalidArgument","v":"101","doc":"JsonValue (data/priority) passed to a node isn't valid JSON."},{"n":"TransactionTimedOut","v":"102","doc":"RunDatabaseTransaction: the Game Thread didn't get to run the OnAttempt handler in time (e.g. it was stalled on a blocking load), so the attempt was abandoned."},{"n":"UnrecognizedCode","v":"127","doc":"The raw SDK error code wasn't one of the 0-14 values above (shouldn't happen in practice)."}]},{"id":"EFirebaseDatabaseChildEventType","kind":"enum","name":"EFirebaseDatabaseChildEventType","module":"Database","doc":"Which kind of change a Realtime Database child listener is reporting. Mirrors firebase::database::ChildListener's four callbacks.","values":[{"n":"Added","doc":""},{"n":"Changed","doc":""},{"n":"Moved","doc":""},{"n":"Removed","doc":""}]},{"id":"EFirebaseCrashlyticsLogForwarding","kind":"enum","name":"EFirebaseCrashlyticsLogForwarding","module":"Core","doc":"Which of Unreal's own log lines are copied into the Crashlytics log.","values":[{"n":"None","doc":""},{"n":"Errors","doc":""},{"n":"ErrorsAndWarnings","doc":""}]},{"id":"EFirebaseLogLevel","kind":"enum","name":"EFirebaseLogLevel","module":"Core","doc":"Mirrors firebase::LogLevel — verbosity of the Firebase C++ SDK's own internal logging (firebase/log.h), separate from this plugin's own UE_LOG output and the engine's own log verbosity.","values":[{"n":"Verbose","v":"0","doc":""},{"n":"Debug","v":"1","doc":""},{"n":"Info","v":"2","doc":""},{"n":"Warning","v":"3","doc":""},{"n":"Error","v":"4","doc":""},{"n":"Assert","v":"5","doc":""}]},{"id":"EFirebaseBPPlayServicesAvailability","kind":"enum","name":"EFirebaseBPPlayServicesAvailability","module":"Core","doc":"Mirrors google_play_services::Availability — Android-specific, see CheckGooglePlayServicesAvailability.","values":[{"n":"Available","doc":""},{"n":"UnavailableDisabled","doc":""},{"n":"UnavailableInvalid","doc":""},{"n":"UnavailableMissing","doc":""},{"n":"UnavailablePermissions","doc":""},{"n":"UnavailableUpdateRequired","doc":""},{"n":"UnavailableUpdating","doc":""},{"n":"UnavailableOther","doc":""},{"n":"NotApplicable","doc":"Not Android — Google Play services isn't a relevant concept on this platform (reported there instead of Available)."}]},{"id":"EFirebaseFirestoreError","kind":"enum","name":"EFirebaseFirestoreError","module":"Firestore","doc":"Mirrors firebase::firestore::Error (see firebase/firestore/firestore_errors.h).\nValues are kept identical to the SDK's kError* codes.","values":[{"n":"None","v":"0","doc":""},{"n":"Cancelled","v":"1","doc":""},{"n":"Unknown","v":"2","doc":""},{"n":"InvalidArgument","v":"3","doc":""},{"n":"DeadlineExceeded","v":"4","doc":""},{"n":"NotFound","v":"5","doc":""},{"n":"AlreadyExists","v":"6","doc":""},{"n":"PermissionDenied","v":"7","doc":""},{"n":"ResourceExhausted","v":"8","doc":""},{"n":"FailedPrecondition","v":"9","doc":""},{"n":"Aborted","v":"10","doc":""},{"n":"OutOfRange","v":"11","doc":""},{"n":"Unimplemented","v":"12","doc":""},{"n":"Internal","v":"13","doc":""},{"n":"Unavailable","v":"14","doc":""},{"n":"DataLoss","v":"15","doc":""},{"n":"Unauthenticated","v":"16","doc":""},{"n":"NotInitialized","v":"100","doc":""}]},{"id":"EFirebaseFirestoreValueType","kind":"enum","name":"EFirebaseFirestoreValueType","module":"Firestore","doc":"The kind of value currently held by an FFirebaseFirestoreValue.","values":[{"n":"Null","doc":""},{"n":"Bool","doc":""},{"n":"Int","doc":""},{"n":"Double","doc":""},{"n":"String","doc":""},{"n":"Timestamp","doc":""},{"n":"GeoPoint","doc":""},{"n":"Reference","doc":"Path (e.g. \"players/abc123\") of another document in the same database."},{"n":"Array","doc":""},{"n":"Map","doc":""},{"n":"Delete","doc":"Removes this field from the document. Only valid with Update, not Set."},{"n":"ServerTimestamp","doc":"The server's own timestamp at write time — more trustworthy than a client-supplied Timestamp value."},{"n":"ArrayUnion","doc":"Adds elements to the field's array (must already be an array), skipping ones already present."},{"n":"ArrayRemove","doc":"Removes all instances of the given elements from the field's array."},{"n":"IncrementInt","doc":"Atomically adds an integer amount to the field's current value, avoiding a read-then-write race with concurrent writers."},{"n":"IncrementDouble","doc":"Same as IncrementInt, for a floating point amount."},{"n":"Blob","doc":"Raw binary data (firebase::firestore::FieldValue::Blob). Appended here\nrather than next to String/Reference above to keep every existing\nvalue's enum ordinal unchanged (this codebase always appends new\nEFirebaseFirestoreValueType/similar enum values at the end, never\ninserts, for the same Blueprint-compat reason a UFUNCTION's own enum\nparameters only ever grow at the end)."}]},{"id":"EFirebaseFirestoreQueryDirection","kind":"enum","name":"EFirebaseFirestoreQueryDirection","module":"Firestore","doc":"Sort direction for UFirestoreQuery::OrderBy.","values":[{"n":"Ascending","doc":""},{"n":"Descending","doc":""}]},{"id":"EFirebaseFirestoreSource","kind":"enum","name":"EFirebaseFirestoreSource","module":"Firestore","doc":"Mirrors firebase::firestore::Source — configures whether GetDocument/\nGetQueryDocuments fetch from the server (falling back to cache), force a\nserver round-trip, or read the local cache only.","values":[{"n":"Default","doc":"Try the server, falling back to cache if it can't be reached (the SDK's own default behavior)."},{"n":"Server","doc":"Fail rather than silently return stale cached data if the server can't be reached."},{"n":"Cache","doc":"Never contact the server — instant, but may be stale or (for a single document) fail if nothing is cached yet."}]},{"id":"EFirebaseFirestoreServerTimestampBehavior","kind":"enum","name":"EFirebaseFirestoreServerTimestampBehavior","module":"Firestore","doc":"Mirrors firebase::firestore::DocumentSnapshot::ServerTimestampBehavior —\nwhat a field written via MakeFirestoreServerTimestamp() reads back as\nbefore the server has actually confirmed its final value.","values":[{"n":"None","doc":"Null until the server confirms the real value (the SDK's own default)."},{"n":"Estimate","doc":"The local clock's estimate, likely to change slightly once the server value arrives — best for a value you write then immediately display back to the same client."},{"n":"Previous","doc":"The field's previous value (before this pending write), instead of Null or an estimate."}]},{"id":"EFirebaseFirestoreDocumentChangeType","kind":"enum","name":"EFirebaseFirestoreDocumentChangeType","module":"Firestore","doc":"Mirrors firebase::firestore::DocumentChange::Type — what kind of change a DocumentChange in a query snapshot represents.","values":[{"n":"Added","doc":""},{"n":"Modified","doc":""},{"n":"Removed","doc":""}]},{"id":"EFirebaseFirestoreLoadBundleState","kind":"enum","name":"EFirebaseFirestoreLoadBundleState","module":"Firestore","doc":"Mirrors firebase::firestore::LoadBundleTaskProgress::State. kError/kSuccess are final — no further OnProgress update follows either one.","values":[{"n":"InProgress","doc":""},{"n":"Success","doc":""},{"n":"Error","doc":""}]},{"id":"EFirebaseFunctionsError","kind":"enum","name":"EFirebaseFunctionsError","module":"Functions","doc":"Mirrors firebase::functions::Error — the standard gRPC status codes Cloud\nFunctions callables use (https://github.com/googleapis/googleapis/blob/master/google/rpc/code.proto).\nUnlike most other modules' error enums, every raw value from 0 to 16 is\nalready a real, defined SDK error (there's no gap to special-case), so the\ncast below only needs a plain range check.","values":[{"n":"None","v":"0","doc":"Not an error; the call succeeded."},{"n":"Cancelled","v":"1","doc":"The operation was cancelled, typically by the caller."},{"n":"Unknown","v":"2","doc":"Unknown error — e.g. an exception thrown by the function's own handler with no HttpsError code attached."},{"n":"InvalidArgument","v":"3","doc":"The client specified an invalid argument."},{"n":"DeadlineExceeded","v":"4","doc":"Deadline expired before the operation could complete."},{"n":"NotFound","v":"5","doc":"No function found at the requested name/URL."},{"n":"AlreadyExists","v":"6","doc":"The entity a client attempted to create already exists."},{"n":"PermissionDenied","v":"7","doc":"The caller does not have permission to execute the specified operation (e.g. failed App Check / Auth requirement on the function)."},{"n":"ResourceExhausted","v":"8","doc":"Some resource has been exhausted, e.g. a per-user quota."},{"n":"FailedPrecondition","v":"9","doc":"The system is not in a state required for the operation's execution."},{"n":"Aborted","v":"10","doc":"The operation was aborted, typically due to a concurrency issue."},{"n":"OutOfRange","v":"11","doc":"The operation was attempted past the valid range."},{"n":"Unimplemented","v":"12","doc":"The operation is not implemented or is not supported/enabled."},{"n":"Internal","v":"13","doc":"Internal error on the server."},{"n":"Unavailable","v":"14","doc":"The service is currently unavailable — safe to retry with backoff."},{"n":"DataLoss","v":"15","doc":"Unrecoverable data loss or corruption."},{"n":"Unauthenticated","v":"16","doc":"The request does not have valid authentication credentials."},{"n":"NotInitialized","v":"100","doc":"Module disabled in Project Settings, or the Firebase App/Functions instance isn't available."},{"n":"UnrecognizedCode","v":"127","doc":"The raw SDK error code wasn't one of the 0-16 values above (shouldn't happen in practice)."}]},{"id":"EFirebaseInstallationsError","kind":"enum","name":"EFirebaseInstallationsError","module":"Installations","doc":"Mirrors firebase::installations::Error. All SDK values are in [0, 3].\n\nFirebase Installations gives this app install a stable per-install\nidentifier and an auth token for it (distinct from the FCM registration\ntoken exposed by the Messaging module — that token identifies this\ninstall to FCM specifically; GetInstallationsId/GetInstallationsAuthToken\nhere are the general-purpose per-install identity Messaging's token is\nitself built on top of).","values":[{"n":"None","v":"0","doc":""},{"n":"Unknown","v":"1","doc":""},{"n":"NoAccess","v":"2","doc":""},{"n":"InvalidConfiguration","v":"3","doc":""},{"n":"NotInitialized","v":"100","doc":"Module disabled in Project Settings, or the Firebase App/Installations instance isn't available."}]},{"id":"EFirebaseMessagingError","kind":"enum","name":"EFirebaseMessagingError","module":"Messaging","doc":"Mirrors firebase::messaging::Error (see firebase/messaging.h), plus a\nNotInitialized sentinel (outside the SDK's real range) for errors detected\non our side before ever reaching the Messaging SDK (e.g. Messaging disabled\nin Project Settings -> Firebase BP).","values":[{"n":"None","v":"0","doc":""},{"n":"FailedToRegisterForRemoteNotifications","v":"1","doc":""},{"n":"InvalidTopicName","v":"2","doc":""},{"n":"NoRegistrationToken","v":"3","doc":""},{"n":"Unknown","v":"4","doc":""},{"n":"NotInitialized","v":"100","doc":""}]},{"id":"EFirebasePlayGamesError","kind":"enum","name":"EFirebasePlayGamesError","module":"Play Games","doc":"Google Play Games Services error, Android only. No C++ SDK exists for this\nproduct (same as AdMob/Billing) — every operation is a JNI call into Java\nglue using com.google.android.gms.games.*, whose Tasks fail with an\nApiException carrying a raw com.google.android.gms.common.api.CommonStatusCodes\nvalue. Only the codes actually reachable from the operations this module\nexposes are mapped; anything else becomes Unknown.","values":[{"n":"None","v":"0","doc":""},{"n":"SignInRequired","v":"1","doc":"Player is not signed in with Play Games (see the Auth module's Sign In With Play Games)."},{"n":"NetworkError","v":"2","doc":""},{"n":"InternalError","v":"3","doc":""},{"n":"DeveloperError","v":"4","doc":""},{"n":"Canceled","v":"5","doc":""},{"n":"Timeout","v":"6","doc":""},{"n":"SnapshotNotFound","v":"7","doc":"The snapshot (saved game) doesn't exist — e.g. Load Snapshot on a slot that was never saved."},{"n":"FriendsConsentRequired","v":"8","doc":"Friends collection: the player hasn't allowed this game to see their Play Games friends list."},{"n":"SavedGamesDisabled","v":"9","doc":"Saved games: Google Play services reports the Saved Games feature as disabled for this game. Enable \"Saved Games\" in the Play Console (Play Games Services > Configuration > Properties) and publish the configuration."},{"n":"NoData","v":"10","doc":"Google returned no data and has none cached, e.g. Get Play Games Player Stats for a player or game without enough history yet, or no network and nothing cached."},{"n":"NotInitialized","v":"100","doc":"Module (or Auth, which Play Games requires) disabled in Project Settings, or Android SDK/JNI unavailable."},{"n":"AlreadyInProgress","v":"101","doc":"A call of this same kind is already in flight; this one was rejected outright, not attempted and failed. (Submit Score and the achievement writes queue instead of failing with this.)"},{"n":"Unknown","v":"127","doc":""}]},{"id":"EFirebasePlayGamesAchievementState","kind":"enum","name":"EFirebasePlayGamesAchievementState","module":"Play Games","doc":"Which of Achievement's three visibility states an achievement is currently in.","values":[{"n":"Unlocked","doc":""},{"n":"Revealed","doc":""},{"n":"Hidden","doc":""}]},{"id":"EFirebasePlayGamesScoreOrder","kind":"enum","name":"EFirebasePlayGamesScoreOrder","module":"Play Games","doc":"Which way a leaderboard ranks scores, as configured in Play Console.","values":[{"n":"LargerIsBetter","doc":"Highest score first (points, distance...)."},{"n":"SmallerIsBetter","doc":"Lowest score first (lap time, moves...)."}]},{"id":"EFirebasePlayGamesAchievementType","kind":"enum","name":"EFirebasePlayGamesAchievementType","module":"Play Games","doc":"Whether an achievement unlocks in one shot (Standard) or tracks incremental progress toward a target (Incremental, e.g. UnlockAchievement vs IncrementAchievement).","values":[{"n":"Standard","doc":""},{"n":"Incremental","doc":""}]},{"id":"EFirebasePlayGamesLeaderboardTimeSpan","kind":"enum","name":"EFirebasePlayGamesLeaderboardTimeSpan","module":"Play Games","doc":"Which reset window of a leaderboard to read — Play Games keeps a separate\nranking per window. AllTime is first (value 0) on purpose: it's what these\nnodes always used before this pin existed, so an existing Blueprint node\nthat never connects it keeps behaving exactly the same.","values":[{"n":"AllTime","v":"0","doc":""},{"n":"Weekly","v":"1","doc":""},{"n":"Daily","v":"2","doc":""}]},{"id":"EFirebasePlayGamesLeaderboardCollection","kind":"enum","name":"EFirebasePlayGamesLeaderboardCollection","module":"Play Games","doc":"Which set of players a leaderboard read/UI covers. Public (value 0, the\nprevious hard-coded behavior) is everyone; Friends is only the signed-in\nplayer's Play Games friends.","values":[{"n":"Public","v":"0","doc":""},{"n":"Friends","v":"1","doc":""}]},{"id":"EFirebaseRemoteConfigError","kind":"enum","name":"EFirebaseRemoteConfigError","module":"Remote Config","doc":"Remote Config error. Raw SDK code 0 IS \"success\" here\n(firebase::remote_config::kRemoteConfigErrorNone), but the SDK's one\nnegative value (kRemoteConfigErrorUnimplemented = -1) needs its own\nexplicit mapping — a direct cast to this uint8-backed enum would wrap it to\n255, same reasoning as EFirebaseAuthError::Unimplemented.","values":[{"n":"None","v":"0","doc":""},{"n":"ConfigUpdateStreamError","v":"1","doc":""},{"n":"ConfigUpdateMessageInvalid","v":"2","doc":""},{"n":"ConfigUpdateNotFetched","v":"3","doc":""},{"n":"ConfigUpdateUnavailable","v":"4","doc":""},{"n":"Unimplemented","v":"5","doc":""},{"n":"InvalidDefaultValue","v":"6","doc":"Not produced by the native SDK: set by this plugin when SetRemoteConfigDefaultsFromJson or SetRemoteConfigCustomSignals had to skip one or more entries with invalid JSON. The underlying native call itself still succeeded with whichever entries WERE valid — this only signals that the result is incomplete."},{"n":"OperationFailed","v":"7","doc":"A one-shot call (Fetch, Activate, Set Defaults, Custom Signals...) failed — for a fetch: offline, throttled (see Get Remote Config Info's LastFetchFailureReason), or a backend error. The ConfigUpdate* values above only come from the real-time update stream."},{"n":"NotInitialized","v":"100","doc":"Module disabled in Project Settings, or the Firebase App/Remote Config instance isn't available."},{"n":"Unknown","v":"127","doc":""}]},{"id":"EFirebaseRemoteConfigFetchStatus","kind":"enum","name":"EFirebaseRemoteConfigFetchStatus","module":"Remote Config","doc":"Mirrors firebase::remote_config::LastFetchStatus.","values":[{"n":"Success","doc":""},{"n":"Failure","doc":""},{"n":"Pending","doc":""}]},{"id":"EFirebaseRemoteConfigFetchFailureReason","kind":"enum","name":"EFirebaseRemoteConfigFetchFailureReason","module":"Remote Config","doc":"Mirrors firebase::remote_config::FetchFailureReason.","values":[{"n":"Invalid","doc":"The fetch has not yet failed."},{"n":"Throttled","doc":"Throttled by the server — too many fetch requests in too short a time."},{"n":"Error","doc":"Failed for an unknown reason."}]},{"id":"EFirebaseRemoteConfigValueSource","kind":"enum","name":"EFirebaseRemoteConfigValueSource","module":"Remote Config","doc":"Mirrors firebase::remote_config::ValueSource — where a Get*WithInfo call's value actually came from. All SDK values are in [0, 2].","values":[{"n":"StaticValue","v":"0","doc":"Key wasn't found remotely or as a default — a static zero-ish fallback (false/0/0.0/\"\"/empty) was returned."},{"n":"RemoteValue","v":"1","doc":"The value came from the most recently activated fetch."},{"n":"DefaultValue","v":"2","doc":"The value came from SetRemoteConfigDefaults (no remote value was available for this key)."}]},{"id":"EFirebaseStorageError","kind":"enum","name":"EFirebaseStorageError","module":"Storage","doc":"Cloud Storage error. Unlike EFirebaseRemoteConfigError/EFirebaseAuthError,\nfirebase::storage::Error has no negative \"unimplemented\" value to special-\ncase — every raw SDK code is already a small non-negative int, so this maps\n1:1 with no offset.","values":[{"n":"None","v":"0","doc":""},{"n":"Unknown","v":"1","doc":""},{"n":"ObjectNotFound","v":"2","doc":"No object exists at the desired reference."},{"n":"BucketNotFound","v":"3","doc":"No bucket is configured for Cloud Storage."},{"n":"ProjectNotFound","v":"4","doc":"No project is configured for Cloud Storage."},{"n":"QuotaExceeded","v":"5","doc":""},{"n":"Unauthenticated","v":"6","doc":""},{"n":"Unauthorized","v":"7","doc":""},{"n":"RetryLimitExceeded","v":"8","doc":"The maximum time limit on an operation (upload, download, delete, etc.) has been exceeded."},{"n":"NonMatchingChecksum","v":"9","doc":"File on the client does not match the checksum of the file received by the server."},{"n":"DownloadSizeExceeded","v":"10","doc":"Size of the downloaded file exceeds the amount of memory allocated for the download."},{"n":"Cancelled","v":"11","doc":""},{"n":"NotInitialized","v":"100","doc":"Module disabled in Project Settings, or the Firebase App/Storage instance isn't available."},{"n":"InvalidArgument","v":"101","doc":"StoragePath isn't a valid path inside the bucket (e.g. a gs:// or https:// URL — use Convert Storage Url To Path first)."}]},{"id":"EFirebaseAppUpdateAvailability","kind":"enum","name":"EFirebaseAppUpdateAvailability","module":"Store Services","doc":"Whether a newer build of this app is available, mirroring Android's Play\nCore AppUpdateInfo.UpdateAvailability. iOS has no equivalent SDK concept —\nUpdateAvailable/UpdateNotAvailable are inferred there by comparing the\nrunning build's own version against the App Store's current listed\nversion (see FFirebaseAppUpdateInfo::StoreVersionName); UpdateInProgress\nnever occurs on iOS.","values":[{"n":"Unknown","v":"0","doc":""},{"n":"UpdateNotAvailable","v":"1","doc":""},{"n":"UpdateAvailable","v":"2","doc":""},{"n":"UpdateInProgress","v":"3","doc":"Android only: an Immediate update flow was already in progress (e.g. the app was backgrounded mid-update) and needs to be resumed — call StartImmediateAppUpdate again. Never reported on iOS."}]},{"id":"EFirebaseAppUpdateInstallStatus","kind":"enum","name":"EFirebaseAppUpdateInstallStatus","module":"Store Services","doc":"Mirrors Play Core's InstallStatus for a Flexible update — see UFirebaseBPSubsystem::OnAppUpdateStateChanged. Android only; never broadcast on iOS.","values":[{"n":"Unknown","v":"0","doc":""},{"n":"Pending","v":"1","doc":""},{"n":"Downloading","v":"2","doc":""},{"n":"Downloaded","v":"3","doc":"Ready to install — call CompleteFlexibleAppUpdate to prompt the player to restart and finish."},{"n":"Installing","v":"4","doc":""},{"n":"Installed","v":"5","doc":""},{"n":"Failed","v":"6","doc":""},{"n":"Cancelled","v":"7","doc":""},{"n":"RequiresUIIntent","v":"8","doc":"Rare: the OS needs to show its own UI to proceed (e.g. requesting storage permission) — no action needed from Blueprint, the OS handles it."}]},{"id":"EFirebaseAppUpdateError","kind":"enum","name":"EFirebaseAppUpdateError","module":"Store Services","doc":"Error from CheckForAppUpdate/StartImmediateAppUpdate/StartFlexibleAppUpdate.","values":[{"n":"None","v":"0","doc":""},{"n":"NotAvailable","v":"1","doc":"No update is currently available (or, for StartFlexibleAppUpdate on iOS, that flow simply doesn't exist on this platform — use StartImmediateAppUpdate instead)."},{"n":"StoreNotFound","v":"2","doc":"Android: Play Store app unavailable/not signed in. iOS: the App Store lookup or the store page itself couldn't be reached."},{"n":"NetworkError","v":"3","doc":""},{"n":"UserCancelled","v":"4","doc":"The player declined/backed out of the update flow (Android's Immediate/Flexible confirmation dialog only — not reported on iOS, since opening the store page has no equivalent \"decline\" signal)."},{"n":"AlreadyInProgress","v":"5","doc":"Android only: StartImmediateAppUpdate and StartFlexibleAppUpdate share the same underlying request code/callback slot, so one cannot be started while the other is still awaiting its result."},{"n":"UpdateFlowError","v":"6","doc":"Android only: the update flow itself (startUpdateFlowForResult) failed to launch, e.g. a stale AppUpdateInfo or an invalid Activity state — distinct from NetworkError, which is reached/lookup connectivity."},{"n":"NotInitialized","v":"100","doc":"Module disabled in Project Settings, or platform/JNI unavailable."},{"n":"Unknown","v":"127","doc":""}]},{"id":"EFirebaseUMPConsentRequestError","kind":"enum","name":"EFirebaseUMPConsentRequestError","module":"UMP","doc":"Mirrors firebase::ump::ConsentRequestError — the error firebase::ump::ConsentInfo::RequestConsentInfoUpdate()\ncompletes its Future with. All SDK values are in [0, 7].","values":[{"n":"None","v":"0","doc":""},{"n":"InvalidAppId","v":"1","doc":""},{"n":"Network","v":"2","doc":""},{"n":"Internal","v":"3","doc":""},{"n":"Misconfiguration","v":"4","doc":""},{"n":"Unknown","v":"5","doc":""},{"n":"InvalidOperation","v":"6","doc":""},{"n":"OperationInProgress","v":"7","doc":"Another RequestUMPConsentInfoUpdate is already in flight; call GetUMPConsentStatus()/CanRequestAds() once that one completes instead of starting a second one."},{"n":"NotInitialized","v":"100","doc":"Module disabled in Project Settings, or the Firebase App/UMP instance isn't available."}]},{"id":"EFirebaseUMPConsentFormError","kind":"enum","name":"EFirebaseUMPConsentFormError","module":"UMP","doc":"Mirrors firebase::ump::ConsentFormError — the error every consent-form\noperation (LoadAndShowUMPConsentFormIfRequired, ShowUMPPrivacyOptionsForm)\ncompletes its Future with. All SDK values are in [0, 7].","values":[{"n":"None","v":"0","doc":""},{"n":"Timeout","v":"1","doc":""},{"n":"Internal","v":"2","doc":""},{"n":"Unknown","v":"3","doc":""},{"n":"Unavailable","v":"4","doc":"No form is available to show right now (e.g. the user's region/consent state doesn't require one) — not necessarily a real failure, check the doc comment on the node you called."},{"n":"AlreadyUsed","v":"5","doc":"This form was already shown and dismissed once; load/request a fresh one instead of reusing it."},{"n":"InvalidOperation","v":"6","doc":""},{"n":"OperationInProgress","v":"7","doc":"Another form operation is already in flight on this ConsentInfo; wait for it to complete instead of starting a second one."},{"n":"NotInitialized","v":"100","doc":"Module disabled in Project Settings, or the Firebase App/UMP instance isn't available."}]},{"id":"EFirebaseUMPConsentFormStatus","kind":"enum","name":"EFirebaseUMPConsentFormStatus","module":"UMP","doc":"Whether the consent form needs to be displayed. Mirrors\nfirebase::ump::ConsentFormStatus.","values":[{"n":"Unknown","v":"0","doc":"Unknown until RequestUMPConsentInfoUpdate completes."},{"n":"Unavailable","v":"1","doc":""},{"n":"Available","v":"2","doc":""}]},{"id":"EFirebaseUMPPrivacyOptionsRequirementStatus","kind":"enum","name":"EFirebaseUMPPrivacyOptionsRequirementStatus","module":"UMP","doc":"Whether the \"Privacy Options\" re-consent entry point needs to be shown in\nyour own settings UI. Mirrors firebase::ump::PrivacyOptionsRequirementStatus.","values":[{"n":"Unknown","v":"0","doc":"Unknown until RequestUMPConsentInfoUpdate completes."},{"n":"NotRequired","v":"1","doc":""},{"n":"Required","v":"2","doc":""}]},{"id":"EFirebaseUMPConsentDebugGeography","kind":"enum","name":"EFirebaseUMPConsentDebugGeography","module":"UMP","doc":"Forces a specific geographic location for RequestUMPConsentInfoUpdate, for\ntesting on a real device — be sure to also list that device's ID in\nDebugDeviceIds below (debug behavior is always enabled for simulators/the\nEditor without needing that). Mirrors firebase::ump::ConsentDebugGeography.","values":[{"n":"Disabled","v":"0","doc":""},{"n":"EEA","v":"1","doc":"Geography appears as in the EEA (European Economic Area) for debug devices."},{"n":"NonEEA","v":"2","doc":"Geography appears as NOT in the EEA for debug devices."}]}],"settings":[{"n":"bEnableAuth","t":"Boolean","d":"true","cat":"Modules","doc":""},{"n":"bEnableGoogleSignIn","t":"Boolean","d":"true","cat":"Modules","doc":"Native \"Sign in with Google\" on Android (Sign In Provider with\nProvider = Google), through Credential Manager. Uncheck if you don't\nuse it (e.g. email/anonymous-only sign-in) to leave the Credential\nManager + Google ID libraries out of the build.","cond":"bEnableAuth"},{"n":"bEnableAppCheck","t":"Boolean","d":"true","cat":"Modules","doc":"Installs and activates an App Check provider at launch (Play Integrity /\nApp Attest, or the Debug provider) and enables the App Check nodes.\nUnlike the other toggles, turning this off does NOT leave App Check's\nGradle dependencies / CocoaPod out of the build: the native Firebase SDK\ninitializes App Check by itself inside firebase::App::Create(), so the\napp would crash at launch without them. Off just means no provider, so\nrequests carry no valid App Check token (fine unless App Check\nenforcement is turned on in the Firebase Console)."},{"n":"bUseAppCheckDebugProviderInDevelopmentBuilds","t":"Boolean","d":"false","cat":"Modules","doc":"Android, non-Shipping builds only: use App Check's Debug provider\ninstead of Play Integrity, for builds Play Integrity can't attest\n(installed over adb or from a file instead of from Google Play).\nOn first launch the SDK generates a debug secret and prints it to\nlogcat (search for \"debugtokens:create\"; R8 renames the log tag in release builds): register it in the Firebase Console\n(App Check -> your Android app -> Manage debug tokens). Ignored in\nShipping, which always uses Play Integrity.","cond":"bEnableAppCheck"},{"n":"bEnableFirestore","t":"Boolean","d":"true","cat":"Modules","doc":""},{"n":"bEnableAnalytics","t":"Boolean","d":"true","cat":"Modules","doc":""},{"n":"bEnableMessaging","t":"Boolean","d":"true","cat":"Modules","doc":""},{"n":"bSuppressMessagingPermissionPrompt","t":"Boolean","d":"false","cat":"Modules","doc":"iOS/tvOS only (no effect on Android): if true, Messaging does NOT show\nthe system prompt asking the user to allow notifications during\ninitialization — you must then call RequestFCMPermission yourself at a\nbetter UX moment (e.g. after explaining why you want it). If the user\nalready answered that prompt in a past session, this has no effect\neither way (the OS never asks twice).","cond":"bEnableMessaging"},{"n":"FCMNotificationChannelId","t":"String","cat":"Messaging","doc":"Android only: the notification channel FCM posts notification messages\nto while the app is in the background. Created at launch with\nFCMNotificationChannelName. Leave empty to keep FCM's own fallback\nchannel (\"Misc\").","cond":"bEnableMessaging"},{"n":"FCMNotificationChannelName","t":"String","d":"TEXT(\"Notifications\")","cat":"Messaging","doc":"Android only: the channel name players see in the app's notification settings. Used only when FCMNotificationChannelId is set.","cond":"bEnableMessaging"},{"n":"FCMNotificationIconPath","t":"String","cat":"Messaging","doc":"Android only: small icon for background notifications, as a path to a\nPNG relative to the project folder (e.g. Build/Android/notification_icon.png).\nAndroid shows it as a white silhouette, so use a white shape on a\ntransparent background. Leave empty to use the app icon.","cond":"bEnableMessaging"},{"n":"FCMNotificationColor","t":"String","cat":"Messaging","doc":"Android only: accent color of background notifications as #RRGGBB (e.g. #F5A623). Leave empty for the system default.","cond":"bEnableMessaging"},{"n":"bEnableCrashlytics","t":"Boolean","d":"true","cat":"Modules","doc":"Automatic native crash reporting is wired up via Gradle/CocoaPods regardless of Blueprint use. Android-only Blueprint nodes (Log/SetCustomKey/SetUserId) require this too."},{"n":"bUploadCrashlyticsNativeSymbols","t":"Boolean","d":"false","cat":"Modules","doc":"Android release builds (packaged with -distribution) only: upload the\ngame's native debug symbols to Crashlytics after the AAB/APK is built,\nso native C++ crash stacks show function names instead of raw\naddresses. Needs network access while packaging, adds a few minutes\nfor a large game, and the package fails if the upload fails.","cond":"bEnableCrashlytics"},{"n":"ForwardLogToCrashlytics","t":"EFirebaseCrashlyticsLogForwarding","d":"EFirebaseCrashlyticsLogForwarding::None","cat":"Modules","doc":"Android/iOS: copy Unreal's own log lines of this severity or worse into\nthe Crashlytics log (the breadcrumbs shown with each crash report), so a\ncrash comes with the errors that led to it. None (the default) forwards\nnothing. Errors only is the sensible choice for most games; with\nwarnings too, a chatty project pays a native call per line.","cond":"bEnableCrashlytics"},{"n":"bRecordEnsuresInCrashlytics","t":"Boolean","d":"false","cat":"Modules","doc":"Android/iOS: report every failed ensure() (and ensureMsgf) to\nCrashlytics as a non-fatal error, grouped by its message — bugs that\ndon't crash but shouldn't happen, visible in the console. Each one is\nreported once per run (UE itself only fires an ensure once). Ensures are\ncompiled out of Shipping builds unless the target sets\nbUseChecksInShipping, so this mostly serves Development / test builds.","cond":"bEnableCrashlytics"},{"n":"bEnableAdMob","t":"Boolean","d":"true","cat":"AdMob","doc":"Android only for now."},{"n":"AdMobAndroidAppId","t":"String","d":"TEXT(\"ca-app-pub-3940256099942544~3347511713\")","cat":"AdMob","doc":"From the AdMob console (Apps -> App settings -> App ID), format\n\"ca-app-pub-XXXXXXXXXXXXXXXX~YYYYYYYYYY\". Required if Enable AdMob is\nchecked: without it, the Google Mobile Ads SDK fails to initialize and\nevery ad load fails immediately.\n\nDefaults to Google's own public sample App ID, paired with the sample\nAd Unit IDs already defaulted on LoadInterstitialAd/LoadRewardedAd/\nLoadAppOpenAd — so a fresh install of this plugin shows real Test Ads\nout of the box, with zero AdMob account setup required. Replace with\nyour own App ID (and your own Ad Unit IDs at each call site) before\nshipping — Google's sample IDs must never reach production.\n\nDeliberately its own field, not the \"AdMob App ID\" in Project Settings\n-> Platforms -> Android -> Google Play Services: that one is greyed out\nunless its own \"Include AdMob support for ads\" is checked, which is an\nunrelated, legacy Epic ad module (AndroidAdvertising) — not what this\nplugin uses, and not something a FirebaseBP user should have to know\nabout just to set an App ID.\n\nAlso needed by UMP (consent forms), even with AdMob off.","cond":"bEnableAdMob || bEnableUMP"},{"n":"AdMobTestDeviceIds","t":"String","cat":"AdMob","doc":"Comma-separated hashed device IDs (e.g. \"ADA8DF0BC36CFB0290E6885E1D8A1651\")\nthat should receive clearly-labeled Test Ads instead of live ads on your\nreal Ad Unit IDs — safe to click/watch without violating AdMob policy or\nskewing your own stats. Registering a device through the AdMob app\n(Advertising ID + a debug gesture) only unlocks the on-device Ad\nInspector; it does NOT do this. Get your device's exact ID from Logcat\n(filter on the \"Ads\" tag) after its first ad request: \"Use\nRequestConfiguration.Builder().setTestDeviceIds(Arrays.asList(\"....\"))\nto get test ads on this device.\"","cond":"bEnableAdMob"},{"n":"bEnableBilling","t":"Boolean","d":"true","cat":"Billing","doc":"Google Play Billing (in-app purchases and subscriptions). Android only —\nthis is a Google Play service, not a Firebase product, but grouped here\nfor the same \"toggle to shrink the AAB\" reason as AdMob. Needs your\napp's real product/subscription IDs set up in Play Console; there is no\nApp ID to configure here (unlike AdMob) since Billing reads your app's\nown package name and signing to find its Play Console product catalog."},{"n":"bAutoConsumeConsumables","t":"Boolean","d":"true","cat":"Billing","doc":"Consume Consumable purchases automatically as soon as Google Play\nreports them (the default), before your game has granted the item. If\nthe app is killed between that consume and your grant (or your grant\ngoes through a server call that fails), the purchase is gone for good:\na consumed purchase is never reported again.\n\nUncheck to consume them yourself instead: grant the item from\nOnPurchasesUpdated / PurchaseProduct's result, THEN call Consume\nPurchase with its PurchaseToken. Until then the purchase keeps being\nreported (every RestorePurchases, and whenever Billing connects or the\napp returns to the foreground), so make your grant\nidempotent per PurchaseToken. Google refunds a purchase left neither\nconsumed nor acknowledged for 3 days. Non-consumables and\nsubscriptions are still acknowledged automatically either way.","cond":"bEnableBilling"},{"n":"bEnableRemoteConfig","t":"Boolean","d":"true","cat":"Modules","doc":""},{"n":"bEnableFunctions","t":"Boolean","d":"true","cat":"Modules","doc":"Cloud Functions (calling HTTPS Callable functions you deploy — server-side logic, purchase verification, anti-cheat, ...)."},{"n":"bEnableDatabase","t":"Boolean","d":"true","cat":"Modules","doc":"Realtime Database (low-latency JSON tree — presence, chat, live leaderboards; Firestore is usually the better default for everything else)."},{"n":"bEnablePlayGames","t":"Boolean","d":"true","cat":"PlayGames","doc":"Google Play Games Services: Play Games Sign-In (Sign In Provider with\nProvider = PlayGames) plus leaderboards, achievements, saved games and\nplayer info. Android only — same \"Google Play service, not Firebase\"\ngrouping as Billing. Requires Enable Auth. Unchecking it also leaves the\nPlay Games Services library out of the build.","cond":"bEnableAuth"},{"n":"bEnableStorage","t":"Boolean","d":"true","cat":"Modules","doc":"Cloud Storage (file upload/download — avatars, screenshots, downloadable\ncontent). Note: as of late 2024 Google requires the Firebase project\nitself to be on the Blaze (pay-as-you-go) plan to use Storage at all —\nthis toggle alone won't help if the project is still on Spark."},{"n":"bEnableInstallations","t":"Boolean","d":"true","cat":"Modules","doc":"Firebase Installations (the per-install identity every other Firebase\nproduct — including Messaging's own FCM registration token — is built\non top of). Leave this on unless you have a specific reason to disable\nit; several other modules degrade if it's off."},{"n":"bEnableUMP","t":"Boolean","d":"true","cat":"Modules","doc":"User Messaging Platform (UMP) — Google's GDPR/CCPA consent flow.\nCross-platform (Android/iOS/Windows) via firebase::ump::ConsentInfo.\nAdMob's own consent convenience nodes (RequestConsentInfoUpdate /\nShowPrivacyOptionsForm / CanRequestAds / IsPrivacyOptionsRequired) read\nthis same module, so turning it off disables those too even if\nEnable AdMob is on."},{"n":"bEnableStoreServices","t":"Boolean","d":"true","cat":"StoreServices","doc":"App store integration: in-app review (RequestAppReview) and in-app\nupdate (CheckForAppUpdate/StartImmediateAppUpdate/StartFlexibleAppUpdate).\nAndroid via Google Play Core (review + app-update libraries); iOS via\nStoreKit (review) and an App Store version lookup (update) — neither is\na Firebase product, grouped here for the same \"toggle to shrink the\nbuild\" reason as AdMob/Billing/PlayGames."},{"n":"bDataCollectionEnabledAtLaunch","t":"Boolean","d":"true","cat":"Privacy","doc":"Firebase's global automatic data collection switch, on from the first\nlaunch. Uncheck to start with it off (firebase_data_collection_default_enabled=false /\nFirebaseDataCollectionDefaultEnabled=NO), then call Set Firebase Data\nCollection Enabled(true) once the player consents. Products with their\nown switch (Analytics, Crashlytics, FCM auto-init) follow theirs below."},{"n":"bAnalyticsCollectionEnabledAtLaunch","t":"Boolean","d":"true","cat":"Privacy","doc":"Analytics collects from the first launch. Uncheck to start with collection off (firebase_analytics_collection_enabled=false).","cond":"bEnableAnalytics"},{"n":"bCrashlyticsCollectionEnabledAtLaunch","t":"Boolean","d":"true","cat":"Privacy","doc":"Crashlytics sends reports from the first launch. Uncheck to hold them until Set Crashlytics Collection Enabled(true) (firebase_crashlytics_collection_enabled=false).","cond":"bEnableCrashlytics"},{"n":"bFCMAutoInitAtLaunch","t":"Boolean","d":"true","cat":"Privacy","doc":"FCM registers this install (generates its token) on the first launch. Uncheck to wait for Set FCM Auto Init Enabled(true) (firebase_messaging_auto_init_enabled=false).","cond":"bEnableMessaging"},{"n":"bConsentAnalyticsStorageGrantedByDefault","t":"Boolean","d":"true","cat":"Privacy","doc":"Google Consent Mode v2 defaults for Analytics (and the ads it links\nto), until Set Consent overrides them at runtime. Uncheck a signal to\nmake it DENIED by default — typically all four for EEA/UK players until\nyour consent flow (e.g. UMP) says otherwise.","cond":"bEnableAnalytics"},{"n":"bConsentAdStorageGrantedByDefault","t":"Boolean","d":"true","cat":"Privacy","doc":"","cond":"bEnableAnalytics"},{"n":"bConsentAdUserDataGrantedByDefault","t":"Boolean","d":"true","cat":"Privacy","doc":"","cond":"bEnableAnalytics"},{"n":"bConsentAdPersonalizationGrantedByDefault","t":"Boolean","d":"true","cat":"Privacy","doc":"","cond":"bEnableAnalytics"}],"guide":{"Core":{"mono":"Co","hue":28,"tagline":"Startup, SDK logging, app info and the Google Play services check every Android game needs.","topics":[],"recipe":{"title":"Fix Google Play services, then start Firebase","steps":[{"id":"UMakeGooglePlayServicesAvailableProxy_MakeGooglePlayServicesAvailable","via":"OnSuccess"},{"id":"UFirebaseBPSubsystem_InitializeFirebase","via":""}]}},"Auth":{"mono":"Au","hue":210,"tagline":"Sign players in (guest, email, Google, Apple, Play Games, phone…) and manage their account.","topics":["Re-authentication","Linking","Sign in","Tokens","Settings","Account"],"recipe":{"title":"Start as a guest, keep the progress when they register","steps":[{"id":"USignInAnonymouslyProxy_SignInAnonymously","via":"OnSignedIn"},{"id":"ULinkWithEmailProxy_LinkWithEmailAndPassword","via":""}]}},"Firestore":{"mono":"Fs","hue":40,"tagline":"Cloud document database: read, write, query and listen to documents in real time.",
