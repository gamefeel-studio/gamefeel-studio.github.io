n":"Level","t":"EFirebaseLogLevel","k":"enum","c":"","r":"EFirebaseLogLevel","adv":false}],"outputs":[],"exec":[],"topic":"Settings and connection"},{"id":"UFirebaseDatabaseLibrary_GetDatabaseLogLevel","title":"Get Database Log Level","fn":"GetDatabaseLogLevel","owner":"UFirebaseDatabaseLibrary","kind":"pure","module":"Database","group":"","platform":"","doc":"The Database-specific log level currently in effect — see SetDatabaseLogLevel. Defaults to EFirebaseLogLevel::Info if never set, or if Database isn't available.","inputs":[],"outputs":[{"n":"Return Value","t":"EFirebaseLogLevel","k":"enum","c":"","r":"EFirebaseLogLevel"}],"exec":[],"topic":"Settings and connection"},{"id":"UFirebaseDatabaseLibrary_GetDatabaseUrl","title":"Get Database Url","fn":"GetDatabaseUrl","owner":"UFirebaseDatabaseLibrary","kind":"pure","module":"Database","group":"","platform":"","doc":"The Realtime Database URL this app is configured to use (e.g. \"https://my-project-default-rtdb.firebaseio.com/\") — its own default URL, or whatever UseDatabaseUrl last pointed at. Empty if Database isn't available.","inputs":[],"outputs":[{"n":"Return Value","t":"String","k":"string","c":"","r":""}],"exec":[],"topic":"Settings and connection"},{"id":"UGetDatabaseValueProxy_GetDatabaseValue","title":"Get Database Value","fn":"GetDatabaseValue","owner":"UGetDatabaseValueProxy","kind":"async","module":"Database","group":"","platform":"","doc":"Gets the value at Reference or Query. bExists is false (and JsonValue empty) if there's no data at that location.","inputs":[{"n":"Reference","t":"FirebaseDatabaseReference","k":"object","c":"","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseDatabaseError","k":"enum","c":"","r":"EFirebaseDatabaseError"},{"n":"bExists","t":"Boolean","k":"bool","c":"","r":""},{"n":"JsonValue","t":"String","k":"string","c":"","r":""},{"n":"JsonPriority","t":"String","k":"string","c":"","r":""}],"exec":["OnSuccess","OnError","OnResultWithPriority"],"topic":"Read and write"},{"id":"UGetDatabaseValueProxy_GetDatabaseQueryValue","title":"Get Database Query Value","fn":"GetDatabaseQueryValue","owner":"UGetDatabaseValueProxy","kind":"async","module":"Database","group":"Query","platform":"","doc":"","inputs":[{"n":"Query","t":"FirebaseDatabaseQuery","k":"object","c":"","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseDatabaseError","k":"enum","c":"","r":"EFirebaseDatabaseError"},{"n":"bExists","t":"Boolean","k":"bool","c":"","r":""},{"n":"JsonValue","t":"String","k":"string","c":"","r":""},{"n":"JsonPriority","t":"String","k":"string","c":"","r":""}],"exec":["OnSuccess","OnError","OnResultWithPriority"],"topic":"Queries"},{"id":"USetDatabaseValueProxy_SetDatabaseValue","title":"Set Database Value","fn":"SetDatabaseValue","owner":"USetDatabaseValueProxy","kind":"async","module":"Database","group":"","platform":"","doc":"Sets the value at Reference. See FirebaseBPVariantJson.h for the JSON \u003c-> Variant mapping (Null deletes the location).","inputs":[{"n":"Reference","t":"FirebaseDatabaseReference","k":"object","c":"","r":"","adv":false},{"n":"JsonValue","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseDatabaseError","k":"enum","c":"","r":"EFirebaseDatabaseError"}],"exec":["OnSuccess","OnError"],"topic":"Read and write"},{"id":"USetDatabaseValueAndPriorityProxy_SetDatabaseValueAndPriority","title":"Set Database Value And Priority","fn":"SetDatabaseValueAndPriority","owner":"USetDatabaseValueAndPriorityProxy","kind":"async","module":"Database","group":"","platform":"","doc":"Sets both the value and priority at Reference in one call.","inputs":[{"n":"Reference","t":"FirebaseDatabaseReference","k":"object","c":"","r":"","adv":false},{"n":"JsonValue","t":"String","k":"string","c":"","r":"","adv":false},{"n":"JsonPriority","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseDatabaseError","k":"enum","c":"","r":"EFirebaseDatabaseError"}],"exec":["OnSuccess","OnError"],"topic":"Read and write"},{"id":"USetDatabasePriorityProxy_SetDatabasePriority","title":"Set Database Priority","fn":"SetDatabasePriority","owner":"USetDatabasePriorityProxy","kind":"async","module":"Database","group":"","platform":"","doc":"Sets only the priority at Reference — see DatabaseReference::SetPriority's doc comment (native SDK) for how priority affects sibling ordering. JsonPriority must parse to Null, Int64, Double, or String.","inputs":[{"n":"Reference","t":"FirebaseDatabaseReference","k":"object","c":"","r":"","adv":false},{"n":"JsonPriority","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseDatabaseError","k":"enum","c":"","r":"EFirebaseDatabaseError"}],"exec":["OnSuccess","OnError"],"topic":"Read and write"},{"id":"UUpdateDatabaseChildrenProxy_UpdateDatabaseChildren","title":"Update Database Children","fn":"UpdateDatabaseChildren","owner":"UUpdateDatabaseChildrenProxy","kind":"async","module":"Database","group":"","platform":"","doc":"Updates just the given child keys of Reference to the given values (JsonValues must be a JSON object). A value of JSON null deletes that child; other children are left untouched.","inputs":[{"n":"Reference","t":"FirebaseDatabaseReference","k":"object","c":"","r":"","adv":false},{"n":"JsonValues","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseDatabaseError","k":"enum","c":"","r":"EFirebaseDatabaseError"}],"exec":["OnSuccess","OnError"],"topic":"Read and write"},{"id":"URemoveDatabaseValueProxy_RemoveDatabaseValue","title":"Remove Database Value","fn":"RemoveDatabaseValue","owner":"URemoveDatabaseValueProxy","kind":"async","module":"Database","group":"","platform":"","doc":"Removes the value at Reference (equivalent to SetDatabaseValue with a JSON null).","inputs":[{"n":"Reference","t":"FirebaseDatabaseReference","k":"object","c":"","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseDatabaseError","k":"enum","c":"","r":"EFirebaseDatabaseError"}],"exec":["OnSuccess","OnError"],"topic":"Read and write"},{"id":"UDatabaseTransactionContext_GetValue","title":"Get Value","fn":"GetValue","owner":"UDatabaseTransactionContext","kind":"call","module":"Database","group":"Transaction","platform":"","doc":"Reads this location's current value for this attempt, as JSON — bExists is false (JsonValue empty) if nothing is there yet.","inputs":[{"n":"Target","t":"DatabaseTransactionContext","k":"object","c":"","r":"","target":true}],"outputs":[{"n":"bExists","t":"Boolean","k":"bool","c":"","r":""},{"n":"JsonValue","t":"String","k":"string","c":"","r":""}],"exec":[],"topic":"Transactions"},{"id":"UDatabaseTransactionContext_SetValue","title":"Set Value","fn":"SetValue","owner":"UDatabaseTransactionContext","kind":"call","module":"Database","group":"Transaction","platform":"","doc":"Sets the new value for this location, applied only if/when this attempt commits successfully. A JSON null deletes it.","inputs":[{"n":"Target","t":"DatabaseTransactionContext","k":"object","c":"","r":"","target":true},{"n":"JsonValue","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[],"exec":[],"topic":"Transactions"},{"id":"UDatabaseTransactionContext_SetPriority","title":"Set Priority","fn":"SetPriority","owner":"UDatabaseTransactionContext","kind":"call","module":"Database","group":"Transaction","platform":"","doc":"Sets the new priority for this location — see DatabaseReference::SetPriority's doc comment (native SDK) for how priority affects sibling ordering. JsonPriority must parse to Null, Int64, Double, or String.","inputs":[{"n":"Target","t":"DatabaseTransactionContext","k":"object","c":"","r":"","target":true},{"n":"JsonPriority","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[],"exec":[],"topic":"Transactions"},{"id":"UDatabaseTransactionContext_GetChildValue","title":"Get Child Value","fn":"GetChildValue","owner":"UDatabaseTransactionContext","kind":"call","module":"Database","group":"Transaction","platform":"","doc":"Same as GetValue, but for a single child of this location (ChildPath is\nrelative, e.g. \"stats/wins\") — reads just that node instead of the\nwhole subtree, so a transaction on a large object only needs to touch\nthe field it actually depends on. bExists is false (JsonValue empty) if\nthat child has no data yet. ChildPath must not be empty.","inputs":[{"n":"Target","t":"DatabaseTransactionContext","k":"object","c":"","r":"","target":true},{"n":"ChildPath","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"bExists","t":"Boolean","k":"bool","c":"","r":""},{"n":"JsonValue","t":"String","k":"string","c":"","r":""}],"exec":[],"topic":"Transactions"},{"id":"UDatabaseTransactionContext_SetChildValue","title":"Set Child Value","fn":"SetChildValue","owner":"UDatabaseTransactionContext","kind":"call","module":"Database","group":"Transaction","platform":"","doc":"Same as SetValue, but for a single child of this location (ChildPath is\nrelative, e.g. \"stats/wins\") — leaves every other child untouched\ninstead of replacing the whole value. Applied only if/when this attempt\ncommits successfully. A JSON null deletes just that child. ChildPath\nmust not be empty.","inputs":[{"n":"Target","t":"DatabaseTransactionContext","k":"object","c":"","r":"","target":true},{"n":"ChildPath","t":"String","k":"string","c":"","r":"","adv":false},{"n":"JsonValue","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[],"exec":[],"topic":"Transactions"},{"id":"UDatabaseTransactionContext_HasChild","title":"Has Child","fn":"HasChild","owner":"UDatabaseTransactionContext","kind":"pure","module":"Database","group":"Transaction","platform":"","doc":"True if this location has data at ChildPath (relative, e.g. \"stats/wins\") in this attempt's current view — cheaper than GetChildValue when you only need existence.","inputs":[{"n":"Target","t":"DatabaseTransactionContext","k":"object","c":"","r":"","target":true},{"n":"ChildPath","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"Boolean","k":"bool","c":"","r":""}],"exec":[],"topic":"Transactions"},{"id":"UDatabaseTransactionContext_AbortTransaction","title":"Abort Transaction","fn":"AbortTransaction","owner":"UDatabaseTransactionContext","kind":"call","module":"Database","group":"Transaction","platform":"","doc":"Deliberately aborts this transaction attempt instead of committing any\nSetValue/SetPriority staged on it — e.g. after GetValue shows a balance\ntoo low for the transfer this transaction was meant to perform. The\nwhole RunDatabaseTransaction call fails with\nEFirebaseDatabaseError::TransactionAbortedByUser and the location's\nvalue is left unchanged; unlike a real write conflict, this is NOT\nretried.\n\nCareful: the FIRST attempt often runs on the local cache, before the\nserver value is known — GetValue then reports bExists = false even for\na location that has data. Aborting on \"no value\" at that point would\nabort forever; treat \"doesn't exist\" as \"unknown yet\" and write what\nyou would for an empty location (the SDK re-runs the attempt with the\nreal value if the server disagrees).","inputs":[{"n":"Target","t":"DatabaseTransactionContext","k":"object","c":"","r":"","target":true}],"outputs":[],"exec":[],"topic":"Transactions"},{"id":"UDatabaseTransactionContext_IsValid","title":"Is Valid","fn":"IsValid","owner":"UDatabaseTransactionContext","kind":"pure","module":"Database","group":"Transaction","platform":"","doc":"False once this attempt's OnAttempt call has already returned — see the class comment.","inputs":[{"n":"Target","t":"DatabaseTransactionContext","k":"object","c":"","r":"","target":true}],"outputs":[{"n":"Return Value","t":"Boolean","k":"bool","c":"","r":""}],"exec":[],"topic":"Transactions"},{"id":"URunDatabaseTransactionProxy_RunDatabaseTransaction","title":"Run Database Transaction","fn":"RunDatabaseTransaction","owner":"URunDatabaseTransactionProxy","kind":"async","module":"Database","group":"Transaction","platform":"","doc":"Runs a Realtime Database transaction at Reference's location: OnAttempt is\nbroadcast once per attempt (usually once, but the SDK may retry\nautomatically if another client wrote to this location first) with a\nContext to synchronously GetValue/SetValue/SetPriority through — see\nUDatabaseTransactionContext's own class comment for the synchronous-only\nconstraint this relies on. OnSuccess/OnError report the outcome of the\ntransaction as a whole (with the final committed value/existence, or the\nunchanged old value on failure), once every attempt is done.\n\nThe only safe way to do an atomic read-modify-write against a Realtime\nDatabase location (a counter, currency, a \"join if there's a free slot\"\ncheck, ...) — a plain SetDatabaseValue after a separate GetDatabaseValue\nhas no protection against another client writing in between.\n\nbTriggerLocalEvents: whether local listeners on this location see events for each intermediate attempt (true, the SDK's own default) or only the final committed state (false).","inputs":[{"n":"Reference","t":"FirebaseDatabaseReference","k":"object","c":"","r":"","adv":false},{"n":"bTriggerLocalEvents","t":"Boolean","k":"bool","c":"","r":"","d":"true","adv":true}],"outputs":[{"n":"Context","t":"DatabaseTransactionContext","k":"object","c":"","r":""},{"n":"Error","t":"EFirebaseDatabaseError","k":"enum","c":"","r":"EFirebaseDatabaseError"},{"n":"bExists","t":"Boolean","k":"bool","c":"","r":""},{"n":"JsonValue","t":"String","k":"string","c":"","r":""}],"exec":["OnAttempt","OnSuccess","OnError"],"topic":"Transactions"},{"id":"UFirebaseBPSubsystem_InitializeFirebase","title":"Initialize Firebase","fn":"InitializeFirebase","owner":"UFirebaseBPSubsystem","kind":"call","module":"Core","group":"","platform":"","doc":"","inputs":[{"n":"Target","t":"FirebaseBPSubsystem","k":"object","c":"","r":"","target":true}],"outputs":[],"exec":[],"topic":""},{"id":"UFirebaseBPSubsystem_IsFirebaseInitialized","title":"Is Firebase Initialized","fn":"IsFirebaseInitialized","owner":"UFirebaseBPSubsystem","kind":"pure","module":"Core","group":"","platform":"","doc":"","inputs":[{"n":"Target","t":"FirebaseBPSubsystem","k":"object","c":"","r":"","target":true}],"outputs":[{"n":"Return Value","t":"Boolean","k":"bool","c":"","r":""}],"exec":[],"topic":""},{"id":"UFirebaseBPSubsystem_GetLastKnownFCMToken","title":"Get Last Known FCMToken","fn":"GetLastKnownFCMToken","owner":"UFirebaseBPSubsystem","kind":"pure","module":"Messaging","group":"","platform":"","doc":"The most recent FCM registration Installation ID received via OnFCMTokenReceived, or empty if none has arrived yet. Synchronous — prefer this over Get FCM Token for anything that doesn't specifically need a guaranteed-fresh registration from the server.","inputs":[{"n":"Target","t":"FirebaseBPSubsystem","k":"object","c":"","r":"","target":true}],"outputs":[{"n":"Return Value","t":"String","k":"string","c":"","r":""}],"exec":[],"topic":"Token"},{"id":"UFirebaseBPSubsystem_GetLastOpenedFCMMessage","title":"Get Last Opened FCMMessage","fn":"GetLastOpenedFCMMessage","owner":"UFirebaseBPSubsystem","kind":"pure","module":"Messaging","group":"","platform":"","doc":"The most recent FCM message the player opened by TAPPING its\nnotification (bNotificationOpened), if any — kept so a message that\nlaunched or resumed the app isn't lost when it arrives before your\nBlueprint had a chance to bind OnFCMMessageReceived (splash screen,\nlevel load...). Typical use: check it once your main menu is up and\nroute the player to wherever the notification was about, then call\nClearLastOpenedFCMMessage so it isn't handled twice.","inputs":[{"n":"Target","t":"FirebaseBPSubsystem","k":"object","c":"","r":"","target":true}],"outputs":[{"n":"Message","t":"FirebaseCloudMessage","k":"struct","c":"","r":"FFirebaseCloudMessage"},{"n":"Return Value","t":"Boolean","k":"bool","c":"","r":""}],"exec":[],"topic":"Notifications"},{"id":"UFirebaseBPSubsystem_ClearLastOpenedFCMMessage","title":"Clear Last Opened FCMMessage","fn":"ClearLastOpenedFCMMessage","owner":"UFirebaseBPSubsystem","kind":"call","module":"Messaging","group":"","platform":"","doc":"","inputs":[{"n":"Target","t":"FirebaseBPSubsystem","k":"object","c":"","r":"","target":true}],"outputs":[],"exec":[],"topic":"Notifications"},{"id":"UFirebaseBPSubsystem_SetFirebaseLogLevel","title":"Set Firebase Log Level","fn":"SetFirebaseLogLevel","owner":"UFirebaseBPSubsystem","kind":"call","module":"Core","group":"","platform":"","doc":"Sets how verbose the underlying Firebase C++ SDK's own internal logging\nis — kLogLevelInfo by default. Lower it to Debug/Verbose to see the\nSDK's own internal diagnostic output (network calls, cache behavior,\ntoken refreshes, ...) while troubleshooting; raise it to Warning/Error/\nAssert to quiet it down for a release build. Takes effect immediately,\nand can be called at any time (before or after InitializeFirebase).","inputs":[{"n":"Target","t":"FirebaseBPSubsystem","k":"object","c":"","r":"","target":true},{"n":"Level","t":"EFirebaseLogLevel","k":"enum","c":"","r":"EFirebaseLogLevel","adv":false}],"outputs":[],"exec":[],"topic":""},{"id":"UFirebaseBPSubsystem_GetFirebaseLogLevel","title":"Get Firebase Log Level","fn":"GetFirebaseLogLevel","owner":"UFirebaseBPSubsystem","kind":"pure","module":"Core","group":"","platform":"","doc":"The Firebase C++ SDK's own current internal log verbosity — see SetFirebaseLogLevel.","inputs":[{"n":"Target","t":"FirebaseBPSubsystem","k":"object","c":"","r":"","target":true}],"outputs":[{"n":"Return Value","t":"EFirebaseLogLevel","k":"enum","c":"","r":"EFirebaseLogLevel"}],"exec":[],"topic":""},{"id":"UFirebaseBPSubsystem_GetFirebaseAppInfo","title":"Get Firebase App Info","fn":"GetFirebaseAppInfo","owner":"UFirebaseBPSubsystem","kind":"pure","module":"Core","group":"","platform":"","doc":"The AppOptions (project id, API key, bucket, ...) this running build's Firebase App was configured with — see FFirebaseBPAppInfo's own doc comment.","inputs":[],"outputs":[{"n":"Return Value","t":"FirebaseBPAppInfo","k":"struct","c":"","r":"FFirebaseBPAppInfo"}],"exec":[],"topic":""},{"id":"UFirebaseBPSubsystem_CheckGooglePlayServicesAvailability","title":"Check Google Play Services Availability","fn":"CheckGooglePlayServicesAvailability","owner":"UFirebaseBPSubsystem","kind":"pure","module":"Core","group":"","platform":"","doc":"Whether Google Play services (required on Android for every Firebase\nmodule except a handful of JNI-only ones) is available and up to date\non this device — check this if InitializeFirebase's OnInitCompleted (or\nany module call) fails with a suspicious/unexplained error on Android.\nNotApplicable on every other platform (nothing to check there).","inputs":[],"outputs":[{"n":"Return Value","t":"EFirebaseBPPlayServicesAvailability","k":"enum","c":"","r":"EFirebaseBPPlayServicesAvailability"}],"exec":[],"topic":""},{"id":"UFirebaseBPSubsystem_SetFirebaseDataCollectionEnabled","title":"Set Firebase Data Collection Enabled","fn":"SetFirebaseDataCollectionEnabled","owner":"UFirebaseBPSubsystem","kind":"call","module":"Core","group":"","platform":"Mobile","doc":"Firebase's global automatic data collection switch (FirebaseApp\nsetDataCollectionDefaultEnabled). Turn it on once the player consents\nwhen \"Data Collection Enabled At Launch\" is unchecked in Project\nSettings -> Firebase BP -> Privacy. Persisted on the device across\nlaunches. Products with their own switch (Analytics, Crashlytics, FCM\nauto-init) still follow theirs. Android and iOS only; no-op elsewhere.","inputs":[{"n":"bEnabled","t":"Boolean","k":"bool","c":"","r":"","adv":false}],"outputs":[],"exec":[],"topic":""},{"id":"UFirebaseBPSubsystem_IsFirebaseDataCollectionEnabled","title":"Is Firebase Data Collection Enabled","fn":"IsFirebaseDataCollectionEnabled","owner":"UFirebaseBPSubsystem","kind":"pure","module":"Core","group":"","platform":"","doc":"Whether Firebase's global automatic data collection is on — see SetFirebaseDataCollectionEnabled. Always true on platforms other than Android and iOS.","inputs":[],"outputs":[{"n":"Return Value","t":"Boolean","k":"bool","c":"","r":""}],"exec":[],"topic":""},{"id":"UMakeGooglePlayServicesAvailableProxy_MakeGooglePlayServicesAvailable","title":"Make Google Play Services Available","fn":"MakeGooglePlayServicesAvailable","owner":"UMakeGooglePlayServicesAvailableProxy","kind":"async","module":"Core","group":"","platform":"Android","doc":"Attempts to fix Google Play services on this device (install/update/enable/\nactivate it, prompting the user as needed) — call this after\nCheckGooglePlayServicesAvailability() reports anything other than\nAvailable, then retry InitializeFirebase once this succeeds. Android only:\nimmediately succeeds with nothing to do on every other platform.","inputs":[],"outputs":[{"n":"bSuccess","t":"Boolean","k":"bool","c":"","r":""},{"n":"ErrorMessage","t":"String","k":"string","c":"","r":""}],"exec":["OnSuccess","OnError"],"topic":""},{"id":"UFirestoreFilter_IsValid","title":"Is Valid","fn":"IsValid","owner":"UFirestoreFilter","kind":"pure","module":"Firestore","group":"Filter","platform":"","doc":"False if this Filter was never built by one of UFirestoreFilterLibrary's MakeFirestoreFilterXxx functions (e.g. a fresh \"Make Firestore Filter\" struct pin left unset).","inputs":[{"n":"Target","t":"FirestoreFilter","k":"object","c":"","r":"","target":true}],"outputs":[{"n":"Return Value","t":"Boolean","k":"bool","c":"","r":""}],"exec":[],"topic":"Query filters"},{"id":"UFirestoreFilterLibrary_MakeFirestoreFilterEqualTo","title":"Make Firestore Filter Equal To","fn":"MakeFirestoreFilterEqualTo","owner":"UFirestoreFilterLibrary","kind":"call","module":"Firestore","group":"Filter","platform":"","doc":"","inputs":[{"n":"Field","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Value","t":"FirebaseFirestoreValue","k":"struct","c":"","r":"FFirebaseFirestoreValue","adv":false}],"outputs":[{"n":"Return Value","t":"FirestoreFilter","k":"object","c":"","r":""}],"exec":[],"topic":"Query filters"},{"id":"UFirestoreFilterLibrary_MakeFirestoreFilterNotEqualTo","title":"Make Firestore Filter Not Equal To","fn":"MakeFirestoreFilterNotEqualTo","owner":"UFirestoreFilterLibrary","kind":"call","module":"Firestore","group":"Filter","platform":"","doc":"","inputs":[{"n":"Field","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Value","t":"FirebaseFirestoreValue","k":"struct","c":"","r":"FFirebaseFirestoreValue","adv":false}],"outputs":[{"n":"Return Value","t":"FirestoreFilter","k":"object","c":"","r":""}],"exec":[],"topic":"Query filters"},{"id":"UFirestoreFilterLibrary_MakeFirestoreFilterLessThan","title":"Make Firestore Filter Less Than","fn":"MakeFirestoreFilterLessThan","owner":"UFirestoreFilterLibrary","kind":"call","module":"Firestore","group":"Filter","platform":"","doc":"","inputs":[{"n":"Field","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Value","t":"FirebaseFirestoreValue","k":"struct","c":"","r":"FFirebaseFirestoreValue","adv":false}],"outputs":[{"n":"Return Value","t":"FirestoreFilter","k":"object","c":"","r":""}],"exec":[],"topic":"Query filters"},{"id":"UFirestoreFilterLibrary_MakeFirestoreFilterLessThanOrEqualTo","title":"Make Firestore Filter Less Than Or Equal To","fn":"MakeFirestoreFilterLessThanOrEqualTo","owner":"UFirestoreFilterLibrary","kind":"call","module":"Firestore","group":"Filter","platform":"","doc":"","inputs":[{"n":"Field","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Value","t":"FirebaseFirestoreValue","k":"struct","c":"","r":"FFirebaseFirestoreValue","adv":false}],"outputs":[{"n":"Return Value","t":"FirestoreFilter","k":"object","c":"","r":""}],"exec":[],"topic":"Query filters"},{"id":"UFirestoreFilterLibrary_MakeFirestoreFilterGreaterThan","title":"Make Firestore Filter Greater Than","fn":"MakeFirestoreFilterGreaterThan","owner":"UFirestoreFilterLibrary","kind":"call","module":"Firestore","group":"Filter","platform":"","doc":"","inputs":[{"n":"Field","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Value","t":"FirebaseFirestoreValue","k":"struct","c":"","r":"FFirebaseFirestoreValue","adv":false}],"outputs":[{"n":"Return Value","t":"FirestoreFilter","k":"object","c":"","r":""}],"exec":[],"topic":"Query filters"},{"id":"UFirestoreFilterLibrary_MakeFirestoreFilterGreaterThanOrEqualTo","title":"Make Firestore Filter Greater Than Or Equal To","fn":"MakeFirestoreFilterGreaterThanOrEqualTo","owner":"UFirestoreFilterLibrary","kind":"call","module":"Firestore","group":"Filter","platform":"","doc":"","inputs":[{"n":"Field","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Value","t":"FirebaseFirestoreValue","k":"struct","c":"","r":"FFirebaseFirestoreValue","adv":false}],"outputs":[{"n":"Return Value","t":"FirestoreFilter","k":"object","c":"","r":""}],"exec":[],"topic":"Query filters"},{"id":"UFirestoreFilterLibrary_MakeFirestoreFilterArrayContains","title":"Make Firestore Filter Array Contains","fn":"MakeFirestoreFilterArrayContains","owner":"UFirestoreFilterLibrary","kind":"call","module":"Firestore","group":"Filter","platform":"","doc":"Field's value must be an array containing Value.","inputs":[{"n":"Field","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Value","t":"FirebaseFirestoreValue","k":"struct","c":"","r":"FFirebaseFirestoreValue","adv":false}],"outputs":[{"n":"Return Value","t":"FirestoreFilter","k":"object","c":"","r":""}],"exec":[],"topic":"Query filters"},{"id":"UFirestoreFilterLibrary_MakeFirestoreFilterArrayContainsAny","title":"Make Firestore Filter Array Contains Any","fn":"MakeFirestoreFilterArrayContainsAny","owner":"UFirestoreFilterLibrary","kind":"call","module":"Firestore","group":"Filter","platform":"","doc":"Field's value must be an array containing at least one of Values.","inputs":[{"n":"Field","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Values","t":"Array of FirebaseFirestoreValue","k":"struct","c":"array","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"FirestoreFilter","k":"object","c":"","r":""}],"exec":[],"topic":"Query filters"},{"id":"UFirestoreFilterLibrary_MakeFirestoreFilterIn","title":"Make Firestore Filter In","fn":"MakeFirestoreFilterIn","owner":"UFirestoreFilterLibrary","kind":"call","module":"Firestore","group":"Filter","platform":"","doc":"Field's value must equal one of Values.","inputs":[{"n":"Field","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Values","t":"Array of FirebaseFirestoreValue","k":"struct","c":"array","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"FirestoreFilter","k":"object","c":"","r":""}],"exec":[],"topic":"Query filters"},{"id":"UFirestoreFilterLibrary_MakeFirestoreFilterNotIn","title":"Make Firestore Filter Not In","fn":"MakeFirestoreFilterNotIn","owner":"UFirestoreFilterLibrary","kind":"call","module":"Firestore","group":"Filter","platform":"","doc":"Field's value must not equal any of Values.","inputs":[{"n":"Field","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Values","t":"Array of FirebaseFirestoreValue","k":"struct","c":"array","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"FirestoreFilter","k":"object","c":"","r":""}],"exec":[],"topic":"Query filters"},{"id":"UFirestoreFilterLibrary_MakeFirestoreFilterAnd","title":"Make Firestore Filter And","fn":"MakeFirestoreFilterAnd","owner":"UFirestoreFilterLibrary","kind":"call","module":"Firestore","group":"Filter","platform":"","doc":"Combines Filters so a document must satisfy ALL of them — mainly useful\nto nest an AND group inside an OR group (MakeFirestoreFilterOr). The\nSDK's one-of-each-kind/mutual-exclusivity rules (a single\nArrayContains, NotIn not combined with NotEqualTo...) still apply to\nevery condition inside, exactly as when chaining WhereXxx calls.","inputs":[{"n":"Filters","t":"Array of FirestoreFilter","k":"object","c":"array","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"FirestoreFilter","k":"object","c":"","r":""}],"exec":[],"topic":"Query filters"},{"id":"UFirestoreFilterLibrary_MakeFirestoreFilterOr","title":"Make Firestore Filter Or","fn":"MakeFirestoreFilterOr","owner":"UFirestoreFilterLibrary","kind":"call","module":"Firestore","group":"Filter","platform":"","doc":"Combines Filters so a document need only satisfy ANY ONE of them — the\nonly way in this plugin to express an OR condition; UFirestoreQuery's\nown WhereXxx calls only ever AND together.","inputs":[{"n":"Filters","t":"Array of FirestoreFilter","k":"object","c":"array","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"FirestoreFilter","k":"object","c":"","r":""}],"exec":[],"topic":"Query filters"},{"id":"UFirestoreLibrary_SetFirestoreSettings","title":"Set Firestore Settings","fn":"SetFirestoreSettings","owner":"UFirestoreLibrary","kind":"call","module":"Firestore","group":"","platform":"","doc":"Applies Settings to the Firestore instance. Only takes effect if called\nbefore the first Firestore read/write/listen of the session — the SDK\nkeeps whatever was in effect when it first connects for the rest of the\nprocess. Call this once, as early as possible (e.g. right after\nFirebase initializes), if you need anything other than the defaults.","inputs":[{"n":"Settings","t":"FirebaseFirestoreSettings","k":"struct","c":"","r":"FFirebaseFirestoreSettings","adv":false}],"outputs":[],"exec":[],"topic":"Settings and network"},{"id":"UFirestoreLibrary_GetFirestoreSettings","title":"Get Firestore Settings","fn":"GetFirestoreSettings","owner":"UFirestoreLibrary","kind":"pure","module":"Firestore","group":"","platform":"","doc":"Reads back the Settings currently in effect (either the defaults, or whatever an earlier SetFirestoreSettings call applied).","inputs":[],"outputs":[{"n":"Return Value","t":"FirebaseFirestoreSettings","k":"struct","c":"","r":"FFirebaseFirestoreSettings"}],"exec":[],"topic":"Settings and network"},{"id":"UFirestoreLibrary_MakeFirestoreCacheSizeUnlimited","title":"Make Firestore Cache Size Unlimited","fn":"MakeFirestoreCacheSizeUnlimited","owner":"UFirestoreLibrary","kind":"pure","module":"Firestore","group":"","platform":"","doc":"Value for FFirebaseFirestoreSettings::CacheSizeBytes that disables cache eviction entirely (the on-disk cache then only grows).","inputs":[],"outputs":[{"n":"Return Value","t":"Integer64","k":"int64","c":"","r":""}],"exec":[],"topic":"Values and JSON"},{"id":"UFirestoreLibrary_UseFirestoreDatabase","title":"Use Firestore Database","fn":"UseFirestoreDatabase","owner":"UFirestoreLibrary","kind":"call","module":"Firestore","group":"","platform":"","doc":"Points every subsequent Firestore call at the named database DatabaseId\ninstead of the project's \"(default)\" Firestore database — for a project\nthat provisions more than one Firestore database (e.g. a \"live\" one for\ngameplay data and a separate one for analytics/logs). Call once, before\nany other Firestore node; calling it again later resolves to a distinct\nFirestore instance for the new DatabaseId (the SDK caches one instance\nper database), it does not reconfigure the previous one. Pass an empty\nstring to go back to the \"(default)\" database for any Firestore instance\nnot already resolved.","inputs":[{"n":"DatabaseId","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[],"exec":[],"topic":"Settings and network"},{"id":"UFirestoreLibrary_GetFirestoreDatabaseId","title":"Get Firestore Database Id","fn":"GetFirestoreDatabaseId","owner":"UFirestoreLibrary","kind":"pure","module":"Firestore","group":"","platform":"","doc":"The Firestore database id this app is currently configured to use (\"(default)\" style name, or whatever UseFirestoreDatabase last pointed at) — empty means the project's own default database. Needs no network call.","inputs":[],"outputs":[{"n":"Return Value","t":"String","k":"string","c":"","r":""}],"exec":[],"topic":"Settings and network"},{"id":"UFirestoreLibrary_SetFirestoreLogLevel","title":"Set Firestore Log Level","fn":"SetFirestoreLogLevel","owner":"UFirestoreLibrary","kind":"call","module":"Firestore","group":"","platform":"","doc":"Verbosity of the Firestore SDK's own internal logging — separate from\n(and on top of) UFirebaseBPSubsystem::SetFirebaseLogLevel's SDK-wide\nsetting, and from Realtime Database's own SetDatabaseLogLevel; use this\nto get more/less Firestore-specific detail without changing every other\nmodule's verbosity. Applies to every Firestore instance in the process\n(the underlying SDK call is process-wide, not per-instance) — reuses\nEFirebaseLogLevel (see its own doc comment on FirebaseBPSubsystem.h).\nThere is no getter: the SDK only exposes a setter for this one.","inputs":[{"n":"Level","t":"EFirebaseLogLevel","k":"enum","c":"","r":"EFirebaseLogLevel","adv":false}],"outputs":[],"exec":[],"topic":"Settings and network"},{"id":"UFirestoreLibrary_MakeNewFirestoreDocumentPath","title":"Make New Firestore Document Path","fn":"MakeNewFirestoreDocumentPath","owner":"UFirestoreLibrary","kind":"call","module":"Firestore","group":"","platform":"","doc":"A new document path in CollectionPath with a random 20-character ID,\nthe same shape Add Document generates — use it when you need the ID\nbefore writing (e.g. to store it in another document first), then Set\nDocument on the returned path. Generated locally: no network call, and\nit doesn't start Firestore. Returns an empty string if CollectionPath\nisn't a valid collection path.","inputs":[{"n":"CollectionPath","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"String","k":"string","c":"","r":""}],"exec":[],"topic":"Documents"},{"id":"USetFirestoreNetworkEnabledProxy_SetFirestoreNetworkEnabled","title":"Set Firestore Network Enabled","fn":"SetFirestoreNetworkEnabled","owner":"USetFirestoreNetworkEnabledProxy","kind":"async","module":"Firestore","group":"","platform":"","doc":"Re-enables or forcibly disables the Firestore instance's network use.\nDisabling it doesn't stop already-listening snapshot listeners from firing\noff the local cache, or queued offline writes from being staged — it only\nstops the SDK from actually reaching the backend until re-enabled. Useful\nto force \"offline mode\" (e.g. to test it, or to respect a player's own\ndata-saver toggle) independent of the device's real connectivity.","inputs":[{"n":"bEnabled","t":"Boolean","k":"bool","c":"","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseFirestoreError","k":"enum","c":"","r":"EFirebaseFirestoreError"}],"exec":["OnSuccess","OnError"],"topic":"Settings and network"},{"id":"UWaitForFirestorePendingWritesProxy_WaitForFirestorePendingWrites","title":"Wait For Firestore Pending Writes","fn":"WaitForFirestorePendingWrites","owner":"UWaitForFirestorePendingWritesProxy","kind":"async","module":"Firestore","group":"","platform":"","doc":"Waits until every locally-queued write (from Set/Update/Delete Document,\nWriteBatch, or a transaction) has either been acknowledged by the backend\nor failed — e.g. to confirm an offline-queued write actually made it to\nthe server before telling the player it's safe to close the app.\nResolves immediately if nothing is pending.","inputs":[],"outputs":[{"n":"Error","t":"EFirebaseFirestoreError","k":"enum","c":"","r":"EFirebaseFirestoreError"}],"exec":["OnSuccess","OnError"],"topic":"Settings and network"},{"id":"UClearFirestorePersistenceProxy_ClearFirestorePersistence","title":"Clear Firestore Persistence","fn":"ClearFirestorePersistence","owner":"UClearFirestorePersistenceProxy","kind":"async","module":"Firestore","group":"","platform":"","doc":"Wipes Firestore's entire on-disk cache (queries, documents, and any\npending offline writes) for a fresh start — e.g. as part of a \"sign out\nand forget this device\" flow. Fails with FailedPrecondition if the\nFirestore instance is still in use elsewhere (any open listener, or any\nother Firestore call still in flight) — call this only while nothing else\nis touching Firestore.","inputs":[],"outputs":[{"n":"Error","t":"EFirebaseFirestoreError","k":"enum","c":"","r":"EFirebaseFirestoreError"}],"exec":["OnSuccess","OnError"],"topic":"Settings and network"},{"id":"UTerminateFirestoreProxy_TerminateFirestore","title":"Terminate Firestore","fn":"TerminateFirestore","owner":"UTerminateFirestoreProxy","kind":"async","module":"Firestore","group":"","platform":"","doc":"Releases the Firestore instance's resources (network connections, listener\nthreads, ...) and puts it into a state where only ClearFirestorePersistence\nmay still be called on it — needed to satisfy ClearFirestorePersistence's\nown documented precondition (it fails with FailedPrecondition if the\ninstance is still \"running\") as part of a \"sign out and wipe local data\"\nflow: Terminate first, then ClearFirestorePersistence.\n\nDoes not delete any on-disk cache — only ClearFirestorePersistence does\nthat. Writes still waiting for the server are not resolved anymore (their\nnodes never fire). Any further Firestore call after this (other than\nClearFirestorePersistence) creates a fresh Firestore instance, with the\ndefault settings: call Set Firestore Settings again first if you changed\nthem. Process-wide: every Firestore listener is stopped and every query\nand write batch built before becomes invalid, whichever database\n(UseFirestoreDatabase) it targets.","inputs":[],"outputs":[{"n":"Error","t":"EFirebaseFirestoreError","k":"enum","c":"","r":"EFirebaseFirestoreError"}],"exec":["OnSuccess","OnError"],"topic":"Settings and network"},{"id":"ULoadFirestoreBundleProxy_LoadFirestoreBundle","title":"Load Firestore Bundle","fn":"LoadFirestoreBundle","owner":"ULoadFirestoreBundleProxy","kind":"async","module":"Firestore","group":"","platform":"","doc":"Loads a Firestore bundle — a precomputed, offline-shippable snapshot of\nquery results and documents (built server-side, e.g. via the\nfirestore-bundle-tool or a Cloud Function) — into the local cache, so the\ndocuments/named queries it contains are available immediately without\ntheir own round trip to the backend. BundleData is the bundle file's raw\nbytes (e.g. from Unreal's own \"Load File to Byte Array\"), not a path.\n\nOnProgress fires repeatedly while the bundle is being parsed and written to\nthe cache; OnSuccess/OnError report the final outcome (also delivered as\none last OnProgress update with State = Success/Error, per the SDK's own\nbehavior — OnSuccess/OnError exist alongside it just for the usual\n\"one clear exec pin per outcome\" convenience every other proxy in this\nplugin has).\n\nLoading the same bundle (by its own internal id) more than once, or one\nwhose version is older than what's already cached, is a fast no-op rather\nthan an error or a redundant write.","inputs":[{"n":"BundleData","t":"Array of Byte","k":"byte","c":"array","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseFirestoreError","k":"enum","c":"","r":"EFirebaseFirestoreError"},{"n":"Progress","t":"FirebaseFirestoreLoadBundleProgress","k":"struct","c":"","r":"FFirebaseFirestoreLoadBundleProgress"}],"exec":["OnProgress","OnSuccess","OnError"],"topic":"Settings and network"},{"id":"UFirestoreListenerLibrary_ListenToDocument","title":"Listen To Document","fn":"ListenToDocument","owner":"UFirestoreListenerLibrary","kind":"call","module":"Firestore","group":"Listener","platform":"","doc":"Starts listening to the document at DocumentPath. Callback fires once\nimmediately with the current data, then again every time the document\nchanges (from this client or any other), until the returned handle is\npassed to StopFirestoreListener.\n\nbIncludeMetadataChanges: false (default) only fires Callback for actual\ndata changes. Set true to also fire it for metadata-only changes — e.g.\na second event once a local write you made is confirmed by the server\n(Data.Metadata.bHasPendingWrites flips from true to false with no other\nchange), or once a cached read is replaced by a guaranteed up-to-date\none (Data.Metadata.bIsFromCache flips from true to false). Data.Metadata\nitself is always populated either way — this only controls whether a\nmetadata-only change gets its own Callback invocation.","inputs":[{"n":"DocumentPath","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Callback","t":"FBP_OnFirestoreDocumentUpdate","k":"delegate","c":"","r":"FFBP_OnFirestoreDocumentUpdate","adv":false},{"n":"bIncludeMetadataChanges","t":"Boolean","k":"bool","c":"","r":"","d":"false","adv":false},{"n":"TimestampBehavior","t":"EFirebaseFirestoreServerTimestampBehavior","k":"enum","c":"","r":"EFirebaseFirestoreServerTimestampBehavior","d":"EFirebaseFirestoreServerTimestampBehavior::None","adv":true}],"outputs":[{"n":"Return Value","t":"FirebaseFirestoreListenerHandle","k":"struct","c":"","r":"FFirebaseFirestoreListenerHandle"}],"exec":[],"topic":"Live listeners"},{"id":"UFirestoreListenerLibrary_ListenToQuery","title":"Listen To Query","fn":"ListenToQuery","owner":"UFirestoreListenerLibrary","kind":"call","module":"Firestore","group":"Listener","platform":"","doc":"Starts listening to the results of Query (built with MakeCollectionQuery\nplus WhereXxx/OrderBy/Limit calls). Callback fires once immediately with the\ncurrent results, then again every time they change, until the returned\nhandle is passed to StopFirestoreListener.\n\nbIncludeMetadataChanges: same as ListenToDocument's own parameter, applied\nto the whole query's result set instead of a single document — see there\nfor the full explanation.","inputs":[{"n":"Query","t":"FirestoreQuery","k":"object","c":"","r":"","adv":false},{"n":"Callback","t":"FBP_OnFirestoreQueryUpdate","k":"delegate","c":"","r":"FFBP_OnFirestoreQueryUpdate","adv":false},{"n":"bIncludeMetadataChanges","t":"Boolean","k":"bool","c":"","r":"","d":"false","adv":false},{"n":"TimestampBehavior","t":"EFirebaseFirestoreServerTimestampBehavior","k":"enum","c":"","r":"EFirebaseFirestoreServerTimestampBehavior","d":"EFirebaseFirestoreServerTimestampBehavior::None","adv":true}],"outputs":[{"n":"Return Value","t":"FirebaseFirestoreListenerHandle","k":"struct","c":"","r":"FFirebaseFirestoreListenerHandle"}],"exec":[],"topic":"Live listeners"},{"id":"UFirestoreListenerLibrary_ListenToQueryWithChanges","title":"Listen To Query With Changes","fn":"ListenToQueryWithChanges","owner":"UFirestoreListenerLibrary","kind":"call","module":"Firestore","group":"Listener","platform":"","doc":"Same as ListenToQuery, but Callback also receives Changes — the\nadded/modified/removed diff (and old/new index) against the previous\nsnapshot, straight from the SDK's own QuerySnapshot::DocumentChanges().\nUse this instead of ListenToQuery for a list/leaderboard/chat UI that\nwants to apply an incremental update instead of rebuilding itself from\nthe full Documents list on every change.","inputs":[{"n":"Query","t":"FirestoreQuery","k":"object","c":"","r":"","adv":false},{"n":"Callback","t":"FBP_OnFirestoreQueryUpdateWithChanges","k":"delegate","c":"","r":"FFBP_OnFirestoreQueryUpdateWithChanges","adv":false},{"n":"bIncludeMetadataChanges","t":"Boolean","k":"bool","c":"","r":"","d":"false","adv":false},{"n":"TimestampBehavior","t":"EFirebaseFirestoreServerTimestampBehavior","k":"enum","c":"","r":"EFirebaseFirestoreServerTimestampBehavior","d":"EFirebaseFirestoreServerTimestampBehavior::None","adv":true}],"outputs":[{"n":"Return Value","t":"FirebaseFirestoreListenerHandle","k":"struct","c":"","r":"FFirebaseFirestoreListenerHandle"}],"exec":[],"topic":"Live listeners"},{"id":"UFirestoreListenerLibrary_ListenToFirestoreSnapshotsInSync","title":"Listen To Firestore Snapshots In Sync","fn":"ListenToFirestoreSnapshotsInSync","owner":"UFirestoreListenerLibrary","kind":"call","module":"Firestore","group":"Listener","platform":"","doc":"Fires Callback every time every currently-registered snapshot listener\n(ListenToDocument/ListenToQuery, anywhere in the app) has finished\nprocessing a given change — i.e. all of them are now in sync with each\nother (NOT necessarily with the server; check SnapshotMetadata on each\nindividual listener for that). Useful to coalesce a UI redraw that\ndepends on several listeners at once, instead of redrawing once per\nlistener as each one updates.","inputs":[{"n":"Callback","t":"FBP_OnFirestoreSnapshotsInSync","k":"delegate","c":"","r":"FFBP_OnFirestoreSnapshotsInSync","adv":false}],"outputs":[{"n":"Return Value","t":"FirebaseFirestoreListenerHandle","k":"struct","c":"","r":"FFirebaseFirestoreListenerHandle"}],"exec":[],"topic":"Live listeners"},{"id":"UFirestoreListenerLibrary_StopFirestoreListener","title":"Stop Firestore Listener","fn":"StopFirestoreListener","owner":"UFirestoreListenerLibrary","kind":"call","module":"Firestore","group":"Listener","platform":"","doc":"Stops a listener started by ListenToDocument or ListenToQuery. Safe to\ncall more than once, or on an already-invalid handle. Updates that were\nalready on their way when you call this are dropped, never delivered.","inputs":[],"outputs":[{"n":"Handle","t":"FirebaseFirestoreListenerHandle","k":"struct","c":"","r":"FFirebaseFirestoreListenerHandle"}],"exec":[],"topic":"Live listeners"},{"id":"UFirestoreListenerLibrary_StopAllFirestoreListeners","title":"Stop All Firestore Listeners","fn":"StopAllFirestoreListeners","owner":"UFirestoreListenerLibrary","kind":"call","module":"Firestore","group":"Listener","platform":"","doc":"Stops every Firestore listener this app started and hasn't stopped yet\n— including ones whose handle was never stored. Handy on sign-out, or\nwhen leaving a whole game mode. Also runs automatically at the end of\neach Play In Editor session and before Terminate Firestore.","inputs":[],"outputs":[],"exec":[],"topic":"Live listeners"},{"id":"UFirestoreListenerLibrary_IsFirestoreListenerValid","title":"Is Firestore Listener Valid","fn":"IsFirestoreListenerValid","owner":"UFirestoreListenerLibrary","kind":"pure","module":"Firestore","group":"Listener","platform":"","doc":"False for a default-constructed handle, one whose listener already failed to start, one already stopped, or one the SDK ended after reporting an error (e.g. permission denied).","inputs":[{"n":"Handle","t":"FirebaseFirestoreListenerHandle","k":"struct","c":"","r":"FFirebaseFirestoreListenerHandle","adv":false}],"outputs":[{"n":"Return Value","t":"Boolean","k":"bool","c":"","r":""}],"exec":[],"topic":"Live listeners"},{"id":"USetFirestoreDocumentProxy_SetDocument","title":"Set Document","fn":"SetDocument","owner":"USetFirestoreDocumentProxy","kind":"async","module":"Firestore","group":"","platform":"","doc":"Writes to the document at DocumentPath (e.g. \"players/abc123\"). Creates the\ndocument if it doesn't exist yet. With bMerge, only the given fields are\nchanged and the rest of the existing document is left untouched; without\nit, the whole document is overwritten. MergeFields (optional, dotted field\npaths like \"stats.wins\") is the precise version of bMerge: when non-empty,\nONLY those fields are written (each must be present in Data) and every\nother field of both Data and the existing document is left alone, so a Data\nmap carrying extra keys can't touch anything you didn't list. It takes\npriority over bMerge.","inputs":[{"n":"DocumentPath","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Data","t":"Map of String to FirebaseFirestoreValue","k":"string","c":"map","r":"","adv":false},{"n":"bMerge","t":"Boolean","k":"bool","c":"","r":"","adv":false},{"n":"MergeFields","t":"Array of String","k":"string","c":"array","r":"","adv":true}],"outputs":[{"n":"Error","t":"EFirebaseFirestoreError","k":"enum","c":"","r":"EFirebaseFirestoreError"}],"exec":["OnSuccess","OnError"],"topic":"Documents"},{"id":"USetFirestoreDocumentJsonProxy_SetDocumentJson","title":"Set Document (Json)","fn":"SetDocumentJson","owner":"USetFirestoreDocumentJsonProxy","kind":"async","module":"Firestore","group":"","platform":"","doc":"Same as SetDocument, but takes the document as a JSON string instead of a\nTMap\u003cFString, FFirebaseFirestoreValue> — the practical option when the data\ncomes from Unreal's own \"Struct To Json String\" node (or any other JSON\nsource), instead of building the map field-by-field with Make Map.\nUses the same \"__type\" convention as UFirestoreJsonLibrary for Timestamp/\nGeoPoint/Reference fields.","inputs":[{"n":"DocumentPath","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Json","t":"String","k":"string","c":"","r":"","adv":false},{"n":"bMerge","t":"Boolean","k":"bool","c":"","r":"","adv":false},{"n":"MergeFields","t":"Array of String","k":"string","c":"array","r":"","adv":true}],"outputs":[{"n":"Error","t":"EFirebaseFirestoreError","k":"enum","c":"","r":"EFirebaseFirestoreError"}],"exec":["OnSuccess","OnError"],"topic":"Documents"},{"id":"UGetFirestoreDocumentProxy_GetDocument","title":"Get Document","fn":"GetDocument","owner":"UGetFirestoreDocumentProxy","kind":"async","module":"Firestore","group":"","platform":"","doc":"Reads the document at DocumentPath. bExists is false (and Data empty) if no\ndocument exists at that path — this is not reported as an error.\n\nSource: force a fresh Server read (fail rather than fall back to stale\ncache) or a Cache-only read (instant, no network) instead of the SDK's\nown Default (server, falling back to cache).\n\nTimestampBehavior: how to read back a field written via\nMakeFirestoreServerTimestamp() before the server has confirmed its\nfinal value — leave at None unless you just wrote such a field and want\nto display it back immediately (use Estimate then).","inputs":[{"n":"DocumentPath","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Source","t":"EFirebaseFirestoreSource","k":"enum","c":"","r":"EFirebaseFirestoreSource","d":"EFirebaseFirestoreSource::Default","adv":true},{"n":"TimestampBehavior","t":"EFirebaseFirestoreServerTimestampBehavior","k":"enum","c":"","r":"EFirebaseFirestoreServerTimestampBehavior","d":"EFirebaseFirestoreServerTimestampBehavior::None","adv":true}],"outputs":[{"n":"Error","t":"EFirebaseFirestoreError","k":"enum","c":"","r":"EFirebaseFirestoreError"},{"n":"bExists","t":"Boolean","k":"bool","c":"","r":""},{"n":"Data","t":"FirebaseFirestoreDocument","k":"struct","c":"","r":"FFirebaseFirestoreDocument"}],"exec":["OnSuccess","OnError"],"topic":"Documents"},{"id":"UGetFirestoreDocumentsProxy_GetDocuments","title":"Get Documents","fn":"GetDocuments","owner":"UGetFirestoreDocumentsProxy","kind":"async","module":"Firestore","group":"","platform":"","doc":"Reads several documents by full path in one node (e.g. a squad's N player\ndocuments, or a list of IDs coming from another query) instead of wiring N\nseparate Get Document calls and joining their results by hand. The Firestore\nSDK has no native multi-get, so this issues one read per path in parallel and\ncompletes once all of them have — there is no batching saving on the wire,\nonly on your Blueprint graph.\n\nOnSuccess.Documents has exactly one entry per requested path, in the same\norder (bExists false, Fields empty for a path with no document — not an\nerror). If ANY read fails, OnError fires once with that failure and no\npartial results. An invalid path fails the whole call with InvalidArgument\nbefore anything is read. An empty DocumentPaths succeeds immediately with an\nempty list. Source/TimestampBehavior apply to every read, same as Get Document.","inputs":[{"n":"DocumentPaths","t":"Array of String","k":"string","c":"array","r":"","adv":false},{"n":"Source","t":"EFirebaseFirestoreSource","k":"enum","c":"","r":"EFirebaseFirestoreSource","d":"EFirebaseFirestoreSource::Default","adv":true},{"n":"TimestampBehavior","t":"EFirebaseFirestoreServerTimestampBehavior","k":"enum","c":"","r":"EFirebaseFirestoreServerTimestampBehavior","d":"EFirebaseFirestoreServerTimestampBehavior::None","adv":true}],"outputs":[{"n":"Error","t":"EFirebaseFirestoreError","k":"enum","c":"","r":"EFirebaseFirestoreError"},{"n":"Documents","t":"Array of FirebaseFirestoreBatchDocument","k":"struct","c":"array","r":""}],"exec":["OnSuccess","OnError"],"topic":"Documents"},{"id":"UGetFirestoreDocumentJsonProxy_GetDocumentJson","title":"Get Document (Json)","fn":"GetDocumentJson","owner":"UGetFirestoreDocumentJsonProxy","kind":"async","module":"Firestore","group":"","platform":"","doc":"Same as GetDocument, but returns the document as a JSON string instead of a\nFFirebaseFirestoreDocument — pair with Unreal's own \"Json To Struct\" node\nto read straight into your own struct.","inputs":[{"n":"DocumentPath","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseFirestoreError","k":"enum","c":"","r":"EFirebaseFirestoreError"},{"n":"bExists","t":"Boolean","k":"bool","c":"","r":""},{"n":"Json","t":"String","k":"string","c":"","r":""}],"exec":["OnSuccess","OnError"],"topic":"Documents"},{"id":"UGetFirestoreDocumentJsonExpandedProxy_GetDocumentJsonExpandReferences","title":"Get Document (Json, Expand References)","fn":"GetDocumentJsonExpandReferences","owner":"UGetFirestoreDocumentJsonExpandedProxy","kind":"async","module":"Firestore","group":"","platform":"","doc":"Same as GetDocumentJson, but every field of type Reference is expanded\nin-place into the referenced document's own fields (a nested JSON object)\ninstead of being left as a bare path string — no more digging the path out\nof \"__type\":\"reference\" yourself and calling GetDocument a second time.\n\nOne level deep only, not recursive: a referenced document's own Reference\nfields (if it has any) are left unexpanded as plain \"__type\":\"reference\"\nentries. This keeps the cost and behavior bounded — at most Fields.Num()\nextra reads, and no risk of an unbounded chain or a reference cycle\n(A references B, B references A) looping forever. Call this again with a\nnested path if you need to go one level further.\n\nA field whose Reference points at a document that no longer exists (or\nfails to load) is left as the original unresolved reference rather than\ndropped, so you can still tell it was meant to point somewhere.","inputs":[{"n":"DocumentPath","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseFirestoreError","k":"enum","c":"","r":"EFirebaseFirestoreError"},{"n":"bExists","t":"Boolean","k":"bool","c":"","r":""},{"n":"Json","t":"String","k":"string","c":"","r":""}],"exec":["OnSuccess","OnError"],"topic":"Documents"},{"id":"UUpdateFirestoreDocumentProxy_UpdateDocument","title":"Update Document","fn":"UpdateDocument","owner":"UUpdateFirestoreDocumentProxy","kind":"async","module":"Firestore","group":"","platform":"","doc":"Updates fields in the document at DocumentPath. Fails if the document\ndoesn't exist yet — use SetDocument with bMerge for create-or-update.","inputs":[{"n":"DocumentPath","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Data","t":"Map of String to FirebaseFirestoreValue","k":"string","c":"map","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseFirestoreError","k":"enum","c":"","r":"EFirebaseFirestoreError"}],"exec":["OnSuccess","OnError"],"topic":"Documents"},{"id":"UUpdateFirestoreDocumentJsonProxy_UpdateDocumentJson","title":"Update Document (Json)","fn":"UpdateDocumentJson","owner":"UUpdateFirestoreDocumentJsonProxy","kind":"async","module":"Firestore","group":"","platform":"","doc":"Same as UpdateDocument, but takes the fields to update as a JSON string.","inputs":[{"n":"DocumentPath","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Json","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseFirestoreError","k":"enum","c":"","r":"EFirebaseFirestoreError"}],"exec":["OnSuccess","OnError"],"topic":"Documents"},{"id":"UDeleteFirestoreDocumentProxy_DeleteDocument","title":"Delete Document","fn":"DeleteDocument","owner":"UDeleteFirestoreDocumentProxy","kind":"async","module":"Firestore","group":"","platform":"","doc":"Permanently deletes the document at DocumentPath. Succeeds even if no\ndocument existed there.","inputs":[{"n":"DocumentPath","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseFirestoreError","k":"enum","c":"","r":"EFirebaseFirestoreError"}],"exec":["OnSuccess","OnError"],"topic":"Documents"},{"id":"UAddFirestoreDocumentProxy_AddDocument","title":"Add Document","fn":"AddDocument","owner":"UAddFirestoreDocumentProxy","kind":"async","module":"Firestore","group":"","platform":"","doc":"Adds a new document with an auto-generated ID to the collection at\nCollectionPath (e.g. \"players\"). Returns the generated document ID.","inputs":[{"n":"CollectionPath","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Data","t":"Map of String to FirebaseFirestoreValue","k":"string","c":"map","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseFirestoreError","k":"enum","c":"","r":"EFirebaseFirestoreError"},{"n":"DocumentId","t":"String","k":"string","c":"","r":""}],"exec":["OnSuccess","OnError"],"topic":"Documents"},{"id":"UAddFirestoreDocumentJsonProxy_AddDocumentJson","title":"Add Document (Json)","fn":"AddDocumentJson","owner":"UAddFirestoreDocumentJsonProxy","kind":"async","module":"Firestore","group":"","platform":"","doc":"Same as AddDocument, but takes the new document's fields as a JSON string.","inputs":[{"n":"CollectionPath","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Json","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseFirestoreError","k":"enum","c":"","r":"EFirebaseFirestoreError"},{"n":"DocumentId","t":"String","k":"string","c":"","r":""}],"exec":["OnSuccess","OnError"],"topic":"Documents"},{"id":"UFirestoreJsonLibrary_GetFirestoreValueType","title":"Get Firestore Value Type","fn":"GetFirestoreValueType","owner":"UFirestoreJsonLibrary","kind":"pure","module":"Firestore","group":"","platform":"","doc":"Use with a Switch on Enum to decide which ToFirestoreXxx/BreakFirestoreXxx to call for a value of unknown origin (e.g. a field read back from GetDocument).","inputs":[{"n":"Value","t":"FirebaseFirestoreValue","k":"struct","c":"","r":"FFirebaseFirestoreValue","adv":false}],"outputs":[{"n":"Return Value","t":"EFirebaseFirestoreValueType","k":"enum","c":"","r":"EFirebaseFirestoreValueType"}],"exec":[],"topic":"Values and JSON"},{"id":"UFirestoreJsonLibrary_MakeFirestoreNull","title":"Make Firestore Null","fn":"MakeFirestoreNull","owner":"UFirestoreJsonLibrary","kind":"pure","module":"Firestore","group":"","platform":"","doc":"","inputs":[],"outputs":[{"n":"Return Value","t":"FirebaseFirestoreValue","k":"struct","c":"","r":"FFirebaseFirestoreValue"}],"exec":[],"topic":"Values and JSON"},{"id":"UFirestoreJsonLibrary_MakeFirestoreBool","title":"Make Firestore Bool","fn":"MakeFirestoreBool","owner":"UFirestoreJsonLibrary","kind":"pure","module":"Firestore","group":"","platform":"","doc":"","inputs":[{"n":"bValue","t":"Boolean","k":"bool","c":"","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"FirebaseFirestoreValue","k":"struct","c":"","r":"FFirebaseFirestoreValue"}],"exec":[],"topic":"Values and JSON"},{"id":"UFirestoreJsonLibrary_MakeFirestoreInt","title":"Make Firestore Int","fn":"MakeFirestoreInt","owner":"UFirestoreJsonLibrary","kind":"pure","module":"Firestore","group":"","platform":"","doc":"","inputs":[{"n":"Value","t":"Integer64","k":"int64","c":"","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"FirebaseFirestoreValue","k":"struct","c":"","r":"FFirebaseFirestoreValue"}],"exec":[],"topic":"Values and JSON"},{"id":"UFirestoreJsonLibrary_MakeFirestoreDouble","title":"Make Firestore Double","fn":"MakeFirestoreDouble","owner":"UFirestoreJsonLibrary","kind":"pure","module":"Firestore","group":"","platform":"","doc":"","inputs":[{"n":"Value","t":"Float","k":"float","c":"","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"FirebaseFirestoreValue","k":"struct","c":"","r":"FFirebaseFirestoreValue"}],"exec":[],"topic":"Values and JSON"},{"id":"UFirestoreJsonLibrary_MakeFirestoreString","title":"Make Firestore String","fn":"MakeFirestoreString","owner":"UFirestoreJsonLibrary","kind":"pure","module":"Firestore","group":"","platform":"","doc":"","inputs":[{"n":"Value","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"FirebaseFirestoreValue","k":"struct","c":"","r":"FFirebaseFirestoreValue"}],"exec":[],"topic":"Values and JSON"},{"id":"UFirestoreJsonLibrary_MakeFirestoreTimestamp","title":"Make Firestore Timestamp","fn":"MakeFirestoreTimestamp","owner":"UFirestoreJsonLibrary","kind":"pure","module":"Firestore","group":"","platform":"","doc":"Loses sub-millisecond precision; use MakeFirestoreTimestampRaw for exact nanosecond precision.","inputs":[{"n":"Value","t":"Date Time","k":"struct","c":"","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"FirebaseFirestoreValue","k":"struct","c":"","r":"FFirebaseFirestoreValue"}],"exec":[],"topic":"Values and JSON"},{"id":"UFirestoreJsonLibrary_MakeFirestoreTimestampRaw","title":"Make Firestore Timestamp Raw","fn":"MakeFirestoreTimestampRaw","owner":"UFirestoreJsonLibrary","kind":"pure","module":"Firestore","group":"","platform":"","doc":"Exact seconds/nanoseconds since Unix epoch UTC, for when FDateTime's millisecond resolution isn't precise enough.","inputs":[{"n":"Seconds","t":"Integer64","k":"int64","c":"","r":"","adv":false},{"n":"Nanoseconds","t":"Integer","k":"int","c":"","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"FirebaseFirestoreValue","k":"struct","c":"","r":"FFirebaseFirestoreValue"}],"exec":[],"topic":"Values and JSON"},{"id":"UFirestoreJsonLibrary_MakeFirestoreReference","title":"Make Firestore Reference","fn":"MakeFirestoreReference","owner":"UFirestoreJsonLibrary","kind":"pure","module":"Firestore","group":"","platform":"","doc":"A document path (e.g. \"players/abc123\") of another document, not FString to avoid autocast ambiguity with MakeFirestoreString.","inputs":[{"n":"DocumentPath","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"FirebaseFirestoreValue","k":"struct","c":"","r":"FFirebaseFirestoreValue"}],"exec":[],"topic":"Values and JSON"},{"id":"UFirestoreJsonLibrary_MakeFirestoreGeoPoint","title":"Make Firestore Geo Point","fn":"MakeFirestoreGeoPoint","owner":"UFirestoreJsonLibrary","kind":"pure","module":"Firestore","group":"","platform":"","doc":"","inputs":[{"n":"Latitude","t":"Float","k":"float","c":"","r":"","adv":false},{"n":"Longitude","t":"Float","k":"float","c":"","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"FirebaseFirestoreValue","k":"struct","c":"","r":"FFirebaseFirestoreValue"}],"exec":[],"topic":"Values and JSON"},{"id":"UFirestoreJsonLibrary_MakeFirestoreBlob","title":"Make Firestore Blob","fn":"MakeFirestoreBlob","owner":"UFirestoreJsonLibrary","kind":"pure","module":"Firestore","group":"","platform":"","doc":"Raw binary data (firebase::firestore::FieldValue::Blob) — e.g. a small image, a compressed payload, an encrypted blob.","inputs":[{"n":"Bytes","t":"Array of Byte","k":"byte","c":"array","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"FirebaseFirestoreValue","k":"struct","c":"","r":"FFirebaseFirestoreValue"}],"exec":[],"topic":"Values and JSON"},{"id":"UFirestoreJsonLibrary_ToFirestoreBool","title":"To Firestore Bool","fn":"ToFirestoreBool","owner":"UFirestoreJsonLibrary","kind":"pure","module":"Firestore","group":"","platform":"","doc":"","inputs":[{"n":"Value","t":"FirebaseFirestoreValue","k":"struct","c":"","r":"FFirebaseFirestoreValue","adv":false}],"outputs":[{"n":"Return Value","t":"Boolean","k":"bool","c":"","r":""}],"exec":[],"topic":"Values and JSON"},{"id":"UFirestoreJsonLibrary_ToFirestoreInt","title":"To Firestore Int","fn":"ToFirestoreInt","owner":"UFirestoreJsonLibrary","kind":"pure","module":"Firestore","group":"","platform":"","doc":"","inputs":[{"n":"Value","t":"FirebaseFirestoreValue","k":"struct","c":"","r":"FFirebaseFirestoreValue","adv":false}],"outputs":[{"n":"Return Value","t":"Integer64","k":"int64","c":"","r":""}],"exec":[],"topic":"Values and JSON"},{"id":"UFirestoreJsonLibrary_ToFirestoreDouble","title":"To Firestore Double","fn":"ToFirestoreDouble","owner":"UFirestoreJsonLibrary","kind":"pure","module":"Firestore","group":"","platform":"","doc":"","inputs":[{"n":"Value","t":"FirebaseFirestoreValue","k":"struct","c":"","r":"FFirebaseFirestoreValue","adv":false}],"outputs":[{"n":"Return Value","t":"Float","k":"float","c":"","r":""}],"exec":[],"topic":"Values and JSON"},{"id":"UFirestoreJsonLibrary_ToFirestoreString","title":"To Firestore String","fn":"ToFirestoreString","owner":"UFirestoreJsonLibrary","kind":"pure","module":"Firestore","group":"","platform":"","doc":"","inputs":[{"n":"Value","t":"FirebaseFirestoreValue","k":"struct","c":"","r":"FFirebaseFirestoreValue","adv":false}],"outputs":[{"n":"Return Value","t":"String","k":"string","c":"","r":""}],"exec":[],"topic":"Values and JSON"},{"id":"UFirestoreJsonLibrary_ToFirestoreTimestamp","title":"To Firestore Timestamp","fn":"ToFirestoreTimestamp","owner":"UFirestoreJsonLibrary","kind":"pure","module":"Firestore","group":"","platform":"","doc":"","inputs":[{"n":"Value","t":"FirebaseFirestoreValue","k":"struct","c":"","r":"FFirebaseFirestoreValue","adv":false}],"outputs":[{"n":"Return Value","t":"Date Time","k":"struct","c":"","r":""}],"exec":[],"topic":"Values and JSON"},{"id":"UFirestoreJsonLibrary_ToFirestoreTimestampRaw","title":"To Firestore Timestamp Raw","fn":"ToFirestoreTimestampRaw","owner":"UFirestoreJsonLibrary","kind":"call","module":"Firestore","group":"","platform":"","doc":"Exact seconds/nanoseconds counterpart to ToFirestoreTimestamp; use when FDateTime's millisecond resolution isn't precise enough.","inputs":[{"n":"Value","t":"FirebaseFirestoreValue","k":"struct","c":"","r":"FFirebaseFirestoreValue","adv":false}],"outputs":[{"n":"Seconds","t":"Integer64","k":"int64","c":"","r":""},{"n":"Nanoseconds","t":"Integer","k":"int","c":"","r":""}],"exec":[],"topic":"Values and JSON"},{"id":"UFirestoreJsonLibrary_ToFirestoreReference","title":"To Firestore Reference","fn":"ToFirestoreReference","owner":"UFirestoreJsonLibrary","kind":"pure","module":"Firestore","group":"","platform":"","doc":"Document path for a Reference-type value; empty for any other type.","inputs":[{"n":"Value","t":"FirebaseFirestoreValue","k":"struct","c":"","r":"FFirebaseFirestoreValue","adv":false}],"outputs":[{"n":"Return Value","t":"String","k":"string","c":"","r":""}],"exec":[],"topic":"Values and JSON"},{"id":"UFirestoreJsonLibrary_ToFirestoreGeoPoint","title":"To Firestore Geo Point","fn":"ToFirestoreGeoPoint","owner":"UFirestoreJsonLibrary","kind":"call","module":"Firestore","group":"","platform":"","doc":"","inputs":[{"n":"Value","t":"FirebaseFirestoreValue","k":"struct","c":"","r":"FFirebaseFirestoreValue","adv":false}],"outputs":[{"n":"Latitude","t":"Float","k":"float","c":"","r":""},{"n":"Longitude","t":"Float","k":"float","c":"","r":""}],"exec":[],"topic":"Values and JSON"},{"id":"UFirestoreJsonLibrary_ToFirestoreBlob","title":"To Firestore Blob","fn":"ToFirestoreBlob","owner":"UFirestoreJsonLibrary","kind":"pure","module":"Firestore","group":"","platform":"","doc":"Raw bytes for a Blob-type value; empty for any other type.","inputs":[{"n":"Value","t":"FirebaseFirestoreValue","k":"struct","c":"","r":"FFirebaseFirestoreValue","adv":false}],"outputs":[{"n":"Return Value","t":"Array of Byte","k":"byte","c":"array","r":""}],"exec":[],"topic":"Values and JSON"},{"id":"UFirestoreJsonLibrary_DocumentToJson","title":"Document To Json","fn":"DocumentToJson","owner":"UFirestoreJsonLibrary","kind":"pure","module":"Firestore","group":"","platform":"","doc":"Converts a Firestore document to a JSON string.","inputs":[{"n":"Data","t":"Map of String to FirebaseFirestoreValue","k":"string","c":"map","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"String","k":"string","c":"","r":""}],"exec":[],"topic":"Values and JSON"},{"id":"UFirestoreJsonLibrary_JsonToDocument","title":"Json To Document","fn":"JsonToDocument","owner":"UFirestoreJsonLibrary","kind":"call","module":"Firestore","group":"","platform":"","doc":"Parses a JSON object string into a Firestore document. bSuccess is false if Json isn't a valid JSON object.","inputs":[{"n":"Json","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"bSuccess","t":"Boolean","k":"bool","c":"","r":""},{"n":"Return Value","t":"Map of String to FirebaseFirestoreValue","k":"string","c":"map","r":""}],"exec":[],"topic":"Values and JSON"},{"id":"UFirestoreJsonLibrary_QueryDocumentsToJson","title":"Query Documents To Json","fn":"QueryDocumentsToJson","owner":"UFirestoreJsonLibrary","kind":"pure","module":"Firestore","group":"","platform":"","doc":"Converts a list of query result documents (e.g. from Get Query\nDocuments) into a single JSON array string, one object per document\nshaped {\"id\": \"...\", \"fields\": {...}} — handy for a quick debug\ndisplay or shipping a whole query result somewhere as one string.","inputs":[{"n":"Documents","t":"Array of FirebaseFirestoreQueryDocument","k":"struct","c":"array","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"String","k":"string","c":"","r":""}],"exec":[],"topic":"Values and JSON"},{"id":"UFirestoreJsonLibrary_MakeFirestoreArrayValue","title":"Make Firestore Array Value","fn":"MakeFirestoreArrayValue","owner":"UFirestoreJsonLibrary","kind":"pure","module":"Firestore","group":"","platform":"","doc":"Builds an Array-type FFirebaseFirestoreValue from a list of values.\nNeeded because FFirebaseFirestoreValue can't hold a native\nTArray\u003cFFirebaseFirestoreValue> member (UHT forbids that struct\nrecursion) — the elements are stored serialized internally instead.","inputs":[{"n":"Elements","t":"Array of FirebaseFirestoreValue","k":"struct","c":"array","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"FirebaseFirestoreValue","k":"struct","c":"","r":"FFirebaseFirestoreValue"}],"exec":[],"topic":"Values and JSON"},{"id":"UFirestoreJsonLibrary_BreakFirestoreArrayValue","title":"Break Firestore Array Value","fn":"BreakFirestoreArrayValue","owner":"UFirestoreJsonLibrary","kind":"pure","module":"Firestore","group":"","platform":"","doc":"Reads back the elements of an Array-type FFirebaseFirestoreValue built by MakeFirestoreArrayValue.","inputs":[{"n":"Value","t":"FirebaseFirestoreValue","k":"struct","c":"","r":"FFirebaseFirestoreValue","adv":false}],"outputs":[{"n":"Return Value","t":"Array of FirebaseFirestoreValue","k":"struct","c":"array","r":""}],"exec":[],"topic":"Values and JSON"},{"id":"UFirestoreJsonLibrary_MakeFirestoreMapValue","title":"Make Firestore Map Value","fn":"MakeFirestoreMapValue","owner":"UFirestoreJsonLibrary","kind":"pure","module":"Firestore","group":"","platform":"","doc":"Builds a Map-type FFirebaseFirestoreValue (a nested object) from a set of\nfields. Use this to nest an object inside a document field; the document\nitself is always a plain TMap\u003cFString, FFirebaseFirestoreValue>.","inputs":[{"n":"Fields","t":"Map of String to FirebaseFirestoreValue","k":"string","c":"map","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"FirebaseFirestoreValue","k":"struct","c":"","r":"FFirebaseFirestoreValue"}],"exec":[],"topic":"Values and JSON"},{"id":"UFirestoreJsonLibrary_BreakFirestoreMapValue","title":"Break Firestore Map Value","fn":"BreakFirestoreMapValue","owner":"UFirestoreJsonLibrary","kind":"pure","module":"Firestore","group":"","platform":"","doc":"Reads back the fields of a Map-type FFirebaseFirestoreValue built by MakeFirestoreMapValue.","inputs":[{"n":"Value","t":"FirebaseFirestoreValue","k":"struct","c":"","r":"FFirebaseFirestoreValue","adv":false}],"outputs":[{"n":"Return Value","t":"Map of String to FirebaseFirestoreValue","k":"string","c":"map","r":""}],"exec":[],"topic":"Values and JSON"},{"id":"UFirestoreJsonLibrary_MakeFirestoreDeleteField","title":"Make Firestore Delete Field","fn":"MakeFirestoreDeleteField","owner":"UFirestoreJsonLibrary","kind":"pure","module":"Firestore","group":"","platform":"","doc":"Removes this field from the document. Only valid with Update Document, not Set Document.","inputs":[],"outputs":[{"n":"Return Value","t":"FirebaseFirestoreValue","k":"struct","c":"","r":"FFirebaseFirestoreValue"}],"exec":[],"topic":"Values and JSON"},{"id":"UFirestoreJsonLibrary_MakeFirestoreServerTimestamp","title":"Make Firestore Server Timestamp","fn":"MakeFirestoreServerTimestamp","owner":"UFirestoreJsonLibrary","kind":"pure","module":"Firestore","group":"","platform":"","doc":"The server's own timestamp at write time — prefer this over MakeFirestoreTimestamp(Now) for values you don't want a possibly-wrong client clock to determine.","inputs":[],"outputs":[{"n":"Return Value","t":"FirebaseFirestoreValue","k":"struct","c":"","r":"FFirebaseFirestoreValue"}],"exec":[],"topic":"Values and JSON"},{"id":"UFirestoreJsonLibrary_MakeFirestoreArrayUnion","title":"Make Firestore Array Union","fn":"MakeFirestoreArrayUnion","owner":"UFirestoreJsonLibrary","kind":"pure","module":"Firestore","group":"","platform":"","doc":"Adds Elements to the field's current array (must already be an array), skipping any already present. Avoids a read-then-write race with concurrent writers.","inputs":[{"n":"Elements","t":"Array of FirebaseFirestoreValue","k":"struct","c":"array","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"FirebaseFirestoreValue","k":"struct","c":"","r":"FFirebaseFirestoreValue"}],"exec":[],"topic":"Values and JSON"},{"id":"UFirestoreJsonLibrary_MakeFirestoreArrayRemove","title":"Make Firestore Array Remove","fn":"MakeFirestoreArrayRemove","owner":"UFirestoreJsonLibrary","kind":"pure","module":"Firestore","group":"","platform":"","doc":"Removes every instance of Elements from the field's current array.","inputs":[{"n":"Elements","t":"Array of FirebaseFirestoreValue","k":"struct","c":"array","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"FirebaseFirestoreValue","k":"struct","c":"","r":"FFirebaseFirestoreValue"}],"exec":[],"topic":"Values and JSON"},{"id":"UFirestoreJsonLibrary_MakeFirestoreIncrement","title":"Make Firestore Increment","fn":"MakeFirestoreIncrement","owner":"UFirestoreJsonLibrary","kind":"pure","module":"Firestore","group":"","platform":"","doc":"Atomically adds By to the field's current integer/double value server-side (e.g. score, currency) — avoids a read-then-write race with concurrent writers.","inputs":[{"n":"By","t":"Integer64","k":"int64","c":"","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"FirebaseFirestoreValue","k":"struct","c":"","r":"FFirebaseFirestoreValue"}],"exec":[],"topic":"Values and JSON"},{"id":"UFirestoreJsonLibrary_MakeFirestoreIncrementDouble","title":"Make Firestore Increment Double","fn":"MakeFirestoreIncrementDouble","owner":"UFirestoreJsonLibrary","kind":"pure","module":"Firestore","group":"","platform":"","doc":"Same as MakeFirestoreIncrement, for a floating point amount.","inputs":[{"n":"By","t":"Float","k":"float","c":"","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"FirebaseFirestoreValue","k":"struct","c":"","r":"FFirebaseFirestoreValue"}],"exec":[],"topic":"Values and JSON"},{"id":"UFirestoreQuery_WhereEqualTo","title":"Where Equal To","fn":"WhereEqualTo","owner":"UFirestoreQuery","kind":"call","module":"Firestore","group":"Query","platform":"","doc":"Documents must contain Field and its value must equal Value.","inputs":[{"n":"Target","t":"FirestoreQuery","k":"object","c":"","r":"","target":true},{"n":"Field","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Value","t":"FirebaseFirestoreValue","k":"struct","c":"","r":"FFirebaseFirestoreValue","adv":false}],"outputs":[{"n":"Return Value","t":"FirestoreQuery","k":"object","c":"","r":""}],"exec":[],"topic":"Queries"},{"id":"UFirestoreQuery_WhereFilter","title":"Where Filter","fn":"WhereFilter","owner":"UFirestoreQuery","kind":"call","module":"Firestore","group":"Query","platform":"","doc":"Applies a standalone UFirestoreFilter (built via UFirestoreFilterLibrary)\nto this query — the only way to express an OR condition, or an explicit\nAND/OR grouping, in this plugin; every WhereXxx call above only ANDs\ntogether. Can be combined with WhereXxx/OrderBy/Limit calls on the same\nquery as usual.","inputs":[{"n":"Target","t":"FirestoreQuery","k":"object","c":"","r":"","target":true},{"n":"Filter","t":"FirestoreFilter","k":"object","c":"","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"FirestoreQuery","k":"object","c":"","r":""}],"exec":[],"topic":"Queries"},{"id":"UFirestoreQuery_WhereNotEqualTo","title":"Where Not Equal To","fn":"WhereNotEqualTo","owner":"UFirestoreQuery","kind":"call","module":"Firestore","group":"Query","platform":"","doc":"Documents must contain Field and its value must not equal Value. Only one WhereNotEqualTo per query; can't combine with WhereNotIn.","inputs":[{"n":"Target","t":"FirestoreQuery","k":"object","c":"","r":"","target":true},{"n":"Field","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Value","t":"FirebaseFirestoreValue","k":"struct","c":"","r":"FFirebaseFirestoreValue","adv":false}],"outputs":[{"n":"Return Value","t":"FirestoreQuery","k":"object","c":"","r":""}],"exec":[],"topic":"Queries"},{"id":"UFirestoreQuery_WhereLessThan","title":"Where Less Than","fn":"WhereLessThan","owner":"UFirestoreQuery","kind":"call","module":"Firestore","group":"Query","platform":"","doc":"","inputs":[{"n":"Target","t":"FirestoreQuery","k":"object","c":"","r":"","target":true},{"n":"Field","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Value","t":"FirebaseFirestoreValue","k":"struct","c":"","r":"FFirebaseFirestoreValue","adv":false}],"outputs":[{"n":"Return Value","t":"FirestoreQuery","k":"object","c":"","r":""}],"exec":[],"topic":"Queries"},{"id":"UFirestoreQuery_WhereLessThanOrEqualTo","title":"Where Less Than Or Equal To","fn":"WhereLessThanOrEqualTo","owner":"UFirestoreQuery","kind":"call","module":"Firestore","group":"Query","platform":"","doc":"","inputs":[{"n":"Target","t":"FirestoreQuery","k":"object","c":"","r":"","target":true},{"n":"Field","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Value","t":"FirebaseFirestoreValue","k":"struct","c":"","r":"FFirebaseFirestoreValue","adv":false}],"outputs":[{"n":"Return Value","t":"FirestoreQuery","k":"object","c":"","r":""}],"exec":[],"topic":"Queries"},{"id":"UFirestoreQuery_WhereGreaterThan","title":"Where Greater Than","fn":"WhereGreaterThan","owner":"UFirestoreQuery","kind":"call","module":"Firestore","group":"Query","platform":"","doc":"","inputs":[{"n":"Target","t":"FirestoreQuery","k":"object","c":"","r":"","target":true},{"n":"Field","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Value","t":"FirebaseFirestoreValue","k":"struct","c":"","r":"FFirebaseFirestoreValue","adv":false}],"outputs":[{"n":"Return Value","t":"FirestoreQuery","k":"object","c":"","r":""}],"exec":[],"topic":"Queries"},{"id":"UFirestoreQuery_WhereGreaterThanOrEqualTo","title":"Where Greater Than Or Equal To","fn":"WhereGreaterThanOrEqualTo","owner":"UFirestoreQuery","kind":"call","module":"Firestore","group":"Query","platform":"","doc":"","inputs":[{"n":"Target","t":"FirestoreQuery","k":"object","c":"","r":"","target":true},{"n":"Field","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Value","t":"FirebaseFirestoreValue","k":"struct","c":"","r":"FFirebaseFirestoreValue","adv":false}],"outputs":[{"n":"Return Value","t":"FirestoreQuery","k":"object","c":"","r":""}],"exec":[],"topic":"Queries"},{"id":"UFirestoreQuery_WhereArrayContains","title":"Where Array Contains","fn":"WhereArrayContains","owner":"UFirestoreQuery","kind":"call","module":"Firestore","group":"Query","platform":"","doc":"Field's value must be an array containing Value. Only one array-type Where (this/ArrayContainsAny/In) per query.","inputs":[{"n":"Target","t":"FirestoreQuery","k":"object","c":"","r":"","target":true},{"n":"Field","t":"String","k":"string","c":"","r":"","adv":fal
