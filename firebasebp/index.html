const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const typeIds = new Set(MODEL.types.map(t => t.id));
const ICONS = {
  async: '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 4.2V8l2.6 1.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
  call: '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 3l9 5-9 5z" fill="currentColor"/></svg>',
  pure: '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><text x="3" y="13" font-size="13" font-style="italic" font-family="Georgia,serif" fill="currentColor">f</text></svg>',
  event: '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M9 1L3 9h4l-1 6 6-8H8z" fill="currentColor"/></svg>',
  type: '<svg class="ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="2.5" width="11" height="11" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5 6h6M5 8.5h6M5 11h4" stroke="currentColor" stroke-width="1.3"/></svg>',
};
const KIND_LABEL = { async: 'Async', call: 'Callable', pure: 'Pure', event: 'Event', type: '' };

function docHtml(doc) {
  if (!doc) return '';
  return doc.split(/\n\s*\n/).map(p => '<p>' + esc(p.replace(/\s*\n\s*/g, ' ')).replace(/`([^`]+)`/g, '<code>$1</code>') + '</p>').join('');
}
function pinHtml(p, exec) {
  if (exec) return `<div class="pin exec"><span class="dot"></span><span class="pn">${esc(p)}</span></div>`;
  const t = p.r && typeIds.has(p.r) ? `<a href="#${esc(p.r)}">${esc(p.t)}</a>` : esc(p.t);
  const def = p.d !== undefined && p.d !== '' && p.d !== '""' ? ` <span class="pd">= ${esc(p.d)}</span>` : '';
  const adv = p.adv ? ' <span class="adv">advanced</span>' : '';
  return `<div class="pin k-${esc(p.k)} ${esc(p.c)}"><span class="dot"></span><span><span class="pn">${esc(p.n)}</span>${adv}${def}<span class="pt">${t}</span></span></div>`;
}
// First sentence of a doc comment, and what is left after it.
function splitDoc(doc) {
  const paras = (doc || '').split(/\n\s*\n/).map(p => p.replace(/\s*\n\s*/g, ' ').trim()).filter(Boolean);
  if (!paras.length) return { summary: '', rest: [] };
  const guarded = paras[0].replace(/\b(e\.g|i\.e|etc|vs|approx)\./gi, m => m.replace(/\./g, '\u0001'));
  const m = guarded.match(/^(.+?[.!?])(?=\s+[A-Z(`"]|$)/);
  let summary = (m ? m[1] : guarded).replace(/\u0001/g, '.');
  const rest = [paras[0].slice(summary.length).trim(), ...paras.slice(1)].filter(Boolean);
  if (summary.length > 240) { rest.unshift(summary); summary = summary.slice(0, 200).replace(/\s+\S*$/, '') + '…'; }
  return { summary, rest };
}

// compact: the Quick start graph's version (no text, pins only); hl names the exec output that is wired.
// One pin as the editor draws it: type by color and shape, literal defaults in a small box.
function bpPin(p, hl = false) {
  if (typeof p === 'string') return `<div class="bp-pin${hl ? ' hl' : ''}"><i class="pi exec"></i><span>${esc(p)}</span></div>`;
  let lit = '';
  if (p.d !== undefined && p.d !== '' && p.d !== '""') {
    const v = String(p.d).replace(/^"(.*)"$/, '$1').replace(/^TEXT\("(.*)"\)$/, '$1');
    lit = p.k === 'bool' ? `<i class="chk${v === 'true' ? ' on' : ''}"></i>` : `<span class="lit">${esc(v.length > 22 ? v.slice(0, 21) + '…' : v)}</span>`;
  }
  return `<div class="bp-pin k-${esc(p.k)}" title="${esc(p.n)}: ${esc(p.t)}"><i class="pi ${esc(p.c)}"></i><span>${esc(p.n)}</span>${lit}</div>`;
}

// compact: the Quick start graph's version (no caption); hl names the exec output that is wired.
function nodeHtml(n, compact = false, hl = null) {
  const ins = [];
  const outs = [];
  if (n.kind !== 'event' && n.kind !== 'pure') ins.push(bpPin(''));
  if (n.kind === 'call' || n.kind === 'event') outs.push(bpPin('', hl === ''));
  (n.exec || []).forEach(e => outs.push(bpPin(e, hl === e)));
  const inputs = n.inputs || [];
  inputs.filter(p => !p.adv).forEach(p => ins.push(bpPin(p)));
  (n.outputs || []).forEach(p => outs.push(bpPin(p)));
  const adv = inputs.filter(p => p.adv).length;
  const tag = n.platform ? `<span class="tag">${esc(n.platform === 'Mobile' ? 'Mobile' : n.platform)}</span>` : '';
  const title = compact ? `<a href="#${esc(n.id)}">${esc(n.title)}</a>` : esc(n.title);
  const body = `<div class="bpn"><header>${ICONS[n.kind]}<span class="t">${title}</span>${tag}</header>
    <div class="io"><div class="col">${ins.join('')}</div><div class="col out">${outs.join('')}</div></div>
    ${adv ? `<div class="advn" title="Advanced pins, folded like in the editor">▾ ${adv} advanced</div>` : ''}</div>`;
  if (compact) return `<div class="node bp ${n.kind}">${body}</div>`;

  const fn = n.fn ? `${esc(n.owner ? n.owner.replace(/^U/, '') + '::' : '')}${esc(n.fn)}` : (n.name ? `Firebase BP Subsystem · ${esc(n.name)}` : '');
  const { summary, rest } = splitDoc(n.doc);
  const typeLink = p => p.r && typeIds.has(p.r) ? `<a href="#${esc(p.r)}">${esc(p.t)}</a>` : esc(p.t);
  const pinRows = [...inputs.map(p => ['in', p]), ...(n.outputs || []).map(p => ['out', p])]
    .map(([d, p]) => `<li><span class="dir">${d}</span> ${esc(p.n)} <span class="ty">${typeLink(p)}</span>${p.adv ? ' <span class="ty">advanced</span>' : ''}</li>`).join('');
  return `<article class="node bp ${n.kind}" id="${esc(n.id)}" data-plat="${esc(n.platform)}">
    ${body}
    ${summary ? `<p class="cap">${esc(summary).replace(/`([^`]+)`/g, '<code>$1</code>')}</p>` : ''}
    <details class="more"><summary>Details</summary>
      ${pinRows ? `<ul class="pinlist">${pinRows}</ul>` : ''}
      <div class="doc">${docHtml(rest.join('\n\n'))}</div>
      <p class="fn">${fn}</p>
    </details>
  </article>`;
}
function typeHtml(t) {
  let body;
  if (t.kind === 'struct') {
    body = `<div class="table-wrap"><table class="fields"><tbody>${t.fields.map(f => `<tr><td>${pinHtml(f)}</td><td class="doc-cell">${docHtml(f.doc)}</td></tr>`).join('')}</tbody></table></div>`;
  } else {
    body = `<div class="table-wrap"><table class="fields"><tbody>${t.values.map(v => `<tr><td><span class="mono">${esc(v.n)}</span>${v.v !== undefined ? ` <span class="pd">= ${esc(v.v)}</span>` : ''}</td><td class="doc-cell">${docHtml(v.doc)}</td></tr>`).join('')}</tbody></table></div>`;
  }
  return `<article class="node type" id="${esc(t.id)}" data-plat="">
    <header>${ICONS.type}<h4>${esc(t.name)}</h4><span class="kind">${t.kind === 'struct' ? 'Struct' : 'Enum'}</span></header>
    ${t.doc ? `<div class="doc" style="padding-top:8px">${docHtml(t.doc)}</div>` : ''}
    ${body}
  </article>`;
}

function render() {
  document.getElementById('ver').textContent = `${MODEL.nodes.length} nodes · ${MODEL.events.length} events · generated ${MODEL.generated}`;
  const rail = [`<li><a href="#start"><span class="lbl"><span class="mg sm home">✦</span>Getting started</span></a></li>`];
  const parts = [];
  const SVG = {
    file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></svg>',
    toggle: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="6" rx="3"/><circle cx="17" cy="8" r="1.6" fill="currentColor"/><rect x="3" y="13" width="18" height="6" rx="3"/><circle cx="7" cy="16" r="1.6"/></svg>',
    node: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="5" width="12" height="14" rx="2"/><path d="M3 9h12"/><path d="M15 13h6m-3-3 3 3-3 3"/></svg>',
  };
  const tiles = MODEL.modules.map(m => {
    const g = MODEL.guide[m] || {};
    const n = MODEL.nodes.filter(x => x.module === m).length;
    const e = MODEL.events.filter(x => x.module === m).length;
    return `<a class="tile" href="#module-${slug(m)}" style="--h:${g.hue}"><span class="mg">${esc(g.mono)}</span><span class="tname">${esc(m)}</span><span class="ttag">${esc(g.tagline)}</span><span class="tcount">${n} nodes${e ? ` · ${e} events` : ''}</span></a>`;
  }).join('');
  parts.push(`<section class="module" id="start">
    <div class="hero">
      <h2>Firebase and Google Play in Blueprint</h2>
      <p class="lede">${MODEL.nodes.length} nodes in ${MODEL.modules.length} modules, generated from the plugin's own headers.</p>
      <ol class="howto">
        <li><span class="hico">${SVG.file}</span><b>Add your Firebase config</b><span>google-services.json · GoogleService-Info.plist → Config/Firebase/</span></li>
        <li><span class="hico">${SVG.toggle}</span><b>Keep the modules you use</b><span>Project Settings → Plugins → Firebase BP</span></li>
        <li><span class="hico">${SVG.node}</span><b>Call the nodes</b><span>async nodes fire an exec output when the request ends</span></li>
      </ol>
      <div class="tiles">${tiles}</div>
      <div class="legend" aria-label="Legend">
        <span><i style="background:var(--hd-async)"></i>Async (latent)</span>
        <span><i style="background:var(--hd-call)"></i>Callable</span>
        <span><i style="background:var(--hd-pure)"></i>Pure</span>
        <span><i style="background:var(--hd-event)"></i>Global event</span>
        <span><span class="badge Android">Android only</span> fails fast on other platforms</span>
      </div>
    </div>
  </section>`);

  const byId = new Map(MODEL.nodes.map(n => [n.id, n]));
  for (const m of MODEL.modules) {
    const g = MODEL.guide[m] || {};
    const nodes = MODEL.nodes.filter(n => n.module === m);
    const events = MODEL.events.filter(e => e.module === m);
    const types = MODEL.types.filter(t => t.module === m);
    if (!nodes.length && !events.length && !types.length) continue;
    const id = 'module-' + slug(m);
    rail.push(`<li><a href="#${id}"><span class="lbl"><span class="mg sm" style="--h:${g.hue}">${esc(g.mono)}</span>${esc(m)}</span><span class="n">${nodes.length + events.length}</span></a></li>`);

    let html = `<section class="module" id="${id}" style="--h:${g.hue}"><div class="module-head"><span class="mg">${esc(g.mono)}</span><h2>${esc(m)}</h2><span class="meta">${nodes.length} nodes${events.length ? ` · ${events.length} events` : ''}${types.length ? ` · ${types.length} types` : ''}</span>${g.tagline ? `<p class="tagline">${esc(g.tagline)}</p>` : ''}</div>`;

    if (g.recipe) {
      const steps = g.recipe.steps.map(s => ({ node: byId.get(s.id), via: s.via }));
      const graph = steps.map((s, i) => {
        const last = i === steps.length - 1;
        const wire = last ? '' : `<div class="wire" aria-hidden="true"><span>${esc(s.via || 'then')}</span><i></i></div>`;
        return nodeHtml(s.node, true, last ? null : s.via) + wire;
      }).join('');
      html += `<div class="recipe"><div class="recipe-title">Quick start<span>${esc(g.recipe.title)}</span></div><div class="graph">${graph}</div></div>`;
    }

    if (events.length) html += `<h3 class="group">Events · bind on the Firebase BP subsystem</h3><div class="cards bpgrid">${events.map(e => nodeHtml(Object.assign({ kind: 'event' }, e))).join('')}</div>`;

    // Topic order: guide.json's order, then whatever is left.
    const topics = new Map((g.topics || []).map(t => [t, []]));
    for (const n of nodes) { const t = n.topic || 'Nodes'; if (!topics.has(t)) topics.set(t, []); topics.get(t).push(n); }
    const order = { async: 0, call: 1, pure: 2 };
    for (const [t, list] of topics) {
      if (!list.length) continue;
      list.sort((a, b) => order[a.kind] - order[b.kind] || a.title.localeCompare(b.title));
      html += `<h3 class="group">${esc(t)}</h3><div class="cards bpgrid">${list.map(n => nodeHtml(n)).join('')}</div>`;
    }
    if (types.length) html += `<details class="types"><summary>Types · ${types.length === 1 ? '1 type' : `${types.length} structs and enums`} used by these nodes</summary><div class="cards">${types.map(typeHtml).join('')}</div></details>`;
    html += `</section>`;
    parts.push(html);
  }

  // Project Settings
  const cats = new Map();
  for (const s of MODEL.settings) { if (!cats.has(s.cat)) cats.set(s.cat, []); cats.get(s.cat).push(s); }
  rail.push(`<li class="sep" aria-hidden="true"></li><li><a href="#settings"><span class="lbl"><span class="mg sm" style="--h:220">⚙</span>Project Settings</span><span class="n">${MODEL.settings.length}</span></a></li>`);
  parts.push(`<section class="module" id="settings"><div class="module-head"><h2>Project Settings</h2><span class="meta">Project Settings → Plugins → Firebase BP</span></div>
    ${[...cats].map(([c, list]) => `<div class="settings-cat"><h3>${esc(c)}</h3><div class="node type" style="overflow:hidden"><div class="table-wrap"><table class="fields"><tbody>${list.map(s => `<tr data-plat=""><td><span class="mono">${esc(s.n)}</span><span class="pt" style="display:block;font:11.5px var(--f-mono);color:var(--ink-3)">${esc(s.t)}${s.d !== undefined ? ' = ' + esc(s.d) : ''}${s.cond ? ' · when ' + esc(s.cond) : ''}</span></td><td class="doc-cell">${docHtml(s.doc)}</td></tr>`).join('')}</tbody></table></div></div></div>`).join('')}
  </section>`);
  parts.push(`<div class="empty" id="empty" hidden>No node matches this search.</div>`);

  document.getElementById('rail').innerHTML = rail.join('');
  document.getElementById('main').innerHTML = parts.join('');
}

let plat = '';
function applyFilter() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const terms = q.split(/\s+/).filter(Boolean);
  let shown = 0, total = 0;
  for (const card of document.querySelectorAll('section.module:not(#start):not(#settings) .cards > .node')) {
    total++;
    const text = card.textContent.toLowerCase();
    const p = card.dataset.plat;
    const platOk = !plat || (plat === 'Android' ? p === 'Android' : (p !== 'Android' && !card.classList.contains('type')));
    const ok = platOk && terms.every(t => text.includes(t));
    card.hidden = !ok;
    if (ok) shown++;
  }
  for (const grid of document.querySelectorAll('.cards')) {
    const any = [...grid.children].some(c => !c.hidden);
    grid.hidden = !any;
    const h = grid.previousElementSibling;
    if (h && h.classList.contains('group')) h.hidden = !any;
  }
  const filtering = terms.length || plat;
  for (const d of document.querySelectorAll('details.types')) {
    const any = [...d.querySelectorAll('.cards > .node')].some(c => !c.hidden);
    d.hidden = !any;
    d.open = !!(filtering && any);
  }
  for (const r of document.querySelectorAll('.recipe')) r.hidden = !!filtering;
  // One module per page; a search looks through every module at once.
  for (const sec of document.querySelectorAll('section.module')) {
    sec.hidden = filtering
      ? sec.id === 'start' || sec.id === 'settings' || ![...sec.querySelectorAll('.cards > .node')].some(c => !c.hidden)
      : sec.id !== view;
  }
  for (const p of document.querySelectorAll('.pager')) p.hidden = !!filtering;
  document.getElementById('empty').hidden = !filtering || shown > 0;
  document.getElementById('count').textContent = filtering ? `${shown} / ${total}` : '';
}

let view = 'start';
// Shows the page (module) holding the hash target, then scrolls to it; navigating ends a search.
function go(hash) {
  const id = decodeURIComponent((hash || '').slice(1));
  const el = (id && document.getElementById(id)) || document.getElementById('start');
  const sec = el.closest('section.module') || document.getElementById('start');
  view = sec.id;
  if (document.getElementById('q').value || plat) {
    document.getElementById('q').value = '';
    plat = '';
    for (const o of document.querySelectorAll('.filters button')) o.setAttribute('aria-pressed', String(o.dataset.p === ''));
  }
  applyFilter();
  for (const a of document.querySelectorAll('#rail a')) {
    if (a.getAttribute('href') === '#' + view) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  }
  closeDrawer();
  for (let p = el.parentElement; p; p = p.parentElement) if (p.tagName === 'DETAILS') p.open = true;
  if (el === sec) window.scrollTo(0, 0); else el.scrollIntoView();
}

render();
document.getElementById('q').addEventListener('input', applyFilter);
for (const b of document.querySelectorAll('.filters button')) {
  b.addEventListener('click', () => {
    plat = b.dataset.p;
    for (const o of document.querySelectorAll('.filters button')) o.setAttribute('aria-pressed', String(o === b));
    applyFilter();
  });
}
// ☰: a drawer on phones (closed by default), a collapsible column on wide screens (remembered).
const narrow = matchMedia('(max-width: 860px)');
const menuBtn = document.getElementById('menu-btn');
function syncMenuButton() {
  const open = narrow.matches ? document.body.classList.contains('nav-open') : !document.body.classList.contains('nav-collapsed');
  menuBtn.setAttribute('aria-expanded', String(open));
}
function closeDrawer() {
  document.body.classList.remove('nav-open');
  syncMenuButton();
}
try { if (localStorage.getItem('fbp-nav-collapsed') === '1') document.body.classList.add('nav-collapsed'); } catch (e) {}
menuBtn.addEventListener('click', () => {
  if (narrow.matches) {
    document.body.classList.toggle('nav-open');
  } else {
    const collapsed = document.body.classList.toggle('nav-collapsed');
    try { localStorage.setItem('fbp-nav-collapsed', collapsed ? '1' : '0'); } catch (e) {}
  }
  syncMenuButton();
});
document.getElementById('menu-close').addEventListener('click', closeDrawer);
document.getElementById('scrim').addEventListener('click', closeDrawer);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
narrow.addEventListener('change', () => { closeDrawer(); });

// Previous / next page links at the bottom of every page, in rail order.
const pages = [...document.querySelectorAll('section.module')];
const label = s => s.id === 'start' ? 'Getting started' : s.querySelector('.module-head h2').textContent;
pages.forEach((sec, i) => {
  const prev = pages[i - 1], next = pages[i + 1];
  sec.insertAdjacentHTML('beforeend', `<nav class="pager" aria-label="Pages">${prev ? `<a href="#${prev.id}"><small>Previous</small>${esc(label(prev))}</a>` : '<span></span>'}${next ? `<a class="next" href="#${next.id}"><small>Next</small>${esc(label(next))}</a>` : ''}</nav>`);
});
window.addEventListener('hashchange', () => go(location.hash));
go(location.hash);
</script>
