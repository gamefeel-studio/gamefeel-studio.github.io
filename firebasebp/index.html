se},{"n":"Value","t":"FirebaseFirestoreValue","k":"struct","c":"","r":"FFirebaseFirestoreValue","adv":false}],"outputs":[{"n":"Return Value","t":"FirestoreQuery","k":"object","c":"","r":""}],"exec":[],"topic":"Queries"},{"id":"UFirestoreQuery_WhereArrayContainsAny","title":"Where Array Contains Any","fn":"WhereArrayContainsAny","owner":"UFirestoreQuery","kind":"call","module":"Firestore","group":"Query","platform":"","doc":"Field's value must be an array containing at least one of Values. Only one array-type Where (this/ArrayContains/In) per query.","inputs":[{"n":"Target","t":"FirestoreQuery","k":"object","c":"","r":"","target":true},{"n":"Field","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Values","t":"Array of FirebaseFirestoreValue","k":"struct","c":"array","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"FirestoreQuery","k":"object","c":"","r":""}],"exec":[],"topic":"Queries"},{"id":"UFirestoreQuery_WhereIn","title":"Where In","fn":"WhereIn","owner":"UFirestoreQuery","kind":"call","module":"Firestore","group":"Query","platform":"","doc":"Field's value must equal one of Values. Only one WhereIn per query; can't combine with WhereArrayContainsAny.","inputs":[{"n":"Target","t":"FirestoreQuery","k":"object","c":"","r":"","target":true},{"n":"Field","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Values","t":"Array of FirebaseFirestoreValue","k":"struct","c":"array","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"FirestoreQuery","k":"object","c":"","r":""}],"exec":[],"topic":"Queries"},{"id":"UFirestoreQuery_WhereNotIn","title":"Where Not In","fn":"WhereNotIn","owner":"UFirestoreQuery","kind":"call","module":"Firestore","group":"Query","platform":"","doc":"Field's value must not equal any of Values. Only one WhereNotIn per query; can't combine with WhereArrayContains(Any)/WhereIn/WhereNotEqualTo.","inputs":[{"n":"Target","t":"FirestoreQuery","k":"object","c":"","r":"","target":true},{"n":"Field","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Values","t":"Array of FirebaseFirestoreValue","k":"struct","c":"array","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"FirestoreQuery","k":"object","c":"","r":""}],"exec":[],"topic":"Queries"},{"id":"UFirestoreQuery_OrderBy","title":"Order By","fn":"OrderBy","owner":"UFirestoreQuery","kind":"call","module":"Firestore","group":"Query","platform":"","doc":"Sorts results by Field. Order of OrderBy calls matters when chaining more than one.","inputs":[{"n":"Target","t":"FirestoreQuery","k":"object","c":"","r":"","target":true},{"n":"Field","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Direction","t":"EFirebaseFirestoreQueryDirection","k":"enum","c":"","r":"EFirebaseFirestoreQueryDirection","d":"EFirebaseFirestoreQueryDirection::Ascending","adv":false}],"outputs":[{"n":"Return Value","t":"FirestoreQuery","k":"object","c":"","r":""}],"exec":[],"topic":"Queries"},{"id":"UFirestoreQuery_Limit","title":"Limit","fn":"Limit","owner":"UFirestoreQuery","kind":"call","module":"Firestore","group":"Query","platform":"","doc":"Keeps only the first Count results (by the query's order).","inputs":[{"n":"Target","t":"FirestoreQuery","k":"object","c":"","r":"","target":true},{"n":"Count","t":"Integer","k":"int","c":"","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"FirestoreQuery","k":"object","c":"","r":""}],"exec":[],"topic":"Queries"},{"id":"UFirestoreQuery_LimitToLast","title":"Limit To Last","fn":"LimitToLast","owner":"UFirestoreQuery","kind":"call","module":"Firestore","group":"Query","platform":"","doc":"Keeps only the last Count results (by the query's order). Requires at least one OrderBy on the query; Count must be positive (same for Limit).","inputs":[{"n":"Target","t":"FirestoreQuery","k":"object","c":"","r":"","target":true},{"n":"Count","t":"Integer","k":"int","c":"","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"FirestoreQuery","k":"object","c":"","r":""}],"exec":[],"topic":"Queries"},{"id":"UFirestoreQuery_StartAt","title":"Start At","fn":"StartAt","owner":"UFirestoreQuery","kind":"call","module":"Firestore","group":"Query","platform":"","doc":"Keeps only results starting at (inclusive) the given field value(s) —\none per OrderBy call on this query, in the same order — relative to the\nquery's own sort order. Pass the last document's own OrderBy field\nvalue(s) from a previous page to fetch the next one, without the\nLimit/Offset-style \"skip N documents\" cost of re-reading everything up\nto that point.","inputs":[{"n":"Target","t":"FirestoreQuery","k":"object","c":"","r":"","target":true},{"n":"Values","t":"Array of FirebaseFirestoreValue","k":"struct","c":"array","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"FirestoreQuery","k":"object","c":"","r":""}],"exec":[],"topic":"Queries"},{"id":"UFirestoreQuery_StartAfter","title":"Start After","fn":"StartAfter","owner":"UFirestoreQuery","kind":"call","module":"Firestore","group":"Query","platform":"","doc":"Same as StartAt, but excludes a result that exactly matches Values (i.e. resumes strictly after it, not at it).","inputs":[{"n":"Target","t":"FirestoreQuery","k":"object","c":"","r":"","target":true},{"n":"Values","t":"Array of FirebaseFirestoreValue","k":"struct","c":"array","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"FirestoreQuery","k":"object","c":"","r":""}],"exec":[],"topic":"Queries"},{"id":"UFirestoreQuery_EndBefore","title":"End Before","fn":"EndBefore","owner":"UFirestoreQuery","kind":"call","module":"Firestore","group":"Query","platform":"","doc":"Keeps only results ending before (exclusive) the given field value(s), one per OrderBy call, relative to the query's own sort order.","inputs":[{"n":"Target","t":"FirestoreQuery","k":"object","c":"","r":"","target":true},{"n":"Values","t":"Array of FirebaseFirestoreValue","k":"struct","c":"array","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"FirestoreQuery","k":"object","c":"","r":""}],"exec":[],"topic":"Queries"},{"id":"UFirestoreQuery_EndAt","title":"End At","fn":"EndAt","owner":"UFirestoreQuery","kind":"call","module":"Firestore","group":"Query","platform":"","doc":"Same as EndBefore, but includes a result that exactly matches Values.","inputs":[{"n":"Target","t":"FirestoreQuery","k":"object","c":"","r":"","target":true},{"n":"Values","t":"Array of FirebaseFirestoreValue","k":"struct","c":"array","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"FirestoreQuery","k":"object","c":"","r":""}],"exec":[],"topic":"Queries"},{"id":"UFirestoreQuery_IsValid","title":"Is Valid","fn":"IsValid","owner":"UFirestoreQuery","kind":"pure","module":"Firestore","group":"Query","platform":"","doc":"False if the collection path used to create this query was invalid,\nFirestore wasn't initialized yet (or was terminated since), or anything\nchained onto it was rejected — mutually exclusive filter kinds (e.g.\nWhereNotEqualTo + WhereNotIn), an empty In/NotIn/ArrayContainsAny list,\na non-positive Limit, LimitToLast without OrderBy, more cursor values\nthan OrderBy calls, OrderBy after a cursor... The reason is logged under\nLogFirebaseBPFirestore. Running an invalid query fails with\nInvalidArgument instead of reaching the SDK, which would crash the app\non most of these.","inputs":[{"n":"Target","t":"FirestoreQuery","k":"object","c":"","r":"","target":true}],"outputs":[{"n":"Return Value","t":"Boolean","k":"bool","c":"","r":""}],"exec":[],"topic":"Queries"},{"id":"UFirestoreQueryLibrary_MakeCollectionQuery","title":"Make Collection Query","fn":"MakeCollectionQuery","owner":"UFirestoreQueryLibrary","kind":"call","module":"Firestore","group":"Query","platform":"","doc":"Starts a query over every document directly in the collection at\nCollectionPath (e.g. \"players\") — chain WhereXxx/OrderBy/Limit calls on\nthe result, then run it with GetQueryDocuments.","inputs":[{"n":"CollectionPath","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"FirestoreQuery","k":"object","c":"","r":""}],"exec":[],"topic":"Queries"},{"id":"UFirestoreQueryLibrary_MakeCollectionGroupQuery","title":"Make Collection Group Query","fn":"MakeCollectionGroupQuery","owner":"UFirestoreQueryLibrary","kind":"call","module":"Firestore","group":"Query","platform":"","doc":"Starts a query over every document in every collection (at any depth in\nthe database) whose collection ID equals CollectionId — e.g. a\n\"comments\" collection group query matches \"posts/1/comments/abc\" and\n\"posts/2/comments/xyz\" alike, without knowing every parent path up\nfront. CollectionId is a bare collection ID (e.g. \"comments\"), not a\n\"/\"-separated path like MakeCollectionQuery takes.\n\nRequires a matching composite index (Firestore Console will link you to\ncreate one the first time a given WhereXxx/OrderBy combination needs\nit) — same as any other Firestore query that can't be served by the\ndefault automatic indexes.","inputs":[{"n":"CollectionId","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"FirestoreQuery","k":"object","c":"","r":""}],"exec":[],"topic":"Queries"},{"id":"UFirestoreQueryLibrary_GetFirestoreDocumentIdFieldPath","title":"Get Firestore Document Id Field Path","fn":"GetFirestoreDocumentIdFieldPath","owner":"UFirestoreQueryLibrary","kind":"pure","module":"Firestore","group":"Query","platform":"","doc":"Pass this as any WhereXxx/OrderBy call's Field to filter/sort by the\ndocument's own ID (firebase::firestore::FieldPath::DocumentId()) instead\nof a regular field — e.g. OrderBy(GetFirestoreDocumentIdFieldPath()) for\na stable pagination sort key when no other field is guaranteed unique.","inputs":[],"outputs":[{"n":"Return Value","t":"String","k":"string","c":"","r":""}],"exec":[],"topic":"Queries"},{"id":"UGetFirestoreQueryDocumentsProxy_GetQueryDocuments","title":"Get Query Documents","fn":"GetQueryDocuments","owner":"UGetFirestoreQueryDocumentsProxy","kind":"async","module":"Firestore","group":"Query","platform":"","doc":"Runs a UFirestoreQuery and returns the matching documents.\n\nSource: force a fresh Server read (fail rather than fall back to stale cache) or a Cache-only read (instant, no network) instead of the SDK's own Default (server, falling back to cache).\nTimestampBehavior: how to read back server timestamps not yet resolved by the server — same as Get Document.","inputs":[{"n":"Query","t":"FirestoreQuery","k":"object","c":"","r":"","adv":false},{"n":"Source","t":"EFirebaseFirestoreSource","k":"enum","c":"","r":"EFirebaseFirestoreSource","d":"EFirebaseFirestoreSource::Default","adv":true},{"n":"TimestampBehavior","t":"EFirebaseFirestoreServerTimestampBehavior","k":"enum","c":"","r":"EFirebaseFirestoreServerTimestampBehavior","d":"EFirebaseFirestoreServerTimestampBehavior::None","adv":true}],"outputs":[{"n":"Error","t":"EFirebaseFirestoreError","k":"enum","c":"","r":"EFirebaseFirestoreError"},{"n":"Documents","t":"Array of FirebaseFirestoreQueryDocument","k":"struct","c":"array","r":""}],"exec":["OnSuccess","OnError"],"topic":"Queries"},{"id":"UGetFirestoreQueryCountProxy_GetQueryCount","title":"Get Query Count","fn":"GetQueryCount","owner":"UGetFirestoreQueryCountProxy","kind":"async","module":"Firestore","group":"Query","platform":"","doc":"Runs Query as a COUNT aggregation instead of downloading its matching\ndocuments — cheaper and faster whenever you only need how many documents\nmatch, not their contents (e.g. a \"how many players are online\" counter),\nespecially for a result set too large to want to download in full just to\ncall Array Length on it. Always goes to the server (this SDK version has\nno cache-only aggregate source), so it fails like any other server call\nwould while offline.","inputs":[{"n":"Query","t":"FirestoreQuery","k":"object","c":"","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseFirestoreError","k":"enum","c":"","r":"EFirebaseFirestoreError"},{"n":"Count","t":"Integer64","k":"int64","c":"","r":""}],"exec":["OnSuccess","OnError"],"topic":"Queries"},{"id":"UGetFirestoreNamedQueryProxy_GetFirestoreNamedQuery","title":"Get Firestore Named Query","fn":"GetFirestoreNamedQuery","owner":"UGetFirestoreNamedQueryProxy","kind":"async","module":"Firestore","group":"Query","platform":"","doc":"Resolves a query by name from a bundle already loaded via\nULoadFirestoreBundleProxy::LoadFirestoreBundle — the bundle's own author\ndecides what QueryName means and which query it maps to (e.g. \"recent-posts\"\nmight map to a specific OrderBy+Limit query baked into the bundle at build\ntime). Fails with NotFound if no bundle defining this name has been loaded\nyet, or QueryName doesn't match any query the loaded bundle(s) define.\nChain further WhereXxx/OrderBy/Limit calls onto the result the same as any\nother UFirestoreQuery, then run it with GetQueryDocuments as usual.","inputs":[{"n":"QueryName","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseFirestoreError","k":"enum","c":"","r":"EFirebaseFirestoreError"},{"n":"Query","t":"class UFirestoreQuery","k":"object","c":"","r":""}],"exec":["OnSuccess","OnError"],"topic":"Queries"},{"id":"UFirestoreTransactionContext_GetDocument","title":"Get Document","fn":"GetDocument","owner":"UFirestoreTransactionContext","kind":"call","module":"Firestore","group":"Transaction","platform":"","doc":"Reads DocumentPath's current value within this transaction — the SDK\ntracks every document read this way and automatically retries the\nwhole attempt (a fresh OnAttempt call) if any of them changes before\nthis transaction commits, so prefer this over GetDocument/\nGetFirestoreDocumentJson for any value this transaction's own writes\ndepend on.","inputs":[{"n":"Target","t":"FirestoreTransactionContext","k":"object","c":"","r":"","target":true},{"n":"DocumentPath","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"bSuccess","t":"Boolean","k":"bool","c":"","r":""},{"n":"bExists","t":"Boolean","k":"bool","c":"","r":""},{"n":"Fields","t":"Map of String to FirebaseFirestoreValue","k":"string","c":"map","r":""}],"exec":[],"topic":"Transactions"},{"id":"UFirestoreTransactionContext_SetDocument","title":"Set Document","fn":"SetDocument","owner":"UFirestoreTransactionContext","kind":"call","module":"Firestore","group":"Transaction","platform":"","doc":"Stages a write to DocumentPath, applied only if/when this whole transaction commits successfully. Same semantics as USetFirestoreDocumentProxy::SetDocument (including MergeFields).","inputs":[{"n":"Target","t":"FirestoreTransactionContext","k":"object","c":"","r":"","target":true},{"n":"DocumentPath","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Data","t":"Map of String to FirebaseFirestoreValue","k":"string","c":"map","r":"","adv":false},{"n":"bMerge","t":"Boolean","k":"bool","c":"","r":"","adv":false},{"n":"MergeFields","t":"Array of String","k":"string","c":"array","r":"","adv":true}],"outputs":[],"exec":[],"topic":"Transactions"},{"id":"UFirestoreTransactionContext_UpdateDocument","title":"Update Document","fn":"UpdateDocument","owner":"UFirestoreTransactionContext","kind":"call","module":"Firestore","group":"Transaction","platform":"","doc":"Stages a field update to DocumentPath, applied only if/when this whole transaction commits successfully. Same semantics as UUpdateFirestoreDocumentProxy::UpdateDocument.","inputs":[{"n":"Target","t":"FirestoreTransactionContext","k":"object","c":"","r":"","target":true},{"n":"DocumentPath","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Data","t":"Map of String to FirebaseFirestoreValue","k":"string","c":"map","r":"","adv":false}],"outputs":[],"exec":[],"topic":"Transactions"},{"id":"UFirestoreTransactionContext_DeleteDocument","title":"Delete Document","fn":"DeleteDocument","owner":"UFirestoreTransactionContext","kind":"call","module":"Firestore","group":"Transaction","platform":"","doc":"Stages a deletion of DocumentPath, applied only if/when this whole transaction commits successfully.","inputs":[{"n":"Target","t":"FirestoreTransactionContext","k":"object","c":"","r":"","target":true},{"n":"DocumentPath","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[],"exec":[],"topic":"Transactions"},{"id":"UFirestoreTransactionContext_FailTransaction","title":"Fail Transaction","fn":"FailTransaction","owner":"UFirestoreTransactionContext","kind":"call","module":"Firestore","group":"Transaction","platform":"","doc":"Deliberately aborts this transaction attempt instead of committing any\nof its staged writes — e.g. after GetDocument shows a balance too low\nfor the transfer this transaction was meant to perform. The whole\nRunFirestoreTransaction call fails with EFirebaseFirestoreError::Aborted\nand Reason is logged; unlike a real write conflict, this is NOT retried.","inputs":[{"n":"Target","t":"FirestoreTransactionContext","k":"object","c":"","r":"","target":true},{"n":"Reason","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[],"exec":[],"topic":"Transactions"},{"id":"UFirestoreTransactionContext_IsValid","title":"Is Valid","fn":"IsValid","owner":"UFirestoreTransactionContext","kind":"pure","module":"Firestore","group":"Transaction","platform":"","doc":"False once this attempt's OnAttempt call has already returned — see the class comment.","inputs":[{"n":"Target","t":"FirestoreTransactionContext","k":"object","c":"","r":"","target":true}],"outputs":[{"n":"Return Value","t":"Boolean","k":"bool","c":"","r":""}],"exec":[],"topic":"Transactions"},{"id":"URunFirestoreTransactionProxy_RunFirestoreTransaction","title":"Run Firestore Transaction","fn":"RunFirestoreTransaction","owner":"URunFirestoreTransactionProxy","kind":"async","module":"Firestore","group":"Transaction","platform":"","doc":"Runs a Firestore transaction: OnAttempt is broadcast once per attempt\n(usually once, but Firestore may retry automatically on a write conflict)\nwith a Context to synchronously Get/Set/Update/Delete documents through —\nsee UFirestoreTransactionContext's own class comment for the\nsynchronous-only constraint this relies on. OnSuccess/OnError report the\noutcome of the transaction as a whole, once every attempt is done.\n\nPrefer UFirestoreWriteBatchLibrary/UCommitFirestoreWriteBatchProxy instead\nwhenever a write doesn't need to be conditioned on a document's current\nvalue — a write batch is simpler, is persisted offline, and never needs\nOnAttempt's synchronous-handler constraint.\n\nMaxAttempts: how many times to retry the whole transaction on a write conflict before giving up (the SDK's own default is 5) — lower it to fail fast on a highly-contended document instead of retrying repeatedly, or raise it for one where retrying longer is worth it. Must be greater than zero.","inputs":[{"n":"MaxAttempts","t":"Integer","k":"int","c":"","r":"","d":"5","adv":true}],"outputs":[{"n":"Context","t":"FirestoreTransactionContext","k":"object","c":"","r":""},{"n":"Error","t":"EFirebaseFirestoreError","k":"enum","c":"","r":"EFirebaseFirestoreError"}],"exec":["OnAttempt","OnSuccess","OnError"],"topic":"Transactions"},{"id":"UFirestoreWriteBatch_Set","title":"Set","fn":"Set","owner":"UFirestoreWriteBatch","kind":"call","module":"Firestore","group":"WriteBatch","platform":"","doc":"Stages a write to DocumentPath — same semantics as USetFirestoreDocumentProxy::SetDocument (including MergeFields), but not applied until this batch is committed.","inputs":[{"n":"Target","t":"FirestoreWriteBatch","k":"object","c":"","r":"","target":true},{"n":"DocumentPath","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Data","t":"Map of String to FirebaseFirestoreValue","k":"string","c":"map","r":"","adv":false},{"n":"bMerge","t":"Boolean","k":"bool","c":"","r":"","adv":false},{"n":"MergeFields","t":"Array of String","k":"string","c":"array","r":"","adv":true}],"outputs":[{"n":"Return Value","t":"FirestoreWriteBatch","k":"object","c":"","r":""}],"exec":[],"topic":"Write batches"},{"id":"UFirestoreWriteBatch_Update","title":"Update","fn":"Update","owner":"UFirestoreWriteBatch","kind":"call","module":"Firestore","group":"WriteBatch","platform":"","doc":"Stages a field update to DocumentPath — same semantics as UUpdateFirestoreDocumentProxy::UpdateDocument, but not applied until this batch is committed.","inputs":[{"n":"Target","t":"FirestoreWriteBatch","k":"object","c":"","r":"","target":true},{"n":"DocumentPath","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Data","t":"Map of String to FirebaseFirestoreValue","k":"string","c":"map","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"FirestoreWriteBatch","k":"object","c":"","r":""}],"exec":[],"topic":"Write batches"},{"id":"UFirestoreWriteBatch_Delete","title":"Delete","fn":"Delete","owner":"UFirestoreWriteBatch","kind":"call","module":"Firestore","group":"WriteBatch","platform":"","doc":"Stages a deletion of DocumentPath — same semantics as UDeleteFirestoreDocumentProxy::DeleteDocument, but not applied until this batch is committed.","inputs":[{"n":"Target","t":"FirestoreWriteBatch","k":"object","c":"","r":"","target":true},{"n":"DocumentPath","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"FirestoreWriteBatch","k":"object","c":"","r":""}],"exec":[],"topic":"Write batches"},{"id":"UFirestoreWriteBatch_IsValid","title":"Is Valid","fn":"IsValid","owner":"UFirestoreWriteBatch","kind":"pure","module":"Firestore","group":"WriteBatch","platform":"","doc":"False if Firestore wasn't available when this batch was created, any\nSet/Update/Delete call so far was given an invalid document path or\ninvalid data, or the batch has already been committed — a batch can\nonly be committed once: to retry after a failed commit, build a new\none with Make Write Batch.","inputs":[{"n":"Target","t":"FirestoreWriteBatch","k":"object","c":"","r":"","target":true}],"outputs":[{"n":"Return Value","t":"Boolean","k":"bool","c":"","r":""}],"exec":[],"topic":"Write batches"},{"id":"UFirestoreWriteBatchLibrary_MakeWriteBatch","title":"Make Write Batch","fn":"MakeWriteBatch","owner":"UFirestoreWriteBatchLibrary","kind":"call","module":"Firestore","group":"WriteBatch","platform":"","doc":"Starts a new, empty write batch — chain Set/Update/Delete calls onto the result, then commit it with CommitWriteBatch.","inputs":[],"outputs":[{"n":"Return Value","t":"FirestoreWriteBatch","k":"object","c":"","r":""}],"exec":[],"topic":"Write batches"},{"id":"UCommitFirestoreWriteBatchProxy_CommitWriteBatch","title":"Commit Write Batch","fn":"CommitWriteBatch","owner":"UCommitFirestoreWriteBatchProxy","kind":"async","module":"Firestore","group":"WriteBatch","platform":"","doc":"Atomically applies every Set/Update/Delete staged on Batch.","inputs":[{"n":"Batch","t":"FirestoreWriteBatch","k":"object","c":"","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseFirestoreError","k":"enum","c":"","r":"EFirebaseFirestoreError"}],"exec":["OnSuccess","OnError"],"topic":"Write batches"},{"id":"UCallFirebaseFunctionProxy_CallFirebaseFunction","title":"Call Firebase Function","fn":"CallFirebaseFunction","owner":"UCallFirebaseFunctionProxy","kind":"async","module":"Functions","group":"","platform":"","doc":"Calls an HTTPS Callable Cloud Function by name (firebase::functions::Functions::GetHttpsCallable).\nJsonData is the request payload, e.g. {\"amount\":5,\"currency\":\"USD\"} — pass\n\"{}\" (the default) for a function that takes no arguments. JsonResult on\nsuccess is whatever the function returned, re-serialized to JSON the same\nway (a bare value like \"42\" or \"true\" is valid JSON here too, not just\nobjects/arrays — parse it back with the same expectation your function's\nreturn type has).\n\n@param FunctionName Name of the callable, as deployed (e.g. \"addNumbers\").\n@param JsonData Request payload as JSON. Defaults to an empty object.\n@param Region Region the function is deployed to (e.g. \"europe-west1\"). Empty uses the SDK's default (\"us-central1\").\n@param bUseLimitedUseAppCheckToken Request a limited-use App Check token for this call instead of the standard cached one — replay protection for sensitive calls (e.g. a purchase). Requires App Check to be enabled and configured.","inputs":[{"n":"FunctionName","t":"String","k":"string","c":"","r":"","adv":false},{"n":"JsonData","t":"String","k":"string","c":"","r":"","d":"\"{}\"","adv":false},{"n":"Region","t":"String","k":"string","c":"","r":"","d":"\"\"","adv":true},{"n":"bUseLimitedUseAppCheckToken","t":"Boolean","k":"bool","c":"","r":"","d":"false","adv":true}],"outputs":[{"n":"Error","t":"EFirebaseFunctionsError","k":"enum","c":"","r":"EFirebaseFunctionsError"},{"n":"ErrorMessage","t":"String","k":"string","c":"","r":""},{"n":"JsonResult","t":"String","k":"string","c":"","r":""}],"exec":["OnSuccess","OnError"],"topic":""},{"id":"UCallFirebaseFunctionAtURLProxy_CallFirebaseFunctionAtURL","title":"Call Firebase Function At URL","fn":"CallFirebaseFunctionAtURL","owner":"UCallFirebaseFunctionAtURLProxy","kind":"async","module":"Functions","group":"","platform":"","doc":"Calls an HTTPS Callable Cloud Function by its full URL\n(firebase::functions::Functions::GetHttpsCallableFromURL) instead of by\nname — needed for a function hosted on a custom domain, or one deployed to\na different Firebase project than the one this app initialized. Otherwise\nidentical to CallFirebaseFunction.\n\n@param Url Full URL of the deployed callable (e.g. \"https://us-central1-my-project.cloudfunctions.net/addNumbers\").\n@param JsonData Request payload as JSON. Defaults to an empty object.\n@param Region Region used to resolve the underlying Functions instance for this call (e.g. for its App Check/emulator settings) — does NOT change which URL is called. Empty uses the SDK's default.\n@param bUseLimitedUseAppCheckToken Same as CallFirebaseFunction's.","inputs":[{"n":"Url","t":"String","k":"string","c":"","r":"","adv":false},{"n":"JsonData","t":"String","k":"string","c":"","r":"","d":"\"{}\"","adv":false},{"n":"Region","t":"String","k":"string","c":"","r":"","d":"\"\"","adv":true},{"n":"bUseLimitedUseAppCheckToken","t":"Boolean","k":"bool","c":"","r":"","d":"false","adv":true}],"outputs":[{"n":"Error","t":"EFirebaseFunctionsError","k":"enum","c":"","r":"EFirebaseFunctionsError"},{"n":"ErrorMessage","t":"String","k":"string","c":"","r":""},{"n":"JsonResult","t":"String","k":"string","c":"","r":""}],"exec":["OnSuccess","OnError"],"topic":""},{"id":"UFirebaseFunctionsLibrary_UseFirebaseFunctionsEmulator","title":"Use Firebase Functions Emulator","fn":"UseFirebaseFunctionsEmulator","owner":"UFirebaseFunctionsLibrary","kind":"call","module":"Functions","group":"","platform":"","doc":"Points every subsequent call made through Region at a local Cloud\nFunctions emulator instead of production — call once at startup, before\nany Call Firebase Function node, and only in development builds.\nOrigin is host+port, e.g. \"http://10.0.2.2:5001\" for the Android\nemulator talking to a Functions emulator on the host machine's default\nport (\"localhost\" from within an Android emulator refers to the\nemulator itself, not the host — 10.0.2.2 is the documented alias for\nthe host loopback), or \"http://localhost:5001\" everywhere else\n(Windows/iOS Simulator/a physical device on the same network as the\nhost, replacing localhost with the host's LAN IP for a physical device).","inputs":[{"n":"Origin","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Region","t":"String","k":"string","c":"","r":"","d":"\"\"","adv":false}],"outputs":[],"exec":[],"topic":""},{"id":"UGetInstallationsIdProxy_GetInstallationsId","title":"Get Installations Id","fn":"GetInstallationsId","owner":"UGetInstallationsIdProxy","kind":"async","module":"Installations","group":"","platform":"","doc":"Returns a stable identifier that uniquely identifies this app installation\n— unique per install (a fresh install, or a reinstall after uninstall, gets\na new one), stable across app restarts, and shared by every Firebase\nproduct on this install (the FCM registration token exposed by the\nMessaging module is built on top of this same identity, not a substitute\nfor it).","inputs":[],"outputs":[{"n":"Error","t":"EFirebaseInstallationsError","k":"enum","c":"","r":"EFirebaseInstallationsError"},{"n":"InstallationId","t":"String","k":"string","c":"","r":""}],"exec":["OnSuccess","OnError"],"topic":""},{"id":"UGetInstallationsAuthTokenProxy_GetInstallationsAuthToken","title":"Get Installations Auth Token","fn":"GetInstallationsAuthToken","owner":"UGetInstallationsAuthTokenProxy","kind":"async","module":"Installations","group":"","platform":"","doc":"Returns a token that authorizes an entity to perform an action on behalf of\nthis app installation — similar to an OAuth2 token, except it authenticates\nthe install rather than a signed-in user. Set bForceRefresh to always mint\na new token instead of returning a cached one.","inputs":[{"n":"bForceRefresh","t":"Boolean","k":"bool","c":"","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseInstallationsError","k":"enum","c":"","r":"EFirebaseInstallationsError"},{"n":"Token","t":"String","k":"string","c":"","r":""}],"exec":["OnSuccess","OnError"],"topic":""},{"id":"UDeleteInstallationProxy_DeleteInstallation","title":"Delete Installation","fn":"DeleteInstallation","owner":"UDeleteInstallationProxy","kind":"async","module":"Installations","group":"","platform":"","doc":"Deletes this Firebase app installation from the Firebase backend: the\ncurrent GetInstallationsId/GetInstallationsAuthToken results become invalid\nand a subsequent call to either mints a brand new installation identity.\nEvery Firebase product that relies on this installation's identity (e.g.\nFCM's registration token) is invalidated along with it — call\nUnregisterFromFCM first if you also need Messaging's own state cleared.\nUseful for a user-initiated \"forget this device\" / privacy-deletion flow.","inputs":[],"outputs":[{"n":"Error","t":"EFirebaseInstallationsError","k":"enum","c":"","r":"EFirebaseInstallationsError"}],"exec":["OnSuccess","OnError"],"topic":""},{"id":"UGetFCMTokenProxy_GetFCMToken","title":"Get FCM Token","fn":"GetFCMToken","owner":"UGetFCMTokenProxy","kind":"async","module":"Messaging","group":"","platform":"","doc":"Registers this app instance with FCM, creating a Firebase Installation ID\n(FID) if one doesn't already exist, and returns it as \"Token\" for backward\ncompatibility with existing Blueprints — it is no longer a classic FCM\nregistration token under the hood (the native SDK deprecated GetToken() in\nfavor of Register(), which identifies the app instance via this FID\ninstead). For the already-known ID cached from the last\nOnFCMTokenReceived event, use UFirebaseBPSubsystem::GetLastKnownFCMToken\ninstead — that one is synchronous and doesn't touch the network.","inputs":[],"outputs":[{"n":"Error","t":"EFirebaseMessagingError","k":"enum","c":"","r":"EFirebaseMessagingError"},{"n":"Token","t":"String","k":"string","c":"","r":""}],"exec":["OnSuccess","OnError"],"topic":"Token"},{"id":"UDeleteFCMTokenProxy_DeleteFCMToken","title":"Delete FCM Token","fn":"DeleteFCMToken","owner":"UDeleteFCMTokenProxy","kind":"async","module":"Messaging","group":"","platform":"","doc":"Unregisters this app instance from FCM (native SDK: Unregister(), formerly DeleteToken()). A new Installation ID is generated the next time registration is requested.","inputs":[],"outputs":[{"n":"Error","t":"EFirebaseMessagingError","k":"enum","c":"","r":"EFirebaseMessagingError"}],"exec":["OnSuccess","OnError"],"topic":"Token"},{"id":"USubscribeToFCMTopicProxy_SubscribeToFCMTopic","title":"Subscribe to FCM Topic","fn":"SubscribeToFCMTopic","owner":"USubscribeToFCMTopicProxy","kind":"async","module":"Messaging","group":"","platform":"","doc":"Subscribes this app instance to Topic, so it receives every message sent to it. Topic must match `[a-zA-Z0-9-_.~%]{1,900}`.","inputs":[{"n":"Topic","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseMessagingError","k":"enum","c":"","r":"EFirebaseMessagingError"}],"exec":["OnSuccess","OnError"],"topic":"Topics"},{"id":"UUnsubscribeFromFCMTopicProxy_UnsubscribeFromFCMTopic","title":"Unsubscribe from FCM Topic","fn":"UnsubscribeFromFCMTopic","owner":"UUnsubscribeFromFCMTopicProxy","kind":"async","module":"Messaging","group":"","platform":"","doc":"Unsubscribes this app instance from Topic.","inputs":[{"n":"Topic","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseMessagingError","k":"enum","c":"","r":"EFirebaseMessagingError"}],"exec":["OnSuccess","OnError"],"topic":"Topics"},{"id":"URequestFCMPermissionProxy_RequestFCMPermission","title":"Request Notification Permission","fn":"RequestFCMPermission","owner":"URequestFCMPermissionProxy","kind":"async","module":"Messaging","group":"","platform":"","doc":"Displays the OS prompt requesting permission to show notifications.\nOn iOS/tvOS this is firebase::messaging::RequestPermission(); on Android\n(API 33+ / Android 13+) this requests the POST_NOTIFICATIONS runtime\npermission via the engine's built-in AndroidPermission plugin — without\nit, FCM messages are still delivered but the OS silently drops the\nnotification, in foreground or background, with no error anywhere.\nBelow API 33 (and on every other platform) this completes immediately\nwith no prompt, since no such permission exists there. Call this once\nbefore relying on notifications being visible to the user.","inputs":[],"outputs":[{"n":"Error","t":"EFirebaseMessagingError","k":"enum","c":"","r":"EFirebaseMessagingError"}],"exec":["OnSuccess","OnError"],"topic":"Notifications"},{"id":"UFirebaseMessagingLibrary_SetFCMAutoInitEnabled","title":"Set FCMAuto Init Enabled","fn":"SetFCMAutoInitEnabled","owner":"UFirebaseMessagingLibrary","kind":"call","module":"Messaging","group":"","platform":"","doc":"Enables/disables automatic FCM registration on startup (native SDK:\nSetRegistrationOnInitEnabled(), formerly SetTokenRegistrationOnInitEnabled()).\nDisabling this avoids creating a Firebase Installation ID and sending it\nto Firebase until consent has been granted; call\nSetFCMAutoInitEnabled(true) (which immediately triggers registration)\nonce the user consents.","inputs":[{"n":"bEnabled","t":"Boolean","k":"bool","c":"","r":"","adv":false}],"outputs":[],"exec":[],"topic":"Settings"},{"id":"UFirebaseMessagingLibrary_IsFCMAutoInitEnabled","title":"Is FCMAuto Init Enabled","fn":"IsFCMAutoInitEnabled","owner":"UFirebaseMessagingLibrary","kind":"pure","module":"Messaging","group":"","platform":"","doc":"","inputs":[],"outputs":[{"n":"Return Value","t":"Boolean","k":"bool","c":"","r":""}],"exec":[],"topic":"Settings"},{"id":"UFirebaseMessagingLibrary_SetFCMDeliveryMetricsExportEnabled","title":"Set FCMDelivery Metrics Export Enabled","fn":"SetFCMDeliveryMetricsExportEnabled","owner":"UFirebaseMessagingLibrary","kind":"call","module":"Messaging","group":"","platform":"Android","doc":"Android only, no effect elsewhere. Off by default.","inputs":[{"n":"bEnabled","t":"Boolean","k":"bool","c":"","r":"","adv":false}],"outputs":[],"exec":[],"topic":"Settings"},{"id":"UFirebaseMessagingLibrary_IsFCMDeliveryMetricsExportEnabled","title":"Is FCMDelivery Metrics Export Enabled","fn":"IsFCMDeliveryMetricsExportEnabled","owner":"UFirebaseMessagingLibrary","kind":"pure","module":"Messaging","group":"","platform":"Android","doc":"Android only; always returns false elsewhere.","inputs":[],"outputs":[{"n":"Return Value","t":"Boolean","k":"bool","c":"","r":""}],"exec":[],"topic":"Settings"},{"id":"USubmitScoreProxy_SubmitScore","title":"Submit Score","fn":"SubmitScore","owner":"USubmitScoreProxy","kind":"async","module":"Play Games","group":"","platform":"Android","doc":"Submits Score to LeaderboardId immediately (not the fire-and-forget legacy submitScore, so success/failure is actually known). Requires the player to be signed in via the Auth module's Sign In With Play Games. Android only.","inputs":[{"n":"LeaderboardId","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Score","t":"Integer64","k":"int64","c":"","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebasePlayGamesError","k":"enum","c":"","r":"EFirebasePlayGamesError"}],"exec":["OnSubmitted","OnFailed"],"topic":"Leaderboards"},{"id":"UShowLeaderboardProxy_ShowLeaderboard","title":"Show Leaderboard","fn":"ShowLeaderboard","owner":"UShowLeaderboardProxy","kind":"async","module":"Play Games","group":"","platform":"Android","doc":"Shows the system UI for a single leaderboard. Resolves once the player\ncloses it. TimeSpan/Collection pick which ranking the UI opens on (the\nplayer can still switch tabs inside it) — leave them at AllTime/Public for\nthe previous behavior. Android only.","inputs":[{"n":"LeaderboardId","t":"String","k":"string","c":"","r":"","adv":false},{"n":"TimeSpan","t":"EFirebasePlayGamesLeaderboardTimeSpan","k":"enum","c":"","r":"EFirebasePlayGamesLeaderboardTimeSpan","adv":false},{"n":"Collection","t":"EFirebasePlayGamesLeaderboardCollection","k":"enum","c":"","r":"EFirebasePlayGamesLeaderboardCollection","adv":false}],"outputs":[{"n":"Error","t":"EFirebasePlayGamesError","k":"enum","c":"","r":"EFirebasePlayGamesError"}],"exec":["OnClosed","OnFailed"],"topic":"Leaderboards"},{"id":"UShowAllLeaderboardsProxy_ShowAllLeaderboards","title":"Show All Leaderboards","fn":"ShowAllLeaderboards","owner":"UShowAllLeaderboardsProxy","kind":"async","module":"Play Games","group":"","platform":"Android","doc":"Shows the system UI listing all of this app's leaderboards. Resolves once the player closes it. Android only.","inputs":[],"outputs":[{"n":"Error","t":"EFirebasePlayGamesError","k":"enum","c":"","r":"EFirebasePlayGamesError"}],"exec":["OnClosed","OnFailed"],"topic":"Leaderboards"},{"id":"UGetPlayerScoreProxy_GetPlayerScore","title":"Get Player Score","fn":"GetPlayerScore","owner":"UGetPlayerScoreProxy","kind":"async","module":"Play Games","group":"","platform":"Android","doc":"Fetches the signed-in player's own score on LeaderboardId for the chosen TimeSpan/Collection (AllTime/Public matches the previous, only behavior). Android only.","inputs":[{"n":"LeaderboardId","t":"String","k":"string","c":"","r":"","adv":false},{"n":"TimeSpan","t":"EFirebasePlayGamesLeaderboardTimeSpan","k":"enum","c":"","r":"EFirebasePlayGamesLeaderboardTimeSpan","adv":false},{"n":"Collection","t":"EFirebasePlayGamesLeaderboardCollection","k":"enum","c":"","r":"EFirebasePlayGamesLeaderboardCollection","adv":false}],"outputs":[{"n":"Error","t":"EFirebasePlayGamesError","k":"enum","c":"","r":"EFirebasePlayGamesError"},{"n":"Score","t":"FirebasePlayGamesScore","k":"struct","c":"","r":"FFirebasePlayGamesScore"}],"exec":["OnScoreReceived","OnFailed"],"topic":"Leaderboards"},{"id":"UGetTopScoresProxy_GetTopScores","title":"Get Top Scores","fn":"GetTopScores","owner":"UGetTopScoresProxy","kind":"async","module":"Play Games","group":"","platform":"Android","doc":"Fetches the top MaxResults scores on LeaderboardId for the chosen\nTimeSpan/Collection (AllTime/Public matches the previous, only behavior;\nFriends limits it to the player's Play Games friends) — unlike\nGetPlayerScore, these are OTHER players' entries, not necessarily\nincluding the signed-in player's own score. Android only.","inputs":[{"n":"LeaderboardId","t":"String","k":"string","c":"","r":"","adv":false},{"n":"MaxResults","t":"Integer","k":"int","c":"","r":"","d":"25","adv":false},{"n":"TimeSpan","t":"EFirebasePlayGamesLeaderboardTimeSpan","k":"enum","c":"","r":"EFirebasePlayGamesLeaderboardTimeSpan","d":"EFirebasePlayGamesLeaderboardTimeSpan::AllTime","adv":false},{"n":"Collection","t":"EFirebasePlayGamesLeaderboardCollection","k":"enum","c":"","r":"EFirebasePlayGamesLeaderboardCollection","d":"EFirebasePlayGamesLeaderboardCollection::Public","adv":false}],"outputs":[{"n":"Error","t":"EFirebasePlayGamesError","k":"enum","c":"","r":"EFirebasePlayGamesError"},{"n":"Entries","t":"Array of FirebasePlayGamesLeaderboardEntry","k":"struct","c":"array","r":""}],"exec":["OnScoresReceived","OnFailed"],"topic":"Leaderboards"},{"id":"UGetPlayerCenteredScoresProxy_GetPlayerCenteredScores","title":"Get Player-Centered Scores","fn":"GetPlayerCenteredScores","owner":"UGetPlayerCenteredScoresProxy","kind":"async","module":"Play Games","group":"","platform":"Android","doc":"Fetches up to MaxResults scores centered around the signed-in player's own\nrank on LeaderboardId for the chosen TimeSpan/Collection (AllTime/Public\nmatches the previous, only behavior) — some entries above\nthe player's rank, some below, including the player's own row. Requires\nthe player to actually have a score on this leaderboard already (fails\nwith Unknown otherwise, per the underlying API). Android only.","inputs":[{"n":"LeaderboardId","t":"String","k":"string","c":"","r":"","adv":false},{"n":"MaxResults","t":"Integer","k":"int","c":"","r":"","d":"25","adv":false},{"n":"TimeSpan","t":"EFirebasePlayGamesLeaderboardTimeSpan","k":"enum","c":"","r":"EFirebasePlayGamesLeaderboardTimeSpan","d":"EFirebasePlayGamesLeaderboardTimeSpan::AllTime","adv":false},{"n":"Collection","t":"EFirebasePlayGamesLeaderboardCollection","k":"enum","c":"","r":"EFirebasePlayGamesLeaderboardCollection","d":"EFirebasePlayGamesLeaderboardCollection::Public","adv":false}],"outputs":[{"n":"Error","t":"EFirebasePlayGamesError","k":"enum","c":"","r":"EFirebasePlayGamesError"},{"n":"Entries","t":"Array of FirebasePlayGamesLeaderboardEntry","k":"struct","c":"array","r":""}],"exec":["OnScoresReceived","OnFailed"],"topic":"Leaderboards"},{"id":"UUnlockAchievementProxy_UnlockAchievement","title":"Unlock Achievement","fn":"UnlockAchievement","owner":"UUnlockAchievementProxy","kind":"async","module":"Play Games","group":"","platform":"Android","doc":"Unlocks AchievementId immediately (idempotent — Play Games ignores repeat unlocks). Android only.","inputs":[{"n":"AchievementId","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebasePlayGamesError","k":"enum","c":"","r":"EFirebasePlayGamesError"}],"exec":["OnUnlocked","OnFailed"],"topic":"Achievements"},{"id":"UIncrementAchievementProxy_IncrementAchievement","title":"Increment Achievement","fn":"IncrementAchievement","owner":"UIncrementAchievementProxy","kind":"async","module":"Play Games","group":"","platform":"Android","doc":"Increments an incremental AchievementId by Steps immediately. Android only. See FFBP_OnAchievementIncremented's own comment before trusting OnIncremented's bNewlyUnlocked for anything beyond instant UI feedback.","inputs":[{"n":"AchievementId","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Steps","t":"Integer","k":"int","c":"","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebasePlayGamesError","k":"enum","c":"","r":"EFirebasePlayGamesError"},{"n":"bNewlyUnlocked","t":"Boolean","k":"bool","c":"","r":""}],"exec":["OnIncremented","OnFailed"],"topic":"Achievements"},{"id":"UIncrementAchievementProxy_SetAchievementSteps","title":"Set Achievement Steps","fn":"SetAchievementSteps","owner":"UIncrementAchievementProxy","kind":"async","module":"Play Games","group":"","platform":"Android","doc":"Sets an incremental AchievementId's progress to at least Steps (Play\nGames never lowers it) — simpler than Increment when the game already\ntracks the total itself (e.g. \"levels completed\"). Same outputs as\nIncrement Achievement. Android only.","inputs":[{"n":"AchievementId","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Steps","t":"Integer","k":"int","c":"","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebasePlayGamesError","k":"enum","c":"","r":"EFirebasePlayGamesError"},{"n":"bNewlyUnlocked","t":"Boolean","k":"bool","c":"","r":""}],"exec":["OnIncremented","OnFailed"],"topic":"Achievements"},{"id":"URevealAchievementProxy_RevealAchievement","title":"Reveal Achievement","fn":"RevealAchievement","owner":"URevealAchievementProxy","kind":"async","module":"Play Games","group":"","platform":"Android","doc":"Reveals a hidden AchievementId (makes it visible in the achievements UI without unlocking it). Android only.","inputs":[{"n":"AchievementId","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebasePlayGamesError","k":"enum","c":"","r":"EFirebasePlayGamesError"}],"exec":["OnRevealed","OnFailed"],"topic":"Achievements"},{"id":"UShowAchievementsProxy_ShowAchievements","title":"Show Achievements","fn":"ShowAchievements","owner":"UShowAchievementsProxy","kind":"async","module":"Play Games","group":"","platform":"Android","doc":"Shows the system UI listing all of this app's achievements. Resolves once the player closes it. Android only.","inputs":[],"outputs":[{"n":"Error","t":"EFirebasePlayGamesError","k":"enum","c":"","r":"EFirebasePlayGamesError"}],"exec":["OnClosed","OnFailed"],"topic":"Achievements"},{"id":"UGetAchievementsProxy_GetAchievements","title":"Get Achievements","fn":"GetAchievements","owner":"UGetAchievementsProxy","kind":"async","module":"Play Games","group":"","platform":"Android","doc":"Fetches every achievement configured for this app along with its current\nstate for the signed-in player (Unlocked/Revealed/Hidden, and progress for\nIncremental ones) — unlike Unlock/Increment/Reveal, which act blind on a\nknown AchievementId with no read-back, this is the only way to know an\nachievement's actual current state without opening the native\nShowAchievements overlay. bForceReload defaults to true (this call's\nlong-standing behavior) — set it to false to use Play Games' own cached\nlisting instead when you know nothing server-side has changed since your\nlast fetch, same as UListPlayGamesSnapshotsProxy's own bForceReload.\nAndroid only.","inputs":[{"n":"bForceReload","t":"Boolean","k":"bool","c":"","r":"","d":"true","adv":false}],"outputs":[{"n":"Error","t":"EFirebasePlayGamesError","k":"enum","c":"","r":"EFirebasePlayGamesError"},{"n":"Achievements","t":"Array of FirebasePlayGamesAchievementEntry","k":"struct","c":"array","r":""}],"exec":["OnAchievementsReceived","OnFailed"],"topic":"Achievements"},{"id":"UGetLeaderboardsProxy_GetLeaderboards","title":"Get Leaderboards","fn":"GetLeaderboards","owner":"UGetLeaderboardsProxy","kind":"async","module":"Play Games","group":"","platform":"Android","doc":"Lists every leaderboard configured for this game in Play Console (ID,\nname, icon, score order), so a game or menu can be built from what's\nactually published instead of a hand-maintained list of IDs. Scores\nthemselves come from Get Top Scores / Get Player Score. bForceReload false\n(the default) is fine for this listing, which only changes when the game's\nPlay Console configuration does. Android only.","inputs":[{"n":"bForceReload","t":"Boolean","k":"bool","c":"","r":"","d":"false","adv":false}],"outputs":[{"n":"Error","t":"EFirebasePlayGamesError","k":"enum","c":"","r":"EFirebasePlayGamesError"},{"n":"Leaderboards","t":"Array of FirebasePlayGamesLeaderboard","k":"struct","c":"array","r":""}],"exec":["OnLeaderboardsReceived","OnFailed"],"topic":"Leaderboards"},{"id":"UGetPlayGamesEventsProxy_GetPlayGamesEvents","title":"Get Play Games Events","fn":"GetPlayGamesEvents","owner":"UGetPlayGamesEventsProxy","kind":"async","module":"Play Games","group":"","platform":"Android","doc":"Lists this game's Play Games events with the signed-in player's current\ntotal for each (see Increment Play Games Event). bForceReload true skips\nthe local cache, which increments made this session may not have reached\nyet. Android only.","inputs":[{"n":"bForceReload","t":"Boolean","k":"bool","c":"","r":"","d":"false","adv":false}],"outputs":[{"n":"Error","t":"EFirebasePlayGamesError","k":"enum","c":"","r":"EFirebasePlayGamesError"},{"n":"Events","t":"Array of FirebasePlayGamesEvent","k":"struct","c":"array","r":""}],"exec":["OnEventsReceived","OnFailed"],"topic":"Events"},{"id":"URefetchAchievementProxy_RefetchAchievement","title":"Refetch Achievement","fn":"RefetchAchievement","owner":"URefetchAchievementProxy","kind":"async","module":"Play Games","group":"","platform":"Android","doc":"Fetches AchievementId's current state fresh from the server — genuinely\naccurate right after IncrementAchievement, where only the server knows the\nexact resulting step count (OnIncremented only reports bNewlyUnlocked, not\nthe new total). There's no single-achievement fetch on the underlying SDK\nto make this cheaper than a full refetch: this internally calls\nGetAchievements (same network cost as fetching everything) and filters the\nresult down to the one entry you asked for. Android only.","inputs":[{"n":"AchievementId","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebasePlayGamesError","k":"enum","c":"","r":"EFirebasePlayGamesError"},{"n":"Achievement","t":"FirebasePlayGamesAchievementEntry","k":"struct","c":"","r":"FFirebasePlayGamesAchievementEntry"}],"exec":["OnAchievementReceived","OnNotFound","OnFailed"],"topic":"Achievements"},{"id":"UIsSignedInWithPlayGamesProxy_IsSignedInWithPlayGames","title":"Is Signed In With Play Games","fn":"IsSignedInWithPlayGames","owner":"UIsSignedInWithPlayGamesProxy","kind":"async","module":"Play Games","group":"","platform":"Android","doc":"Asynchronously checks whether the native Play Games Services session\n(GamesSignInClient) is actually authenticated right now — the one live\nsignal for \"can I call SubmitScore/GetAchievements/... without hitting\nSignInRequired\". Deliberately NOT the same thing as either\nUFirebasePlayGamesLibrary::IsPlayGamesReady() (a synchronous Project\nSettings/platform check with no native state at all) or\nUFirebaseAuthLibrary::IsProviderLinked(EFirebaseAuthProvider::PlayGames)\n(a persistent Firebase Auth fact — this account was linked to Play Games\nat some point — that can be stale: Play Games Services' own native session\ndoesn't automatically restore itself just because Firebase Auth restored\nits own session on app relaunch). Android only.","inputs":[],"outputs":[{"n":"Error","t":"EFirebasePlayGamesError","k":"enum","c":"","r":"EFirebasePlayGamesError"},{"n":"bIsSignedIn","t":"Boolean","k":"bool","c":"","r":""}],"exec":["OnResult","OnFailed"],"topic":"Player"},{"id":"UGetCurrentPlayerProxy_GetCurrentPlayer","title":"Get Current Player","fn":"GetCurrentPlayer","owner":"UGetCurrentPlayerProxy","kind":"async","module":"Play Games","group":"","platform":"Android","doc":"Fetches the signed-in player's own Play Games public profile. Android only.","inputs":[],"outputs":[{"n":"Error","t":"EFirebasePlayGamesError","k":"enum","c":"","r":"EFirebasePlayGamesError"},{"n":"Player","t":"FirebasePlayGamesPlayer","k":"struct","c":"","r":"FFirebasePlayGamesPlayer"}],"exec":["OnPlayerReceived","OnFailed"],"topic":"Player"},{"id":"UGetPlayGamesFriendsProxy_GetPlayGamesFriends","title":"Get Play Games Friends","fn":"GetPlayGamesFriends","owner":"UGetPlayGamesFriendsProxy","kind":"async","module":"Play Games","group":"","platform":"Android","doc":"Lists the signed-in player's Play Games friends who also play this game\n(up to PageSize, max 200). The player must agree to share their friends\nlist with the game: with bRequestConsent, Google's consent screen is shown\nthe first time and the list is fetched once they accept; if they decline\n(or bRequestConsent is false), OnFailed with FriendsConsentRequired.\nAndroid only.","inputs":[{"n":"PageSize","t":"Integer","k":"int","c":"","r":"","d":"200","adv":false},{"n":"bRequestConsent","t":"Boolean","k":"bool","c":"","r":"","d":"true","adv":false},{"n":"bForceReload","t":"Boolean","k":"bool","c":"","r":"","d":"false","adv":true}],"outputs":[{"n":"Error","t":"EFirebasePlayGamesError","k":"enum","c":"","r":"EFirebasePlayGamesError"},{"n":"Friends","t":"Array of FirebasePlayGamesPlayer","k":"struct","c":"array","r":""}],"exec":["OnFriendsReceived","OnFailed"],"topic":"Player"},{"id":"UGetPlayGamesPlayerStatsProxy_GetPlayGamesPlayerStats","title":"Get Play Games Player Stats","fn":"GetPlayGamesPlayerStats","owner":"UGetPlayGamesPlayerStatsProxy","kind":"async","module":"Play Games","group":"","platform":"Android","doc":"Fetches the signed-in player's Play Games engagement/monetization stats\n(PlayerStatsClient) — see FFirebasePlayGamesPlayerStats's own doc comment\nfor why several fields may come back as an \"unknown\" sentinel. Android only.","inputs":[],"outputs":[{"n":"Error","t":"EFirebasePlayGamesError","k":"enum","c":"","r":"EFirebasePlayGamesError"},{"n":"Stats","t":"FirebasePlayGamesPlayerStats","k":"struct","c":"","r":"FFirebasePlayGamesPlayerStats"}],"exec":["OnStatsReceived","OnFailed"],"topic":"Player"},{"id":"USavePlayGamesSnapshotProxy_SavePlayGamesSnapshot","title":"Save Play Games Snapshot","fn":"SavePlayGamesSnapshot","owner":"USavePlayGamesSnapshotProxy","kind":"async","module":"Play Games","group":"","platform":"Android","doc":"Saved Games (cloud save) via Play Games Services' SnapshotsClient — writes\nData (raw bytes; serialize your own save format into this however you\nalready do for a local save file) to a cloud snapshot named SnapshotName,\ncreating it if it doesn't exist yet, overwriting it if it does. SnapshotName\nis your own chosen identifier (e.g. one per save slot) — Play Games has no\nconcept of your game's own slot structure beyond this string.\n\nA genuine sync conflict (the same snapshot name saved from two devices\nwhile offline, both later reconnecting) is auto-resolved by Play Games\nitself (keeping the most recently modified save) rather than\nsurfaced to Blueprint for manual resolution — the simpler, still-correct\nchoice for most games; a game that needs to resolve conflicts itself (e.g.\nto merge rather than pick one save wholesale) would need lower-level access\nthis module doesn't expose. To build a slot picker, see List Play Games\nSnapshots.\nAndroid only.\n\nPlayedTimeMs / ProgressValue: optional metadata shown in Play Games'\nsaved-games UI and returned by List Play Games Snapshots (total play\ntime in milliseconds, and any game-defined progress number). -1 keeps\nthe value already stored for this snapshot.","inputs":[{"n":"SnapshotName","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Data","t":"Array of Byte","k":"byte","c":"array","r":"","adv":false},{"n":"Description","t":"String","k":"string","c":"","r":"","d":"\"\"","adv":false},{"n":"PlayedTimeMs","t":"Integer64","k":"int64","c":"","r":"","d":"-1","adv":true},{"n":"ProgressValue","t":"Integer64","k":"int64","c":"","r":"","d":"-1","adv":true}],"outputs":[{"n":"Error","t":"EFirebasePlayGamesError","k":"enum","c":"","r":"EFirebasePlayGamesError"}],"exec":["OnSaved","OnFailed"],"topic":"Saved games"},{"id":"ULoadPlayGamesSnapshotProxy_LoadPlayGamesSnapshot","title":"Load Play Games Snapshot","fn":"LoadPlayGamesSnapshot","owner":"ULoadPlayGamesSnapshotProxy","kind":"async","module":"Play Games","group":"","platform":"Android","doc":"Reads back a snapshot previously written by SavePlayGamesSnapshot. OnFailed (not a separate \"not found\" event) if SnapshotName doesn't exist yet — check the error, or simply treat any failure on a first-ever load as \"no cloud save yet, keep using local data\". Android only.","inputs":[{"n":"SnapshotName","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebasePlayGamesError","k":"enum","c":"","r":"EFirebasePlayGamesError"},{"n":"Data","t":"Array of Byte","k":"byte","c":"array","r":""}],"exec":["OnLoaded","OnFailed"],"topic":"Saved games"},{"id":"UDeletePlayGamesSnapshotProxy_DeletePlayGamesSnapshot","title":"Delete Play Games Snapshot","fn":"DeletePlayGamesSnapshot","owner":"UDeletePlayGamesSnapshotProxy","kind":"async","module":"Play Games","group":"","platform":"Android","doc":"Permanently deletes a snapshot previously written by SavePlayGamesSnapshot.\nLooks it up by name via a metadata-only listing (see ListPlayGamesSnapshots)\nrather than downloading its save data first, so it's cheap regardless of\nsave size — retrying against the server once if the name isn't found in\nthe local listing, since that listing isn't guaranteed to reflect a\nSave/Delete from this session (or another device) instantly. Fails with\nEFirebasePlayGamesError::DeveloperError if the name still isn't found after\nthat retry. Does not run Play Games' own conflict-resolution step (unlike\nSavePlayGamesSnapshot/LoadPlayGamesSnapshot) — deleting a snapshot with a\ngenuine, still-unresolved cross-device conflict acts on whichever version\nthe server currently reports for that name. Android only.","inputs":[{"n":"SnapshotName","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebasePlayGamesError","k":"enum","c":"","r":"EFirebasePlayGamesError"}],"exec":["OnDeleted","OnFailed"],"topic":"Saved games"},{"id":"UListPlayGamesSnapshotsProxy_ListPlayGamesSnapshots","title":"List Play Games Snapshots","fn":"ListPlayGamesSnapshots","owner":"UListPlayGamesSnapshotsProxy","kind":"async","module":"Play Games","group":"","platform":"Android","doc":"Lists every saved-game slot for the signed-in player — metadata only (name,\ndescription, timestamps), never the actual save data — e.g. to build a\n\"choose a save slot\" or \"continue\" menu before calling\nLoadPlayGamesSnapshot on whichever one the player picks. Set bForceReload\nto bypass Play Games' own cached listing and hit the network, e.g. after\nthis device may have changed what's on the server (a fresh sign-in, or\nafter this same session's own SavePlayGamesSnapshot/DeletePlayGamesSnapshot\ncalls, whose local cache update is not guaranteed instant). Android only.","inputs":[{"n":"bForceReload","t":"Boolean","k":"bool","c":"","r":"","d":"false","adv":false}],"outputs":[{"n":"Error","t":"EFirebasePlayGamesError","k":"enum","c":"","r":"EFirebasePlayGamesError"},{"n":"Snapshots","t":"Array of FirebasePlayGamesSnapshotInfo","k":"struct","c":"array","r":""}],"exec":["OnSnapshotsReceived","OnFailed"],"topic":"Saved games"},{"id":"UFirebasePlayGamesLibrary_IsPlayGamesReady","title":"Is Play Games Ready","fn":"IsPlayGamesReady","owner":"UFirebasePlayGamesLibrary","kind":"pure","module":"Play Games","group":"","platform":"","doc":"True if the module is enabled in Project Settings AND running on\nAndroid — NOT whether the player is actually signed in via Play Games\n(there's no cheap synchronous native getter for that; every node in\nthis module still fails with SignInRequired at the actual API call if\nthe player turns out not to be signed in). In particular, this is\nalways false in the Editor/on Windows even with the module enabled —\nevery node here is Android-only.","inputs":[],"outputs":[{"n":"Return Value","t":"Boolean","k":"bool","c":"","r":""}],"exec":[],"topic":"Player"},{"id":"UFirebasePlayGamesLibrary_IncrementPlayGamesEvent","title":"Increment Play Games Event","fn":"IncrementPlayGamesEvent","owner":"UFirebasePlayGamesLibrary","kind":"call","module":"Play Games","group":"","platform":"Android","doc":"Adds Steps (at least 1) to the Play Games event EventId (configured in\nPlay Console -> Play Games Services -> Events). Fire-and-forget: the\nSDK batches increments and sends them in the background, so it's fine\nto call often. Android only; does nothing elsewhere.","inputs":[{"n":"EventId","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Steps","t":"Integer","k":"int","c":"","r":"","d":"1","adv":false}],"outputs":[],"exec":[],"topic":"Events"},{"id":"UFirebasePlayGamesLibrary_FindAchievement","title":"Find Achievement","fn":"FindAchievement","owner":"UFirebasePlayGamesLibrary","kind":"pure","module":"Play Games","group":"","platform":"","doc":"Finds the entry for AchievementId within Achievements (as returned by\nGetAchievements) — a plain local array search, no extra network/JNI\ncall. There's no single-achievement fetch on the underlying SDK\n(AchievementsClient.load() always returns every achievement at once),\nso this is the intended way to look one up after already calling\nGetAchievements once. Returns false (OutAchievement left at its\ndefault) if no entry with that AchievementId is present.","inputs":[{"n":"Achievements","t":"Array of FirebasePlayGamesAchievementEntry","k":"struct","c":"array","r":"","adv":false},{"n":"AchievementId","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"OutAchievement","t":"FirebasePlayGamesAchievementEntry","k":"struct","c":"","r":"FFirebasePlayGamesAchievementEntry"},{"n":"Return Value","t":"Boolean","k":"bool","c":"","r":""}],"exec":[],"topic":"Achievements"},{"id":"UFirebasePlayGamesLibrary_StringToSnapshotData","title":"String To Snapshot Data","fn":"StringToSnapshotData","owner":"UFirebasePlayGamesLibrary","kind":"pure","module":"Play Games","group":"","platform":"","doc":"Saved games store raw bytes, and Blueprint has no built-in way to make\nbytes. These turn a string (UTF-8) or a SaveGame object (the engine's\nown serialization, same as Save Game to Slot) into the Data that\nSavePlayGamesSnapshot takes, and back from LoadPlayGamesSnapshot's Data.","inputs":[{"n":"Text","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"Array of Byte","k":"byte","c":"array","r":""}],"exec":[],"topic":"Saved games"},{"id":"UFirebasePlayGamesLibrary_SnapshotDataToString","title":"Snapshot Data To String","fn":"SnapshotDataToString","owner":"UFirebasePlayGamesLibrary","kind":"pure","module":"Play Games","group":"","platform":"","doc":"","inputs":[{"n":"Data","t":"Array of Byte","k":"byte","c":"array","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"String","k":"string","c":"","r":""}],"exec":[],"topic":"Saved games"},{"id":"UFirebasePlayGamesLibrary_SaveGameToSnapshotData","title":"Save Game To Snapshot Data","fn":"SaveGameToSnapshotData","owner":"UFirebasePlayGamesLibrary","kind":"call","module":"Play Games","group":"","platform":"","doc":"Returns false (OutData empty) if SaveGame is null or fails to serialize.","inputs":[{"n":"SaveGame","t":"SaveGame","k":"object","c":"","r":"","adv":false}],"outputs":[{"n":"OutData","t":"Array of Byte","k":"byte","c":"array","r":""},{"n":"Return Value","t":"Boolean","k":"bool","c":"","r":""}],"exec":[],"topic":"Saved games"},{"id":"UFirebasePlayGamesLibrary_SnapshotDataToSaveGame","title":"Snapshot Data To Save Game","fn":"SnapshotDataToSaveGame","owner":"UFirebasePlayGamesLibrary","kind":"call","module":"Play Games","group":"","platform":"","doc":"Returns null if Data is empty or was not written by Save Game To Snapshot Data; cast the result to your SaveGame class.","inputs":[{"n":"Data","t":"Array of Byte","k":"byte","c":"array","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"SaveGame","k":"object","c":"","r":""}],"exec":[],"topic":"Saved games"},{"id":"UFetchRemoteConfigProxy_FetchRemoteConfig","title":"Fetch Remote Config","fn":"FetchRemoteConfig","owner":"UFetchRemoteConfigProxy","kind":"async","module":"Remote Config","group":"","platform":"","doc":"Fetches config data from the server and caches it, but does NOT make it\naccessible to Get calls yet — call ActivateRemoteConfig afterwards, or use\nFetchAndActivateRemoteConfig to do both in one call (the common case).\nUseful when you want to fetch ahead of time and only apply the new values\nat a specific moment (e.g. between game sessions, not mid-match).\n\nCacheExpirationSeconds: skip the fetch and return immediately if cached data newer than this is already available. 0 always fetches. Defaults to the SDK's own 12-hour default.","inputs":[{"n":"CacheExpirationSeconds","t":"Integer64","k":"int64","c":"","r":"","d":"43200","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseRemoteConfigError","k":"enum","c":"","r":"EFirebaseRemoteConfigError"}],"exec":["OnSuccess","OnError"],"topic":"Fetch"},{"id":"UActivateRemoteConfigProxy_ActivateRemoteConfig","title":"Activate Remote Config","fn":"ActivateRemoteConfig","owner":"UActivateRemoteConfigProxy","kind":"async","module":"Remote Config","group":"","platform":"","doc":"Activates the most recently fetched config so its values take effect. bConfigsActivated is false if there was nothing new to activate (already up to date).","inputs":[],"outputs":[{"n":"Error","t":"EFirebaseRemoteConfigError","k":"enum","c":"","r":"EFirebaseRemoteConfigError"},{"n":"bConfigsActivated","t":"Boolean","k":"bool","c":"","r":""}],"exec":["OnSuccess","OnError"],"topic":"Fetch"},{"id":"UFetchAndActivateRemoteConfigProxy_FetchAndActivateRemoteConfig","title":"Fetch And Activate Remote Config","fn":"FetchAndActivateRemoteConfig","owner":"UFetchAndActivateRemoteConfigProxy","kind":"async","module":"Remote Config","group":"","platform":"","doc":"Fetches and then activates config in one call — the common case for most\napps. Respects the minimum fetch interval (12 hours by default, see\nSetRemoteConfigSettings): if the last fetch was recent enough, this\nactivates the already-cached values without hitting the network again.","inputs":[],"outputs":[{"n":"Error","t":"EFirebaseRemoteConfigError","k":"enum","c":"","r":"EFirebaseRemoteConfigError"},{"n":"bConfigsActivated","t":"Boolean","k":"bool","c":"","r":""}],"exec":["OnSuccess","OnError"],"topic":"Fetch"},{"id":"USetRemoteConfigDefaultsProxy_SetRemoteConfigDefaults","title":"Set Remote Config Defaults","fn":"SetRemoteConfigDefaults","owner":"USetRemoteConfigDefaultsProxy","kind":"async","module":"Remote Config","group":"","platform":"","doc":"Sets fallback string values used until the first successful fetch (or for\nany key never present in remote config). Completely overwrites all\nprevious defaults — pass every key you want defaulted each time, not just\nthe ones that changed. Get calls parse the string back to bool/int/double\nas needed, same as fetched remote values.","inputs":[{"n":"Defaults","t":"Map of String to String","k":"string","c":"map","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseRemoteConfigError","k":"enum","c":"","r":"EFirebaseRemoteConfigError"}],"exec":["OnSuccess","OnError"],"topic":"Defaults and settings"},{"id":"USetRemoteConfigSettingsProxy_SetRemoteConfigSettings","title":"Set Remote Config Settings","fn":"SetRemoteConfigSettings","owner":"USetRemoteConfigSettingsProxy","kind":"async","module":"Remote Config","group":"","platform":"","doc":"Changes the fetch settings. FetchTimeoutMs: how long a Fetch call waits for\na connection before failing (default 30 s). MinimumFetchIntervalMs: how\noften you're allowed to actually hit the network (default 12 h) — Fetch\ncalls sooner than this just reuse the last cached result instead of\nfailing. The SDK applies them asynchronously: wait for OnSuccess before\nfetching (a Fetch And Activate started right away can still use the old\ninterval — e.g. a 0 ms interval for testing seemingly ignored).","inputs":[{"n":"FetchTimeoutMs","t":"Integer64","k":"int64","c":"","r":"","d":"30000","adv":false},{"n":"MinimumFetchIntervalMs","t":"Integer64","k":"int64","c":"","r":"","d":"43200000","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseRemoteConfigError","k":"enum","c":"","r":"EFirebaseRemoteConfigError"}],"exec":["OnSuccess","OnError"],"topic":"Defaults and settings"},{"id":"UEnsureRemoteConfigInitializedProxy_EnsureRemoteConfigInitialized","title":"Ensure Remote Config Initialized","fn":"EnsureRemoteConfigInitialized","owner":"UEnsureRemoteConfigInitializedProxy","kind":"async","module":"Remote Config","group":"","platform":"","doc":"Waits for the Remote Config instance to finish its own async initialization\n(loading cached fetch/default state from disk) before resolving — Info\nreflects the state once that's done. Not required before Fetch/Get calls\n(they're all safe to call immediately; the SDK queues them internally), but\ncalling this first avoids a rare race on some platforms where a very early\nGet call could momentarily miss already-cached data that hasn't finished\nloading yet.","inputs":[],"outputs":[{"n":"Error","t":"EFirebaseRemoteConfigError","k":"enum","c":"","r":"EFirebaseRemoteConfigError"},{"n":"Info","t":"FirebaseRemoteConfigInfo","k":"struct","c":"","r":"FFirebaseRemoteConfigInfo"}],"exec":["OnSuccess","OnError"],"topic":"Fetch"},{"id":"USetRemoteConfigCustomSignalsProxy_SetRemoteConfigCustomSignals","title":"Set Remote Config Custom Signals","fn":"SetRemoteConfigCustomSignals","owner":"USetRemoteConfigCustomSignalsProxy","kind":"async","module":"Remote Config","group":"","platform":"","doc":"Merges CustomSignals into Remote Config's custom signals for this device —\narbitrary key/value attributes (e.g. player level, spend tier) fed into\nRemote Config's condition-based targeting, in addition to the SDK's own\nbuilt-in targeting (app version, platform, ...). Each value is a JSON\nscalar (bool/number/string, or JSON null to remove a previously-set\nsignal) — see FirebaseBPVariantJson.h for the JSON \u003c-> Variant mapping.\nSetting a signal again overwrites its previous value; signals not\nmentioned in CustomSignals are left untouched.","inputs":[{"n":"CustomSignals","t":"Map of String to String","k":"string","c":"map","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseRemoteConfigError","k":"enum","c":"","r":"EFirebaseRemoteConfigError"}],"exec":["OnSuccess","OnError"],"topic":"Defaults and settings"},{"id":"USetRemoteConfigDefaultsFromJsonProxy_SetRemoteConfigDefaultsFromJson","title":"Set Remote Config Defaults From Json","fn":"SetRemoteConfigDefaultsFromJson","owner":"USetRemoteConfigDefaultsFromJsonProxy","kind":"async","module":"Remote Config","group":"","platform":"","doc":"Same as USetRemoteConfigDefaultsProxy, but each default is a JSON scalar\n(bool/number/string, or JSON null) instead of a plain string — avoids the\nSDK's own string-to-type coercion ambiguity for a Bool/Int/Double default\n(e.g. whether \"1\" means the integer 1 or the boolean true is otherwise up\nto whichever GetRemoteConfigXxx call reads it back). See\nFirebaseBPVariantJson.h for the JSON \u003c-> Variant mapping. Binary (GetData)\ndefaults still can't be set this way — Variant's blob type has no JSON\nrepresentation.","inputs":[{"n":"Defaults","t":"Map of String to String","k":"string","c":"map","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseRemoteConfigError","k":"enum","c":"","r":"EFirebaseRemoteConfigError"}],"exec":["OnSuccess","OnError"],"topic":"Defaults and settings"},{"id":"UFirebaseRemoteConfigLibrary_GetRemoteConfigBool","title":"Get Remote Config Bool","fn":"GetRemoteConfigBool","owner":"UFirebaseRemoteConfigLibrary","kind":"pure","module":"Remote Config","group":"","platform":"","doc":"","inputs":[{"n":"Key","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"Boolean","k":"bool","c":"","r":""}],"exec":[],"topic":"Read values"},{"id":"UFirebaseRemoteConfigLibrary_GetRemoteConfigInt","title":"Get Remote Config Int","fn":"GetRemoteConfigInt","owner":"UFirebaseRemoteConfigLibrary","kind":"pure","module":"Remote Config","group":"","platform":"","doc":"","inputs":[{"n":"Key","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"Integer64","k":"int64","c":"","r":""}],"exec":[],"topic":"Read values"},{"id":"UFirebaseRemoteConfigLibrary_GetRemoteConfigDouble","title":"Get Remote Config Double","fn":"GetRemoteConfigDouble","owner":"UFirebaseRemoteConfigLibrary","kind":"pure","module":"Remote Config","group":"","platform":"","doc":"","inputs":[{"n":"Key","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"Float","k":"float","c":"","r":""}],"exec":[],"topic":"Read values"},{"id":"UFirebaseRemoteConfigLibrary_GetRemoteConfigString","title":"Get Remote Config String","fn":"GetRemoteConfigString","owner":"UFirebaseRemoteConfigLibrary","kind":"pure","module":"Remote Config","group":"","platform":"","doc":"","inputs":[{"n":"Key","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"String","k":"string","c":"","r":""}],"exec":[],"topic":"Read values"},{"id":"UFirebaseRemoteConfigLibrary_GetRemoteConfigData","title":"Get Remote Config Data","fn":"GetRemoteConfigData","owner":"UFirebaseRemoteConfigLibrary","kind":"pure","module":"Remote Config","group":"","platform":"","doc":"Raw binary Remote Config value for Key. Rarely needed — most parameters are Bool/Int/Double/String.","inputs":[{"n":"Key","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"Array of Byte","k":"byte","c":"array","r":""}],"exec":[],"topic":"Read values"},{"id":"UFirebaseRemoteConfigLibrary_GetRemoteConfigBoolWithInfo","title":"Get Remote Config Bool With Info","fn":"GetRemoteConfigBoolWithInfo","owner":"UFirebaseRemoteConfigLibrary","kind":"pure","module":"Remote Config","group":"","platform":"","doc":"Same as GetRemoteConfigBool, plus Info: whether the value came from the last fetch, a default, or a static fallback.","inputs":[{"n":"Key","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Info","t":"FirebaseRemoteConfigValueInfo","k":"struct","c":"","r":"FFirebaseRemoteConfigValueInfo"},{"n":"Return Value","t":"Boolean","k":"bool","c":"","r":""}],"exec":[],"topic":"Read values"},{"id":"UFirebaseRemoteConfigLibrary_GetRemoteConfigIntWithInfo","title":"Get Remote Config Int With Info","fn":"GetRemoteConfigIntWithInfo","owner":"UFirebaseRemoteConfigLibrary","kind":"pure","module":"Remote Config","group":"","platform":"","doc":"Same as GetRemoteConfigInt, plus Info: whether the value came from the last fetch, a default, or a static fallback.","inputs":[{"n":"Key","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Info","t":"FirebaseRemoteConfigValueInfo","k":"struct","c":"","r":"FFirebaseRemoteConfigValueInfo"},{"n":"Return Value","t":"Integer64","k":"int64","c":"","r":""}],"exec":[],"topic":"Read values"},{"id":"UFirebaseRemoteConfigLibrary_GetRemoteConfigDoubleWithInfo","title":"Get Remote Config Double With Info","fn":"GetRemoteConfigDoubleWithInfo","owner":"UFirebaseRemoteConfigLibrary","kind":"pure","module":"Remote Config","group":"","platform":"","doc":"Same as GetRemoteConfigDouble, plus Info: whether the value came from the last fetch, a default, or a static fallback.","inputs":[{"n":"Key","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Info","t":"FirebaseRemoteConfigValueInfo","k":"struct","c":"","r":"FFirebaseRemoteConfigValueInfo"},{"n":"Return Value","t":"Float","k":"float","c":"","r":""}],"exec":[],"topic":"Read values"},{"id":"UFirebaseRemoteConfigLibrary_GetRemoteConfigStringWithInfo","title":"Get Remote Config String With Info","fn":"GetRemoteConfigStringWithInfo","owner":"UFirebaseRemoteConfigLibrary","kind":"pure","module":"Remote Config","group":"","platform":"","doc":"Same as GetRemoteConfigString, plus Info: whether the value came from the last fetch, a default, or a static fallback.","inputs":[{"n":"Key","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Info","t":"FirebaseRemoteConfigValueInfo","k":"struct","c":"","r":"FFirebaseRemoteConfigValueInfo"},{"n":"Return Value","t":"String","k":"string","c":"","r":""}],"exec":[],"topic":"Read values"},{"id":"UFirebaseRemoteConfigLibrary_GetRemoteConfigDataWithInfo","title":"Get Remote Config Data With Info","fn":"GetRemoteConfigDataWithInfo","owner":"UFirebaseRemoteConfigLibrary","kind":"pure","module":"Remote Config","group":"","platform":"","doc":"Same as GetRemoteConfigData, plus Info: whether the value came from the last fetch, a default, or a static fallback.","inputs":[{"n":"Key","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Info","t":"FirebaseRemoteConfigValueInfo","k":"struct","c":"","r":"FFirebaseRemoteConfigValueInfo"},{"n":"Return Value","t":"Array of Byte","k":"byte","c":"array","r":""}],"exec":[],"topic":"Read values"},{"id":"UFirebaseRemoteConfigLibrary_GetRemoteConfigKeysByPrefix","title":"Get Remote Config Keys By Prefix","fn":"GetRemoteConfigKeysByPrefix","owner":"UFirebaseRemoteConfigLibrary","kind":"pure","module":"Remote Config","group":"","platform":"","doc":"Every Remote Config parameter key that starts with Prefix (empty Prefix returns every key).","inputs":[{"n":"Prefix","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"Array of String","k":"string","c":"array","r":""}],"exec":[],"topic":"Read values"},{"id":"UFirebaseRemoteConfigLibrary_GetRemoteConfigKeys","title":"Get Remote Config Keys","fn":"GetRemoteConfigKeys","owner":"UFirebaseRemoteConfigLibrary","kind":"pure","module":"Remote Config","group":"","platform":"","doc":"","inputs":[],"outputs":[{"n":"Return Value","t":"Array of String","k":"string","c":"array","r":""}],"exec":[],"topic":"Read values"},{"id":"UFirebaseRemoteConfigLibrary_GetRemoteConfigAll","title":"Get Remote Config All","fn":"GetRemoteConfigAll","owner":"UFirebaseRemoteConfigLibrary","kind":"pure","module":"Remote Config","group":"","platform":"","doc":"Every Remote Config key currently available (activated value, or a\ndefault if the key was never fetched), each as a JSON scalar string —\ne.g. {\"max_players\": \"10\", \"welcome_message\": \"\\\"Hello!\\\"\"} — see\nFirebaseBPVariantJson.h for the JSON \u003c-> Variant mapping. Useful for a\ndebug overlay or dumping the whole config to a log; prefer the typed\nGetRemoteConfigBool/Int/Double/String for a specific known key.","inputs":[],"outputs":[{"n":"Return Value","t":"Map of String to String","k":"string","c":"map","r":""}],"exec":[],"topic":"Read values"},{"id":"UFirebaseRemoteConfigLibrary_GetRemoteConfigInfo","title":"Get Remote Config Info","fn":"GetRemoteConfigInfo","owner":"UFirebaseRemoteConfigLibrary","kind":"pure","module":"Remote Config","group":"","platform":"","doc":"State of the most recent Fetch/FetchAndActivate call (status, failure reason, timestamps).","inputs":[],"outputs":[{"n":"Return Value","t":"FirebaseRemoteConfigInfo","k":"struct","c":"","r":"FFirebaseRemoteConfigInfo"}],"exec":[],"topic":"Defaults and settings"},{"id":"UFirebaseRemoteConfigLibrary_GetRemoteConfigSettings","title":"Get Remote Config Settings","fn":"GetRemoteConfigSettings","owner":"UFirebaseRemoteConfigLibrary","kind":"call","module":"Remote Config","group":"","platform":"","doc":"Reads back the fetch timeout / minimum fetch interval currently in effect — either the SDK's own defaults, or whatever an earlier SetRemoteConfigSettings call applied.","inputs":[],"outputs":[{"n":"FetchTimeoutMs","t":"Integer64","k":"int64","c":"","r":""},{"n":"MinimumFetchIntervalMs","t":"Integer64","k":"int64","c":"","r":""}],"exec":[],"topic":"Defaults and settings"},{"id":"UFirebaseRemoteConfigLibrary_StartRemoteConfigRealtimeUpdates","title":"Start Remote Config Realtime Updates","fn":"StartRemoteConfigRealtimeUpdates","owner":"UFirebaseRemoteConfigLibrary","kind":"call","module":"Remote Config","group":"","platform":"","doc":"Starts listening for config changes pushed live by the Remote Config\nbackend: each change fires the Firebase BP subsystem's\nOnRemoteConfigUpdated with the changed keys. Off until called — the\nstream keeps a connection open for as long as it runs.\n\nbAutoActivate: activate each update before OnRemoteConfigUpdated fires,\nso Get calls see the new values immediately. Leave it off to apply\nchanges only at a safe moment (menu, between matches) by calling\nActivate Remote Config yourself — values changing mid-gameplay is\nrarely what you want.\n\nCalling it again while running only updates bAutoActivate; if the\nstream ended on an error (OnRemoteConfigUpdated reported\nConfigUpdateStreamError or ConfigUpdateUnavailable), it restarts it. Returns\nfalse if Remote Config isn't available (module disabled or Firebase\nnot initialized yet).","inputs":[{"n":"bAutoActivate","t":"Boolean","k":"bool","c":"","r":"","d":"false","adv":false}],"outputs":[{"n":"Return Value","t":"Boolean","k":"bool","c":"","r":""}],"exec":[],"topic":"Realtime updates"},{"id":"UFirebaseRemoteC
