onfigLibrary_StopRemoteConfigRealtimeUpdates","title":"Stop Remote Config Realtime Updates","fn":"StopRemoteConfigRealtimeUpdates","owner":"UFirebaseRemoteConfigLibrary","kind":"call","module":"Remote Config","group":"","platform":"","doc":"Stops the stream started by StartRemoteConfigRealtimeUpdates. Updates already queued are dropped.","inputs":[],"outputs":[],"exec":[],"topic":"Realtime updates"},{"id":"UFirebaseRemoteConfigLibrary_IsListeningForRemoteConfigRealtimeUpdates","title":"Is Listening For Remote Config Realtime Updates","fn":"IsListeningForRemoteConfigRealtimeUpdates","owner":"UFirebaseRemoteConfigLibrary","kind":"pure","module":"Remote Config","group":"","platform":"","doc":"True while the stream is running — false before Start, after Stop, and once the stream ended on an error (call Start again to restart it).","inputs":[],"outputs":[{"n":"Return Value","t":"Boolean","k":"bool","c":"","r":""}],"exec":[],"topic":"Realtime updates"},{"id":"UUploadFileToStorageProxy_UploadFileToStorage","title":"Upload File To Storage","fn":"UploadFileToStorage","owner":"UUploadFileToStorageProxy","kind":"async","module":"Storage","group":"","platform":"","doc":"Uploads a local file on this device to Cloud Storage at StoragePath (e.g.\n\"avatars/player1.png\") — creates the object if it doesn't exist yet,\noverwrites it if it does. ContentType is optional (e.g. \"image/png\"); leave\nempty to let Storage infer it, or if you don't need it set on download.\n\nReads the whole file into memory and uploads via PutBytes rather than the\nSDK's own PutFile — confirmed on-device (2026-08-31) that PutFile's Android\nimplementation throws \"No content provider: \u003cpath>\" (a real firebase-cpp-sdk\nbug: it hands ContentResolver a bare filesystem path instead of a proper\nfile:// Uri). Same \"fine for avatars/small assets, not huge downloadable\ncontent\" memory caveat as DownloadFileFromStorage applies here too.\n\nCacheControl/ContentDisposition/ContentEncoding/ContentLanguage: optional extra HTTP metadata to set in the same call instead of a second UpdateStorageMetadata round-trip — see FFirebaseStorageMetadata's own fields for what each one does. Leave empty to not set them.","inputs":[{"n":"StoragePath","t":"String","k":"string","c":"","r":"","adv":false},{"n":"LocalFilePath","t":"String","k":"string","c":"","r":"","adv":false},{"n":"ContentType","t":"String","k":"string","c":"","r":"","adv":false},{"n":"CacheControl","t":"String","k":"string","c":"","r":"","d":"\"\"","adv":true},{"n":"ContentDisposition","t":"String","k":"string","c":"","r":"","d":"\"\"","adv":true},{"n":"ContentEncoding","t":"String","k":"string","c":"","r":"","d":"\"\"","adv":true},{"n":"ContentLanguage","t":"String","k":"string","c":"","r":"","d":"\"\"","adv":true}],"outputs":[{"n":"Error","t":"EFirebaseStorageError","k":"enum","c":"","r":"EFirebaseStorageError"},{"n":"Metadata","t":"FirebaseStorageMetadata","k":"struct","c":"","r":"FFirebaseStorageMetadata"},{"n":"BytesTransferred","t":"Integer64","k":"int64","c":"","r":""},{"n":"TotalByteCount","t":"Integer64","k":"int64","c":"","r":""}],"exec":["OnSuccess","OnError","OnProgress"],"topic":"Transfers"},{"id":"UUploadFileToStorageProxy_UploadBytesToStorage","title":"Upload Bytes To Storage","fn":"UploadBytesToStorage","owner":"UUploadFileToStorageProxy","kind":"async","module":"Storage","group":"","platform":"","doc":"Same as Upload File To Storage, from bytes already in memory instead of a file (e.g. a SaveGame from Save Game To Snapshot Data, or generated data) — no temporary file needed.","inputs":[{"n":"StoragePath","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Data","t":"Array of Byte","k":"byte","c":"array","r":"","adv":false},{"n":"ContentType","t":"String","k":"string","c":"","r":"","adv":false},{"n":"CacheControl","t":"String","k":"string","c":"","r":"","d":"\"\"","adv":true},{"n":"ContentDisposition","t":"String","k":"string","c":"","r":"","d":"\"\"","adv":true},{"n":"ContentEncoding","t":"String","k":"string","c":"","r":"","d":"\"\"","adv":true},{"n":"ContentLanguage","t":"String","k":"string","c":"","r":"","d":"\"\"","adv":true}],"outputs":[{"n":"Error","t":"EFirebaseStorageError","k":"enum","c":"","r":"EFirebaseStorageError"},{"n":"Metadata","t":"FirebaseStorageMetadata","k":"struct","c":"","r":"FFirebaseStorageMetadata"},{"n":"BytesTransferred","t":"Integer64","k":"int64","c":"","r":""},{"n":"TotalByteCount","t":"Integer64","k":"int64","c":"","r":""}],"exec":["OnSuccess","OnError","OnProgress"],"topic":"Transfers"},{"id":"UDownloadFileFromStorageProxy_DownloadFileFromStorage","title":"Download File From Storage","fn":"DownloadFileFromStorage","owner":"UDownloadFileFromStorageProxy","kind":"async","module":"Storage","group":"","platform":"","doc":"Downloads the object at StoragePath from Cloud Storage into a local file on\nthis device, creating/overwriting LocalFilePath. Streamed straight to disk\n(not held in memory), so it's fine for large files too.","inputs":[{"n":"StoragePath","t":"String","k":"string","c":"","r":"","adv":false},{"n":"LocalFilePath","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseStorageError","k":"enum","c":"","r":"EFirebaseStorageError"},{"n":"BytesDownloaded","t":"Integer64","k":"int64","c":"","r":""},{"n":"BytesTransferred","t":"Integer64","k":"int64","c":"","r":""},{"n":"TotalByteCount","t":"Integer64","k":"int64","c":"","r":""}],"exec":["OnSuccess","OnError","OnProgress"],"topic":"Transfers"},{"id":"UDownloadBytesFromStorageProxy_DownloadBytesFromStorage","title":"Download Bytes From Storage","fn":"DownloadBytesFromStorage","owner":"UDownloadBytesFromStorageProxy","kind":"async","module":"Storage","group":"","platform":"","doc":"Downloads the object at StoragePath into memory and returns its bytes —\nno local file needed (e.g. feed them to Snapshot Data To Save Game, or\nparse them). Held entirely in memory, so meant for small objects: fails\nif the object is bigger than MaxSizeBytes (default 10 MB, at most 512 MB).\nUse Download File From Storage for large files.","inputs":[{"n":"StoragePath","t":"String","k":"string","c":"","r":"","adv":false},{"n":"MaxSizeBytes","t":"Integer64","k":"int64","c":"","r":"","d":"10485760","adv":true}],"outputs":[{"n":"Error","t":"EFirebaseStorageError","k":"enum","c":"","r":"EFirebaseStorageError"},{"n":"Data","t":"Array of Byte","k":"byte","c":"array","r":""},{"n":"BytesTransferred","t":"Integer64","k":"int64","c":"","r":""},{"n":"TotalByteCount","t":"Integer64","k":"int64","c":"","r":""}],"exec":["OnSuccess","OnError","OnProgress"],"topic":"Transfers"},{"id":"UDeleteStorageFileProxy_DeleteStorageFile","title":"Delete Storage File","fn":"DeleteStorageFile","owner":"UDeleteStorageFileProxy","kind":"async","module":"Storage","group":"","platform":"","doc":"Deletes the object at StoragePath. Fails with ObjectNotFound if nothing exists there.","inputs":[{"n":"StoragePath","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseStorageError","k":"enum","c":"","r":"EFirebaseStorageError"}],"exec":["OnSuccess","OnError"],"topic":"Files and metadata"},{"id":"UGetStorageDownloadUrlProxy_GetStorageDownloadUrl","title":"Get Storage Download Url","fn":"GetStorageDownloadUrl","owner":"UGetStorageDownloadUrlProxy","kind":"async","module":"Storage","group":"","platform":"","doc":"Retrieves a long-lived, publicly-shareable download URL for the object at\nStoragePath — revokable later from the Firebase Console if needed. This is\nwhat you'd hand to an \"Image\" widget's \"Set Brush from URL\" or similar, as\nan alternative to DownloadFileFromStorage when you just need to display/\nshare the file rather than save it locally.","inputs":[{"n":"StoragePath","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseStorageError","k":"enum","c":"","r":"EFirebaseStorageError"},{"n":"DownloadUrl","t":"String","k":"string","c":"","r":""}],"exec":["OnSuccess","OnError"],"topic":"Files and metadata"},{"id":"UGetStorageMetadataProxy_GetStorageMetadata","title":"Get Storage Metadata","fn":"GetStorageMetadata","owner":"UGetStorageMetadataProxy","kind":"async","module":"Storage","group":"","platform":"","doc":"Retrieves the metadata (size, content type, custom key/values, timestamps...) of the object at StoragePath, without downloading its data.","inputs":[{"n":"StoragePath","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseStorageError","k":"enum","c":"","r":"EFirebaseStorageError"},{"n":"Metadata","t":"FirebaseStorageMetadata","k":"struct","c":"","r":"FFirebaseStorageMetadata"}],"exec":["OnSuccess","OnError"],"topic":"Files and metadata"},{"id":"UUpdateStorageMetadataProxy_UpdateStorageMetadata","title":"Update Storage Metadata","fn":"UpdateStorageMetadata","owner":"UUpdateStorageMetadataProxy","kind":"async","module":"Storage","group":"","platform":"","doc":"Overwrites the content type and/or custom key/value metadata of the object\nat StoragePath, without re-uploading its data. Leave ContentType empty to\nleave it unchanged. CustomMetadata is MERGED into the existing custom\nmetadata: the keys you pass are added or overwritten, keys you leave out\nare kept (there's no way to delete a key through this node).\n\nCacheControl/ContentDisposition/ContentEncoding/ContentLanguage: leave empty to leave each unchanged — same as ContentType/CustomMetadata's own \"leave empty\" convention, unlike CustomMetadata this does NOT mean \"clear it\" (there's no way to clear one of these back to empty once set, matching the underlying SDK).","inputs":[{"n":"StoragePath","t":"String","k":"string","c":"","r":"","adv":false},{"n":"ContentType","t":"String","k":"string","c":"","r":"","adv":false},{"n":"CustomMetadata","t":"Map of String to String","k":"string","c":"map","r":"","adv":false},{"n":"CacheControl","t":"String","k":"string","c":"","r":"","d":"\"\"","adv":true},{"n":"ContentDisposition","t":"String","k":"string","c":"","r":"","d":"\"\"","adv":true},{"n":"ContentEncoding","t":"String","k":"string","c":"","r":"","d":"\"\"","adv":true},{"n":"ContentLanguage","t":"String","k":"string","c":"","r":"","d":"\"\"","adv":true}],"outputs":[{"n":"Error","t":"EFirebaseStorageError","k":"enum","c":"","r":"EFirebaseStorageError"},{"n":"Metadata","t":"FirebaseStorageMetadata","k":"struct","c":"","r":"FFirebaseStorageMetadata"}],"exec":["OnSuccess","OnError"],"topic":"Files and metadata"},{"id":"UListStorageFilesProxy_ListStorageFiles","title":"List Storage Files","fn":"ListStorageFiles","owner":"UListStorageFilesProxy","kind":"async","module":"Storage","group":"","platform":"","doc":"Lists the files (Items) and subfolders (Folders, e.g. \"avatars/\") directly\nunder StoragePath — \"/\" is Storage's path delimiter, this does not recurse\ninto subfolders. MaxResults caps the page size (1-1000); if there are more\nresults, NextPageToken comes back non-empty — pass it back in on the next\ncall to page through the rest, or ignore it if you only need the first page.","inputs":[{"n":"StoragePath","t":"String","k":"string","c":"","r":"","adv":false},{"n":"MaxResults","t":"Integer","k":"int","c":"","r":"","d":"1000","adv":true},{"n":"PageToken","t":"String","k":"string","c":"","r":"","d":"\"\"","adv":true}],"outputs":[{"n":"Error","t":"EFirebaseStorageError","k":"enum","c":"","r":"EFirebaseStorageError"},{"n":"Files","t":"Array of String","k":"string","c":"array","r":""},{"n":"Folders","t":"Array of String","k":"string","c":"array","r":""},{"n":"NextPageToken","t":"String","k":"string","c":"","r":""}],"exec":["OnSuccess","OnError"],"topic":"Files and metadata"},{"id":"UPickFileForStorageUploadProxy_PickFileForStorageUpload","title":"Pick File For Storage Upload","fn":"PickFileForStorageUpload","owner":"UPickFileForStorageUploadProxy","kind":"async","module":"Storage","group":"","platform":"Android","doc":"Android only. Launches the system file picker (Storage Access Framework) so\nthe user can choose any file from Photos/Downloads/Drive/etc. — no need to\nalready know a local path. The picked file is copied into this app's cache\nfolder (SAF URIs often aren't backed by a real filesystem path, especially\ncloud providers or scoped storage on Android 10+) so OnPicked's\nLocalFilePath is a real path you can feed straight into\nUploadFileToStorage. MimeTypeFilter restricts what's selectable to a given\nMIME type (e.g. images only); leave it empty to allow any file type. Error\nis Cancelled if the user backed out of the picker without choosing\nanything.\n\nEmpty MimeTypeFilter allows any file type — the implementation substitutes the wildcard MIME type internally, kept out of this file since UHT misparses it as a comment terminator.","inputs":[{"n":"MimeTypeFilter","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseStorageError","k":"enum","c":"","r":"EFirebaseStorageError"},{"n":"LocalFilePath","t":"String","k":"string","c":"","r":""},{"n":"FileName","t":"String","k":"string","c":"","r":""}],"exec":["OnPicked","OnError"],"topic":"Transfers"},{"id":"UDownloadFileToDeviceProxy_DownloadFileToDevice","title":"Download File To Device","fn":"DownloadFileToDevice","owner":"UDownloadFileToDeviceProxy","kind":"async","module":"Storage","group":"","platform":"Android","doc":"Downloads the object at StoragePath and lets the user choose exactly where\nto save it via Android's native \"Save As\" picker (Storage Access\nFramework) — no app-managed local file path involved anywhere in this\nflow. Internally: shows the picker, reads the object's real size via\nGetStorageMetadata, downloads it fully into memory (same \"fine for\navatars/small assets, not huge files\" caveat as everywhere else in this\nmodule — there's no streaming download on the underlying SDK), then writes\nthose bytes straight into the location the user picked. SuggestedFileName\npre-fills the picker's filename field (the user can still rename it);\nMimeType hints what kind of file it is (e.g. \"image/png\") for the picker's\nown UI — neither affects the actual download. Error is Cancelled if the\nuser backed out of the picker without choosing a location. Android only.","inputs":[{"n":"StoragePath","t":"String","k":"string","c":"","r":"","adv":false},{"n":"SuggestedFileName","t":"String","k":"string","c":"","r":"","adv":false},{"n":"MimeType","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseStorageError","k":"enum","c":"","r":"EFirebaseStorageError"}],"exec":["OnSuccess","OnError"],"topic":"Transfers"},{"id":"UFirebaseStorageLibrary_UseStorageEmulator","title":"Use Storage Emulator","fn":"UseStorageEmulator","owner":"UFirebaseStorageLibrary","kind":"call","module":"Storage","group":"","platform":"","doc":"Redirects every subsequent Storage call to a local Firebase Storage\nEmulator instead of the real backend — for offline/local testing only.\nMust be called before any other Storage node; calling it after Storage\nhas already made a real network call has no effect. Host is usually\n\"10.0.2.2\" from an Android emulator (loopback to the host machine) or\nyour machine's LAN IP from a real device; Port defaults to 9199 in the\nFirebase emulator suite.","inputs":[{"n":"Host","t":"String","k":"string","c":"","r":"","adv":false},{"n":"Port","t":"Integer","k":"int","c":"","r":"","adv":false}],"outputs":[],"exec":[],"topic":"Paths and settings"},{"id":"UFirebaseStorageLibrary_UseStorageBucketUrl","title":"Use Storage Bucket Url","fn":"UseStorageBucketUrl","owner":"UFirebaseStorageLibrary","kind":"call","module":"Storage","group":"","platform":"","doc":"Points every subsequent Storage call at BucketUrl (e.g.\n\"gs://my-second-bucket.appspot.com\") instead of the project's default\nCloud Storage bucket — for a game that provisions a second, differently\n-configured bucket (e.g. a public \"cdn\" bucket vs a private\n\"user-uploads\" one). Call once, before any other Storage node\n(including UploadFileToStorage); calling it again later resolves to a\ndistinct Storage instance for the new BucketUrl (the SDK caches one\ninstance per URL), it does not reconfigure the previous one. Pass an\nempty string to go back to the default bucket for any Storage instance\nnot already resolved.","inputs":[{"n":"BucketUrl","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[],"exec":[],"topic":"Paths and settings"},{"id":"UFirebaseStorageLibrary_GetStorageParentPath","title":"Get Storage Parent Path","fn":"GetStorageParentPath","owner":"UFirebaseStorageLibrary","kind":"pure","module":"Storage","group":"","platform":"","doc":"Path of Reference's parent location, or empty if Reference is already the bucket root. Pure string manipulation — no network call.","inputs":[{"n":"StoragePath","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"String","k":"string","c":"","r":""}],"exec":[],"topic":"Paths and settings"},{"id":"UFirebaseStorageLibrary_GetStorageChildPath","title":"Get Storage Child Path","fn":"GetStorageChildPath","owner":"UFirebaseStorageLibrary","kind":"pure","module":"Storage","group":"","platform":"","doc":"Path of a child location under StoragePath (e.g. \"avatars\" + \"player1.png\" -> \"avatars/player1.png\"). Pure string manipulation — no network call.","inputs":[{"n":"StoragePath","t":"String","k":"string","c":"","r":"","adv":false},{"n":"ChildName","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"String","k":"string","c":"","r":""}],"exec":[],"topic":"Paths and settings"},{"id":"UFirebaseStorageLibrary_GetStorageBucketName","title":"Get Storage Bucket Name","fn":"GetStorageBucketName","owner":"UFirebaseStorageLibrary","kind":"pure","module":"Storage","group":"","platform":"","doc":"The Cloud Storage bucket this app is currently configured to use (its default bucket, or whatever UseStorageBucketUrl last pointed at) — e.g. \"my-project.appspot.com\". Empty if Storage isn't available. Unlike GetStorageMetadata's own Bucket field, this needs no network call.","inputs":[],"outputs":[{"n":"Return Value","t":"String","k":"string","c":"","r":""}],"exec":[],"topic":"Paths and settings"},{"id":"UFirebaseStorageLibrary_ConvertStorageUrlToPath","title":"Convert Storage Url To Path","fn":"ConvertStorageUrlToPath","owner":"UFirebaseStorageLibrary","kind":"pure","module":"Storage","group":"","platform":"","doc":"Converts a \"gs://bucket/path\" URL (e.g. one stored in a Firestore\ndocument or Remote Config value) into a plain StoragePath string usable\nwith every other node in this module (UploadFileToStorage,\nGetStorageMetadata, ...) — an alternative to manually stripping the\n\"gs://bucket/\" prefix yourself. Url must belong to this app's own\ndefault Storage bucket; returns an empty string if it doesn't, or if\nStorage isn't available.","inputs":[{"n":"Url","t":"String","k":"string","c":"","r":"","adv":false}],"outputs":[{"n":"Return Value","t":"String","k":"string","c":"","r":""}],"exec":[],"topic":"Paths and settings"},{"id":"UFirebaseStorageLibrary_SetStorageRetryTimes","title":"Set Storage Retry Times","fn":"SetStorageRetryTimes","owner":"UFirebaseStorageLibrary","kind":"call","module":"Storage","group":"","platform":"","doc":"Sets how long (in seconds) an upload/download/other operation keeps\nautomatically retrying a failed transfer before giving up — the SDK's\nown defaults are 600s (upload), 600s (download), 120s (other\noperations: metadata/list/delete). Lower these for a fail-fast UI on a\nknown-flaky connection, or raise them for a huge asset on mobile\nnetworks where the default might not be long enough. Fire-and-forget;\napplies to every subsequent transfer, not retroactively to ones already\nin flight.","inputs":[{"n":"MaxUploadRetrySeconds","t":"Float","k":"float","c":"","r":"","adv":false},{"n":"MaxDownloadRetrySeconds","t":"Float","k":"float","c":"","r":"","adv":false},{"n":"MaxOperationRetrySeconds","t":"Float","k":"float","c":"","r":"","adv":false}],"outputs":[],"exec":[],"topic":"Paths and settings"},{"id":"UFirebaseStorageLibrary_GetStorageRetryTimes","title":"Get Storage Retry Times","fn":"GetStorageRetryTimes","owner":"UFirebaseStorageLibrary","kind":"pure","module":"Storage","group":"","platform":"","doc":"The upload/download/other-operation retry times currently in effect\n(the SDK's own defaults if SetStorageRetryTimes was never called) — the\nread-back counterpart to SetStorageRetryTimes. All three are zeroed if\nStorage isn't available.","inputs":[],"outputs":[{"n":"MaxUploadRetrySeconds","t":"Float","k":"float","c":"","r":""},{"n":"MaxDownloadRetrySeconds","t":"Float","k":"float","c":"","r":""},{"n":"MaxOperationRetrySeconds","t":"Float","k":"float","c":"","r":""}],"exec":[],"topic":"Paths and settings"},{"id":"UFirebaseStorageTransferControl_Pause","title":"Pause","fn":"Pause","owner":"UFirebaseStorageTransferControl","kind":"call","module":"Storage","group":"","platform":"","doc":"Pauses the transfer. Returns false if it couldn't be paused (e.g. it already finished, or the underlying platform doesn't support pausing this kind of transfer).","inputs":[{"n":"Target","t":"FirebaseStorageTransferControl","k":"object","c":"","r":"","target":true}],"outputs":[{"n":"Return Value","t":"Boolean","k":"bool","c":"","r":""}],"exec":[],"topic":"Transfer control"},{"id":"UFirebaseStorageTransferControl_Resume","title":"Resume","fn":"Resume","owner":"UFirebaseStorageTransferControl","kind":"call","module":"Storage","group":"","platform":"","doc":"Resumes a transfer previously paused with Pause(). Returns false if it couldn't be resumed (e.g. it wasn't paused).","inputs":[{"n":"Target","t":"FirebaseStorageTransferControl","k":"object","c":"","r":"","target":true}],"outputs":[{"n":"Return Value","t":"Boolean","k":"bool","c":"","r":""}],"exec":[],"topic":"Transfer control"},{"id":"UFirebaseStorageTransferControl_Cancel","title":"Cancel","fn":"Cancel","owner":"UFirebaseStorageTransferControl","kind":"call","module":"Storage","group":"","platform":"","doc":"Cancels the transfer outright — it cannot be resumed afterwards. The proxy's OnError fires once the cancellation is observed. Returns false if it couldn't be cancelled (e.g. it already finished).","inputs":[{"n":"Target","t":"FirebaseStorageTransferControl","k":"object","c":"","r":"","target":true}],"outputs":[{"n":"Return Value","t":"Boolean","k":"bool","c":"","r":""}],"exec":[],"topic":"Transfer control"},{"id":"UFirebaseStorageTransferControl_IsTransferPaused","title":"Is Transfer Paused","fn":"IsTransferPaused","owner":"UFirebaseStorageTransferControl","kind":"pure","module":"Storage","group":"","platform":"","doc":"","inputs":[{"n":"Target","t":"FirebaseStorageTransferControl","k":"object","c":"","r":"","target":true}],"outputs":[{"n":"Return Value","t":"Boolean","k":"bool","c":"","r":""}],"exec":[],"topic":"Transfer control"},{"id":"UFirebaseStorageTransferControl_GetBytesTransferred","title":"Get Bytes Transferred","fn":"GetBytesTransferred","owner":"UFirebaseStorageTransferControl","kind":"pure","module":"Storage","group":"","platform":"","doc":"","inputs":[{"n":"Target","t":"FirebaseStorageTransferControl","k":"object","c":"","r":"","target":true}],"outputs":[{"n":"Return Value","t":"Integer64","k":"int64","c":"","r":""}],"exec":[],"topic":"Transfer control"},{"id":"UFirebaseStorageTransferControl_GetTotalByteCount","title":"Get Total Byte Count","fn":"GetTotalByteCount","owner":"UFirebaseStorageTransferControl","kind":"pure","module":"Storage","group":"","platform":"","doc":"-1 if the total size isn't known yet (e.g. right at the very start of the transfer).","inputs":[{"n":"Target","t":"FirebaseStorageTransferControl","k":"object","c":"","r":"","target":true}],"outputs":[{"n":"Return Value","t":"Integer64","k":"int64","c":"","r":""}],"exec":[],"topic":"Transfer control"},{"id":"UFirebaseStorageTransferControl_IsValid","title":"Is Valid","fn":"IsValid","owner":"UFirebaseStorageTransferControl","kind":"pure","module":"Storage","group":"","platform":"","doc":"False once the transfer this was attached to has finished (or if this Control was never actually attached to one).","inputs":[{"n":"Target","t":"FirebaseStorageTransferControl","k":"object","c":"","r":"","target":true}],"outputs":[{"n":"Return Value","t":"Boolean","k":"bool","c":"","r":""}],"exec":[],"topic":"Transfer control"},{"id":"UCheckForAppUpdateProxy_CheckForAppUpdate","title":"Check For App Update","fn":"CheckForAppUpdate","owner":"UCheckForAppUpdateProxy","kind":"async","module":"Store Services","group":"","platform":"","doc":"Checks whether a newer build of this app is available. Android via Google\nPlay Core's AppUpdateManager; iOS via an App Store version lookup (see\nFFirebaseAppUpdateInfo's own doc comment for the per-platform field\ndifferences this implies). Not a Firebase product — grouped under\nStoreServices for the same \"toggle to shrink the build\" reason as\nAdMob/Billing/PlayGames.","inputs":[],"outputs":[{"n":"Error","t":"EFirebaseAppUpdateError","k":"enum","c":"","r":"EFirebaseAppUpdateError"},{"n":"Info","t":"FirebaseAppUpdateInfo","k":"struct","c":"","r":"FFirebaseAppUpdateInfo"}],"exec":["OnResult","OnFailed"],"topic":"In-app updates"},{"id":"UStartImmediateAppUpdateProxy_StartImmediateAppUpdate","title":"Start Immediate App Update","fn":"StartImmediateAppUpdate","owner":"UStartImmediateAppUpdateProxy","kind":"async","module":"Store Services","group":"","platform":"","doc":"Starts Android Play Core's full-screen, blocking Immediate update flow\n(the player cannot use the app again until it updates), or on iOS, opens\nthis app's App Store product page directly (the closest available\nequivalent — there is no in-app \"immediate update\" concept on iOS). Call\nCheckForAppUpdate first and only call this when bImmediateUpdateAllowed is\ntrue. On Android, OnStarted fires once the update flow launches — not once\nthe update actually finishes (the OS restarts the app automatically when\nit does, so there is nothing further to observe from Blueprint). On iOS,\nOnStarted fires once the App Store page has been requested to open; there\nis no further signal available after that.","inputs":[],"outputs":[{"n":"Error","t":"EFirebaseAppUpdateError","k":"enum","c":"","r":"EFirebaseAppUpdateError"}],"exec":["OnStarted","OnFailed"],"topic":"In-app updates"},{"id":"UStartFlexibleAppUpdateProxy_StartFlexibleAppUpdate","title":"Start Flexible App Update","fn":"StartFlexibleAppUpdate","owner":"UStartFlexibleAppUpdateProxy","kind":"async","module":"Store Services","group":"","platform":"Android","doc":"Starts Android Play Core's Flexible update flow (downloads in the\nbackground while the player keeps using the app) — Android only, no iOS\nequivalent exists (always fails with NotAvailable there; use\nStartImmediateAppUpdate instead). Call CheckForAppUpdate first and only\ncall this when bFlexibleUpdateAllowed is true. Bind\nUFirebaseBPSubsystem::OnAppUpdateStateChanged for download progress, and\ncall CompleteFlexibleAppUpdate once it reports Downloaded.","inputs":[],"outputs":[{"n":"Error","t":"EFirebaseAppUpdateError","k":"enum","c":"","r":"EFirebaseAppUpdateError"}],"exec":["OnStarted","OnFailed"],"topic":"In-app updates"},{"id":"UFirebaseBPStoreServicesLibrary_RequestAppReview","title":"Request App Review","fn":"RequestAppReview","owner":"UFirebaseBPStoreServicesLibrary","kind":"call","module":"Store Services","group":"","platform":"","doc":"Requests the native in-app review prompt (Android: Google Play\nIn-App Review; iOS: SKStoreReviewController) — per both platforms'\nown anti-gaming policies, this never reports whether the prompt was\nactually shown or what the player did with it, and the OS itself\nlimits how often it will actually appear regardless of how often\nthis is called. Call it at a natural break in play, never right\nafter a negative moment (e.g. a crash or a failed purchase).","inputs":[],"outputs":[],"exec":[],"topic":"Reviews"},{"id":"UFirebaseBPStoreServicesLibrary_CompleteFlexibleAppUpdate","title":"Complete Flexible App Update","fn":"CompleteFlexibleAppUpdate","owner":"UFirebaseBPStoreServicesLibrary","kind":"call","module":"Store Services","group":"","platform":"Android","doc":"Android only: call once UFirebaseBPSubsystem::OnAppUpdateStateChanged reports Downloaded, to prompt the player to restart and finish installing a Flexible update. No-op on every other platform.","inputs":[],"outputs":[],"exec":[],"topic":"In-app updates"},{"id":"URequestUMPConsentInfoUpdateProxy_RequestUMPConsentInfoUpdate","title":"Request UMP Consent Info Update","fn":"RequestUMPConsentInfoUpdate","owner":"URequestUMPConsentInfoUpdateProxy","kind":"async","module":"UMP","group":"","platform":"","doc":"Requests an update of the end user's consent info — must be called once\nper app session, before checking GetUMPConsentStatus()/CanRequestAds() or\ncalling LoadAndShowUMPConsentFormIfRequired(). Updates GetUMPConsentStatus()/\nCanRequestAds() immediately to the previous session's value (if any), then\nagain once this completes. Cross-platform (Android/iOS/Windows) via\nfirebase::ump::ConsentInfo — see UFirebaseAdMobLibrary::RequestConsentInfoUpdate\nfor AdMob's own convenience node that chains this straight into\nLoadAndShowUMPConsentFormIfRequired for you.","inputs":[{"n":"Params","t":"FirebaseUMPConsentRequestParameters","k":"struct","c":"","r":"FFirebaseUMPConsentRequestParameters","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseUMPConsentRequestError","k":"enum","c":"","r":"EFirebaseUMPConsentRequestError"}],"exec":["OnSuccess","OnError"],"topic":"Consent flow"},{"id":"ULoadAndShowUMPConsentFormIfRequiredProxy_LoadAndShowUMPConsentFormIfRequired","title":"Load And Show UMP Consent Form If Required","fn":"LoadAndShowUMPConsentFormIfRequired","owner":"ULoadAndShowUMPConsentFormIfRequiredProxy","kind":"async","module":"UMP","group":"","platform":"","doc":"Loads a consent form and immediately presents it (over the app's own\nwindow/root view) if GetUMPConsentStatus() is Required; completes\nsuccessfully without showing anything otherwise. Call\nRequestUMPConsentInfoUpdate first and wait for it to complete.\nGetUMPConsentStatus()/CanRequestAds() are updated before this completes.","inputs":[],"outputs":[{"n":"Error","t":"EFirebaseUMPConsentFormError","k":"enum","c":"","r":"EFirebaseUMPConsentFormError"}],"exec":["OnSuccess","OnError"],"topic":"Consent flow"},{"id":"ULoadUMPConsentFormProxy_LoadUMPConsentForm","title":"Load UMP Consent Form","fn":"LoadUMPConsentForm","owner":"ULoadUMPConsentFormProxy","kind":"async","module":"UMP","group":"","platform":"","doc":"Loads a consent form ahead of time without showing it — pair with\nShowUMPConsentForm to control exactly when it appears (e.g. pre-load\nduring a splash/loading screen so it can be shown instantly right\nafterward, with no network wait), instead of LoadAndShowUMPConsentFormIfRequired's\ncombined \"load then immediately show\" behavior. Succeeds (with nothing to\nshow later) even if GetUMPConsentStatus() isn't Required — check that\nyourself before bothering to call this. Call RequestUMPConsentInfoUpdate\nfirst and wait for it to complete.","inputs":[],"outputs":[{"n":"Error","t":"EFirebaseUMPConsentFormError","k":"enum","c":"","r":"EFirebaseUMPConsentFormError"}],"exec":["OnSuccess","OnError"],"topic":"Consent flow"},{"id":"UShowUMPConsentFormProxy_ShowUMPConsentForm","title":"Show UMP Consent Form","fn":"ShowUMPConsentForm","owner":"UShowUMPConsentFormProxy","kind":"async","module":"UMP","group":"","platform":"","doc":"Presents a consent form previously loaded via LoadUMPConsentForm — fails\nwith FormNotAvailable-style error if none was loaded (or it already failed\nto load). Prefer LoadAndShowUMPConsentFormIfRequired unless you specifically\nneed to control the load/show timing separately (see LoadUMPConsentForm's\nown doc comment).","inputs":[],"outputs":[{"n":"Error","t":"EFirebaseUMPConsentFormError","k":"enum","c":"","r":"EFirebaseUMPConsentFormError"}],"exec":["OnSuccess","OnError"],"topic":"Consent flow"},{"id":"UShowUMPPrivacyOptionsFormProxy_ShowUMPPrivacyOptionsForm","title":"Show UMP Privacy Options Form","fn":"ShowUMPPrivacyOptionsForm","owner":"UShowUMPPrivacyOptionsFormProxy","kind":"async","module":"UMP","group":"","platform":"","doc":"Re-shows the \"Privacy Options\" form so the user can change a consent\nchoice they already made — wire this to a \"Privacy Options\" entry in your\nown settings menu, shown only when GetUMPPrivacyOptionsRequirementStatus()\nis Required (most non-EEA/UK users will never need it). Requires\nRequestUMPConsentInfoUpdate to have already completed at least once this\nsession.","inputs":[],"outputs":[{"n":"Error","t":"EFirebaseUMPConsentFormError","k":"enum","c":"","r":"EFirebaseUMPConsentFormError"}],"exec":["OnSuccess","OnError"],"topic":"Consent flow"},{"id":"UFirebaseUMPLibrary_GetUMPConsentStatus","title":"Get UMPConsent Status","fn":"GetUMPConsentStatus","owner":"UFirebaseUMPLibrary","kind":"pure","module":"UMP","group":"","platform":"","doc":"The user's consent status. Unknown until RequestUMPConsentInfoUpdate completes; defaults to the previous session's value until then.","inputs":[],"outputs":[{"n":"Return Value","t":"EFirebaseConsentStatus","k":"enum","c":"","r":"EFirebaseConsentStatus"}],"exec":[],"topic":"Status and testing"},{"id":"UFirebaseUMPLibrary_GetUMPConsentFormStatus","title":"Get UMPConsent Form Status","fn":"GetUMPConsentFormStatus","owner":"UFirebaseUMPLibrary","kind":"pure","module":"UMP","group":"","platform":"","doc":"Whether a consent form is available to show. Unknown until RequestUMPConsentInfoUpdate completes.","inputs":[],"outputs":[{"n":"Return Value","t":"EFirebaseUMPConsentFormStatus","k":"enum","c":"","r":"EFirebaseUMPConsentFormStatus"}],"exec":[],"topic":"Status and testing"},{"id":"UFirebaseUMPLibrary_GetUMPPrivacyOptionsRequirementStatus","title":"Get UMPPrivacy Options Requirement Status","fn":"GetUMPPrivacyOptionsRequirementStatus","owner":"UFirebaseUMPLibrary","kind":"pure","module":"UMP","group":"","platform":"","doc":"Whether the \"Privacy Options\" re-consent entry point needs to be shown. Unknown until RequestUMPConsentInfoUpdate completes.","inputs":[],"outputs":[{"n":"Return Value","t":"EFirebaseUMPPrivacyOptionsRequirementStatus","k":"enum","c":"","r":"EFirebaseUMPPrivacyOptionsRequirementStatus"}],"exec":[],"topic":"Status and testing"},{"id":"UFirebaseUMPLibrary_CanRequestAds","title":"Can Request Ads","fn":"CanRequestAds","owner":"UFirebaseUMPLibrary","kind":"pure","module":"UMP","group":"","platform":"","doc":"True once consent (per the user's region/choice) allows ad/personalization\nrequests to proceed — check this before requesting ads. False if\nRequestUMPConsentInfoUpdate hasn't completed yet.","inputs":[],"outputs":[{"n":"Return Value","t":"Boolean","k":"bool","c":"","r":""}],"exec":[],"topic":"Status and testing"},{"id":"UFirebaseUMPLibrary_ResetUMPConsentState","title":"Reset UMPConsent State","fn":"ResetUMPConsentState","owner":"UFirebaseUMPLibrary","kind":"call","module":"UMP","group":"","platform":"","doc":"Clears all consent state from persistent storage. Development only, to simulate a fresh install.","inputs":[],"outputs":[],"exec":[],"topic":"Status and testing"},{"id":"UFirebaseUMPLibrary_GetThisDeviceHashedId","title":"Get This Device Hashed Id","fn":"GetThisDeviceHashedId","owner":"UFirebaseUMPLibrary","kind":"pure","module":"UMP","group":"","platform":"Android","doc":"This device's hashed ID, the value UMP's DebugDeviceIds (and AdMob's\ntest device IDs) expect — so a development build can test the consent\nform on its own device without copying the ID from the device log.\nAndroid only (MD5 of the device's ANDROID_ID, the hash Google's SDKs\nlog); empty elsewhere — on iOS, use the ID the UMP SDK prints in the\nXcode console. Only pass it to debug settings in development builds.","inputs":[],"outputs":[{"n":"Return Value","t":"String","k":"string","c":"","r":""}],"exec":[],"topic":"Status and testing"}],"events":[{"id":"evt_OnFirebaseInitialized","title":"On Firebase Initialized","name":"OnFirebaseInitialized","doc":"","platform":"","outputs":[{"n":"Result","t":"FirebaseBPError","k":"struct","c":"","r":"FFirebaseBPError"}],"module":"Core"},{"id":"evt_OnAuthStateChanged","title":"On Auth State Changed","name":"OnAuthStateChanged","doc":"Broadcasts the currently signed-in user (User.bIsValid will be false if\nsigned out) whenever the Firebase Auth state changes: once at startup\nwith the user restored from the previous session (if any), then on\nsign-in, sign-out, and when the current user changes. The startup event\nis queued to the Game Thread's next tick, normally after the startup\nlevel's BeginPlay (and it's replayed at the start of every Play In\nEditor session); anything that binds later should read Get Current\nUser for the current state instead of waiting for it. Never fires if\nAuth is disabled in Project Settings -> Firebase BP.","platform":"","outputs":[{"n":"User","t":"FirebaseUser","k":"struct","c":"","r":"FFirebaseUser"}],"module":"Auth"},{"id":"evt_OnIdTokenChanged","title":"On Id Token Changed","name":"OnIdTokenChanged","doc":"Broadcasts the currently signed-in user whenever their ID token is\nrefreshed — a superset of OnAuthStateChanged: also fires on the SDK's\nown periodic silent token refreshes (roughly hourly), not just on\nsign-in/sign-out/user-change. Bind this instead of OnAuthStateChanged\nonly if you specifically need to know about every token refresh (e.g.\nto re-send a fresh token to your own backend) — most Blueprint graphs\nwant OnAuthStateChanged. Doesn't carry the token itself: call\nGetIdToken(bForceRefresh=false) right after, which is guaranteed cheap\nsince a fresh token is already cached at that point. Never fires if\nAuth is disabled in Project Settings -> Firebase BP.","platform":"","outputs":[{"n":"User","t":"FirebaseUser","k":"struct","c":"","r":"FFirebaseUser"}],"module":"Auth"},{"id":"evt_OnFCMMessageReceived","title":"On FCMMessage Received","name":"OnFCMMessageReceived","doc":"Fires for every incoming FCM message, whether it carries a notification, a data payload, or both. Never fires if Messaging is disabled in Project Settings -> Firebase BP.","platform":"","outputs":[{"n":"Message","t":"FirebaseCloudMessage","k":"struct","c":"","r":"FFirebaseCloudMessage"}],"module":"Messaging"},{"id":"evt_OnFCMTokenReceived","title":"On FCMToken Received","name":"OnFCMTokenReceived","doc":"Fires whenever a new FCM registration Installation ID is generated (first launch, refresh, or reinstall) — native SDK: OnRegistrationReceived(), formerly OnTokenReceived(). Never fires if Messaging is disabled.","platform":"","outputs":[{"n":"Token","t":"String","k":"string","c":"","r":""}],"module":"Messaging"},{"id":"evt_OnFCMTokenUnregistered","title":"On FCMToken Unregistered","name":"OnFCMTokenUnregistered","doc":"Never fires if Messaging is disabled.\n\nFires when the SDK reports this installation's FCM registration has been removed (e.g. after UDeleteFCMTokenProxy completes, or the token was invalidated server-side). Redundant with UDeleteFCMTokenProxy's own Future for the former case; mainly useful for the latter, which that Future can't observe.","platform":"","outputs":[{"n":"InstallationId","t":"String","k":"string","c":"","r":""}],"module":"Messaging"},{"id":"evt_OnApplicationForegrounded","title":"On Application Foregrounded","name":"OnApplicationForegrounded","doc":"Fires when the app returns to the foreground (e.g. after being\nbackgrounded by the home button or an app switch) — the natural place\nto show a preloaded App Open ad. Unlike UApplicationLifecycleComponent,\nthis works from any level with zero per-level setup: the subsystem\n(and its delegate bindings) already live for the whole game instance.\nIndependent of any FirebaseBP module toggle — always available.","platform":"","outputs":[],"module":"Core"},{"id":"evt_OnApplicationBackgrounded","title":"On Application Backgrounded","name":"OnApplicationBackgrounded","doc":"Fires when the app is about to be backgrounded (e.g. home button, app switch, incoming call).","platform":"","outputs":[],"module":"Core"},{"id":"evt_OnBillingReady","title":"On Billing Ready","name":"OnBillingReady","doc":"Fires once the connection to Google Play Billing is established (or lost/reconnected). See also UFirebaseBillingLibrary::IsBillingReady for a synchronous check. Never fires if Billing is disabled in Project Settings -> Firebase BP.","platform":"","outputs":[{"n":"bReady","t":"Boolean","k":"bool","c":"","r":""}],"module":"Billing"},{"id":"evt_OnPurchasesUpdated","title":"On Purchases Updated","name":"OnPurchasesUpdated","doc":"Fires for every purchase result Google Play Billing reports — from\nPurchaseProduct, from RestorePurchases, or settling on its own (e.g. a\nPending purchase that later completes) — after this plugin's own\nautomatic acknowledge/consume has been started (see Auto Consume\nConsumables in Project Settings to consume them yourself, after\ngranting, instead). Grant only when bIsAcknowledged is false (a\nre-report of an already-handled purchase has it true). Bind this if you sell\nconsumables/subscriptions and want a single place that never misses a\npurchase, rather than relying only on PurchaseProduct's own result.\nNever fires if Billing is disabled.","platform":"","outputs":[{"n":"Purchases","t":"Array of FirebasePurchase","k":"struct","c":"array","r":""}],"module":"Billing"},{"id":"evt_OnPurchaseConsumed","title":"On Purchase Consumed","name":"OnPurchaseConsumed","doc":"Fires when a Consumable's consume finished: bSuccess true once Google\nPlay confirmed it, false once the automatic retries gave up (the\npurchase is then still owned and will be reported again; with Auto\nConsume Consumables off, call Consume Purchase again then). Never fires\nif Billing is disabled.","platform":"","outputs":[{"n":"PurchaseToken","t":"String","k":"string","c":"","r":""},{"n":"bSuccess","t":"Boolean","k":"bool","c":"","r":""}],"module":"Billing"},{"id":"evt_OnRemoteConfigUpdated","title":"On Remote Config Updated","name":"OnRemoteConfigUpdated","doc":"Fires when the Remote Config backend pushes a live update, once\nStartRemoteConfigRealtimeUpdates has been called (never before).\nUpdatedKeys lists which parameter keys changed. With bAutoActivate on,\nthe new values are already active when this fires; otherwise they are\nfetched but only applied once you call Activate Remote Config.","platform":"","outputs":[{"n":"UpdatedKeys","t":"Array of String","k":"string","c":"array","r":""},{"n":"Error","t":"EFirebaseRemoteConfigError","k":"enum","c":"","r":"EFirebaseRemoteConfigError"}],"module":"Remote Config"},{"id":"evt_OnAppCheckTokenChanged","title":"On App Check Token Changed","name":"OnAppCheckTokenChanged","doc":"Broadcasts whenever the App Check token changes, i.e. on every refresh\n(does NOT fire on plain expiry, only on an actual change — see the\nnative SDK's own AppCheckListener doc comment). Not replayed when you\nbind: a token obtained before that (at startup) isn't re-sent, so call\nGet App Check Token for the current one. Only needed if you authorize requests to your OWN backend\nwith an App Check token (GetLimitedUseAppCheckToken/GetAppCheckToken);\ncalls to Firebase services themselves are authorized automatically and\ndon't need this. Never fires if App Check is disabled in Project\nSettings -> Firebase BP.","platform":"","outputs":[{"n":"Token","t":"FirebaseAppCheckToken","k":"struct","c":"","r":"FFirebaseAppCheckToken"}],"module":"App Check"},{"id":"evt_OnAnalyticsLogMessage","title":"On Analytics Log Message","name":"OnAnalyticsLogMessage","doc":"Only fires once UFirebaseAnalyticsLibrary::SetFirebaseAnalyticsLogCallbackEnabled(true) is called.\n\nFires for every message the Analytics SDK's own internal logger emits, once UFirebaseAnalyticsLibrary::SetFirebaseAnalyticsLogCallbackEnabled(true) is called. Level reuses EFirebaseLogLevel (see SetFirebaseLogLevel's own doc comment) — this is a separate, Analytics-specific log stream, not affected by SetFirebaseLogLevel itself.","platform":"","outputs":[{"n":"Level","t":"EFirebaseLogLevel","k":"enum","c":"","r":"EFirebaseLogLevel"},{"n":"Message","t":"String","k":"string","c":"","r":""}],"module":"Analytics"},{"id":"evt_OnAppUpdateStateChanged","title":"On App Update State Changed","name":"OnAppUpdateStateChanged","doc":"Never fires if StoreServices is disabled in Project Settings -> Firebase BP.\n\nAndroid only: progress of a StartFlexibleAppUpdate download — fires an arbitrary number of times over an arbitrarily long period, so this is a persistent subsystem delegate rather than a one-shot proxy result. Register early (see UFirebaseBPStoreServicesLibrary's own module doc comment) to catch a download that finishes while nothing is bound yet. Never fires on iOS or if StoreServices is disabled.","platform":"Android","outputs":[{"n":"InstallStatus","t":"EFirebaseAppUpdateInstallStatus","k":"enum","c":"","r":"EFirebaseAppUpdateInstallStatus"},{"n":"BytesDownloaded","t":"Integer64","k":"int64","c":"","r":""},{"n":"TotalBytesToDownload","t":"Integer64","k":"int64","c":"","r":""}],"module":"Store Services"},{"id":"evt_OnAdPaid","title":"On Ad Paid","name":"OnAdPaid","doc":"Fires for every ad impression AdMob reports revenue for (interstitial,\nrewarded, app open, banner) — the raw signal to forward to an\nattribution/LTV SDK or to accumulate into your own ad-revenue stats.\nAndroid only; never fires if AdMob is disabled in Project Settings ->\nFirebase BP. Bind this once, early: it isn't tied to any one Load/Show\ncall, and impressions can be reported at any point while an ad is on\nscreen.","platform":"Android","outputs":[{"n":"Event","t":"FirebaseAdPaidEvent","k":"struct","c":"","r":"FFirebaseAdPaidEvent"}],"module":"AdMob"}],"types":[{"id":"FFirebaseAdPaidEvent","kind":"struct","name":"FFirebaseAdPaidEvent","module":"AdMob","doc":"One ad impression's estimated revenue, reported by AdMob's OnPaidEvent —\nthe raw signal LTV/attribution SDKs (AppsFlyer, Adjust, Firebase\nAnalytics' own ad_impression event, ...) need, and the basis for any\nin-game ad-revenue tracking. Android only.","fields":[{"n":"Format","t":"EFirebaseAdMobAdFormat","k":"enum","c":"","r":"EFirebaseAdMobAdFormat","doc":"","d":"EFirebaseAdMobAdFormat::Unknown"},{"n":"AdUnitId","t":"String","k":"string","c":"","r":"","doc":"The Ad Unit ID this impression was served for (the one passed to the matching Load*Ad call)."},{"n":"ValueMicros","t":"Integer64","k":"int64","c":"","r":"","doc":"Revenue in millionths of CurrencyCode's unit (AdMob's own representation — e.g. 1500000 = 1.5 USD), kept as an exact integer so summing many events doesn't accumulate floating-point error.","d":"0"},{"n":"Value","t":"Float","k":"float","c":"","r":"","doc":"ValueMicros / 1,000,000, for convenience — prefer ValueMicros when accumulating totals.","d":"0.0"},{"n":"CurrencyCode","t":"String","k":"string","c":"","r":"","doc":"ISO 4217 currency code, e.g. \"USD\"."},{"n":"Precision","t":"EFirebaseAdValuePrecision","k":"enum","c":"","r":"EFirebaseAdValuePrecision","doc":"","d":"EFirebaseAdValuePrecision::Unknown"},{"n":"AdSourceName","t":"String","k":"string","c":"","r":"","doc":"The ad network that actually served this impression via mediation (e.g. \"AdMob Network\"); empty if unavailable."}]},{"id":"FFirebaseAnalyticsItem","kind":"struct","name":"FFirebaseAnalyticsItem","module":"Analytics","doc":"One entry of the standard \"items\" event parameter (GA4 e-commerce events:\npurchase, add_to_cart, view_item_list, ...). Fill StringFields with the\ntext attributes (keys like \"item_id\", \"item_name\", \"item_brand\",\n\"item_category\", \"item_variant\" — see GetAnalyticsParameterName for the\nexact standard names) and NumberFields with the numeric ones (\"price\",\n\"quantity\", \"index\", \"discount\"). Whole-number NumberFields values are\nsent as integers, fractional ones as doubles.","fields":[{"n":"StringFields","t":"Map of String to String","k":"string","c":"map","r":"","doc":""},{"n":"NumberFields","t":"Map of String to Float","k":"string","c":"map","r":"","doc":""}]},{"id":"FFirebaseAnalyticsParameterValue","kind":"struct","name":"FFirebaseAnalyticsParameterValue","module":"Analytics","doc":"One Analytics event parameter value. Only the member matching Type is\nmeaningful. Deliberately not exposed as UPROPERTY (same reasoning as\nFFirebaseFirestoreValue) — build/read through UFirebaseAnalyticsLibrary's\nMakeAnalyticsParamInt/Double/String instead, each a single-purpose,\nBlueprintAutocast-tagged node.","fields":[]},{"id":"FFirebaseAppCheckToken","kind":"struct","name":"FFirebaseAppCheckToken","module":"App Check","doc":"Mirrors firebase::app_check::AppCheckToken — the SDK mints a fresh\nexpiration alongside every token (GetAppCheckToken() returns a cached\ntoken until it's within its own refresh window of ExpireTime, then mints a\nnew one automatically), so there's no need to track \"when was this\nreceived\" client-side: ExpireTime already tells you exactly how long this\nspecific token is valid for. See UFirebaseAppCheckLibrary::IsAppCheckTokenExpired.","fields":[{"n":"Token","t":"String","k":"string","c":"","r":"","doc":""},{"n":"ExpireTime","t":"Date Time","k":"struct","c":"","r":"","doc":"UTC time this token stops being valid."}]},{"id":"FFirebaseBPPhoneForceResendingToken","kind":"struct","name":"FFirebaseBPPhoneForceResendingToken","module":"Auth","doc":"Opaque handle to a firebase::auth::PhoneAuthProvider::ForceResendingToken,\ncaptured from SendPhoneVerificationCode's OnCodeSentWithToken. Pass it back\ninto a follow-up SendPhoneVerificationCode call (its ResendToken param) for\nthe same phone number to force a second SMS instead of silently being\ndeduplicated by the backend's own anti-spam logic (\"Resend code\" UX).","fields":[]},{"id":"FFirebaseBPError","kind":"struct","name":"FFirebaseBPError","module":"Auth","doc":"","fields":[{"n":"bSuccess","t":"Boolean","k":"bool","c":"","r":"","doc":"","d":"false"},{"n":"ErrorCode","t":"Integer","k":"int","c":"","r":"","doc":"","d":"0"},{"n":"ErrorMessage","t":"String","k":"string","c":"","r":"","doc":""}]},{"id":"FFirebaseAuthCredential","kind":"struct","name":"FFirebaseAuthCredential","module":"Auth","doc":"An opaque Firebase Auth credential, passed between Blueprint nodes as is:\nbuilt by Make OAuth Credential, or handed back by a failed Link node as\nAdditionalInfo.UpdatedCredential, then consumed by Sign In / Link /\nReauthenticate With Credential. Not saved anywhere: it only lives as long\nas the variable holding it, and a game restart loses it.","fields":[{"n":"bIsValid","t":"Boolean","k":"bool","c":"","r":"","doc":"False for an empty (default) credential, e.g. when a link failure didn't come with one.","d":"false"},{"n":"ProviderId","t":"String","k":"string","c":"","r":"","doc":"The provider this credential signs in with, e.g. \"google.com\", \"apple.com\"."}]},{"id":"FFirebaseAuthAdditionalUserInfo","kind":"struct","name":"FFirebaseAuthAdditionalUserInfo","module":"Auth","doc":"Identity-provider specific info returned alongside a sign-in/link/\nreauthenticate result (firebase::auth::AdditionalUserInfo) — only populated\non FFirebaseUser values coming out of one of those operations; always\ndefault-constructed (empty) on a FFirebaseUser from GetCurrentUser() or any\nother source, since the SDK itself only attaches this to a fresh result.","fields":[{"n":"ProviderId","t":"String","k":"string","c":"","r":"","doc":"e.g. \"google.com\", \"facebook.com\" — same provider ID space as EFirebaseAuthProvider/ConvertAuthProviderId."},{"n":"Username","t":"String","k":"string","c":"","r":"","doc":""},{"n":"ProfileJson","t":"String","k":"string","c":"","r":"","doc":"Identity-provider specific profile data (e.g. locale, verified-email flag, extra IdP fields) as a JSON string — shape varies per provider. Empty if the provider supplied none."},{"n":"UpdatedCredential","t":"FirebaseAuthCredential","k":"struct","c":"","r":"FFirebaseAuthCredential","doc":"Only on a Link node's OnError, typically with CredentialAlreadyInUse:\nthe provider account the player picked already belongs to ANOTHER\nFirebase user, and Firebase hands back a fresh credential for it\n(bIsValid true) — the picker doesn't have to be shown again. Pass it to\nSign In With Credential to switch to that other account (the current\none, e.g. anonymous, is signed out: move its progress over yourself\nfirst if needed). Not every provider returns one; bIsValid false then."}]},{"id":"FFirebaseUser","kind":"struct","name":"FFirebaseUser","module":"Auth","doc":"","fields":[{"n":"UserId","t":"String","k":"string","c":"","r":"","doc":""},{"n":"Email","t":"String","k":"string","c":"","r":"","doc":""},{"n":"DisplayName","t":"String","k":"string","c":"","r":"","doc":""},{"n":"PhoneNumber","t":"String","k":"string","c":"","r":"","doc":"Empty unless a phone number is linked (or the user signed in with one) — same merged-view field as Email/DisplayName, not scoped to a single provider."},{"n":"PhotoUrl","t":"String","k":"string","c":"","r":"","doc":"Empty unless the signed-in provider supplies one (e.g. Google) — same merged-view field as Email/DisplayName, not scoped to a single provider."},{"n":"bIsAnonymous","t":"Boolean","k":"bool","c":"","r":"","doc":"","d":"false"},{"n":"bIsEmailVerified","t":"Boolean","k":"bool","c":"","r":"","doc":"","d":"false"},{"n":"bIsValid","t":"Boolean","k":"bool","c":"","r":"","doc":"","d":"false"},{"n":"CreationTimeMs","t":"Integer64","k":"int64","c":"","r":"","doc":"Milliseconds since epoch the account was created.","d":"0"},{"n":"LastSignInTimeMs","t":"Integer64","k":"int64","c":"","r":"","doc":"Milliseconds since epoch of the most recent sign-in. Right after a sign-in that just created the account, this equals CreationTimeMs (within a second or two) — see bIsNewUser below, which already does that comparison.","d":"0"},{"n":"bIsNewUser","t":"Boolean","k":"bool","c":"","r":"","doc":"True if this sign-in call is the one that just created the account —\ni.e. CreationTimeMs and LastSignInTimeMs are (within a few seconds of)\nequal, the standard trick to detect a fresh sign-up since Firebase Auth\notherwise never exposes that as its own field. Use it to decide whether\nto show onboarding / create a Firestore profile document right after\nsign-in, instead of every time the same user signs back in.\n\nOnly ever set on the result of a sign-in node (Sign In Anonymously,\nSign In With Email, Create User With Email, Sign In Provider...), and\nfalse when Sign In Anonymously just returned the already-signed-in\nanonymous user from a previous session. Always false on Link /\nReauthenticate / Unlink results (the account already existed), on Get\nCurrent User, on the auth-state / ID-token events, and for an invalid\nuser (bIsValid false).","d":"false"},{"n":"AdditionalInfo","t":"FirebaseAuthAdditionalUserInfo","k":"struct","c":"","r":"FFirebaseAuthAdditionalUserInfo","doc":"Only populated on a FFirebaseUser returned by a sign-in/link/reauthenticate proxy — see FFirebaseAuthAdditionalUserInfo's own comment."}]},{"id":"FFirebaseLinkedProviderInfo","kind":"struct","name":"FFirebaseLinkedProviderInfo","module":"Auth","doc":"Per-provider profile info for one linked identity provider (e.g. the\nGoogle account or Play Games account linked to the current user).\nUnlike FFirebaseUser's own DisplayName/Email — a single value Firebase\nmerges across every linked provider — these fields are scoped to exactly\nthe provider named by ProviderId, so e.g. a user who signed in with\nGoogle then linked Play Games can see each provider's own name/email\ninstead of only whichever one Firebase picked for the merged view.","fields":[{"n":"ProviderId","t":"String","k":"string","c":"","r":"","doc":"e.g. \"password\", \"google.com\", \"playgames.google.com\" — same values as UFirebaseAuthLibrary::GetLinkedProviderIds."},{"n":"Provider","t":"EFirebaseAuthProvider","k":"enum","c":"","r":"EFirebaseAuthProvider","doc":"ProviderId converted to a typed enum via ConvertAuthProviderId — Switch on Enum instead of comparing ProviderId as a raw string.","d":"EFirebaseAuthProvider::Unknown"},{"n":"ProviderUserId","t":"String","k":"string","c":"","r":"","doc":"This provider's own user ID — usually different from FFirebaseUser::UserId, which is Firebase's own UID for the account as a whole."},{"n":"DisplayName","t":"String","k":"string","c":"","r":"","doc":""},{"n":"Email","t":"String","k":"string","c":"","r":"","doc":""},{"n":"PhotoUrl","t":"String","k":"string","c":"","r":"","doc":""},{"n":"PhoneNumber","t":"String","k":"string","c":"","r":"","doc":"Only meaningful for the Phone provider entry — empty for every other provider."}]},{"id":"FFirebaseIdTokenResult","kind":"struct","name":"FFirebaseIdTokenResult","module":"Auth","doc":"The decoded content of a Firebase ID token (a JWT) — mirrors what other\nFirebase SDKs return from getIdTokenResult(). Decoded locally, NOT\nverified: fine to drive UI (show an admin menu, a \"premium\" badge...), but\nanything that must be trusted is decided by your backend or security\nrules, which verify the token's signature.","fields":[{"n":"Token","t":"String","k":"string","c":"","r":"","doc":"The raw ID token, to send to your own backend."},{"n":"ClaimsJson","t":"String","k":"string","c":"","r":"","doc":"The whole claims object as JSON (standard and custom claims)."},{"n":"CustomClaims","t":"Map of String to String","k":"string","c":"map","r":"","doc":"Custom claims only (set by your backend with the Admin SDK's\nsetCustomUserClaims, e.g. {\"admin\": true, \"tier\": \"gold\"}), each value\nas JSON text: true, 42, \"\\\"gold\\\"\" — use JsonStringTo... helpers or\ncompare directly. Standard JWT/Firebase claims are not included."},{"n":"SignInProvider","t":"String","k":"string","c":"","r":"","doc":"How the user signed in for this token: \"password\", \"google.com\", \"anonymous\", \"custom\", \"phone\", \"playgames.google.com\"..."},{"n":"ExpirationTime","t":"Date Time","k":"struct","c":"","r":"","doc":"When the token expires (UTC). A fresh one is fetched automatically; force one with bForceRefresh."},{"n":"IssuedAtTime","t":"Date Time","k":"struct","c":"","r":"","doc":"When the token was issued (UTC)."},{"n":"AuthTime","t":"Date Time","k":"struct","c":"","r":"","doc":"When the user last actually authenticated (UTC) — sign-in or reauthentication, not a token refresh."}]},{"id":"FFirebaseSubscriptionPricingPhase","kind":"struct","name":"FFirebaseSubscriptionPricingPhase","module":"Billing","doc":"One pricing phase of a subscription offer, in order: e.g. a free trial,\nthen an introductory price, then the recurring price last.","fields":[{"n":"FormattedPrice","t":"String","k":"string","c":"","r":"","doc":"Localized, ready-to-display price (e.g. \"$4.99\", or the localized \"Free\" for a trial)."},{"n":"PriceAmountMicros","t":"Integer64","k":"int64","c":"","r":"","doc":"Price in micro-units of CurrencyCode (0 for a free trial).","d":"0"},{"n":"CurrencyCode","t":"String","k":"string","c":"","r":"","doc":""},{"n":"BillingPeriod","t":"String","k":"string","c":"","r":"","doc":"ISO 8601 duration of one billing period, e.g. \"P1M\" (one month), \"P1W\", \"P1Y\"."},{"n":"BillingCycleCount","t":"Integer","k":"int","c":"","r":"","doc":"How many billing periods this phase lasts; 0 for the recurring phase (repeats until cancelled).","d":"0"}]},{"id":"FFirebaseSubscriptionOffer","kind":"struct","name":"FFirebaseSubscriptionOffer","module":"Billing","doc":"One way to buy a subscription: a base plan, optionally with an offer\n(free trial, intro price...) on top. Pass its BasePlanId and OfferId to\nPurchase Product to buy this one instead of the first available.","fields":[{"n":"BasePlanId","t":"String","k":"string","c":"","r":"","doc":"The base plan ID set in Play Console (e.g. \"monthly\")."},{"n":"OfferId","t":"String","k":"string","c":"","r":"","doc":"The offer ID set in Play Console; empty for the base plan itself (no offer on top)."},{"n":"OfferTags","t":"Array of String","k":"string","c":"array","r":"","doc":"Tags set on the base plan/offer in Play Console, useful to pick an offer from game logic."},{"n":"PricingPhases","t":"Array of FirebaseSubscriptionPricingPhase","k":"struct","c":"array","r":"","doc":""}]},{"id":"FFirebaseProductDetails","kind":"struct","name":"FFirebaseProductDetails","module":"Billing","doc":"One product's catalog info as returned by QueryProductDetails. For a\nSubscription, FormattedPrice/PriceAmountMicros/CurrencyCode reflect the\nrecurring price of the FIRST available offer — the one Purchase Product\nbuys by default; SubscriptionOffers lists every offer this player is\neligible for, to show or buy another one.","fields":[{"n":"ProductId","t":"String","k":"string","c":"","r":"","doc":""},{"n":"ProductType","t":"EFirebaseProductType","k":"enum","c":"","r":"EFirebaseProductType","doc":"","d":"EFirebaseProductType::Consumable"},{"n":"Title","t":"String","k":"string","c":"","r":"","doc":"Localized product name as entered in Play Console (e.g. \"100 Coins\"), without the app name Play appends to its own title."},{"n":"Description","t":"String","k":"string","c":"","r":"","doc":""},{"n":"FormattedPrice","t":"String","k":"string","c":"","r":"","doc":"Localized, ready-to-display price (e.g. \"$4.99\")."},{"n":"PriceAmountMicros","t":"Integer64","k":"int64","c":"","r":"","doc":"Price in micro-units of CurrencyCode (1,000,000 micros = 1 whole unit).","d":"0"},{"n":"CurrencyCode","t":"String","k":"string","c":"","r":"","doc":"ISO 4217 currency code, e.g. \"USD\"."},{"n":"SubscriptionOffers","t":"Array of FirebaseSubscriptionOffer","k":"struct","c":"array","r":"","doc":"Subscriptions only: every base plan/offer this player is eligible for, in Play's order. Empty for one-time products."}]},{"id":"FFirebasePurchase","kind":"struct","name":"FFirebasePurchase","module":"Billing","doc":"A completed or pending purchase. Delivered both directly from\nPurchaseProduct's own result and via UFirebaseBPSubsystem::OnPurchasesUpdated\n(the latter is the only reliable way to learn about a purchase that settles\nlater, was restored, or happened outside PurchaseProduct — bind to it if\nyou sell consumables/subscriptions and want to never miss one, per Google's\nown recommended architecture).","fields":[{"n":"OrderId","t":"String","k":"string","c":"","r":"","doc":""},{"n":"ProductIds","t":"Array of String","k":"string","c":"array","r":"","doc":"Usually a single ID; Play Billing allows bundling more than one product per purchase, though rare in practice."},{"n":"Quantity","t":"Integer","k":"int","c":"","r":"","doc":"How many units the player bought in this one purchase — always 1 unless\n\"Multi-quantity\" is enabled for the product in Play Console, in which\ncase the purchase dialog lets the player pick more. Grant this many\n(e.g. Quantity x 100 coins). Consuming the purchase consumes all of them.","d":"1"},{"n":"PurchaseToken","t":"String","k":"string","c":"","r":"","doc":""},{"n":"PurchaseTimeMs","t":"Integer64","k":"int64","c":"","r":"","doc":"Milliseconds since epoch.","d":"0"},{"n":"PurchaseState","t":"EFirebasePurchaseState","k":"enum","c":"","r":"EFirebasePurchaseState","doc":"","d":"EFirebasePurchaseState::Unspecified"},{"n":"bIsAcknowledged","t":"Boolean","k":"bool","c":"","r":"","doc":"Play's acknowledged state AS OF THIS REPORT. A new purchase is reported\n(and granted) before the plugin's automatic acknowledge/consume has\ncompleted, so it's still false on that first report; it's true on\nlater reports of an already-handled purchase (e.g. RestorePurchases on\nthe next launch) — which is how to tell a new purchase from a re-report.","d":"false"},{"n":"bIsAutoRenewing","t":"Boolean","k":"bool","c":"","r":"","doc":"Subscriptions only.","d":"false"},{"n":"OriginalJson","t":"String","k":"string","c":"","r":"","doc":"Raw receipt JSON and its signature, exposed for your own optional server-side verification (Play Developer API) — not used by the plugin itself."},{"n":"Signature","t":"String","k":"string","c":"","r":"","doc":""}]},{"id":"FFirebaseDatabaseListenerHandle","kind":"struct","name":"FFirebaseDatabaseListenerHandle","module":"Database","doc":"Handle to a live Realtime Database listener, returned by\nListenToDatabaseValue(Query)/ListenToDatabaseChildren(Query). Pass it to\nStopDatabaseListener when you no longer need updates (e.g. in EndPlay) —\na forgotten listener keeps firing, and keeps the location synced, for as\nlong as the app runs. Same copy semantics as FFirebaseFirestoreListenerHandle:\ncopies all refer to the same underlying listener.\n\nState is deliberately a TWeakPtr, not a TSharedPtr: the listener itself is\nkept alive by a separate, file-static registry in FirebaseBPDatabaseListener.cpp\n(GActiveDatabaseListeners) for exactly as long as the doc comment above\npromises — \"for as long as the app runs\" — independent of whether this\nhandle (or every copy of it) is still around. Firestore's own\nFFirebaseFirestoreListenerHandle gets the same \"forgotten handle keeps\nfiring\" behavior for free, because firebase::firestore::ListenerRegistration's\ndestructor is a documented no-op with respect to actually stopping the\nlistener; firebase::database::Query's AddValueListener/AddChildListener has\nno such built-in keep-alive (this plugin's own bridge listener object is\nthe only thing referencing the callback), so this plugin has to provide\nthat keep-alive itself instead of relying on a TSharedPtr the caller may or\nmay not still hold.","fields":[]},{"id":"FFirebaseBPAppInfo","kind":"struct","name":"FFirebaseBPAppInfo","module":"Core","doc":"Mirrors firebase::AppOptions (see firebase/app.h) — the project/environment a running build is actually pointed at. Useful for a debug/diagnostics screen, e.g. to confirm a build wasn't accidentally shipped against a staging google-services.json/GoogleService-Info.plist.","fields":[{"n":"AppId","t":"String","k":"string","c":"","r":"","doc":""},{"n":"ApiKey","t":"String","k":"string","c":"","r":"","doc":""},{"n":"ProjectId","t":"String","k":"string","c":"","r":"","doc":""},{"n":"DatabaseUrl","t":"String","k":"string","c":"","r":"","doc":"Empty unless this project has a Realtime Database instance configured (or a UseDatabaseURL override was applied)."},{"n":"MessagingSenderId","t":"String","k":"string","c":"","r":"","doc":""},{"n":"StorageBucket","t":"String","k":"string","c":"","r":"","doc":""},{"n":"bIsValid","t":"Boolean","k":"bool","c":"","r":"","doc":"False if Firebase isn't initialized yet — every other field is empty in that case.","d":"false"}]},{"id":"FFirebaseFirestoreSettings","kind":"struct","name":"FFirebaseFirestoreSettings","module":"Firestore","doc":"Mirrors firebase::firestore::Settings — configures the Firestore instance\nitself rather than any one query/document. Must be applied via\nSetFirestoreSettings before the first Firestore call of the session (the\nSDK ignores changes made after the instance is already in use); there is\nno per-call override.","fields":[{"n":"bPersistenceEnabled","t":"Boolean","k":"bool","c":"","r":"","doc":"Local offline persistence (the on-disk cache queries can be served from while offline, and writes queue in until reconnected). On by default.","d":"true"},{"n":"CacheSizeBytes","t":"Integer64","k":"int64","c":"","r":"","doc":"Approximate on-disk cache size threshold in bytes before Firestore starts\nevicting least-recently-used data — a guideline, not a hard cap. 100 MiB\nby default; the SDK's own minimum is 1 MiB. Use\nUFirestoreLibrary::MakeFirestoreCacheSizeUnlimited() to disable eviction\nentirely (the cache then only grows).","d":"100 * 1024 * 1024"},{"n":"Host","t":"String","k":"string","c":"","r":"","doc":"Firestore backend host. Empty (the default) uses the real\n\"firestore.googleapis.com\" backend; point this at the Firestore\nemulator (e.g. \"10.0.2.2:8080\" on the Android emulator, \"localhost:8080\"\non desktop) for local testing — pair with bSslEnabled = false, since the\nemulator doesn't serve TLS."},{"n":"bSslEnabled","t":"Boolean","k":"bool","c":"","r":"","doc":"Whether to use SSL/TLS to reach Host. On by default; turn off only for a local (non-TLS) emulator Host.","d":"true"}]},{"id":"FFirebaseFirestoreListenerHandle","kind":"struct","name":"FFirebaseFirestoreListenerHandle","module":"Firestore","doc":"Handle to a live Firestore listener, returned by ListenToDocument /\nListenToQuery. Pass it to StopFirestoreListener when you no longer need\nupdates (e.g. in EndPlay) — a forgotten listener keeps firing (and keeps\nconsuming Firestore reads on every change) for as long as the app runs.\n\nCopies of a handle all refer to the same underlying listener: stopping any\none copy stops it for all of them, matching firebase::firestore::ListenerRegistration's\nown documented copy semantics.","fields":[]},{"id":"FFirebaseFirestoreValue","kind":"struct","name":"FFirebaseFirestoreValue","module":"Firestore","doc":"A single Firestore field value. Only the member matching Type is meaningful;\nthe rest are left at their default. Documents are TMap\u003cFString, FFirebaseFirestoreValue>.\n\nDeliberately NOT exposing these members as UPROPERTY: Unreal auto-generates\na \"Make\"/\"Break FirebaseFirestoreValue\" node the moment a struct has\nBlueprintReadWrite properties, and with 10 fields on one tagged-union\nstruct, that node showed every field at once regardless of Type — clunky\nand error-prone in the Blueprint graph (easy to fill e.g. IntValue while\nleaving Type on its default Null, silently losing the value). Build/read\nvalues exclusively through UFirestoreJsonLibrary's single-purpose\nMakeFirestoreBool/Int/Double/String/Timestamp/GeoPoint/Reference/Array/Map\nand matching ToFirestoreXxx / BreakFirestoreXxx functions instead, each\nwith only the relevant pin(s) — same pattern as FFirebaseVariant in\nPandores' Firebase Features plugin. The fields are still UPROPERTY(SaveGame)\n(just not Blueprint-visible, so no Make/Break pins appear): without real\nproperties, UE's struct comparison sees nothing to compare — every value\ncompared \"identical\" (Find/Remove on an array of values matched the\nfirst/every element) — and a value stored in a USaveGame reloaded as Null.","fields":[{"n":"Type","t":"EFirebaseFirestoreValueType","k":"enum","c":"","r":"EFirebaseFirestoreValueType","doc":"","d":"EFirebaseFirestoreValueType::Null"},{"n":"BoolValue","t":"Boolean","k":"bool","c":"","r":"","doc":"","d":"false"},{"n":"IntValue","t":"Integer64","k":"int64","c":"","r":"","doc":"","d":"0"},{"n":"DoubleValue","t":"Float","k":"float","c":"","r":"","doc":"","d":"0.0"},{"n":"StringValue","t":"String","k":"string","c":"","r":"","doc":"Also used for Reference (as a document path, e.g. \"players/abc123\")."},{"n":"TimestampSeconds","t":"Integer64","k":"int64","c":"","r":"","doc":"Seconds and nanoseconds since Unix epoch UTC, used when Type == Timestamp.","d":"0"},{"n":"TimestampNanoseconds","t":"Integer","k":"int","c":"","r":"","doc":"","d":"0"},{"n":"Latitude","t":"Float","k":"float","c":"","r":"","doc":"","d":"0.0"},{"n":"Longitude","t":"Float","k":"float","c":"","r":"","doc":"","d":"0.0"},{"n":"BlobValue","t":"Array of Byte","k":"byte","c":"array","r":"","doc":"Raw bytes, used when Type == Blob."},{"n":"NestedJson","t":"String","k":"string","c":"","r":"","doc":"Holds the JSON-serialized array/map when Type == Array or Type == Map.\n\nUHT does not allow a USTRUCT to directly contain TArray\u003cSelf> /\nTMap\u003cFString, Self> (unsupported struct recursion), so nested values are\nstored pre-serialized here instead of as native Blueprint containers.\nDon't touch this field directly — use UFirestoreJsonLibrary's\nMakeFirestoreArrayValue / MakeFirestoreMapValue to build one, and\nBreakFirestoreArrayValue / BreakFirestoreMapValue to read it back."}]},{"id":"FFirebaseFirestoreSnapshotMetadata","kind":"struct","name":"FFirebaseFirestoreSnapshotMetadata","module":"Firestore","doc":"Mirrors firebase::firestore::SnapshotMetadata — describes where a document\nread actually came from, attached to every FFirebaseFirestoreDocument/\nFFirebaseFirestoreQueryDocument alongside its Fields.","fields":[{"n":"bHasPendingWrites","t":"Boolean","k":"bool","c":"","r":"","doc":"True if this snapshot includes the result of a local write (Set/Update/\nDelete) not yet confirmed by the server. A local write always produces\nan immediate snapshot with this true, whether or not you opted into\nmetadata-only updates (see ListenToDocument/ListenToQuery's\nbIncludeMetadataChanges) — that option only controls whether you're\nalso notified of the follow-up event where this flips back to false\nonce the write is confirmed, rather than only finding out the next\ntime the listener fires for an unrelated reason (or never, for a\none-shot Get).","d":"false"},{"n":"bIsFromCache","t":"Boolean","k":"bool","c":"","r":"","doc":"True if this snapshot was served from the local cache rather than a guaranteed up-to-date read from the server (e.g. while offline).","d":"false"}]},{"id":"FFirebaseFirestoreDocument","kind":"struct","name":"FFirebaseFirestoreDocument","module":"Firestore","doc":"Wraps a Firestore document (a map of field name to value) in a struct.\n\nNeeded because dynamic multicast delegates (DECLARE_DYNAMIC_MULTICAST_DELEGATE_*)\ncan't take a bare TMap\u003c...> as a parameter (UHT's delegate macro parsing\ndoesn't resolve it) — wrapping it in a USTRUCT works fine and Blueprint can\nstill \"Break\" this struct to get the map directly.","fields":[{"n":"Fields","t":"Map of String to FirebaseFirestoreValue","k":"string","c":"map","r":"","doc":""},{"n":"Metadata","t":"FirebaseFirestoreSnapshotMetadata","k":"struct","c":"","r":"FFirebaseFirestoreSnapshotMetadata","doc":""}]},{"id":"FFirebaseFirestoreQueryDocument","kind":"struct","name":"FFirebaseFirestoreQueryDocument","module":"Firestore","doc":"One document returned by a query: its ID plus its fields (same shape as FFirebaseFirestoreDocument, with the ID alongside since a query can span many documents at once).","fields":[{"n":"Id","t":"String","k":"string","c":"","r":"","doc":""},{"n":"Fields","t":"Map of String to FirebaseFirestoreValue","k":"string","c":"map","r":"","doc":""},{"n":"Metadata","t":"FirebaseFirestoreSnapshotMetadata","k":"struct","c":"","r":"FFirebaseFirestoreSnapshotMetadata","doc":""},{"n":"Path","t":"String","k":"string","c":"","r":"","doc":"Full document path (e.g. \"scores/abc123\"), ready for Set/Update/Delete Document — needed for a collection group query, where the same ID can live under different parents."}]},{"id":"FFirebaseFirestoreBatchDocument","kind":"struct","name":"FFirebaseFirestoreBatchDocument","module":"Firestore","doc":"One entry of a GetDocuments result: the full path that was requested, whether\na document actually exists there, and (if it does) its fields. Unlike\nFFirebaseFirestoreQueryDocument, this carries the whole path rather than just\nan ID, since a multi-get can span different collections where the same ID\ncould appear twice.","fields":[{"n":"DocumentPath","t":"String","k":"string","c":"","r":"","doc":""},{"n":"bExists","t":"Boolean","k":"bool","c":"","r":"","doc":"False if no document exists at DocumentPath — not an error, Fields is just empty.","d":"false"},{"n":"Fields","t":"Map of String to FirebaseFirestoreValue","k":"string","c":"map","r":"","doc":""},{"n":"Metadata","t":"FirebaseFirestoreSnapshotMetadata","k":"struct","c":"","r":"FFirebaseFirestoreSnapshotMetadata","doc":""}]},{"id":"FFirebaseFirestoreDocumentChange","kind":"struct","name":"FFirebaseFirestoreDocumentChange","module":"Firestore","doc":"One entry of a QuerySnapshot's DocumentChanges() — mirrors\nfirebase::firestore::DocumentChange. Lets a list/leaderboard/chat UI apply\nan incremental diff instead of rebuilding itself from the full document\nlist on every ListenToQueryWithChanges update.","fields":[{"n":"Type","t":"EFirebaseFirestoreDocumentChangeType","k":"enum","c":"","r":"EFirebaseFirestoreDocumentChangeType","doc":"","d":"EFirebaseFirestoreDocumentChangeType::Added"},{"n":"Document","t":"FirebaseFirestoreQueryDocument","k":"struct","c":"","r":"FFirebaseFirestoreQueryDocument","doc":""},{"n":"OldIndex","t":"Integer","k":"int","c":"","r":"","doc":"Index of Document in the result set immediately before this change; -1 (\"no index\", the SDK's own npos) for an Added change.","d":"-1"},{"n":"NewIndex","t":"Integer","k":"int","c":"","r":"","doc":"Index of Document in the result set immediately after this change; -1 (\"no index\", the SDK's own npos) for a Removed change.","d":"-1"}]},{"id":"FFirebaseFirestoreLoadBundleProgress","kind":"struct","name":"FFirebaseFirestoreLoadBundleProgress","module":"Firestore","doc":"Mirrors firebase::firestore::LoadBundleTaskProgress — one update on a LoadFirestoreBundle call's progress, or its final outcome.","fields":[{"n":"State","t":"EFirebaseFirestoreLoadBundleState","k":"enum","c":"","r":"EFirebaseFirestoreLoadBundleState","doc":"","d":"EFirebaseFirestoreLoadBundleState::InProgress"},{"n":"DocumentsLoaded","t":"Integer","k":"int","c":"","r":"","doc":"","d":"0"},{"n":"TotalDocuments","t":"Integer","k":"int","c":"","r":"","doc":"0 if the bundle failed to parse.","d":"0"},{"n":"BytesLoaded","t":"Integer64","k":"int64","c":"","r":"","doc":"","d":"0"},{"n":"TotalBytes","t":"Integer64","k":"int64","c":"","r":"","doc":"0 if the bundle failed to parse.","d":"0"}]},{"id":"FFirebaseCloudMessage","kind":"struct","name":"FFirebaseCloudMessage","module":"Messaging","doc":"Mirrors firebase::messaging::Message (+ its optional Notification), flattened\ninto a single struct: bHasNotification is false (and every NotificationXxx\nfield left at its default) when the message carried no notification payload\n(a \"data-only\" message).","fields":[{"n":"From","t":"String","k":"string","c":"","r":"","doc":"Authenticated ID of the sender (a project number in most cases)."},{"n":"To","t":"String","k":"string","c":"","r":"","doc":"Recipient of the message: a registration token, topic name, or project ID."},{"n":"MessageId","t":"String","k":"string","c":"","r":"","doc":"Message ID, as specified by the sender. Unique per topic subscription."},{"n":"CollapseKey","t":"String","k":"string","c":"","r":"","doc":"Identifies a group of messages that can be collapsed so only the last one is delivered."},{"n":"MessageType","t":"String","k":"string","c":"","r":"","doc":"\"deleted_messages\" / \"send_event\" / \"send_error\", or empty for a regular message."},{"n":"Priority","t":"String","k":"string","c":"","r":"","doc":"\"normal\" or \"high\" — the priority FCM actually delivered this message with (may differ from OriginalPriority if e.g. the OS downgraded it)."},{"n":"OriginalPriority","t":"String","k":"string","c":"","r":"","doc":"\"normal\" or \"high\" — the priority the message was originally sent with, before any delivery-time downgrade. Empty if it was never downgraded (same as Priority)."},{"n":"TimeToLive","t":"Integer","k":"int","c":"","r":"","doc":"How long (in seconds) FCM kept this message queued while the device was offline.","d":"0"},{"n":"SentTime","t":"Integer64","k":"int64","c":"","r":"","doc":"When the server sent this message, as milliseconds since the Unix epoch (UTC). 0 if unavailable.","d":"0"},{"n":"RawData","t":"Array of Byte","k":"byte","c":"array","r":"","doc":"Raw binary payload, for a data-only message that sends bytes instead of (or alongside) string Data entries. Empty for a normal message."},{"n":"ErrorCode","t":"String","k":"string","c":"","r":"","doc":"Error code, for \"nack\" messages for CCS and server responses. Empty for a normal message."},{"n":"ErrorDescription","t":"String","k":"string","c":"","r":"","doc":"Human-readable details about ErrorCode."},{"n":"Data","t":"Map of String to String","k":"string","c":"map","r":"","doc":"The me
