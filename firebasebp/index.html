<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FirebaseBP Node Reference</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: sticky search bar, module rail on the left (chip row on phones), node cards drawn like Blueprint graph nodes. */
:root {
  --bg: #eef0f3;
  --surface: #ffffff;
  --surface-2: #f6f7f9;
  --ink: #18202c;
  --ink-2: #4a5566;
  --ink-3: #6f7a8b;
  --line: #d9dde4;
  --accent: #d9761a;
  --accent-ink: #9a4f0b;
  --grid: rgba(24, 32, 44, 0.045);

  /* Node header colors (Blueprint editor conventions). */
  --hd-async: #3a6ea8;
  --hd-call: #2f5d8f;
  --hd-pure: #4f8a3d;
  --hd-event: #a83a32;
  --hd-type: #59607a;

  /* Pin colors (Unreal's own pin palette, darkened to read on light). */
  --pin-exec: #3c4350;
  --pin-bool: #a40e0e;
  --pin-int: #0f9d7a;
  --pin-int64: #3f8f6b;
  --pin-byte: #00695c;
  --pin-enum: #00695c;
  --pin-float: #5e9c16;
  --pin-string: #c0189c;
  --pin-text: #c4569e;
  --pin-name: #8e5bc9;
  --pin-struct: #1d5fbd;
  --pin-object: #0889c7;
  --pin-class: #6a2fb0;
  --pin-delegate: #b5382f;
  --pin-other: #7a8090;

  --android: #2d7d46;
  --ios: #4a5566;

  --f-display: "Barlow Semi Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15181d; --surface: #1d2128; --surface-2: #232831; --ink: #e6e9ee; --ink-2: #aab3c0; --ink-3: #828c9b; --line: #313844;
    --accent: #f0913a; --accent-ink: #f6b072; --grid: rgba(255, 255, 255, 0.035);
    --hd-async: #3d74b3; --hd-call: #33669e; --hd-pure: #4d8b3a; --hd-event: #b0433a; --hd-type: #5d6582;
    --pin-exec: #e6e9ee; --pin-bool: #e04646; --pin-int: #2fe0b2; --pin-int64: #7fd8a8; --pin-byte: #1fbba3; --pin-enum: #1fbba3; --pin-float: #9fe04a;
    --pin-string: #ff4fd8; --pin-text: #ee8fcf; --pin-name: #c79bff; --pin-struct: #4d93ff; --pin-object: #33b4f2; --pin-class: #a46cf0; --pin-delegate: #ff6b5e; --pin-other: #a0a6b4;
    --android: #5fc07c; --ios: #aab3c0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15181d; --surface: #1d2128; --surface-2: #232831; --ink: #e6e9ee; --ink-2: #aab3c0; --ink-3: #828c9b; --line: #313844;
  --accent: #f0913a; --accent-ink: #f6b072; --grid: rgba(255, 255, 255, 0.035);
  --hd-async: #3d74b3; --hd-call: #33669e; --hd-pure: #4d8b3a; --hd-event: #b0433a; --hd-type: #5d6582;
  --pin-exec: #e6e9ee; --pin-bool: #e04646; --pin-int: #2fe0b2; --pin-int64: #7fd8a8; --pin-byte: #1fbba3; --pin-enum: #1fbba3; --pin-float: #9fe04a;
  --pin-string: #ff4fd8; --pin-text: #ee8fcf; --pin-name: #c79bff; --pin-struct: #4d93ff; --pin-object: #33b4f2; --pin-class: #a46cf0; --pin-delegate: #ff6b5e; --pin-other: #a0a6b4;
  --android: #5fc07c; --ios: #aab3c0;
  color-scheme: dark;
}

* { box-sizing: border-box; }
/* Pages, search and filters work by toggling hidden; display: grid / flex rules must not undo it. */
[hidden] { display: none !important; }
body {
  background: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font: 15px/1.55 var(--f-body);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
a { color: var(--accent-ink); }
code, .mono { font-family: var(--f-mono); font-size: 0.86em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand h1 { margin: 0; font: 700 22px/1.1 var(--f-display); letter-spacing: 0.01em; }
.brand h1 span { color: var(--accent); }
.brand .ver { font: 500 12px var(--f-mono); color: var(--ink-3); white-space: nowrap; }
.search { flex: 1 1 260px; display: flex; gap: 8px; align-items: center; max-width: 560px; }
.search input {
  width: 100%; font: 15px var(--f-body); color: var(--ink); background: var(--surface-2);
  border: 1px solid var(--line); border-radius: var(--r); padding: 8px 12px;
}
.search .count { font: 500 12px var(--f-mono); color: var(--ink-3); white-space: nowrap; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button {
  font: 600 12px var(--f-body); letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-2);
  background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; cursor: pointer;
}
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }

.layout {
  display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 28px;
  padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 1320px; margin: 0 auto;
}
nav.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 74px); align-self: start; max-height: calc(100vh - 100px); overflow: auto; }
nav.rail ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
nav.rail a {
  display: flex; justify-content: space-between; gap: 8px; text-decoration: none; color: var(--ink-2);
  font: 600 15px var(--f-display); letter-spacing: 0.02em; padding: 5px 10px; border-radius: var(--r);
}
nav.rail a:hover { background: var(--surface); color: var(--ink); }
nav.rail a .n { font: 500 11px var(--f-mono); color: var(--ink-3); align-self: center; }
nav.rail .sep { height: 1px; background: var(--line); margin: 8px 10px; }
nav.rail a .lbl { display: flex; align-items: center; gap: 9px; min-width: 0; }
.mg.sm { width: 22px; height: 22px; border-radius: 6px; font-size: 10.5px; letter-spacing: 0; }
.mg.home { background: var(--accent); }

/* ☰ toggles the module menu: a drawer on phones, a collapsible column on wide screens. */
.menu-btn {
  flex: none; display: grid; place-items: center; width: 36px; height: 36px; padding: 0; cursor: pointer;
  background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r);
}
.menu-btn svg { width: 20px; height: 20px; }
.menu-btn:hover { border-color: var(--accent); }
.drawer-head { display: none; align-items: center; justify-content: space-between; padding: 0 4px 10px 10px; margin-bottom: 8px; border-bottom: 1px solid var(--line); font: 700 18px var(--f-display); }
.drawer-head button { background: none; border: 0; color: var(--ink-2); font-size: 22px; line-height: 1; padding: 4px 8px; cursor: pointer; }
.scrim { display: none; position: fixed; inset: 0; z-index: 35; background: rgba(0, 0, 0, 0.45); }
@media (min-width: 861px) {
  body.nav-collapsed nav.rail { display: none; }
  body.nav-collapsed .layout { grid-template-columns: minmax(0, 1fr); max-width: 1100px; }
}

/* minmax(0, 1fr): an implicit auto column would grow to its widest card and overflow phones. */
main { min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 40px; }
section.module { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; scroll-margin-top: 90px; }
.module-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; border-bottom: 2px solid var(--ink); padding-bottom: 6px; }
.module-head h2 { margin: 0; font: 700 30px/1.1 var(--f-display); letter-spacing: 0.01em; text-wrap: balance; }
.module-head .meta { font: 500 12px var(--f-mono); color: var(--ink-3); }
h3.group { margin: 6px 0 -4px; font: 600 13px var(--f-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 14px; align-items: start; }

.node {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  box-shadow: 0 1px 0 rgba(0,0,0,0.04); overflow: hidden; min-width: 0; scroll-margin-top: 90px;
}
.node > header {
  display: flex; align-items: center; gap: 10px; padding: 7px 12px; color: #fff;
  background: var(--hd-call);
}
.node.async > header { background: linear-gradient(90deg, var(--hd-async), color-mix(in srgb, var(--hd-async) 70%, #000)); }
.node.pure > header { background: var(--hd-pure); }
.node.event > header { background: var(--hd-event); }
.node.type > header { background: var(--hd-type); }
.node header .ico { width: 16px; height: 16px; flex: none; }
.node header h4 { margin: 0; font: 600 17px/1.2 var(--f-display); letter-spacing: 0.01em; min-width: 0; overflow-wrap: anywhere; }
.node header .kind { margin-left: auto; font: 600 10px var(--f-body); letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.85; white-space: nowrap; }
.node .sub { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 6px 12px 0; font-size: 12px; color: var(--ink-3); }
.badge { font: 600 11px var(--f-body); letter-spacing: 0.03em; border-radius: 4px; padding: 1px 6px; border: 1px solid currentColor; }
.badge.Android { color: var(--android); }
.badge.iOS, .badge.Mobile { color: var(--ios); }
.pins { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 4px 16px; padding: 8px 12px; }
.pins .col { display: grid; gap: 4px; align-content: start; min-width: 0; }
.pins .col.out { justify-items: end; text-align: right; }
.pin { display: flex; align-items: flex-start; gap: 7px; min-width: 0; font-size: 13px; line-height: 1.35; }
.col.out .pin { flex-direction: row-reverse; }
.pin .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--c, var(--pin-other)); margin-top: 3px; }
.pin.array .dot { border-radius: 2px; background: repeating-linear-gradient(90deg, var(--c) 0 2px, transparent 2px 4px); }
.pin.map .dot { border-radius: 2px; background: var(--c); }
.pin.exec .dot { border: none; width: 0; height: 0; border-left: 9px solid var(--pin-exec); border-top: 6px solid transparent; border-bottom: 6px solid transparent; border-radius: 0; margin-top: 2px; }
.pin .pn { font-weight: 500; overflow-wrap: anywhere; }
.pin .pt { display: block; font: 400 11.5px var(--f-mono); color: var(--ink-3); overflow-wrap: anywhere; }
.pin .pd { font: 400 11.5px var(--f-mono); color: var(--accent-ink); overflow-wrap: anywhere; }
.pin .adv { font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); }
.pin a { color: inherit; }
.k-bool { --c: var(--pin-bool); } .k-int { --c: var(--pin-int); } .k-int64 { --c: var(--pin-int64); } .k-byte { --c: var(--pin-byte); }
.k-enum { --c: var(--pin-enum); } .k-float { --c: var(--pin-float); } .k-string { --c: var(--pin-string); } .k-text { --c: var(--pin-text); }
.k-name { --c: var(--pin-name); } .k-struct, .k-vector { --c: var(--pin-struct); } .k-object { --c: var(--pin-object); } .k-class { --c: var(--pin-class); }
.k-delegate { --c: var(--pin-delegate); } .k-other { --c: var(--pin-other); }
.node .doc { padding: 4px 12px 12px; color: var(--ink-2); font-size: 14px; }
.node .doc p { margin: 0 0 8px; max-width: 70ch; }
.node .doc p:last-child { margin-bottom: 0; }
.node details { border-top: 1px solid var(--line); }
.node details summary { cursor: pointer; padding: 6px 12px; font-size: 12.5px; color: var(--ink-3); }
.node .fn { font: 400 11.5px var(--f-mono); color: var(--ink-3); }

.fields { width: 100%; border-collapse: collapse; font-size: 13px; }
.fields td { border-top: 1px solid var(--line); padding: 6px 12px; vertical-align: top; }
.fields td:first-child { width: 42%; }
.fields .doc-cell { color: var(--ink-2); }
.table-wrap { overflow-x: auto; }

.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 12.5px; color: var(--ink-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.empty { padding: 40px 0; text-align: center; color: var(--ink-3); }

.settings-cat h3 { margin: 10px 0 6px; font: 600 18px var(--f-display); }

/* Getting started: four numbered steps, each shown as a small mock of what you'll see. */
.hero { display: grid; gap: 18px; }
.hero h2 { margin: 0; font: 700 34px/1.1 var(--f-display); text-wrap: balance; }
.hero .lede { margin: -8px 0 0; color: var(--ink-2); }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 14px; margin: 0; padding: 0; list-style: none; counter-reset: step; }
.step { counter-increment: step; display: grid; grid-template-rows: auto auto 1fr; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; min-width: 0; }
.step h3 { display: flex; align-items: center; gap: 10px; margin: 0; font: 600 19px/1.2 var(--f-display); }
.step h3::before { content: counter(step); display: grid; place-items: center; flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; font: 700 15px var(--f-display); }
.step > p { margin: 0 0 4px; font-size: 13.5px; color: var(--ink-2); }
.mock { align-self: start; background: var(--surface-2); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; font-size: 12.5px; min-width: 0; }
.mock .bar { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-bottom: 1px solid var(--line); font: 500 11px var(--f-mono); color: var(--ink-3); }
.mock .bar i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.mock .body { display: grid; gap: 6px; padding: 10px; }
.mock .row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; min-width: 0; }
.mock .row > span { min-width: 0; overflow-wrap: anywhere; }
.mock .mi { flex: none; width: 18px; height: 18px; }
.mock .dim { color: var(--ink-3); }
.mock .file { font-family: var(--f-mono); font-weight: 600; color: var(--ink); white-space: nowrap; }
.mock .btn { margin-left: auto; flex: none; white-space: nowrap; padding: 3px 8px; border-radius: 5px; background: var(--accent); color: #fff; font: 600 11px var(--f-body); }
.mock .tag { margin-left: auto; flex: none; padding: 1px 7px; border-radius: 99px; border: 1px solid var(--line); font: 500 10.5px var(--f-mono); color: var(--ink-3); }
.mock .hl { background: color-mix(in srgb, var(--accent) 14%, transparent); border-radius: 5px; padding: 3px 6px; margin: 0 -6px; }
.mock .cbx { flex: none; width: 15px; height: 15px; border-radius: 3px; border: 1.5px solid var(--ink-3); display: grid; place-items: center; }
.mock .cbx.on { background: var(--accent); border-color: var(--accent); }
.mock .cbx.on::after { content: ""; width: 4px; height: 8px; border: solid #fff; border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }
.mock.graph-mock { background: var(--bg); padding: 10px; }
/* Always stacked here, like the phone layout: the card is too narrow for two nodes side by side. */
.mock.graph-mock .graph { flex-direction: column; align-items: flex-start; overflow: visible; }
.mock.graph-mock .wire { align-self: stretch; width: auto; height: 46px; margin: 0; padding-left: 40px; grid-template-columns: auto auto; align-items: center; justify-content: start; gap: 8px; }
.mock.graph-mock .wire i { width: 3px; height: 100%; order: -1; }
.mock.graph-mock .wire i::after { right: auto; left: -5px; top: auto; bottom: -2px; border-left: 6.5px solid transparent; border-right: 6.5px solid transparent; border-top: 9px solid var(--pin-exec); border-bottom: 0; }
.tips { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 10px; }
.tip { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: var(--r); border: 1px dashed var(--line); font-size: 13px; color: var(--ink-2); }
.tip svg { flex: none; width: 22px; height: 22px; color: var(--accent-ink); }
.mg { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 9px; background: hsl(var(--h) 55% 45%); color: #fff; font: 700 17px var(--f-display); letter-spacing: 0.02em; flex: none; }

/* Module head with its monogram, then the Quick start graph. */
.module-head .mg { align-self: center; width: 44px; height: 44px; font-size: 19px; }
.module-head .tagline { flex-basis: 100%; margin: 0; color: var(--ink-2); }
.recipe { grid-template-columns: minmax(0, 1fr); background: var(--surface-2); border: 1px dashed var(--line); border-radius: var(--r); padding: 12px 14px 14px; display: grid; gap: 10px; }
.recipe-title { font: 600 12px var(--f-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent-ink); }
.recipe-title span { text-transform: none; letter-spacing: 0; font: 500 14px var(--f-body); color: var(--ink); margin-left: 6px; }
/* Nodes top-aligned so the wire sits on the first exec row, as in the editor. */
.graph { display: flex; align-items: flex-start; overflow-x: auto; padding-bottom: 4px; }
.graph .node { flex: none; }
.graph .node .pins { padding: 6px 10px; }
.pin.hl .pn { color: var(--accent-ink); font-weight: 600; }
.pin.exec.hl .dot { border-left-color: var(--accent); }
.wire { flex: none; display: grid; justify-items: center; gap: 2px; width: 88px; margin: 24px -2px 0; }
.wire i { display: block; width: 100%; height: 3px; background: var(--pin-exec); position: relative; border-radius: 2px; }
.wire i::after { content: ""; position: absolute; right: -2px; top: -5px; border-left: 9px solid var(--pin-exec); border-top: 6.5px solid transparent; border-bottom: 6.5px solid transparent; }
.wire span { font: 500 11px var(--f-mono); color: var(--ink-3); white-space: nowrap; }

/* Blueprint nodes, drawn like the editor's (dark body in both themes), with a one-line caption under them. */
.bpgrid { display: flex; flex-wrap: wrap; gap: 28px 32px; align-items: flex-start; }
.node.bp { background: none; border: 0; border-radius: 0; box-shadow: none; overflow: visible; width: max-content; max-width: 100%; display: grid; gap: 6px; }
.bpn {
  --pin-exec: #f2f2f2; --pin-bool: #e04646; --pin-int: #2fe0b2; --pin-int64: #7fd8a8; --pin-byte: #1fbba3; --pin-enum: #1fbba3; --pin-float: #9fe04a;
  --pin-string: #ff4fd8; --pin-text: #ee8fcf; --pin-name: #c79bff; --pin-struct: #4d93ff; --pin-object: #33b4f2; --pin-class: #a46cf0; --pin-delegate: #ff6b5e; --pin-other: #a0a6b4;
  min-width: 220px; max-width: 100%; background: rgba(16, 17, 19, 0.94); color: #e6e6e6; border: 1px solid #050505; border-radius: 8px;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.07), 0 8px 18px rgba(0, 0, 0, 0.32); overflow: hidden; font: 13px/1.25 var(--f-body);
}
.bp { --hc: #2c6db5; }
.bp.pure { --hc: #4b8a2f; }
.bp.event { --hc: #a9271f; }
.bpn > header {
  display: flex; align-items: center; gap: 7px; padding: 6px 12px 6px 9px; border-bottom: 1px solid rgba(0, 0, 0, 0.7);
  background: linear-gradient(90deg, var(--hc), color-mix(in srgb, var(--hc) 45%, transparent) 75%, transparent);
}
.bpn header .ico { width: 14px; height: 14px; flex: none; color: #fff; }
.bpn header .t { font: 600 14px var(--f-body); color: #fff; text-shadow: 0 1px 1px #000; white-space: nowrap; }
.bpn header .t a { color: inherit; text-decoration: none; }
.bpn header .t a:hover { text-decoration: underline; }
.bpn header .tag { margin-left: auto; padding-left: 4px; font: 600 10px var(--f-body); letter-spacing: 0.04em; color: #9be0a8; }
.bpn .io { display: grid; grid-template-columns: auto auto; justify-content: space-between; gap: 0 26px; padding: 7px 0 9px; }
.bpn .col { display: grid; gap: 6px; align-content: start; min-width: 0; }
.bpn .col.out { justify-items: end; }
.bp-pin { display: flex; align-items: center; gap: 6px; padding: 0 10px; white-space: nowrap; }
.col.out .bp-pin { flex-direction: row-reverse; }
.bp-pin.hl span { color: #ffb35c; font-weight: 600; }
.pi { flex: none; width: 11px; height: 11px; border: 2px solid var(--c, var(--pin-other)); border-radius: 50%; }
.pi.array { border-radius: 1px; border-width: 1.5px; background: linear-gradient(var(--c), var(--c)) center / 1.5px 100% no-repeat, linear-gradient(var(--c), var(--c)) center / 100% 1.5px no-repeat; }
.pi.map, .pi.set { border-radius: 2px; background: var(--c); }
.pi.exec { width: 11px; height: 12px; border: 0; border-radius: 0; background: var(--pin-exec); clip-path: polygon(0 0, 55% 0, 100% 50%, 55% 100%, 0 100%); }
.bp-pin.hl .pi.exec { background: #ffb35c; }
.lit { font: 11px var(--f-mono); color: #d4d4d4; background: #0a0a0b; border: 1px solid #3b3b3e; border-radius: 3px; padding: 0 5px; min-width: 0; max-width: 12em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chk { width: 13px; height: 13px; border: 1px solid #77777c; border-radius: 2px; background: #0a0a0b; position: relative; }
.chk.on::after { content: ""; position: absolute; left: 3.5px; top: 0.5px; width: 3px; height: 7px; border: solid #e6e6e6; border-width: 0 2px 2px 0; transform: rotate(45deg); }
.advn { text-align: center; font-size: 11px; color: #9a9a9f; padding: 2px 0 6px; border-top: 1px solid rgba(255, 255, 255, 0.05); }
.node.bp .cap { width: 0; min-width: 100%; margin: 0; color: var(--ink-2); font-size: 13.5px; line-height: 1.45; overflow-wrap: anywhere; }
.node.bp details.more { overflow-wrap: anywhere; }
.node.bp details.more { width: 0; min-width: 100%; border: 0; }
.node.bp details.more summary { padding: 0; font-size: 12.5px; color: var(--ink-3); }
.node.bp details.more .doc { padding: 6px 0 0; font-size: 13.5px; }
.pinlist { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 3px; font-size: 12.5px; }
.pinlist .dir { display: inline-block; width: 26px; font: 500 10px var(--f-mono); text-transform: uppercase; color: var(--ink-3); }
.pinlist .ty { font: 11.5px var(--f-mono); color: var(--ink-3); }
.pinlist .pdoc { display: block; margin: 1px 0 4px 26px; color: var(--ink-2); }
.node.bp .fn { margin: 6px 0 0; font: 11px var(--f-mono); color: var(--ink-3); overflow-wrap: anywhere; }

/* Page navigation: current page in the rail, previous / next at the bottom. */
.brand h1 a { color: inherit; text-decoration: none; }
nav.rail a[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: inset 3px 0 var(--accent); }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
.pager a { display: grid; gap: 2px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); text-decoration: none; color: var(--ink); font: 600 17px var(--f-display); }
.pager a:hover { border-color: var(--accent); }
.pager a.next { text-align: right; grid-column: 2; }
.pager small { font: 500 11px var(--f-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }

/* Types fold as one block per module. */
details.types { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
details.types > summary { cursor: pointer; padding: 10px 14px; font: 600 15px var(--f-display); letter-spacing: 0.02em; color: var(--ink-2); }
details.types[open] > summary { border-bottom: 1px solid var(--line); }
details.types > .cards { padding: 14px; }

@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 16px; padding-block: 12px 48px; }
  /* Phones: the module list becomes a drawer that slides in from the left over a scrim. */
  nav.rail {
    position: fixed; z-index: 40; top: 0; bottom: 0; left: 0; width: min(82vw, 300px); max-height: none;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) 12px 24px max(12px, env(safe-area-inset-left, 0px));
    background: var(--bg); border-right: 1px solid var(--line); box-shadow: 8px 0 24px rgba(0, 0, 0, 0.3);
    transform: translateX(-105%); transition: transform 0.22s ease; visibility: hidden;
  }
  body.nav-open nav.rail { transform: none; visibility: visible; }
  body.nav-open .scrim { display: block; }
  body.nav-open { overflow: hidden; }
  nav.rail .drawer-head { display: flex; }
  /* Struct fields, enum values and settings: name above its explanation, not two cramped columns. */
  .fields, .fields tbody, .fields tr, .fields td { display: block; width: auto !important; }
  .fields tr { border-top: 1px solid var(--line); padding: 8px 12px; }
  .fields td { border: 0; padding: 0; overflow-wrap: anywhere; }
  .fields td.doc-cell { padding-top: 4px; }
  .fields td.doc-cell:empty, .fields td.doc-cell:not(:has(*)) { display: none; }
  details.types > .cards { padding: 10px; }
  .pins { grid-template-columns: minmax(0, 1fr); }
  .pins .col.out { justify-items: start; text-align: left; }
  .col.out .pin { flex-direction: row; }
  /* The Quick start graph stacks, wired top to bottom. */
  .graph { flex-direction: column; align-items: flex-start; overflow: visible; }
  .graph .wire { align-self: stretch; justify-content: start; padding-left: 40px; }
  /* Phones: the title bar keeps to the screen width, and long pin names may wrap inside a node. */
  .brand h1 { font-size: 20px; }
  .brand .ver { display: none; }
  .bp-pin { white-space: normal; min-width: 0; }
  .lit { max-width: 7em; }
  /* Quick start values are the point of the example: drop under the pin name rather than cut. */
  .graph .bp-pin { flex-wrap: wrap; }
  .graph .lit { max-width: none; flex: 0 0 auto; }
  .graph .node, .graph .bpn { max-width: 100%; }
  .bpn header .t { white-space: normal; }
  .wire { width: auto; height: 46px; margin: 0; grid-template-columns: auto auto; align-items: center; justify-content: center; gap: 8px; }
  .wire i { width: 3px; height: 100%; order: -1; }
  .wire i::after { right: auto; left: -5px; top: auto; bottom: -2px; border-left: 6.5px solid transparent; border-right: 6.5px solid transparent; border-top: 9px solid var(--pin-exec); border-bottom: 0; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

":[],"topic":"Errors"},{"id":"UFirebaseCrashlyticsLibrary_SendUnsentCrashlyticsReports","title":"Send Unsent Crashlytics Reports","fn":"SendUnsentCrashlyticsReports","owner":"UFirebaseCrashlyticsLibrary","kind":"call","module":"Crashlytics","group":"","platform":"","doc":"Sends the crash reports waiting on the device, e.g. once the player agrees to share them.","inputs":[],"outputs":[],"exec":[],"topic":"Reports and consent"},{"id":"UFirebaseCrashlyticsLibrary_DeleteUnsentCrashlyticsReports","title":"Delete Unsent Crashlytics Reports","fn":"DeleteUnsentCrashlyticsReports","owner":"UFirebaseCrashlyticsLibrary","kind":"call","module":"Crashlytics","group":"","platform":"","doc":"Deletes the crash reports waiting on the device, e.g. when the player declines to share them.","inputs":[],"outputs":[],"exec":[],"topic":"Reports and consent"},{"id":"UFirebaseCrashlyticsLibrary_SetCrashlyticsCollectionEnabled","title":"Set Crashlytics Collection Enabled","fn":"SetCrashlyticsCollectionEnabled","owner":"UFirebaseCrashlyticsLibrary","kind":"call","module":"Crashlytics","group":"","platform":"","doc":"Turns crash reporting on or off.\nMay only apply from the next launch: call it early, from the player's saved choice.","inputs":[{"n":"bEnabled","t":"Boolean","k":"bool","c":"","r":"","adv":false}],"outputs":[],"exec":[],"topic":"Reports and consent"},{"id":"UCheckForUnsentCrashlyticsReportsProxy_CheckForUnsentCrashlyticsReports","title":"Check For Unsent Crashlytics Reports","fn":"CheckForUnsentCrashlyticsReports","owner":"UCheckForUnsentCrashlyticsReportsProxy","kind":"async","module":"Crashlytics","group":"","platform":"","doc":"Checks if crash reports from a previous run are waiting to be sent, to ask the player before sending them.\nCall it once per launch. Reports only wait if collection is off at launch (Project Settings > Firebase BP > Privacy).","inputs":[],"outputs":[{"n":"bHasUnsentReports","t":"Boolean","k":"bool","c":"","r":""}],"exec":["OnResult"],"topic":"Reports and :"Cancel","owner":"UFirebaseStorageTransferControl","kind":"call","module":"Storage","group":"","platform":"","doc":"Cancels the transfer for good: the node's On Error fires. False if it already finished.","inputs":[{"n":"Target","t":"FirebaseStorageTransferControl","k":"object","c":"","r":"","target":true}],"outputs":[{"n":"Return Value","t":"Boolean","k":"bool","c":"","r":""}],"exec":[],"topic":"Transfer control"},{"id":"UFirebaseStorageTransferControl_IsTransferPaused","title":"Is Transfer Paused","fn":"IsTransferPaused","owner":"UFirebaseStorageTransferControl","kind":"pure","module":"Storage","group":"","platform":"","doc":"True if the transfer is paused.","inputs":[{"n":"Target","t":"FirebaseStorageTransferControl","k":"object","c":"","r":"","target":true}],"outputs":[{"n":"Return Value","t":"Boolean","k":"bool","c":"","r":""}],"exec":[],"topic":"Transfer control"},{"id":"UFirebaseStorageTransferControl_GetBytesTransferred","title":"Get Bytes Transferred","fn":"GetBytesTransferred","owner":"UFirebaseStorageTransferControl","kind":"pure","module":"Storage","group":"","platform":"","doc":"How many bytes have been transferred so far.","inputs":[{"n":"Target","t":"FirebaseStorageTransferControl","k":"object","c":"","r":"","target":true}],"outputs":[{"n":"Return Value","t":"Integer64","k":"int64","c":"","r":""}],"exec":[],"topic":"Transfer control"},{"id":"UFirebaseStorageTransferControl_GetTotalByteCount","title":"Get Total Byte Count","fn":"GetTotalByteCount","owner":"UFirebaseStorageTransferControl","kind":"pure","module":"Storage","group":"","platform":"","doc":"The transfer's total size in bytes, or -1 while it isn't known yet.","inputs":[{"n":"Target","t":"FirebaseStorageTransferControl","k":"object","c":"","r":"","target":true}],"outputs":[{"n":"Return Value","t":"Integer64","k":"int64","c":"","r":""}],"exec":[],"topic":"Transfer control"},{"id":"UFirebaseStorageTransferControl_IsValid","title":"Is Valid","fn":"IsValid","owner":"UFirebaseStorageTransferContr  Android only.","inputs":[],"outputs":[{"n":"Error","t":"EFirebaseAppUpdateError","k":"enum","c":"","r":"EFirebaseAppUpdateError"}],"exec":["OnStarted","OnFailed"],"topic":"In-app updates"},{"id":"UFirebaseBPStoreServicesLibrary_RequestAppReview","title":"Request App Review","fn":"RequestAppReview","owner":"UFirebaseBPStoreServicesLibrary","kind":"call","module":"Store Services","group":"","platform":"","doc":"Asks the player to rate the game without leaving it.\nThe store decides whether the card actually shows and never tells you the result. Call it after a good moment, not after a failure.","inputs":[],"outputs":[],"exec":[],"topic":"Reviews"},{"id":"UFirebaseBPStoreServicesLibrary_CompleteFlexibleAppUpdate","title":"Complete Flexible App Update","fn":"CompleteFlexibleAppUpdate","owner":"UFirebaseBPStoreServicesLibrary","kind":"call","module":"Store Services","group":"","platform":"Android","doc":"Restarts the game to install a downloaded Flexible update. Call it once On App Update State Changed says Downloaded. Android only.","inputs":[],"outputs":[],"exec":[],"topic":"In-app updates"},{"id":"URequestUMPConsentInfoUpdateProxy_RequestUMPConsentInfoUpdate","title":"Request UMP Consent Info Update","fn":"RequestUMPConsentInfoUpdate","owner":"URequestUMPConsentInfoUpdateProxy","kind":"async","module":"UMP","group":"","platform":"","doc":"Refreshes the player's consent status. Call it once per launch, before any other consent node.\nUntil it finishes, the status nodes return the previous session's value.","inputs":[{"n":"Params","t":"FirebaseUMPConsentRequestParameters","k":"struct","c":"","r":"FFirebaseUMPConsentRequestParameters","adv":false}],"outputs":[{"n":"Error","t":"EFirebaseUMPConsentRequestError","k":"enum","c":"","r":"EFirebaseUMPConsentRequestError"}],"exec":["OnSuccess","OnError"],"topic":"Consent flow"},{"id":"ULoadAndShowUMPConsentFormIfRequiredProxy_LoadAndShowUMPConsentFormIfRequired","title":"Load And Show UMP Consent Form If Required","fn":"LoadAndShowUMPConsentFormIfRequired","owner":"ULoadAndShowUMPConsentFormIfRequiredProxy","kind":"async","module":"UMP","group":"","platform":"","doc":"Shows the consent form, but only if this player still has to answer it.\nCall it after Request UMP Consent Info Update. Completes without showing anything otherwise.","inputs":[],"outputs":[{"n":"Error","t":"EFirebaseUMPConsentFormError","k":"enum","c":"","r":"EFirebaseUMPConsentFormError"}],"exec":["OnSuccess","OnError"],"topic":"Consent flow"},{"id":"ULoadUMPConsentFormProxy_LoadUMPConsentForm","title":"Load UMP Consent Form","fn":"LoadUMPConsentForm","owner":"ULoadUMPConsentFormProxy","kind":"async","module":"UMP","group":"","platform":"","doc":"Loads the consent form without showing it, so Show UMP Consent Form can open it instantly later.\nMost games just use Load And Show UMP Consent Form If Required.","inputs":[],"outputs":[{"n":"Error","t":"EFirebaseUMPConsentFormError","k":"enum","c":"","r":"EFirebaseUMPConsentFormError"}],"exec":["OnSuccess","OnError"],"topic":"Consent flow"},{"id":"UShowUMPConsentFormProxy_ShowUMPConsentForm","title":"Show UMP Consent Form","fn":"ShowUMPConsentForm","owner":"UShowUMPConsentFormProxy","kind":"async","module":"UMP","group":"","platform":"","doc":"Shows a form loaded with Load UMP Consent Form. Fails if none is loaded.","inputs":[],"outputs":[{"n":"Error","t":"EFirebaseUMPConsentFormError","k":"enum","c":"","r":"EFirebaseUMPConsentFormError"}],"exec":["OnSuccess","OnError"],"topic":"Consent flow"},{"id":"UShowUMPPrivacyOptionsFormProxy_ShowUMPPrivacyOptionsForm","title":"Show UMP Privacy Options Form","fn":"ShowUMPPrivacyOptionsForm","owner":"UShowUMPPrivacyOptionsFormProxy","kind":"async","module":"UMP","group":"","platform":"","doc":"Reopens the consent form so the player can change their choice.\nPut it behind a \"Privacy options\" button, shown only when Get UMP Privacy Options Requirement Status says Required.","inputs":[],"outputs":[{"n":"Error","t":"EFirebaseUMPConsentFormError","k":"enum","c":"","r":"EFirebaseUMPConsentFormError"}],"exec":["OnSuccess","OnError"],"topic":"Consent flow"},{"id":"UFirebaseUMPLibrary_GetUMPConsentStatus","title":"Get UMPConsent Status","fn":"GetUMPConsentStatus","owner":"UFirebaseUMPLibrary","kind":"pure","module":"UMP","group":"","platform":"","doc":"The player's consent status. Unknown until Request UMP Consent Info Update has run.","inputs":[],"outputs":[{"n":"Return Value","t":"EFirebaseConsentStatus","k":"enum","c":"","r":"EFirebaseConsentStatus"}],"exec":[],"topic":"Status and testing"},{"id":"UFirebaseUMPLibrary_GetUMPConsentFormStatus","title":"Get UMPConsent Form Status","fn":"GetUMPConsentFormStatus","owner":"UFirebaseUMPLibrary","kind":"pure","module":"UMP","group":"","platform":"","doc":"Whether a consent form is available. Unknown until Request UMP Consent Info Update has run.","inputs":[],"outputs":[{"n":"Return Value","t":"EFirebaseUMPConsentFormStatus","k":"enum","c":"","r":"EFirebaseUMPConsentFormStatus"}],"exec":[],"topic":"Status and testing"},{"id":"UFirebaseUMPLibrary_GetUMPPrivacyOptionsRequirementStatus","title":"Get UMPPrivacy Options Requirement Status","fn":"GetUMPPrivacyOptionsRequirementStatus","owner":"UFirebaseUMPLibrary","kind":"pure","module":"UMP","group":"","platform":"","doc":"Whether you must offer a \"Privacy options\" button. Unknown until Request UMP Consent Info Update has run.","inputs":[],"outputs":[{"n":"Return Value","t":"EFirebaseUMPPrivacyOptionsRequirementStatus","k":"enum","c":"","r":"EFirebaseUMPPrivacyOptionsRequirementStatus"}],"exec":[],"topic":"Status and testing"},{"id":"UFirebaseUMPLibrary_CanRequestAds","title":"Can Request Ads","fn":"CanRequestAds","owner":"UFirebaseUMPLibrary","kind":"pure","module":"UMP","group":"","platform":"","doc":"True when the player's consent allows ads. Check it before loading ads.","inputs":[],"outputs":[{"n":"Return Value","t":"Boolean","k":"bool","c":"","r":""}],"exec":[],"topic":"Status and testing"},{"id":"UFirebaseUMPLibrary_ResetUMPConsentState","title":"Reset UMPConsent State","fn":"ResetUMPConsentState","owner":"UFirebaseUMPLibrary","kind":"call","module":"UMP","group":"","platform":"","doc":"Forgets the player's consent, as on a fresh install. For testing only.","inputs":[],"outputs":[],"exec":[],"topic":"Status and testing"},{"id":"UFirebaseUMPLibrary_GetThisDeviceHashedId","title":"Get This Device Hashed Id","fn":"GetThisDeviceHashedId","owner":"UFirebaseUMPLibrary","kind":"pure","module":"UMP","group":"","platform":"Android","doc":"This device's test ID, for the consent and AdMob test device settings.\nUse it in development builds only. Empty on iOS: take the ID from the Xcode console. Android only.","inputs":[],"outputs":[{"n":"Return Value","t":"String","k":"string","c":"","r":""}],"exec":[],"topic":"Status and testing"}],"events":[{"id":"evt_OnFirebaseInitialized","title":"On Firebase Initialized","name":"OnFirebaseInitialized","doc":"Fires when Firebase has finished starting. Result tells whether it worked.","platform":"","outputs":[{"n":"Result","t":"FirebaseBPError","k":"struct","c":"","r":"FFirebaseBPError"}],"module":"Core"},{"id":"evt_OnAuthStateChanged","title":"On Auth State Changed","name":"OnAuthStateChanged","doc":"Fires when the player signs in or out, and once at startup with the player restored from last time.\nUser.bIsValid is false when signed out. If you bind late, read Get Current User instead of waiting.","platform":"","outputs":[{"n":"User","t":"FirebaseUser","k":"struct","c":"","r":"FFirebaseUser"}],"module":"Auth"},{"id":"evt_OnIdTokenChanged","title":"On Id Token Changed","name":"OnIdTokenChanged","doc":"Fires on every ID token refresh (about hourly), on top of sign-in and sign-out.\nUse it to send a fresh token to your own server; most games want On Auth State Changed.","platform":"","outputs":[{"n":"User","t":"FirebaseUser","k":"struct","c":"","r":"FFirebaseUser"}],"module":"Auth"},{"id":"evt_OnFCMMessageReceived","title":"On FCMMessage Received","name":"OnFCMMessageReceived","doc":"Fires for every push message received.","platform":"","outputs":[{"n":"Message","t":"FirebaseCloudMessage","k":"struct","c":"","r":"FFirebaseCloudMessage"}],"module":"Messaging"},{"id":"evt_OnFCMTokenReceived","title":"On FCMToken Received","name":"OnFCMTokenReceived","doc":"Fires when the device gets a new push token: first launch, refresh or reinstall. Send it to your server.","platform":"","outputs":[{"n":"Token","t":"String","k":"string","c":"","r":""}],"module":"Messaging"},{"id":"evt_OnFCMTokenUnregistered","title":"On FCMToken Unregistered","name":"OnFCMTokenUnregistered","doc":"Fires when the device's push token is removed, e.g. revoked by the server.","platform":"","outputs":[{"n":"InstallationId","t":"String","k":"string","c":"","r":""}],"module":"Messaging"},{"id":"evt_OnApplicationForegrounded","title":"On Application Foregrounded","name":"OnApplicationForegrounded","doc":"Fires when the game comes back to the foreground, e.g. to show an app open ad.","platform":"","outputs":[],"module":"Core"},{"id":"evt_OnApplicationBackgrounded","title":"On Application Backgrounded","name":"OnApplicationBackgrounded","doc":"Fires when the game goes to the background (home button, app switch, call…).","platform":"","outputs":[],"module":"Core"},{"id":"evt_OnBillingReady","title":"On Billing Ready","name":"OnBillingReady","doc":"Fires when the connection to Google Play Billing is made, lost or restored.","platform":"","outputs":[{"n":"bReady","t":"Boolean","k":"bool","c":"","r":""}],"module":"Billing"},{"id":"evt_OnPurchasesUpdated","title":"On Purchases Updated","name":"OnPurchasesUpdated","doc":"Fires for every purchase: bought now, restored, or completed later. The safest place to grant items.\nGrant only when bIsAcknowledged is false: a purchase already handled comes back with it true.","platform":"","outputs":[{"n":"Purchases","t":"Array of FirebasePurchase","k":"struct","c":"array","r":""}],"module":"Billing"},{"id":"evt_OnPurchaseConsumed","title":"On Purchase Consumed","name":"OnPurchaseConsumed","doc":"Fires when a consumable is consumed. bSuccess false means it failed and will be reported again.","platform":"","outputs":[{"n":"PurchaseToken","t":"String","k":"string","c":"","r":""},{"n":"bSuccess","t":"Boolean","k":"bool","c":"","r":""}],"module":"Billing"},{"id":"evt_OnRemoteConfigUpdated","title":"On Remote Config Updated","name":"OnRemoteConfigUpdated","doc":"Fires when Remote Config values change in the console, once Start Remote Config Realtime Updates runs.\nUpdatedKeys lists the changed keys. Without auto-activate, call Activate Remote Config to apply them.","platform":"","outputs":[{"n":"UpdatedKeys","t":"Array of String","k":"string","c":"array","r":""},{"n":"Error","t":"EFirebaseRemoteConfigError","k":"enum","c":"","r":"EFirebaseRemoteConfigError"}],"module":"Remote Config"},{"id":"evt_OnAppCheckTokenChanged","title":"On App Check Token Changed","name":"OnAppCheckTokenChanged","doc":"Fires when the App Check token changes. Only needed to send it to your own server.","platform":"","outputs":[{"n":"Token","t":"FirebaseAppCheckToken","k":"struct","c":"","r":"FFirebaseAppCheckToken"}],"module":"App Check"},{"id":"evt_OnAnalyticsLogMessage","title":"On Analytics Log Message","name":"OnAnalyticsLogMessage","doc":"Fires for each Analytics log line, once Set Firebase Analytics Log Callback Enabled is on. Windows only.","platform":"","outputs":[{"n":"Level","t":"EFirebaseLogLevel","k":"enum","c":"","r":"EFirebaseLogLevel"},{"n":"Message","t":"String","k":"string","c":"","r":""}],"module":"Analytics"},{"id":"evt_OnAppUpdateStateChanged","title":"On App Update State Changed","name":"OnAppUpdateStateChanged","doc":"Fires as a Flexible update downloads. When it says Downloaded, call Complete Flexible App Update. Android only.","platform":"Android","outputs":[{"n":"InstallStatus","t":"EFirebaseAppUpdateInstallStatus","k":"enum","c":"","r":"EFirebaseAppUpdateInstallStatus"},{"n":"BytesDownloaded","t":"Integer64","k":"int64","c":"","r":""},{"n":"TotalBytesToDownload","t":"Integer64","k":"int64","c":"","r":""}],"module":"Store Services"},{"id":"evt_OnAdPaid","title":"On Ad Paid","name":"OnAdPaid","doc":"Fires each time an ad earns revenue, with its value and currency.\nBind it once at startup, e.g. to forward revenue to an attribution tool. Android only.","platform":"Android","outputs":[{"n":"Event","t":"FirebaseAdPaidEvent","k":"struct","c":"","r":"FFirebaseAdPaidEvent"}],"module":"AdMob"}],"types":[{"id":"FFirebaseAdPaidEvent","kind":"struct","name":"FFirebaseAdPaidEvent","module":"AdMob","doc":"The revenue of one ad impression, e.g. to forward to an attribution tool.","fields":[{"n":"Format","t":"EFirebaseAdMobAdFormat","k":"enum","c":"","r":"EFirebaseAdMobAdFormat","doc":"","d":"EFirebaseAdMobAdFormat::Unknown"},{"n":"AdUnitId","t":"String","k":"string","c":"","r":"","doc":"The ad unit that showed the ad."},{"n":"ValueMicros","t":"Integer64","k":"int64","c":"","r":"","doc":"Revenue in millionths of the currency, e.g. 1500000 = 1.5 USD.","d":"0"},{"n":"Value","t":"Float","k":"float","c":"","r":"","doc":"ValueMicros / 1,000,000, for convenience — prefer ValueMicros when accumulating totals.","d":"0.0"},{"n":"CurrencyCode","t":"String","k":"string","c":"","r":"","doc":"ISO 4217 currency code, e.g. \"USD\"."},{"n":"Precision","t":"EFirebaseAdValuePrecision","k":"enum","c":"","r":"EFirebaseAdValuePrecision","doc":"","d":"EFirebaseAdValuePrecision::Unknown"},{"n":"AdSourceName","t":"String","k":"string","c":"","r":"","doc":"The ad network that served the ad, e.g. \"AdMob Network\". Empty if unknown."}]},{"id":"FFirebaseAnalyticsItem","kind":"struct","name":"FFirebaseAnalyticsItem","module":"Analytics","doc":"One item of the \"items\" parameter of e-commerce events, such as purchase.\nText in StringFields (item_id, item_name…), numbers in NumberFields (price, quantity…).","fields":[{"n":"StringFields","t":"Map of String to String","k":"string","c":"map","r":"","doc":""},{"n":"NumberFields","t":"Map of String to Float","k":"string","c":"map","r":"","doc":""}]},{"id":"FFirebaseAnalyticsParameterValue","kind":"struct","name":"FFirebaseAnalyticsParameterValue","module":"Analytics","doc":"An event parameter value. Make it with the Make Analytics Param nodes.","fields":[]},{"id":"FFirebaseAppCheckToken","kind":"struct","name":"FFirebaseAppCheckToken","module":"App Check","doc":"An App Check token and when it expires.","fields":[{"n":"Token","t":"String","k":"string","c":"","r":"","doc":""},{"n":"ExpireTime","t":"Date Time","k":"struct","c":"","r":"","doc":"When the token expires (UTC)."}]},{"id":"FFirebaseBPPhoneForceResendingToken","kind":"struct","name":"FFirebaseBPPhoneForceResendingToken","module":"Auth","doc":"The token for a \"Resend code\" button. Pass it to Send Phone Verification Code with the same number.","fields":[]},{"id":"FFirebaseBPError","kind":"struct","name":"FFirebaseBPError","module":"Auth","doc":"An error code and its message.","fields":[{"n":"bSuccess","t":"Boolean","k":"bool","c":"","r":"","doc":"","d":"false"},{"n":"ErrorCode","t":"Integer","k":"int","c":"","r":"","doc":"","d":"0"},{"n":"ErrorMessage","t":"String","k":"string","c":"","r":"","doc":""}]},{"id":"FFirebaseAuthCredential","kind":"struct","name":"FFirebaseAuthCredential","module":"Auth","doc":"A sign-in credential, passed from node to node: from Make OAuth Credential or a failed Link node.\nNot saved: it's lost when the game restarts.","fields":[{"n":"bIsValid","t":"Boolean","k":"bool","c":"","r":"","doc":"False for an empty (default) credential, e.g. when a link failure didn't come with one.","d":"false"},{"n":"ProviderId","t":"String","k":"string","c":"","r":"","doc":"The provider this credential signs in with, e.g. \"google.com\", \"apple.com\"."}]},{"id":"FFirebaseAuthAdditionalUserInfo","kind":"struct","name":"FFirebaseAuthAdditionalUserInfo","module":"Auth","doc":"Extra provider info, only filled right after a sign-in, link or re-authentication.","fields":[{"n":"ProviderId","t":"String","k":"string","c":"","r":"","doc":"The provider, e.g. \"google.com\"."},{"n":"Username","t":"String","k":"string","c":"","r":"","doc":""},{"n":"ProfileJson","t":"String","k":"string","c":"","r":"","doc":"The provider's profile data as JSON (locale, verified email…). Depends on the provider."},{"n":"UpdatedCredential","t":"FirebaseAuthCredential","k":"struct","c":"","r":"FFirebaseAuthCredential","doc":"After a Link fails with CredentialAlreadyInUse: a credential for the other account that already uses it.\nPass it to Sign In With Credential to switch to that account (move the current progress first). bIsValid false if none."}]},{"id":"FFirebaseUser","kind":"struct","name":"FFirebaseUser","module":"Auth","doc":"A Firebase account. bIsValid is false if nobody is signed in.","fields":[{"n":"UserId","t":"String","k":"string","c":"","r":"","doc":""},{"n":"Email","t":"String","k":"string","c":"","r":"","doc":""},{"n":"DisplayName","t":"String","k":"string","c":"","r":"","doc":""},{"n":"PhoneNumber","t":"String","k":"string","c":"","r":"","doc":"The phone number, if one is linked."},{"n":"PhotoUrl","t":"String","k":"string","c":"","r":"","doc":"The profile photo, if the provider gives one (e.g. Google)."},{"n":"bIsAnonymous","t":"Boolean","k":"bool","c":"","r":"","doc":"","d":"false"},{"n":"bIsEmailVerified","t":"Boolean","k":"bool","c":"","r":"","doc":"","d":"false"},{"n":"bIsValid","t":"Boolean","k":"bool","c":"","r":"","doc":"","d":"false"},{"n":"CreationTimeMs","t":"Integer64","k":"int64","c":"","r":"","doc":"Milliseconds since epoch the account was created.","d":"0"},{"n":"LastSignInTimeMs","t":"Integer64","k":"int64","c":"","r":"","doc":"When the player last signed in, in milliseconds since 1970.","d":"0"},{"n":"bIsNewUser","t":"Boolean","k":"bool","c":"","r":"","doc":"True if this sign-in just created the account, e.g. to show onboarding or create the player's profile.\nOnly set by sign-in nodes. False on link, re-authentication, Get Current User and the events.","d":"false"},{"n":"AdditionalInfo","t":"FirebaseAuthAdditionalUserInfo","k":"struct","c":"","r":"FFirebaseAuthAdditionalUserInfo","doc":"Extra provider info, only right after a sign-in, link or re-authentication."}]},{"id":"FFirebaseLinkedProviderInfo","kind":"struct","name":"FFirebaseLinkedProviderInfo","module":"Auth","doc":"One sign-in method on the account, with that provider's own name, email and photo.","fields":[{"n":"ProviderId","t":"String","k":"string","c":"","r":"","doc":"The provider, e.g. \"google.com\" or \"playgames.google.com\"."},{"n":"Provider","t":"EFirebaseAuthProvider","k":"enum","c":"","r":"EFirebaseAuthProvider","doc":"The provider as an enum, for a Switch.","d":"EFirebaseAuthProvider::Unknown"},{"n":"ProviderUserId","t":"String","k":"string","c":"","r":"","doc":"The player's ID at that provider. Not the Firebase UID."},{"n":"DisplayName","t":"String","k":"string","c":"","r":"","doc":""},{"n":"Email","t":"String","k":"string","c":"","r":"","doc":""},{"n":"PhotoUrl","t":"String","k":"string","c":"","r":"","doc":""},{"n":"PhoneNumber","t":"String","k":"string","c":"","r":"","doc":"Only meaningful for the Phone provider entry — empty for every other provider."}]},{"id":"FFirebaseIdTokenResult","kind":"struct","name":"FFirebaseIdTokenResult","module":"Auth","doc":"What an ID token contains. Read on the device, not verified.\nFine for the UI (admin menu, premium badge); trusted decisions belong on your server.","fields":[{"n":"Token","t":"String","k":"string","c":"","r":"","doc":"The raw ID token, to send to your own backend."},{"n":"ClaimsJson","t":"String","k":"string","c":"","r":"","doc":"The whole claims object as JSON (standard and custom claims)."},{"n":"CustomClaims","t":"Map of String to String","k":"string","c":"map","r":"","doc":"Claims your server set, e.g. {\"admin\": true}, each value as JSON."},{"n":"SignInProvider","t":"String","k":"string","c":"","r":"","doc":"How the player sign te completes."},{"n":"Unavailable","v":"1","doc":""},{"n":"Available","v":"2","doc":""}]},{"id":"EFirebaseUMPPrivacyOptionsRequirementStatus","kind":"enum","name":"EFirebaseUMPPrivacyOptionsRequirementStatus","module":"UMP","doc":"Whether you must offer a \"Privacy options\" button.","values":[{"n":"Unknown","v":"0","doc":"Unknown until RequestUMPConsentInfoUpdate completes."},{"n":"NotRequired","v":"1","doc":""},{"n":"Required","v":"2","doc":""}]},{"id":"EFirebaseUMPConsentDebugGeography","kind":"enum","name":"EFirebaseUMPConsentDebugGeography","module":"UMP","doc":"Pretends the device is in a region, to test the consent form. List the device in DebugDeviceIds too.","values":[{"n":"Disabled","v":"0","doc":""},{"n":"EEA","v":"1","doc":"Geography appears as in the EEA (European Economic Area) for debug devices."},{"n":"NonEEA","v":"2","doc":"Geography appears as NOT in the EEA for debug devices."}]}],"settings":[{"n":"bEnableAuth","t":"Boolean","d":"true","cat":"Modules","doc":""},{"n":"bEnableGoogleSignIn","t":"Boolean","d":"true","cat":"Modules","doc":"Native \"Sign in with Google\" on Android (Sign In Provider with\nProvider = Google), through Credential Manager. Uncheck if you don't\nuse it (e.g. email/anonymous-only sign-in) to leave the Credential\nManager + Google ID libraries out of the build.","cond":"bEnableAuth"},{"n":"bEnableAppCheck","t":"Boolean","d":"true","cat":"Modules","doc":"Installs and activates an App Check provider at launch (Play Integrity /\nApp Attest, or the Debug provider) and enables the App Check nodes.\nUnlike the other toggles, turning this off does NOT leave App Check's\nGradle dependencies / CocoaPod out of the build: the native Firebase SDK\ninitializes App Check by itself inside firebase::App::Create(), so the\napp would crash at launch without them. Off just means no provider, so\nrequests carry no valid App Check token (fine unless App Check\nenforcement is turned on in the Firebase Console)."},{"n":"bUseAppCheckDebugProviderInDevelopmentBuilds","t":"Boolean","d":"false","cat":"Modules","doc":"Android, non-Shipping builds only: use App Check's Debug provider\ninstead of Play Integrity, for builds Play Integrity can't attest\n(installed over adb or from a file instead of from Google Play).\nOn first launch the SDK generates a debug secret and prints it to\nlogcat (search for \"debugtokens:create\"; R8 renames the log tag in release builds): register it in the Firebase Console\n(App Check -> your Android app -> Manage debug tokens). Ignored in\nShipping, which always uses Play Integrity.","cond":"bEnableAppCheck"},{"n":"bEnableFirestore","t":"Boolean","d":"true","cat":"Modules","doc":""},{"n":"bEnableAnalytics","t":"Boolean","d":"true","cat":"Modules","doc":""},{"n":"bEnableMessaging","t":"Boolean","d":"true","cat":"Modules","doc":""},{"n":"bSuppressMessagingPermissionPrompt","t":"Boolean","d":"false","cat":"Modules","doc":"iOS/tvOS only (no effect on Android): if true, Messaging does NOT show\nthe system prompt asking the user to allow notifications during\ninitialization — you must then call RequestFCMPermission yourself at a\nbetter UX moment (e.g. after explaining why you want it). If the user\nalready answered that prompt in a past session, this has no effect\neither way (the OS never asks twice).","cond":"bEnableMessaging"},{"n":"FCMNotificationChannelId","t":"String","cat":"Messaging","doc":"Android only: the notification channel FCM posts notification messages\nto while the app is in the background. Created at launch with\nFCMNotificationChannelName. Leave empty to keep FCM's own fallback\nchannel (\"Misc\").","cond":"bEnableMessaging"},{"n":"FCMNotificationChannelName","t":"String","d":"TEXT(\"Notifications\")","cat":"Messaging","doc":"Android only: the channel name players see in the app's notification settings. Used only when FCMNotificationChannelId is set.","cond":"bEnableMessaging"},{"n":"FCMNotificationIconPath","t":"String","cat":"Messaging","doc":"Android only: small icon for background notifications, as a path to a\nPNG relative to the project folder (e.g. Build/Android/notification_icon.png).\nAndroid shows it as a white silhouette, so use a white shape on a\ntransparent background. Leave empty to use the app icon.","cond":"bEnableMessaging"},{"n":"FCMNotificationColor","t":"String","cat":"Messaging","doc":"Android only: accent color of background notifications as #RRGGBB (e.g. #F5A623). Leave empty for the system default.","cond":"bEnableMessaging"},{"n":"bEnableCrashlytics","t":"Boolean","d":"true","cat":"Modules","doc":"Automatic native crash reporting is wired up via Gradle/CocoaPods regardless of Blueprint use. Android-only Blueprint nodes (Log/SetCustomKey/SetUserId) require this too."},{"n":"bUploadCrashlyticsNativeSymbols","t":"Boolean","d":"false","cat":"Modules","doc":"Android release builds (packaged with -distribution) only: upload the\ngame's native debug symbols to Crashlytics after the AAB/APK is built,\nso native C++ crash stacks show function names instead of raw\naddresses. Needs network access while packaging, adds a few minutes\nfor a large game, and the package fails if the upload fails.","cond":"bEnableCrashlytics"},{"n":"ForwardLogToCrashlytics","t":"EFirebaseCrashlyticsLogForwarding","d":"EFirebaseCrashlyticsLogForwarding::None","cat":"Modules","doc":"Android/iOS: copy Unreal's own log lines of this severity or worse into\nthe Crashlytics log (the breadcrumbs shown with each crash report), so a\ncrash comes with the errors that led to it. None (the default) forwards\nnothing. Errors only is the sensible choice for most games; with\nwarnings too, a chatty project pays a native call per line.","cond":"bEnableCrashlytics"},{"n":"bRecordEnsuresInCrashlytics","t":"Boolean","d":"false","cat":"Modules","doc":"Android/iOS: report every failed ensure() (and ensureMsgf) to\nCrashlytics as a non-fatal error, grouped by its message — bugs that\ndon't crash but shouldn't happen, visible in the console. Each one is\nreported once per run (UE itself only fires an ensure once). Ensures are\ncompiled out of Shipping builds unless the target sets\nbUseChecksInShipping, so this mostly serves Development / test builds.","cond":"bEnableCrashlytics"},{"n":"bEnableAdMob","t":"Boolean","d":"true","cat":"AdMob","doc":"Android only for now."},{"n":"AdMobAndroidAppId","t":"String","d":"TEXT(\"ca-app-pub-3940256099942544~3347511713\")","cat":"AdMob","doc":"From the AdMob console (Apps -> App settings -> App ID), format\n\"ca-app-pub-XXXXXXXXXXXXXXXX~YYYYYYYYYY\". Required if Enable AdMob is\nchecked: without it, the Google Mobile Ads SDK fails to initialize and\nevery ad load fails immediately.\n\nDefaults to Google's own public sample App ID, paired with the sample\nAd Unit IDs already defaulted on LoadInterstitialAd/LoadRewardedAd/\nLoadAppOpenAd — so a fresh install of this plugin shows real Test Ads\nout of the box, with zero AdMob account setup required. Replace with\nyour own App ID (and your own Ad Unit IDs at each call site) before\nshipping — Google's sample IDs must never reach production.\n\nDeliberately its own field, not the \"AdMob App ID\" in Project Settings\n-> Platforms -> Android -> Google Play Services: that one is greyed out\nunless its own \"Include AdMob support for ads\" is checked, which is an\nunrelated, legacy Epic ad module (AndroidAdvertising) — not what this\nplugin uses, and not something a FirebaseBP user should have to know\nabout just to set an App ID.\n\nAlso needed by UMP (consent forms), even with AdMob off.","cond":"bEnableAdMob || bEnableUMP"},{"n":"AdMobTestDeviceIds","t":"String","cat":"AdMob","doc":"Comma-separated hashed device IDs (e.g. \"ADA8DF0BC36CFB0290E6885E1D8A1651\")\nthat should receive clearly-labeled Test Ads instead of live ads on your\nreal Ad Unit IDs — safe to click/watch without violating AdMob policy or\nskewing your own stats. Registering a device through the AdMob app\n(Advertising ID + a debug gesture) only unlocks the on-device Ad\nInspector; it does NOT do this. Get your device's exact ID from Logcat\n(filter on the \"Ads\" tag) after its first ad request: \"Use\nRequestConfiguration.Builder().setTestDeviceIds(Arrays.asList(\"....\"))\nto get test ads on this device.\"","cond":"bEnableAdMob"},{"n":"bEnableBilling","t":"Boolean","d":"true","cat":"Billing","doc":"Google Play Billing (in-app purchases and subscriptions). Android only —\nthis is a Google Play service, not a Firebase product, but grouped here\nfor the same \"toggle to shrink the AAB\" reason as AdMob. Needs your\napp's real product/subscription IDs set up in Play Console; there is no\nApp ID to configure here (unlike AdMob) since Billing reads your app's\nown package name and signing to find its Play Console product catalog."},{"n":"bAutoConsumeConsumables","t":"Boolean","d":"true","cat":"Billing","doc":"Consume Consumable purchases automatically as soon as Google Play\nreports them (the default), before your game has granted the item. If\nthe app is killed between that consume and your grant (or your grant\ngoes through a server call that fails), the purchase is gone for good:\na consumed purchase is never reported again.\n\nUncheck to consume them yourself instead: grant the item from\nOnPurchasesUpdated / PurchaseProduct's result, THEN call Consume\nPurchase with its PurchaseToken. Until then the purchase keeps being\nreported (every RestorePurchases, and whenever Billing connects or the\napp returns to the foreground), so make your grant\nidempotent per PurchaseToken. Google refunds a purchase left neither\nconsumed nor acknowledged for 3 days. Non-consumables and\nsubscriptions are still acknowledged automatically either way.","cond":"bEnableBilling"},{"n":"bEnableRemoteConfig","t":"Boolean","d":"true","cat":"Modules","doc":""},{"n":"bEnableFunctions","t":"Boolean","d":"true","cat":"Modules","doc":"Cloud Functions (calling HTTPS Callable functions you deploy — server-side logic, purchase verification, anti-cheat, ...)."},{"n":"bEnableDatabase","t":"Boolean","d":"true","cat":"Modules","doc":"Realtime Database (low-latency JSON tree — presence, chat, live leaderboards; Firestore is usually the better default for everything else)."},{"n":"bEnablePlayGames","t":"Boolean","d":"true","cat":"PlayGames","doc":"Google Play Games Services: Play Games Sign-In (Sign In Provider with\nProvider = PlayGames) plus leaderboards, achievements, saved games and\nplayer info. Android only — same \"Google Play service, not Firebase\"\ngrouping as Billing. Requires Enable Auth. Unchecking it also leaves the\nPlay Games Services library out of the build.","cond":"bEnableAuth"},{"n":"bEnableStorage","t":"Boolean","d":"true","cat":"Modules","doc":"Cloud Storage (file upload/download — avatars, screenshots, downloadable\ncontent). Note: as of late 2024 Google requires the Firebase project\nitself to be on the Blaze (pay-as-you-go) plan to use Storage at all —\nthis toggle alone won't help if the project is still on Spark."},{"n":"bEnableInstallations","t":"Boolean","d":"true","cat":"Modules","doc":"Firebase Installations (the per-install identity every other Firebase\nproduct — including Messaging's own FCM registration token — is built\non top of). Leave this on unless you have a specific reason to disable\nit; several other modules degrade if it's off."},{"n":"bEnableUMP","t":"Boolean","d":"true","cat":"Modules","doc":"User Messaging Platform (UMP) — Google's GDPR/CCPA consent flow.\nCross-platform (Android/iOS/Windows) via firebase::ump::ConsentInfo.\nAdMob's own consent convenience nodes (RequestConsentInfoUpdate /\nShowPrivacyOptionsForm / CanRequestAds / IsPrivacyOptionsRequired) read\nthis same module, so turning it off disables those too even if\nEnable AdMob is on."},{"n":"bEnableStoreServices","t":"Boolean","d":"true","cat":"StoreServices","doc":"App store integration: in-app review (RequestAppReview) and in-app\nupdate (CheckForAppUpdate/StartImmediateAppUpdate/StartFlexibleAppUpdate).\nAndroid via Google Play Core (review + app-update libraries); iOS via\nStoreKit (review) and an App Store version lookup (update) — neither is\na Firebase product, grouped here for the same \"toggle to shrink the\nbuild\" reason as AdMob/Billing/PlayGames."},{"n":"bDataCollectionEnabledAtLaunch","t":"Boolean","d":"true","cat":"Privacy","doc":"Firebase's global automatic data collection switch, on from the first\nlaunch. Uncheck to start with it off (firebase_data_collection_default_enabled=false /\nFirebaseDataCollectionDefaultEnabled=NO), then call Set Firebase Data\nCollection Enabled(true) once the player consents. Products with their\nown switch (Analytics, Crashlytics, FCM auto-init) follow theirs below."},{"n":"bAnalyticsCollectionEnabledAtLaunch","t":"Boolean","d":"true","cat":"Privacy","doc":"Analytics collects from the first launch. Uncheck to start with collection off (firebase_analytics_collection_enabled=false).","cond":"bEnableAnalytics"},{"n":"bCrashlyticsCollectionEnabledAtLaunch","t":"Boolean","d":"true","cat":"Privacy","doc":"Crashlytics sends reports from the first launch. Uncheck to hold them until Set Crashlytics Collection Enabled(true) (firebase_crashlytics_collection_enabled=false).","cond":"bEnableCrashlytics"},{"n":"bFCMAutoInitAtLaunch","t":"Boolean","d":"true","cat":"Privacy","doc":"FCM registers this install (generates its token) on the first launch. Uncheck to wait for Set FCM Auto Init Enabled(true) (firebase_messaging_auto_init_enabled=false).","cond":"bEnableMessaging"},{"n":"bConsentAnalyticsStorageGrantedByDefault","t":"Boolean","d":"true","cat":"Privacy","doc":"Google Consent Mode v2 defaults for Analytics (and the ads it links\nto), until Set Consent overrides them at runtime. Uncheck a signal to\nmake it DENIED by default — typically all four for EEA/UK players until\nyour consent flow (e.g. UMP) says otherwise.","cond":"bEnableAnalytics"},{"n":"bConsentAdStorageGrantedByDefault","t":"Boolean","d":"true","cat":"Privacy","doc":"","cond":"bEnableAnalytics"},{"n":"bConsentAdUserDataGrantedByDefault","t":"Boolean","d":"true","cat":"Privacy","doc":"","cond":"bEnableAnalytics"},{"n":"bConsentAdPersonalizationGrantedByDefault","t":"Boolean","d":"true","cat":"Privacy","doc":"","cond":"bEnableAnalytics"}],"guide":{"Core":{"mono":"Co","hue":28,"tagline":"Startup, SDK logging, app info and the Google Play services check every Android game needs.","topics":[],"recipes":[{"title":"Fix Google Play services, then start Firebase","steps":[{"id":"UMakeGooglePlayServicesAvailableProxy_MakeGooglePlayServicesAvailable","via":"OnSuccess","args":null},{"id":"UFirebaseBPSubsystem_InitializeFirebase","via":"","args":null}]}]},"Auth":{"mono":"Au","hue":210,"tagline":"Sign players in (guest, email, Google, Apple, Play Games, phone…) and manage their account.","topics":["Re-authentication","Linking","Sign in","Tokens","Settings","Account"],"recipes":[{"title":"Sign in with Google (or Play Games, Apple…)","steps":[{"id":"USignInProviderProxy_SignInProvider","via":"","args":{"Provider":"Google"}}]},{"title":"Start as a guest, keep the progress when they register","steps":[{"id":"USignInAnonymouslyProxy_SignInAnonymously","via":"OnSignedIn","args":null},{"id":"ULinkWithEmailProxy_LinkWithEmailAndPassword","via":"","args":null}]},{"title":"Start as a guest, link Google later","steps":[{"id":"USignInAnonymouslyProxy_SignInAnonymously","via":"OnSignedIn","args":null},{"id":"ULinkProviderProxy_LinkProvider","via":"","args":{"Provider":"Google"}}]},{"title":"Create an email account, then verify it","steps":[{"id":"UCreateUserWithEmailProxy_CreateUserWithEmailAndPassword","via":"OnUserCreated","args":null},{"id":"USendEmailVerificationProxy_SendEmailVerification","via":"","args":null}]},{"title":"Forgotten password","steps":[{"id":"USendPasswordResetEmailProxy_SendPasswordResetEmail","via":"","args":null}]}]},"Firestore":{"mono":"Fs","hue":40,"tagline":"Cloud document database: read, write, query and listen to documents in real time.","topics":
